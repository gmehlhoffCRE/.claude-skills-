function ListPanel({ list, labels, sort, setSort, activeId, hoveredId, selectedIds, onOpen, onHover, onToggle, canAdd }) {
  const refs = useRef({});
  const box = useRef(null);
  // Scroll only the list (scrollIntoView would also scroll the page and hide the header).
  useEffect(() => {
    const n = activeId && refs.current[activeId], c = box.current;
    if (!n || !c) return;
    const top = n.offsetTop, bottom = top + n.offsetHeight;
    if (top < c.scrollTop) c.scrollTo({ top, behavior: "smooth" });
    else if (bottom > c.scrollTop + c.clientHeight) c.scrollTo({ top: bottom - c.clientHeight, behavior: "smooth" });
  }, [activeId]);
  return (
    <div className="panel">
      <div className="panel-h"><span className="panel-t">{list.length} buildings</span>
        <label className="sort">Sort<select value={sort} onChange={(e) => setSort(e.target.value)}>
          {Object.entries(SORTS).map(([k, s]) => <option key={k} value={k}>{s.label}</option>)}</select></label></div>
      <div className="panel-b" ref={box} style={{ position: "relative" }}>
        {list.length === 0 && <div className="empty">No buildings match these filters.<br />Try widening a range or clearing a filter.</div>}
        {list.map((b) => {
          const sel = selectedIds.includes(b.id);
          return (
            <div key={b.id} ref={(n) => (refs.current[b.id] = n)}
              className={"card" + (b.id === activeId ? " act" : "") + (b.id === hoveredId ? " hov" : "")}
              onClick={() => onOpen(b.id)} onMouseEnter={() => onHover(b.id)} onMouseLeave={() => onHover(null)}>
              <div className={"num" + (sel ? " sel" : "")}>{labels[b.id]}</div>
              <Photo b={b} className="thumb" />
              <div style={{ minWidth: 0, paddingRight: 22 }}>
                <div className="c-name">{b.name}</div>
                <div className="c-addr">{b.address}</div>
                <div className="c-meta">
                  <span><b>{fmtRent(b.totalRent)}</b> total</span>
                  <span>{fmtK(b.rba)} SF</span>
                  <span>{fmtPct(b.leased)} leased</span>
                </div>
              </div>
              <label className="cmp-box" onClick={(e) => e.stopPropagation()} title="Add to compare">
                <input type="checkbox" checked={sel} disabled={!sel && !canAdd} onChange={() => onToggle(b.id)} />
              </label>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const TABLE_COLS = [
  { k: "num", label: "#", get: (b, l) => l[b.id], r: true },
  { k: "photo", label: "", sort: false },
  { k: "address", label: "Address", get: (b) => b.address },
  { k: "name", label: "Property name", get: (b) => (b.name === b.address ? "" : b.name), fmt: (b) => (b.name === b.address ? "—" : b.name) },
  { k: "submarket", label: "Submarket", get: (b) => b.submarket },
  { k: "cls", label: "Class", get: (b) => b.cls },
  { k: "rba", label: "RBA (SF)", get: (b) => b.rba, fmt: (b) => fmtInt(b.rba), r: true },
  { k: "stories", label: "Stories", get: (b) => b.stories, fmt: (b) => b.stories ?? "—", r: true },
  { k: "yearBuilt", label: "Built", get: (b) => b.yearBuilt, fmt: (b) => b.yearBuilt || "—", r: true },
  { k: "yearReno", label: "Renov.", get: (b) => b.yearReno, fmt: (b) => b.yearReno || "—", r: true },
  { k: "leased", label: "% Leased", get: (b) => b.leased, fmt: (b) => fmtPct(b.leased), r: true },
  { k: "rent", label: "Direct rent", get: (b) => b.rent, fmt: (b) => fmtRent(b.rent), r: true },
  { k: "opex", label: "OPEX", get: (b) => b.opex, fmt: (b) => fmtRent(b.opex), r: true },
  { k: "totalRent", label: "Total rent", get: (b) => b.totalRent, fmt: (b) => fmtRent(b.totalRent), r: true },
  { k: "contig", label: "Available 9K+ SF suites", get: (b) => (b.contig ? 1 : 0), fmt: (b) => (b.contig ? <span title={b.contigText}>{/^(y|yes|true)$/i.test(b.contigText) ? "Yes" : b.contigText}</span> : "—") },
  { k: "amenityCount", label: "Amenities", get: (b) => b.amenityCount, r: true },
  { k: "owner", label: "Owner", get: (b) => b.owner, fmt: (b) => <span title={b.owner}>{b.owner || "—"}</span> },
];

function TableView({ list, labels, selectedIds, onToggle, onOpen, canAdd }) {
  const [sk, setSk] = useState("num"), [dir, setDir] = useState(1);
  const col = TABLE_COLS.find((c) => c.k === sk);
  const rows = useMemo(() => list.slice().sort((a, b) => {
    const x = col.get(a, labels), y = col.get(b, labels);
    if (x == null || x === "") return 1; if (y == null || y === "") return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  }), [list, sk, dir, labels]);
  const click = (c) => { if (c.sort === false) return; if (c.k === sk) setDir(-dir); else { setSk(c.k); setDir(1); } };
  return (
    <div className="panel">
      <div className="panel-h"><span className="panel-t">All options · {list.length} buildings</span>
        <span style={{ marginLeft: "auto", fontSize: 12, color: "var(--ink4)" }}>Click a row for details · tick to compare</span></div>
      <div className="tbl-wrap">
        {list.length === 0 ? <div className="empty">No buildings match these filters.</div> : (
          <table className="tbl prop">
            <thead><tr>
              <th style={{ width: 30 }}></th>
              {TABLE_COLS.map((c) => <th key={c.k} className={c.r ? "r" : ""} onClick={() => click(c)}>{c.label}{sk === c.k && <span className="arr">{dir > 0 ? "▲" : "▼"}</span>}</th>)}
            </tr></thead>
            <tbody>
              {rows.map((b) => {
                const sel = selectedIds.includes(b.id);
                return (
                  <tr key={b.id} className={sel ? "sel" : ""} onClick={() => onOpen(b.id)}>
                    <td onClick={(e) => e.stopPropagation()}><input type="checkbox" checked={sel} disabled={!sel && !canAdd} onChange={() => onToggle(b.id)} /></td>
                    {TABLE_COLS.map((c) => (
                      <td key={c.k} className={(c.r ? "r " : "") + "c-" + c.k}>
                        {c.k === "photo" ? (b.photo ? <img src={b.photo} alt="" loading="lazy" /> : null)
                          : c.fmt ? c.fmt(b) : (c.get(b, labels) ?? "—")}
                      </td>
                    ))}
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

function CompareView({ all, selectedIds, onRemove, onClear, amenCols, goTo, cm }) {
  const items = selectedIds.map((id) => all.find((b) => b.id === id)).filter(Boolean);
  if (!items.length) return (
    <div className="panel"><div className="empty" style={{ margin: "auto" }}>
      <div style={{ fontSize: 15, fontWeight: 700, color: "var(--navy)", marginBottom: 6 }}>Nothing to compare yet</div>
      Tick the box on up to {MAX_COMPARE} buildings in the Map or Table view, then come back here.
      <div style={{ marginTop: 14, display: "flex", gap: 8, justifyContent: "center" }}>
        <button className="btn primary" onClick={() => goTo("map")}>{I.map} Go to map</button>
        <button className="btn" onClick={() => goTo("table")}>{I.table} Go to table</button></div>
    </div></div>
  );
  const best = (key, dirLow) => {
    const v = items.map((b) => b[key]).filter((x) => x != null);
    if (v.length < 2) return null;
    return dirLow ? Math.min(...v) : Math.max(...v);
  };
  const ROWS = [
    ["Location", null],
    ["Submarket", (b) => b.submarket || "—"],
    ["City", (b) => b.city],
    ["Owner", (b) => b.owner || "—"],
    ["Building", null],
    ["Class", (b) => b.cls || "—"],
    ["Building size (RBA)", (b) => fmtSF(b.rba), "rba", false],
    ["Stories", (b) => b.stories ?? "—"],
    ["Year built", (b) => b.yearBuilt || "—"],
    ["Year renovated", (b) => b.yearReno || "—"],
    ["% Leased", (b) => fmtPct(b.leased)],
    ["Contiguous 9,000+ SF", (b) => (b.contig ? <span className="yes">{/^(y|yes|true)$/i.test(b.contigText) ? "Yes" : b.contigText}</span> : <span className="no">No</span>)],
    ["Economics ($/SF/yr)", null],
    ["Direct asking rent", (b) => fmtRent(b.rent), "rent", true],
    ["OPEX", (b) => fmtRent(b.opex), "opex", true],
    ["Total rent", (b) => fmtRent(b.totalRent), "totalRent", true],
  ];
  if (cm && cm.hasData && cm.roster.length) {
    const st = {};
    items.forEach((b) => { if (b.lat != null && b.lng != null) st[b.id] = commuteStats(cm.roster, b, cm.minutes, cm.target, cm.homeOf); });
    const bestOf = (fn, low) => { const v = items.map((b) => st[b.id] && fn(st[b.id])).filter((x) => x != null); return v.length < 2 ? null : low ? Math.min(...v) : Math.max(...v); };
    const row = (label, fn, fmt, low) => {
      const bv = bestOf(fn, low);
      return [label, (b) => (st[b.id] ? fmt(fn(st[b.id])) : "—"), null, null, (b) => bv != null && st[b.id] && fn(st[b.id]) === bv];
    };
    ROWS.push(
      [`Drive time${cm.useGoogle ? " · Google" : " (est.)"}`, null],
      row("Average drive", (s) => s.avg, (v) => v + " min", true),
      row(`Within ${cm.target} min`, (s) => s.within, (v) => v + "%", false),
      row("Team hrs / week", (s) => s.hrsWk, (v) => v.toLocaleString(), true),
      row("vs today (hrs / week)", (s) => s.deltaHrs, (v) => fmtDeltaHrs(v), true),
    );
  }
  const amenUsed = amenCols.filter((a) => items.some((b) => b.amenities.includes(a)));
  return (
    <div className="panel">
      <div className="panel-h"><span className="panel-t">Comparing {items.length} buildings</span>
        <span style={{ fontSize: 12, color: "var(--ink4)" }}>★ = best value among these</span>
        <button className="btn sm" style={{ marginLeft: "auto" }} onClick={onClear}>Clear all</button></div>
      <div className="cmp-wrap">
        <table className="cmp">
          <thead><tr><th></th>
            {items.map((b) => (
              <th key={b.id}>
                {b.photo ? <img src={b.photo} alt={b.name} /> : <div className="thumb ph" style={{ width: "100%", height: 130 }}>No photo</div>}
                <div className="cname">{b.name}</div>
                <div className="caddr">{b.address}</div>
                <button className="btn sm" style={{ marginTop: 8 }} onClick={() => onRemove(b.id)}>Remove</button>
              </th>
            ))}</tr></thead>
          <tbody>
            {ROWS.map(([label, fn, key, low, isBest]) => fn == null
              ? <tr key={label} className="grp"><td>{label}</td>{items.map((b) => <td key={b.id}></td>)}</tr>
              : <tr key={label}><td>{label}</td>{items.map((b) => {
                  const bv = key ? best(key, low) : null;
                  const win = isBest ? isBest(b) : bv != null && b[key] === bv;
                  return <td key={b.id} className={win ? "best" : ""}>{fn(b)}</td>;
                })}</tr>)}
            {amenUsed.length > 0 && <tr className="grp"><td>Amenities</td>{items.map((b) => <td key={b.id}>{b.amenities.length} total</td>)}</tr>}
            {amenUsed.map((a) => (
              <tr key={a}><td style={{ textTransform: "none", letterSpacing: 0, fontSize: 12, fontWeight: 600 }}>{a}</td>
                {items.map((b) => <td key={b.id}>{b.amenities.includes(a) ? <span className="yes">✓</span> : <span className="no">—</span>}</td>)}</tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function exportCSV(list, amenCols) {
  const cols = [["Property Name", (b) => b.name], ["Property Address", (b) => b.address], ["City", (b) => b.city], ["Submarket", (b) => b.submarket],
    ["Class", (b) => b.cls], ["RBA", (b) => b.rba], ["Stories", (b) => b.stories], ["Year Built", (b) => b.yearBuilt], ["Year Renovated", (b) => b.yearReno],
    ["Percent Leased", (b) => b.leased], ["Direct Rent", (b) => b.rent], ["OPEX", (b) => b.opex], ["Total Rent", (b) => b.totalRent],
    ["Contiguous 9,000+ SF", (b) => b.contigText], ["Owner", (b) => b.owner], ["Amenities", (b) => b.amenities.join("; ")]];
  const esc = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [cols.map((c) => c[0]).join(","), ...list.map((b) => cols.map((c) => esc(c[1](b))).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "Cresa_Austin_Office_Options_HR_Green.csv";
  a.click();
}

// ===================== APP =====================
function App() {
  const data = useListings();
  const all = data.buildings;
  const [view, setView] = useState("map");
  const [f, setF] = useState(EMPTY_FILTERS);
  const [sort, setSort] = useState("total_asc");
  const [activeId, setActiveId] = useState(null);
  const [modalId, setModalId] = useState(null);
  const [hoveredId, setHoveredId] = useState(null);
  const layers = data.layers || EMPTY_LAYERS;
  const cm = useCommute(layers);
  const [show, setShow] = useState({ comp: true, emp: false, office: true });
  const [selectedIds, setSelectedIds] = useState(() => { try { return JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY + ":compare") || "[]"); } catch (e) { return []; } });

  useEffect(() => { try { localStorage.setItem(LOCAL_CACHE_KEY + ":compare", JSON.stringify(selectedIds)); } catch (e) {} }, [selectedIds]);
  // Drop compare picks that no longer exist after a sheet update.
  useEffect(() => { if (all.length) setSelectedIds((s) => s.filter((id) => all.some((b) => b.id === id))); }, [all]);

  const list = useMemo(() => applyFilters(all, f).sort(SORTS[sort].fn), [all, f, sort]);
  const labels = useMemo(() => { const m = {}; list.forEach((b, i) => (m[b.id] = i + 1)); return m; }, [list]);
  const canAdd = selectedIds.length < MAX_COMPARE;
  const toggle = (id) => setSelectedIds((s) => (s.includes(id) ? s.filter((x) => x !== id) : s.length < MAX_COMPARE ? [...s, id] : s));
  const active = activeId && list.find((b) => b.id === activeId);
  const modal = modalId && all.find((b) => b.id === modalId);

  useEffect(() => { if (activeId && !list.some((b) => b.id === activeId)) setActiveId(null); }, [list]);
  useEffect(() => { const k = (e) => { if (e.key === "Escape") { setModalId(null); setActiveId(null); } }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);

  // Map view: numbered buildings + optional competitor / employee / office layers.
  const mapItems = useMemo(() => {
    const out = [];
    if (show.emp) layers.employees.forEach((e, i) => out.push({ key: "e" + i, lat: e.lat, lng: e.lng,
      cls: "pin-emp", html: "", style: officeColor(cm.offices, (cm.homeOf(e) || {}).key),
      tip: `<b>${esc(officeShort(e.office) || "Employee")}</b><span>${esc(e.dept || "")}</span>` }));
    if (show.comp) out.push(...competitorItems(layers.competitors));
    if (show.office) out.push(...officeItems(cm.offices));
    list.forEach((b) => out.push({ key: b.id, id: b.id, kind: "bldg", lat: b.lat, lng: b.lng, cls: "pin-bldg", html: String(labels[b.id]),
      tip: `<b>${esc(b.name)}</b><span>${fmtRent(b.totalRent)} total · ${fmtK(b.rba)} SF</span>` }));
    return out;
  }, [list, labels, show, layers, cm.offices, cm.homeOf]);
  const mapState = (el, it) => {
    if (it.kind !== "bldg") return;
    el.classList.toggle("act", it.id === activeId);
    el.classList.toggle("hov", it.id === hoveredId);
    el.classList.toggle("sel", selectedIds.includes(it.id));
  };

  const k = {
    n: list.length,
    rba: list.reduce((s, b) => s + (b.rba || 0), 0),
    total: avg(list.map((b) => b.totalRent)),
    rent: avg(list.map((b) => b.rent)),
    leased: avg(list.map((b) => b.leased)),
    contig: list.filter((b) => b.contig).length,
  };
  const email = window.__cresaUserEmail || "";
  const statusCls = data.error ? (all.length ? "cached" : "error") : data.loading ? "loading" : "live";
  const statusTxt = data.error ? (all.length ? "Offline copy" : "Not loaded") : data.loading ? "Loading…" : "Live";
  const statusTitle = data.error ? data.error : data.updatedAt ? "Sheet last changed " + new Date(data.updatedAt).toLocaleString() : "";

  return (
    <div className="app">
      <header className="hdr">
        <img className="hdr-logo" src={LOGO} alt="Cresa" />
        <div className="hdr-sep" />
        <div><div className="hdr-title">Austin Office Options</div><div className="hdr-sub">Prepared for HR Green</div></div>
        <div className="hdr-spacer" />
        <span className={"status " + statusCls} title={statusTitle} onClick={data.reload} style={{ cursor: "pointer" }}><span className="dot" />{statusTxt}</span>
        <nav className="tabs">
          <button className={"tab" + (view === "map" ? " on" : "")} onClick={() => setView("map")}>{I.map} Map</button>
          <button className={"tab" + (view === "table" ? " on" : "")} onClick={() => setView("table")}>{I.table} Table</button>
          <button className={"tab" + (view === "drive" ? " on" : "")} onClick={() => setView("drive")}>{I.car} Drive time</button>
          <button className={"tab" + (view === "compare" ? " on" : "")} onClick={() => setView("compare")}>{I.compare} Compare
            {selectedIds.length > 0 && <span className="badge">{selectedIds.length}</span>}</button>
        </nav>
        <button className="btn" onClick={() => exportCSV(list, data.amenCols)} disabled={!list.length}>{I.dl} CSV</button>
        <button className="avatar" title={email ? `${email} — click to sign out` : "Sign out"}
          onClick={() => { if (confirm("Sign out?")) window.__cresaSignOut && window.__cresaSignOut(); }}>{(email[0] || "U").toUpperCase()}</button>
      </header>

      {data.error && !all.length && (
        <div style={{ margin: "14px 22px 0", padding: "12px 16px", background: "#FBE9E9", color: "var(--bad)", borderRadius: 10, fontSize: 13 }}>
          Couldn't load listings: {data.error}. <button className="btn sm" onClick={data.reload}>Retry</button></div>
      )}

      <section className="kpis">
        <div className="kpi"><div className="kpi-l">Buildings</div><div className="kpi-v">{k.n}<small>/ {all.length}</small></div><div className="kpi-s">{activeFilterCount(f) ? "matching filters" : "all options"}</div></div>
        <div className="kpi"><div className="kpi-l">Avg total rent</div><div className="kpi-v">{fmtRent(k.total)}<small>/SF</small></div><div className="kpi-s">Direct {fmtRent(k.rent)} + OPEX</div></div>
        <div className="kpi"><div className="kpi-l">Avg % leased</div><div className="kpi-v">{fmtPct(k.leased)}</div><div className="kpi-s">across shown buildings</div></div>
        <div className="kpi"><div className="kpi-l">9,000+ SF contiguous</div><div className="kpi-v">{k.contig}</div><div className="kpi-s">buildings with a fit</div></div>
        <div className="kpi"><div className="kpi-l">Total RBA</div><div className="kpi-v">{fmtK(k.rba)}<small>SF</small></div><div className="kpi-s">rentable building area</div></div>
      </section>

      <main className={"body v-" + view}>
        {view !== "drive" && <FiltersPanel all={all} amenCols={data.amenCols} f={f} setF={setF} onReset={() => setF(EMPTY_FILTERS)} shown={list.length}
          mapLayers={view === "map" ? { show, setShow, counts: { office: cm.offices.length, comp: layers.competitors.length, emp: layers.employees.length } } : null} />}
        {view === "map" && <>
          <ListPanel list={list} labels={labels} sort={sort} setSort={setSort} activeId={activeId} hoveredId={hoveredId}
            selectedIds={selectedIds} onOpen={(id) => setActiveId(id)} onHover={setHoveredId} onToggle={toggle} canAdd={canAdd} />
          <div className="map-wrap">
            <MapCanvas items={mapItems} state={mapState} stateKey={[activeId, hoveredId, selectedIds.join(",")].join("|")}
              fitKey={list.map((b) => b.id).join("|")} fitTo={list} focus={active ? { key: active.id, lat: active.lat, lng: active.lng } : null}
              onClick={(it) => it.kind === "bldg" && setActiveId(it.id)} onHover={(it) => setHoveredId(it && it.kind === "bldg" ? it.id : null)}>
              {show.emp && layers.employees.length > 0 && cm.offices.length > 1 && (
                <div className="map-key">
                  {cm.offices.map((o) => <span key={o.key} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><i className="lg lg-emp" style={{ background: officeColor(cm.offices, o.key) }} />{o.name} staff</span>)}
                </div>
              )}
            </MapCanvas>
            {active && <div className="map-detail"><DetailCard b={active} selected={selectedIds.includes(active.id)} canAdd={canAdd}
              onToggleCompare={() => toggle(active.id)} onClose={() => setActiveId(null)} /></div>}
          </div>
        </>}
        {view === "table" && <TableView list={list} labels={labels} selectedIds={selectedIds} onToggle={toggle} onOpen={setModalId} canAdd={canAdd} />}
        {view === "drive" && <DriveTimeView list={list} total={all.length} nFilters={activeFilterCount(f)} goTo={setView} layers={layers} cm={cm} selectedIds={selectedIds} onToggle={toggle} canAdd={canAdd} onOpenBuilding={setModalId} />}
        {view === "compare" && <CompareView all={all} selectedIds={selectedIds} amenCols={data.amenCols} goTo={setView} cm={cm}
          onRemove={(id) => setSelectedIds((s) => s.filter((x) => x !== id))} onClear={() => setSelectedIds([])} />}
      </main>

      {modal && <div className="modal-bg" onClick={() => setModalId(null)}>
        <DetailCard b={modal} selected={selectedIds.includes(modal.id)} canAdd={canAdd} onToggleCompare={() => toggle(modal.id)} onClose={() => setModalId(null)} />
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
