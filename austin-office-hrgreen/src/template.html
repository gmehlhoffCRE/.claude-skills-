}

function DistBar({ s, target }) {
  const pct = (n) => (n / s.n) * 100;
  return (
    <div className="dist" title={`≤${target} min: ${s.good} · ${target + 1}–${target + 15}: ${s.mid} · ${target + 15}+: ${s.far}`}>
      <span className="d-good" style={{ width: pct(s.good) + "%" }} />
      <span className="d-mid" style={{ width: pct(s.mid) + "%" }} />
      <span className="d-far" style={{ width: pct(s.far) + "%" }} />
    </div>
  );
}

const bandOf = (m, t) => (m <= t ? "good" : m <= t + 15 ? "mid" : "far");
const fmtDeltaHrs = (h) => (h == null ? "—" : h === 0 ? "±0" : (h < 0 ? "−" : "+") + Math.abs(h).toLocaleString());

// ===================== EXCEL COMMUTE REPORT =====================
// Three tabs, styled like the HR Green commute analysis: Analysis Overview, Building Ranking, Commute Matrix.
// Every summary cell is a live Excel formula over the matrix (with its value cached so it shows instantly).
const XL = {
  navy: "FF001E5A", blue: "FF0056DA", gold: "FFFFB600", zebra: "FFF2F4F8", white: "FFFFFFFF", ink: "FF000000",
  grey: "FF5A6580", line: "FFD9DEE8", green: "FFE8F3E8", amber: "FFFFF4D9", red: "FFF4B9B2",
};
const colL = (n) => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const xlFont = (o = {}) => ({ name: "Arial", size: 10, color: { argb: XL.ink }, ...o, ...(o.color ? { color: { argb: o.color } } : {}) });
const xlFill = (argb) => ({ type: "pattern", pattern: "solid", fgColor: { argb } });
const xlBorder = { top: { style: "thin", color: { argb: XL.line } }, bottom: { style: "thin", color: { argb: XL.line } },
  left: { style: "thin", color: { argb: XL.line } }, right: { style: "thin", color: { argb: XL.line } } };
const mean = (a) => { const v = a.filter((x) => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const med = (a) => { const v = a.filter((x) => x != null).sort((x, y) => x - y); if (!v.length) return null; const m = Math.floor(v.length / 2); return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
const r1 = (x) => (x == null ? null : Math.round(x * 10) / 10);

function loadExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  const urls = ["https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js", "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"];
  return urls.reduce((p, u) => p.catch(() => new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = u; s.onload = () => (window.ExcelJS ? res(window.ExcelJS) : rej()); s.onerror = rej; document.head.appendChild(s);
  })), Promise.reject()).catch(() => { throw new Error("Couldn't load the Excel library. Check your connection and try again."); });
}

async function logoPng() {
  const img = new Image(); img.src = LOGO;
  await img.decode();
  const c = document.createElement("canvas"); c.width = 472; c.height = 84;
  c.getContext("2d").drawImage(img, 0, 0, 472, 84);
  return c.toDataURL("image/png");
}

function barChartPng(rows, title) {
  const W = 1800, rowH = 64, top = 120, H = top + rows.length * rowH + 50, labelW = 760;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#001E5A"; g.font = "bold 40px Arial"; g.textAlign = "center"; g.fillText(title, W / 2, 64);
  const lo = Math.min(...rows.map((r) => r.v)), hi = Math.max(...rows.map((r) => r.v));
  const base = Math.max(0, Math.floor(lo - Math.max(2, (hi - lo) * 1.5))); // start near the data so differences are visible
  const span = Math.max(1, hi - base), maxW = W - labelW - 160;
  rows.forEach((r, i) => {
    const y = top + i * rowH;
    g.fillStyle = "#2B3350"; g.font = "26px Arial"; g.textAlign = "right"; g.textBaseline = "middle";
    let lab = r.label; while (g.measureText(lab).width > labelW - 30 && lab.length > 8) lab = lab.slice(0, -2);
    if (lab !== r.label) lab = lab.trimEnd() + "…";
    g.fillText(lab, labelW - 20, y + rowH / 2);
    const w = Math.max(4, ((r.v - base) / span) * maxW);
    g.fillStyle = r.best ? "#FFB600" : "#001E5A"; g.fillRect(labelW, y + 14, w, rowH - 28);
    g.fillStyle = "#0E1220"; g.font = "bold 26px Arial"; g.textAlign = "left"; g.fillText(r.v.toFixed(1), labelW + w + 12, y + rowH / 2);
  });
  g.strokeStyle = "#C9D2E3"; g.lineWidth = 2; g.beginPath(); g.moveTo(labelW, top - 6); g.lineTo(labelW, top + rows.length * rowH + 6); g.stroke();
  g.fillStyle = "#8A93A8"; g.font = "22px Arial"; g.textAlign = "left"; g.fillText(`Axis starts at ${base} min`, labelW, H - 18);
  return { url: c.toDataURL("image/png"), w: W / 2, h: H / 2 };
}

async function exportCommuteReport({ roster, places, minutes, homeOf, google, scenario, officeNames }) {
  const ExcelJS = await loadExcelJS();
  const wb = new ExcelJS.Workbook();
  wb.creator = "Cresa"; wb.created = new Date();
  const logoId = wb.addImage({ base64: await logoPng(), extension: "png" });

  // ---- data ----
  const emps = roster.slice().sort((a, b) => officeShort(a.office).localeCompare(officeShort(b.office)) || (a.dept || "").localeCompare(b.dept || ""));
  const N = emps.length, M = places.length;
  const today = emps.map((e) => { const h = homeOf(e); return h ? minutes(e, h) : null; });
  const grid = places.map((p) => emps.map((e) => minutes(e, p)));
  const offices = officeNames.filter((o) => emps.some((e) => officeShort(e.office) === o));
  const nameOf = (b) => b.unit || b.name;
  const labelOf = (b) => (nameOf(b) === b.address ? b.address : `${nameOf(b)} — ${b.address}`);
  const R0 = 8, R1 = R0 + N - 1;                       // matrix data rows
  const MCOL = (i) => colL(6 + i);                      // building i → matrix column (F = first building)
  const rng = (i) => `'Commute Matrix'!${MCOL(i)}${R0}:${MCOL(i)}${R1}`;
  const TODAY = `'Commute Matrix'!$E$${R0}:$E$${R1}`, OFF = `'Commute Matrix'!$B$${R0}:$B$${R1}`;
  const stat = (arr) => {
    const byOff = {}; offices.forEach((o) => { byOff[o] = mean(emps.map((e, k) => (officeShort(e.office) === o ? arr[k] : null))); });
    return { avg: mean(arr), med: med(arr), min: Math.min(...arr.filter((x) => x != null)), max: Math.max(...arr.filter((x) => x != null)), byOff };
  };
  const todayS = stat(today);
  const B = places.map((p, i) => {
    const s = stat(grid[i]);
    const shorter = grid[i].filter((m, k) => today[k] != null && m < today[k]).length;
    const longer = grid[i].filter((m, k) => today[k] != null && m > today[k]).length;
    return { p, i, ...s, shorter, longer, delta: s.avg - todayS.avg };
  });
  const ranked = B.slice().sort((a, b) => a.avg - b.avg || b.shorter - a.shorter);
  const top5 = ranked.slice(0, 5);
  const source = (google ? "Google drive time" : "Estimated drive time") + (google && scenario ? ` (${scenario}, with traffic)` : "");
  const target = 20;

  // ---- shared sheet chrome: logo, gold rule, navy title band ----
  const chrome = (ws, lastCol, title, sub) => {
    ws.properties.defaultRowHeight = 16;
    ws.pageSetup = { fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 1, orientation: lastCol.length > 1 ? "landscape" : "portrait",
      horizontalCentered: true, margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 } };
    ws.getRow(1).height = 54; ws.addImage(logoId, { tl: { col: 0.15, row: 0.15 }, ext: { width: 236, height: 42 } });
    ws.mergeCells(`A2:${lastCol}2`); ws.getRow(2).height = 5; ws.getCell("A2").fill = xlFill(XL.gold);
    ws.mergeCells(`A3:${lastCol}3`); ws.mergeCells(`A4:${lastCol}4`);
    Object.assign(ws.getCell("A3"), { value: title, font: xlFont({ size: 16, bold: true, color: XL.white }), fill: xlFill(XL.navy), alignment: { vertical: "middle", indent: 1 } });
    Object.assign(ws.getCell("A4"), { value: sub, font: xlFont({ size: 9, italic: true, color: XL.white }), fill: xlFill(XL.navy), alignment: { vertical: "middle", indent: 1 } });
    ws.getRow(3).height = 30; ws.getRow(4).height = 20;
  };
  const head = (cell, text, fill = XL.navy, size = 9) => Object.assign(cell, { value: text, font: xlFont({ size, bold: true, color: XL.white }), fill: xlFill(fill),
    alignment: { horizontal: "center", vertical: "middle", wrapText: true }, border: xlBorder });
  const put = (cell, value, o = {}) => Object.assign(cell, { value, font: xlFont({ size: o.size || 10, bold: !!o.bold }), fill: xlFill(o.fill || XL.white),
    alignment: { horizontal: o.h || "center", vertical: "middle", wrapText: !!o.wrap }, border: xlBorder, ...(o.fmt ? { numFmt: o.fmt } : {}) });

  // ================= Analysis Overview =================
  const ov = wb.addWorksheet("Analysis Overview", { views: [{ showGridLines: false }], properties: { tabColor: { argb: XL.navy } } });
  [30, 15, 17, 17, 17, 17, 17].forEach((w, i) => (ov.getColumn(i + 1).width = w));
  chrome(ov, "G", "HR Green Austin Office Commute Analysis",
    `Drive-time impact of consolidating ${N} employees into one Austin office  |  vs. today's ${offices.length === 1 ? "office" : offices.length + "-office"} baseline  |  ${source}`);
  let r = 7;
  const section = (text) => { ov.mergeCells(`A${r}:G${r}`); Object.assign(ov.getCell(`A${r}`), { value: text, font: xlFont({ size: 11, bold: true, color: XL.white }), fill: xlFill(XL.navy), alignment: { vertical: "middle", indent: 1 } }); ov.getRow(r).height = 20; r++; };
  const colHeads = () => {
    head(ov.getCell(`A${r}`), "Metric", XL.blue); ov.getCell(`A${r}`).alignment = { horizontal: "left", vertical: "middle", indent: 1 };
    head(ov.getCell(`B${r}`), "Today\n(own office)", XL.blue);
    top5.forEach((t, j) => head(ov.getCell(`${colL(3 + j)}${r}`), `${nameOf(t.p)}\n${nameOf(t.p) === t.p.address ? "" : t.p.address}`.trim(), XL.blue));
    ov.getRow(r).height = 40; r++;
  };
  const metricRow = (label, todayF, todayV, f, v, fmt, zebra) => {
    put(ov.getCell(`A${r}`), label, { h: "left", fill: zebra ? XL.zebra : XL.white });
    put(ov.getCell(`B${r}`), todayF ? { formula: todayF, result: todayV } : "—", { fmt, fill: zebra ? XL.zebra : XL.white });
    top5.forEach((t, j) => put(ov.getCell(`${colL(3 + j)}${r}`), { formula: f(t), result: v(t) }, { fmt, fill: zebra ? XL.zebra : XL.white }));
    r++;
  };
  section("A  ·  BASELINE & TOP-5 SHORTLIST");
  colHeads();
  let z = false;
  metricRow("Average Commute (All)", `AVERAGE(${TODAY})`, r1(todayS.avg), (t) => `AVERAGE(${rng(t.i)})`, (t) => r1(t.avg), "0.0", z = !z);
  offices.forEach((o) => metricRow(`Average (${o})`, `AVERAGEIF(${OFF},"${o}",${TODAY})`, r1(todayS.byOff[o]),
    (t) => `AVERAGEIF(${OFF},"${o}",${rng(t.i)})`, (t) => r1(t.byOff[o]), "0.0", z = !z));
  metricRow("Median Commute", `MEDIAN(${TODAY})`, todayS.med, (t) => `MEDIAN(${rng(t.i)})`, (t) => t.med, "0.0", z = !z);
  metricRow("Max Commute", `MAX(${TODAY})`, todayS.max, (t) => `MAX(${rng(t.i)})`, (t) => t.max, "0", z = !z);
  metricRow(`Employees ≤${target} min`, `COUNTIF(${TODAY},"<=${target}")`, today.filter((m) => m != null && m <= target).length,
    (t) => `COUNTIF(${rng(t.i)},"<=${target}")`, (t) => grid[t.i].filter((m) => m <= target).length, "0", z = !z);
  r++;
  section("B  ·  IMPACT vs. TODAY (consolidation)");
  colHeads(); z = false;
  metricRow("Δ Avg Commute (min)", null, null, (t) => `AVERAGE(${rng(t.i)})-AVERAGE(${TODAY})`, (t) => r1(t.delta), "+0.0;-0.0;0.0", z = !z);
  metricRow("% Change vs Today", null, null, (t) => `(AVERAGE(${rng(t.i)})-AVERAGE(${TODAY}))/AVERAGE(${TODAY})`, (t) => t.delta / todayS.avg, "+0.0%;-0.0%;0.0%", z = !z);
  metricRow("Employees w/ Shorter Commute", null, null, (t) => `SUMPRODUCT(--(${rng(t.i)}<${TODAY}))`, (t) => t.shorter, "0", z = !z);
  metricRow("Employees w/ Longer Commute", null, null, (t) => `SUMPRODUCT(--(${rng(t.i)}>${TODAY})*(${TODAY}<>""))`, (t) => t.longer, "0", z = !z);
  r++;

  // Key takeaways, written from the numbers.
  section("C  ·  KEY TAKEAWAYS");
  const best = ranked[0], beat = B.filter((b) => b.delta < 0).length;
  const mostShorter = B.slice().sort((a, b) => b.shorter - a.shorter || a.avg - b.avg)[0];
  const offPart = offices.length > 1 ? ` (${offices.map((o) => `${r1(todayS.byOff[o])} min for the ${emps.filter((e) => officeShort(e.office) === o).length} ${o} staff`).join(", ")})` : "";
  const d = r1(best.delta);
  const lean = offices.length > 1 ? offices.slice().sort((a, b) => best.byOff[a] - best.byOff[b])[0] : null;
  const spread = top5.length > 1 ? r1(top5[top5.length - 1].avg - top5[0].avg) : 0;
  const bullets = [
    `Today's ${offices.length > 1 ? "split-office" : "office"} setup averages ${r1(todayS.avg)} min per employee${offPart}.`,
    `Best single location: ${labelOf(best.p)} averages ${r1(best.avg)} min — ${Math.abs(d) <= 0.3 ? "effectively matching" : d < 0 ? `${Math.abs(d)} min less than` : `${d} min more than`} today's commute (${d > 0 ? "+" : ""}${d} min).`,
    beat === 0 ? `None of the ${M} candidate buildings beats today's baseline. That's expected: today each employee drives to their own office, so any single site adds time for some.`
      : `${beat} of ${M} candidate buildings beat${beat === 1 ? "s" : ""} today's baseline${beat <= 3 ? ` — today each employee drives to their own office, so most single sites add a little for some` : ""}.`,
    mostShorter.p.id !== best.p.id
      ? `Lowest average isn't the whole story: ${nameOf(best.p)}${lean ? ` favors ${lean} commuters` : " has the lowest average"}, while ${labelOf(mostShorter.p)} shortens the commute for the most employees (${mostShorter.shorter} of ${N}).`
      : `${nameOf(best.p)} also shortens the commute for the most employees (${best.shorter} of ${N}).`,
    spread <= 1.5
      ? `The top of the shortlist is tightly clustered — the top ${top5.length} buildings sit within about ${spread} min of each other — so commute is a near-tie across them and rent, space and amenities can drive the decision.`
      : `The top ${top5.length} buildings span ${spread} min, so commute is a real differentiator within the shortlist.`,
    `Full detail: the Building Ranking tab ranks all ${M} candidates${offices.length > 1 ? ` with ${offices.join(" / ")} splits` : ""}; the Commute Matrix tab holds every employee-by-building drive time.`,
  ];
  bullets.forEach((t) => {
    ov.mergeCells(`A${r}:G${r}`);
    Object.assign(ov.getCell(`A${r}`), { value: "▸  " + t, font: xlFont({ size: 10 }), alignment: { wrapText: true, vertical: "top", indent: 1 } });
    ov.getRow(r).height = 15 * Math.ceil((t.length + 4) / 115) + 8; r++;
  });
  r++;
  section(`D  ·  TOP ${Math.min(12, M)} CANDIDATES BY AVERAGE COMMUTE (min)`);
  const chart = barChartPng(ranked.slice(0, 12).map((b, k) => ({ label: labelOf(b.p), v: r1(b.avg), best: k === 0 })), "Average Employee Commute by Location (min)");
  ov.addImage(wb.addImage({ base64: chart.url, extension: "png" }), { tl: { col: 0, row: r }, ext: { width: chart.w, height: chart.h } });

  // ================= Building Ranking =================
  const rk = wb.addWorksheet("Building Ranking", { views: [{ state: "frozen", xSplit: 3, ySplit: 8, showGridLines: false }], properties: { tabColor: { argb: XL.gold } } });
  const offCols = offices.map((o) => ({ h: `Avg\n${o.replace(/^Austin\s+/i, "Austin ").replace(/North$/i, "N").replace(/South$/i, "S")}`, o }));
  const bands = [["≤10\nmin", "<=10"], ["11–20\nmin", ">10", "<=20"], ["21–30\nmin", ">20", "<=30"], ["31–40\nmin", ">30", "<=40"], ["41–50\nmin", ">40", "<=50"], ["50+\nmin", ">50"]];
  const heads = ["Rank", "Candidate Building", "Address", "Avg\n(All)", ...offCols.map((c) => c.h), "Min", "Max", ...bands.map((b) => b[0]), "# Shorter\nvs Today", "Δ vs\nToday"];
  const RL = colL(heads.length);
  [5, 26, 24, 9, ...offCols.map(() => 10), 6.5, 6.5, ...bands.map(() => 7.5), 10.5, 9.5].forEach((w, i) => (rk.getColumn(i + 1).width = w));
  chrome(rk, RL, "HR Green — Candidate Building Ranking",
    `All ${M} Austin candidate buildings ranked by average commute, with address and employee commute-band breakdown  |  Baseline (today): ${r1(todayS.avg)} min  |  ${source}`);
  heads.forEach((h, i) => head(rk.getCell(7, i + 1), h)); rk.getRow(7).height = 34;
  const bandF = (R, b) => (b.length === 2 ? `COUNTIF(${R},"${b[1]}")` : `COUNTIFS(${R},"${b[1]}",${R},"${b[2]}")`);
  const bandV = (arr, b) => arr.filter((m) => m != null && (b.length === 2 ? (b[1] === "<=10" ? m <= 10 : m > 50) : m > +b[1].slice(1) && m <= +b[2].slice(2))).length;
  const rankRow = (row, rank, name, addr, R, arr, s, isToday, fill, tb) => {
    const o = { fill, bold: isToday };
    put(rk.getCell(row, 1), rank, { ...o }); put(rk.getCell(row, 2), name, { ...o, h: "left", wrap: true }); put(rk.getCell(row, 3), addr, { ...o, h: "left", wrap: true });
    rk.getCell(row, 3).font = xlFont({ size: 9, italic: isToday, bold: isToday });
    let c = 4;
    put(rk.getCell(row, c++), { formula: `AVERAGE(${R})`, result: r1(s.avg) }, { ...o, fmt: "0.0" });
    offCols.forEach((oc) => put(rk.getCell(row, c++), { formula: `AVERAGEIF(${OFF},"${oc.o}",${R})`, result: r1(s.byOff[oc.o]) }, { ...o, fmt: "0.0" }));
    put(rk.getCell(row, c++), { formula: `MIN(${R})`, result: s.min }, { ...o, fmt: "0" });
    put(rk.getCell(row, c++), { formula: `MAX(${R})`, result: s.max }, { ...o, fmt: "0" });
    bands.forEach((b) => put(rk.getCell(row, c++), { formula: bandF(R, b), result: bandV(arr, b) }, { ...o, fmt: "0" }));
    put(rk.getCell(row, c++), isToday ? "—" : { formula: `SUMPRODUCT(--(${R}<${TODAY}))`, result: tb.shorter }, { ...o, fmt: "0" });
    put(rk.getCell(row, c++), isToday ? "—" : { formula: `AVERAGE(${R})-AVERAGE(${TODAY})`, result: r1(tb.delta) }, { ...o, fmt: "+0.0;-0.0;0.0" });
  };
  rankRow(8, "—", "TODAY — own office (baseline)", offices.length > 1 ? `${offices.length} Austin offices` : "current office", TODAY, today, todayS, true, XL.gold);
  ranked.forEach((t, k) => { rankRow(9 + k, k + 1, nameOf(t.p), t.p.address, rng(t.i), grid[t.i], t, false, k % 2 ? XL.zebra : XL.white, t); rk.getRow(9 + k).height = 22; });
  const lastR = 8 + M;
  rk.addConditionalFormatting({ ref: `D9:D${lastR}`, rules: [{ type: "colorScale", priority: 1,
    cfvo: [{ type: "min" }, { type: "percentile", value: 50 }, { type: "max" }], color: [{ argb: XL.green }, { argb: XL.amber }, { argb: XL.red }] }] });
  const c10 = colL(4 + offCols.length + 3);
  rk.addConditionalFormatting({ ref: `${c10}9:${c10}${lastR}`, rules: [{ type: "colorScale", priority: 2,
    cfvo: [{ type: "num", value: 0 }, { type: "max" }], color: [{ argb: XL.white }, { argb: XL.gold }] }] });

  // ================= Commute Matrix =================
  const mx = wb.addWorksheet("Commute Matrix", { views: [{ state: "frozen", xSplit: 5, ySplit: 7, showGridLines: false }], properties: { tabColor: { argb: XL.blue } } });
  const ML = colL(5 + M);
  [12, 13, 30, 10, 11].forEach((w, i) => (mx.getColumn(i + 1).width = w));
  for (let i = 0; i < M; i++) mx.getColumn(6 + i).width = 5.2;
  chrome(mx, ML, "Employee Commute Matrix — Austin Candidate Buildings",
    `${source} (minutes) for ${N} employees across ${M} candidate buildings  |  Confidential`);
  ["Employee ID", "Office", "Department", "Home ZIP", "Today (min)"].forEach((h, i) => head(mx.getCell(7, i + 1), h, XL.navy, 10));
  places.forEach((p, i) => { head(mx.getCell(7, 6 + i), labelOf(p), XL.navy, 8); mx.getCell(7, 6 + i).alignment = { textRotation: 90, horizontal: "center", vertical: "bottom", wrapText: true }; });
  mx.getRow(7).height = 215;
  emps.forEach((e, k) => {
    const row = R0 + k, fill = k % 2 ? XL.zebra : XL.white;
    put(mx.getCell(row, 1), `HRG-${String(k + 1).padStart(3, "0")}`, { fill, bold: true, size: 9 });
    put(mx.getCell(row, 2), officeShort(e.office) || "—", { fill, size: 9, h: "left" });
    put(mx.getCell(row, 3), e.dept || "—", { fill, size: 9, h: "left" });
    put(mx.getCell(row, 4), e.zip || "", { fill, size: 9 });
    put(mx.getCell(row, 5), today[k] == null ? null : today[k], { fill, size: 9, fmt: "0" });
    places.forEach((p, i) => put(mx.getCell(row, 6 + i), grid[i][k], { fill, size: 9, fmt: "0" }));
  });
  const avgRow = R1 + 1;
  mx.mergeCells(`A${avgRow}:D${avgRow}`);
  put(mx.getCell(avgRow, 1), "AVERAGE (min)", { bold: true, fill: XL.gold, h: "left" });
  for (let c = 5; c <= 5 + M; c++) {
    const L = colL(c), arr = c === 5 ? today : grid[c - 6];
    put(mx.getCell(avgRow, c), { formula: `AVERAGE(${L}${R0}:${L}${R1})`, result: r1(mean(arr)) }, { bold: true, fill: XL.gold, size: 9, fmt: "0.0" });
  }
  mx.addConditionalFormatting({ ref: `F${R0}:${ML}${R1}`, rules: [{ type: "colorScale", priority: 1,
    cfvo: [{ type: "num", value: 0 }, { type: "num", value: 25 }, { type: "num", value: 50 }], color: [{ argb: XL.green }, { argb: XL.amber }, { argb: XL.red }] }] });

  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = "HR_Green_Austin_Commute_Analysis.xlsx";
  document.body.appendChild(a); a.click(); a.remove();
}

function DriveTimeView({ list, total, nFilters, goTo, layers, cm, selectedIds, onToggle, canAdd, onOpenBuilding }) {
  const shortIds = React.useContext(ShortCtx).ids;
  const [sk, setSk] = useState("rank"), [dir, setDir] = useState(1);
  const [selId, setSelId] = useState(null);
  const [hoverId, setHoverId] = useState(null);
  const [showComp, setShowComp] = useState(true);
  const [exporting, setExporting] = useState(false);
  const [newScen, setNewScen] = useState(null);
  const scenLabelOf = (k) => (k === cm.peak ? cm.label : (() => { const m = /^arr-(\d)-(\d\d)(\d\d)$/.exec(k); return m ? `${DAYS[+m[1]]} · arrive by ${fmtClock(m[2] + ":" + m[3])}` : k; })());
  const { roster, target, minutes, homeOf } = cm;

  const mapped = useMemo(() => list.filter((b) => b.lat != null && b.lng != null), [list]);
  const rows = useMemo(() => mapped.map((b) => ({ b, s: commuteStats(roster, b, minutes, target, homeOf) })).filter((r) => r.s), [mapped, roster, minutes, target, homeOf]);
  const today = useMemo(() => todayStats(roster, minutes, target, homeOf), [roster, minutes, target, homeOf]);
  const rank = useMemo(() => { const m = {}; rows.slice().sort((a, b) => a.s.avg - b.s.avg || a.s.hrsWk - b.s.hrsWk).forEach((r, i) => (m[r.b.id] = i + 1)); return m; }, [rows]);
  const KEYS = { rank: (r) => rank[r.b.id], name: (r) => r.b.name, avg: (r) => r.s.avg, med: (r) => r.s.med, within: (r) => -r.s.within, hrs: (r) => r.s.hrsWk, delta: (r) => r.s.deltaHrs, better: (r) => -(r.s.better - r.s.worse) };
  const sorted = useMemo(() => rows.slice().sort((a, b) => {
    const x = KEYS[sk](a), y = KEYS[sk](b);
    if (typeof x === "string") return x.localeCompare(y) * dir;
    return ((x ?? 1e9) - (y ?? 1e9)) * dir || a.s.avg - b.s.avg;
  }), [rows, sk, dir, rank]);
  const by = (k) => { if (k === sk) setDir(-dir); else { setSk(k); setDir(1); } };
  const arr = (k) => (sk === k ? <span className="arr">{dir > 0 ? "▲" : "▼"}</span> : null);

  const bestId = sorted.length ? Object.keys(rank).find((id) => rank[id] === 1) : null;
  const sel = rows.find((r) => r.b.id === selId) || rows.find((r) => r.b.id === bestId) || null;
  const focusId = hoverId || (sel && sel.b.id);
  const focus = rows.find((r) => r.b.id === focusId) || sel;

  // Map layers: employees coloured by drive band to the focused building.
  const items = useMemo(() => {
    const out = [];
    if (showComp) out.push(...competitorItems(layers.competitors));
    out.push(...officeItems(cm.offices));
    // Employee dots are built once; their colour and minutes are set in pinState so hovering never rebuilds pins.
    roster.forEach((e, i) => out.push({ key: "e" + i, kind: "emp", emp: e, lat: e.lat, lng: e.lng, cls: "pin-emp",
      tip: `<b class="emp-min"></b><span>${esc(e.dept || "Employee")}${e.zip ? " · " + esc(e.zip) : ""}</span>` }));
    rows.forEach((r) => out.push({ key: r.b.id, id: r.b.id, kind: "bldg", lat: r.b.lat, lng: r.b.lng, cls: "pin-bldg", html: String(rank[r.b.id]),
      tip: `<b>${esc(r.b.name)}</b><span>${r.s.avg} min avg · ${r.s.within}% ≤ ${target}</span>` }));
    return out;
  }, [rows, roster, target, showComp, layers.competitors, cm.offices, rank]);

  const stateKey = [focusId, sel && sel.b.id, selectedIds.join(","), shortIds.join(","), cm.peak, cm.useGoogle, target, items.length].join("|");
  const pinState = (el, it) => {
    if (it.kind === "emp") {
      const m = focus ? minutes(it.emp, focus.b) : null;
      const band = m == null ? "" : bandOf(m, target);
      ["good", "mid", "far"].forEach((k) => el.classList.toggle("band-" + k, band === k));
      const t = el.querySelector(".emp-min"); if (t) t.textContent = m == null ? "" : m + " min to " + focus.b.name;
      return;
    }
    if (it.kind !== "bldg") return;
    el.classList.toggle("short", shortIds.includes(it.id));
    el.classList.toggle("act", sel && it.id === sel.b.id);
    el.classList.toggle("hov", it.id === hoverId);
    el.classList.toggle("sel", selectedIds.includes(it.id));
  };

  if (!cm.hasData) return (
    <div className="panel"><div className="empty" style={{ margin: "auto", maxWidth: 520 }}>
      <div className="empty-t">No employee locations yet</div>
      Add an <b>Employees</b> tab to the Google Sheet (home address, department, office) and a <b>Current Offices</b> tab
      (Name, Address, Code). The publisher script locates each address and this tab fills in on the next refresh.
    </div></div>
  );

  const deptRows = focus ? cm.depts.map((d) => {
    const r = roster.filter((e) => e.dept === d);
    if (!r.length) return null;
    const ms = r.map((e) => minutes(e, focus.b));
    const tm = r.filter((e) => homeOf(e)).map((e) => minutes(e, homeOf(e)));
    return { d, n: r.length, avg: Math.round(ms.reduce((a, b) => a + b, 0) / ms.length), today: tm.length ? Math.round(tm.reduce((a, b) => a + b, 0) / tm.length) : null };
  }).filter(Boolean).sort((a, b) => b.n - a.n) : [];
  const maxDept = Math.max(60, ...deptRows.map((r) => Math.max(r.avg, r.today || 0)));
  const need = cm.lookupsNeeded(mapped);
  const cover = cm.coverage(mapped);

  return (
    <div className="drive">
      <div className="panel drive-bar">
        {(cm.isAdmin || cm.scenarios.length > 1) && <div className="db-group"><span className="db-l">Drive time</span>
          <select value={cm.peak} onChange={(e) => cm.setPeak(e.target.value)} title={cm.hint}>
            {cm.scenarios.map((k) => <option key={k} value={k}>{k === "am" ? "Standard (no traffic)" : cm.scenarios && scenLabelOf(k)}</option>)}
          </select>
          {cm.isAdmin && !newScen && <button className="btn sm" onClick={() => setNewScen({ day: 2, time: "09:00" })}>+ Arrival time</button>}
          {cm.isAdmin && cm.peak !== "am" && !newScen && <button className="link" onClick={() => { if (confirm("Remove this scenario and its saved drive times?")) cm.removeScenario(cm.peak); }}>Remove</button>}
          {newScen && <span className="scen-new">
            <select value={newScen.day} onChange={(e) => setNewScen({ ...newScen, day: +e.target.value })}>
              {[1, 2, 3, 4, 5].map((d) => <option key={d} value={d}>{DAYS[d]}</option>)}
            </select>
            <span className="db-n">arrive by</span>
            <input type="time" step="900" value={newScen.time} onChange={(e) => setNewScen({ ...newScen, time: e.target.value || "09:00" })} />
            <button className="btn sm primary" onClick={() => { cm.addScenario(newScen.day, newScen.time); setNewScen(null); }}>Add</button>
            <button className="link" onClick={() => setNewScen(null)}>Cancel</button>
          </span>}
        </div>}
        <div className="db-group"><span className="db-l">Target</span>
          <Seg value={target} onChange={cm.setTarget} options={TARGETS.map((t) => [t, t + " min"])} /></div>
        <div className="db-group"><span className="db-l">Who</span>
          <select value={cm.office} onChange={(e) => cm.setOffice(e.target.value)}>
            <option value="all">All offices</option>
            {cm.officeNames.map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
          <select value={cm.dept} onChange={(e) => cm.setDept(e.target.value)}>
            <option value="all">All departments</option>
            {cm.depts.map((d) => <option key={d} value={d}>{d}</option>)}
          </select>
          <span className="db-n">{roster.length} people</span>
        </div>
        <div className="db-group"><ShortlistSwitch compact /></div>
        <div className="db-group">
          <span className="db-n">{list.length === total ? `All ${total} buildings` : `${list.length} of ${total} buildings`}
            {nFilters > 0 && <> · <button className="link" onClick={() => goTo("map")}>{nFilters} filter{nFilters > 1 ? "s" : ""} on</button></>}</span>
        </div>
        <div className="db-src">
          <button className="btn sm" disabled={exporting} title="Commute analysis workbook: overview, building ranking and employee-by-building matrix"
            onClick={async () => {
              setExporting(true);
              try { await exportCommuteReport({ roster, places: mapped, minutes, homeOf, google: cm.useGoogle && cover > 0.98, scenario: cm.peak !== "am" ? cm.label : null, officeNames: cm.officeNames }); }
              catch (e) { alert(e.message || "Export failed"); }
              setExporting(false);
            }}>{I.dl} {exporting ? "Building report…" : "Excel report"}</button>
          {cm.fetching != null ? (
            <span className="src-chip live"><span className="spin" />{cm.fetchNote || `Getting Google times… ${Math.round(cm.fetching * 100)}%`}</span>
          ) : cm.useGoogle && cover > 0.98 ? (
            <><span className="src-chip live" title={cm.hint}>Google drive times{cm.traffic ? " · with traffic" : ""}</span>
              {cm.isAdmin && <button className="btn sm" onClick={() => cm.setUseGoogle(false)}>Use estimates</button>}</>
          ) : (
            <><span className="src-chip est" title="Straight-line distance at typical Austin speeds for the time of day">
                {cm.useGoogle && cover > 0 ? "Partly estimated" : "Estimated"}</span>
              {cm.isAdmin && <button className="btn sm primary" onClick={() => {
                if (!need) { cm.setUseGoogle(true); return; }
                const msg = cm.traffic
                  ? `Look up ${need.toLocaleString()} drive times from Google for ${cm.label}?\n\nThis uses Google's traffic tier (Route Matrix Pro): the first 5,000 each month are free, then about $10 per 1,000 — at most about $${Math.ceil(need * 0.01)} for this run if the free allowance is used up. Results are saved for everyone.`
                  : `Look up ${need.toLocaleString()} drive times from Google?\n\nGoogle's first 10,000 each month are free (Route Matrix Essentials); beyond that it's about $5 per 1,000. Results are saved for everyone who opens this page, so it only needs doing once. Buildings or employees added later cost only their new pairs.`;
                if (confirm(msg)) cm.fetchGoogle(mapped);
              }}>{need ? `Get Google drive times (${need.toLocaleString()})` : "Use Google drive times"}</button>}</>
          )}
        </div>
        {cm.error && <div className="db-err">{cm.error}</div>}
        {cm.notice && <div className="db-ok">{cm.notice}</div>}
      </div>

      <div className="panel drive-table">
        <div className="tbl-wrap">
          <table className="tbl dt">
            <thead><tr>
              <th className="r" onClick={() => by("rank")}>#{arr("rank")}</th>
              <th onClick={() => by("name")}>Building{arr("name")}</th>
              <th className="r" onClick={() => by("avg")}>Avg{arr("avg")}</th>
              <th className="r" onClick={() => by("med")}>Median{arr("med")}</th>
              <th onClick={() => by("within")}>Within {target} min{arr("within")}</th>
              <th className="r" onClick={() => by("hrs")} title="Total team drive time per week (round trip, 5 days)">Team hrs/wk{arr("hrs")}</th>
              <th className="r" onClick={() => by("delta")} title="Change in team hours per week vs each person's current office">vs today{arr("delta")}</th>
              <th style={{ width: 30 }} title="Shortlist"></th>
              <th style={{ width: 30 }} title="Compare"></th>
            </tr></thead>
            <tbody>
              {today && (
                <tr className="today">
                  <td className="r"><span className="star-ic" dangerouslySetInnerHTML={{ __html: STAR_SVG }} /></td>
                  <td><div className="tname">Today</div><div className="tsub">Current offices</div></td>
                  <td className="r"><b>{today.avg}</b> min</td>
                  <td className="r">{today.med} min</td>
                  <td><div className="within"><DistBar s={today} target={target} /><span>{today.within}%</span></div></td>
                  <td className="r">{today.hrsWk.toLocaleString()}</td>
                  <td className="r">—</td><td></td><td></td>
                </tr>
              )}
              {sorted.map((r) => {
                const isSel = sel && r.b.id === sel.b.id, inCmp = selectedIds.includes(r.b.id);
                return (
                  <tr key={r.b.id} className={(isSel ? "act" : "") + (inCmp ? " sel" : "")} onClick={() => setSelId(r.b.id)}
                    onMouseEnter={() => setHoverId(r.b.id)} onMouseLeave={() => setHoverId(null)}>
                    <td className="r"><span className={"num sm" + (rank[r.b.id] === 1 ? " best" : "")}>{rank[r.b.id]}</span></td>
                    <td><div className="tname">{r.b.name}</div><div className="tsub">{subLine(r.b) || r.b.address}</div></td>
                    <td className="r"><b>{r.s.avg}</b> min</td>
                    <td className="r">{r.s.med} min</td>
                    <td><div className="within"><DistBar s={r.s} target={target} /><span>{r.s.within}%</span></div></td>
                    <td className="r">{r.s.hrsWk.toLocaleString()}</td>
                    <td className={"r delta " + (r.s.deltaHrs == null ? "" : r.s.deltaHrs < 0 ? "good" : r.s.deltaHrs > 0 ? "bad" : "")}>{fmtDeltaHrs(r.s.deltaHrs)}</td>
                    <td className="c-star" onClick={(e) => e.stopPropagation()}><StarBtn id={r.b.id} /></td>
                    <td onClick={(e) => e.stopPropagation()}><input type="checkbox" title="Add to compare" checked={inCmp} disabled={!inCmp && !canAdd} onChange={() => onToggle(r.b.id)} /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {!rows.length && <div className="empty">No mapped buildings match these filters.</div>}
        </div>
        <div className="dt-legend">
          <span><i className="d-good" />≤ {target} min</span><span><i className="d-mid" />{target + 1}–{target + 15}</span><span><i className="d-far" />{target + 15}+ min</span>
          <span className="dt-note">{cm.useGoogle && cover > 0.98 ? cm.hint : cm.traffic ? `${cm.label} — not fetched yet; showing estimates` : "Estimated from distance at typical Austin speeds"}</span>
        </div>
      </div>

      <div className="drive-side">
      <div className="map-wrap drive-map">
        <MapCanvas items={items} state={pinState} stateKey={stateKey} fitKey={mapped.map((b) => b.id).join("|") + "|" + layers.employees.length}
          fitTo={[...mapped, ...roster]} onClick={(it) => it.kind === "bldg" && setSelId(it.id)}
          onHover={(it) => setHoverId(it && it.kind === "bldg" ? it.id : null)}>
          <div className="layers">
            <label className="layer-row"><input type="checkbox" checked={showComp} onChange={(e) => setShowComp(e.target.checked)} /><i className="lg lg-comp" /><span>Competitors</span><span className="n">{layers.competitors.length}</span></label>
          </div>
        </MapCanvas>
      </div>
        {focus && (
          <div className="panel insight">
            <div className="ins-h">
              <span className={"num sm" + (rank[focus.b.id] === 1 ? " best" : "")}>{rank[focus.b.id]}</span>
              <div style={{ minWidth: 0 }}><div className="ins-name">{focus.b.name}</div><div className="ins-sub">{subLine(focus.b)}</div></div>
              <button className="btn sm" onClick={() => onOpenBuilding(focus.b.id)}>Details</button>
            </div>
            <div className="ins-big">
              <div><b>{focus.s.good}</b><span>of {focus.s.n} within {target} min</span></div>
              <div><b>{focus.s.avg}<small> min</small></b><span>average drive in</span></div>
              {focus.s.deltaHrs != null && <div><b className={focus.s.deltaHrs < 0 ? "good" : focus.s.deltaHrs > 0 ? "bad" : ""}>{fmtDeltaHrs(focus.s.deltaHrs)}<small> hrs</small></b><span>team time / week vs today</span></div>}
            </div>
            {focus.s.nBase > 0 && (
              <div className="h2h">
                <div className="ins-l">Compared with each person's current office</div>
                {[["better", "Shorter by 5+ min"], ["same", "About the same"], ["worse", "Longer by 5+ min"]].map(([k, lbl]) => (
                  <div className="h2h-row" key={k}>
                    <span className="h2h-lbl">{lbl}</span>
                    <span className="h2h-track"><span className={"h2h-fill " + k} style={{ width: (focus.s[k] / focus.s.nBase) * 100 + "%" }} /></span>
                    <span className="h2h-n">{focus.s[k]}</span>
                  </div>
                ))}
              </div>
            )}
            {deptRows.length > 1 && (
              <div className="depts">
                <div className="ins-l">Average by department <span className="dl-key"><i className="k-new" />here <i className="k-today" />today</span></div>
                {deptRows.slice(0, 5).map((r) => (
                  <div className="dept-row" key={r.d} title={`${r.n} people`}>
                    <span className="dept-n">{r.d}</span>
                    <span className="dept-bars">
                      <span className="k-new" style={{ width: (r.avg / maxDept) * 100 + "%" }} />
                      {r.today != null && <span className="k-today" style={{ width: (r.today / maxDept) * 100 + "%" }} />}
                    </span>
                    <span className="dept-v">{r.avg}{r.today != null && <em> / {r.today}</em>}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ===================== UI PIECES =====================
// Second line under a building's title: the address, or — when the title already is the address — its building label.
const subLine = (b) => (b.name === b.address ? b.unit || "" : b.address);

const Photo = ({ b, className }) => b.photo
  ? <img className={className} src={b.photo} alt={b.name} loading="lazy" />
  : <div className={className + " ph"}>No photo</div>;

function DetailCard({ b, selected, onToggleCompare, onClose, canAdd, onDetails }) {
  return (
    <div className="detail" onClick={(e) => e.stopPropagation()}>
      <div className="detail-photo">
        {b.photo ? <img src={b.photo} alt={b.name} /> : <div className="map-msg">No photo</div>}
        <button className="detail-x" onClick={onClose} aria-label="Close">×</button>
      </div>
      <div className="detail-b">
        <div className="detail-name">{b.name}</div>
        <div className="detail-addr">{[subLine(b), b.city].filter(Boolean).join(", ")}</div>
        <div className="detail-tags">
          {b.cls && <span className="tag">Class {b.cls}</span>}
          {b.submarket && <span className="tag">{b.submarket}</span>}
          {b.contig && <span className="tag gold">9,000+ SF contiguous</span>}
        </div>
        <div className="stats">
          <div><div className="stat-l">Total rent</div><div className="stat-v">{fmtRent(b.totalRent)}<span style={{ fontSize: 11, color: "var(--ink4)" }}> /SF</span></div></div>
          <div><div className="stat-l">Direct rent / OPEX</div><div className="stat-v">{fmtRent(b.rent)} / {fmtRent(b.opex)}</div></div>
          <div><div className="stat-l">Building size</div><div className="stat-v">{fmtSF(b.rba)}</div></div>
          <div><div className="stat-l">% Leased</div><div className="stat-v">{fmtPct(b.leased)}</div></div>
          <div><div className="stat-l">Stories</div><div className="stat-v">{b.stories ?? "—"}</div></div>
          <div><div className="stat-l">Built / renovated</div><div className="stat-v">{yearsText(b)}</div></div>
        </div>
        {b.contig && b.contigText && !/^(y|yes|true)$/i.test(b.contigText) && (
          <div className="detail-sec"><div className="stat-l">Contiguous suites 9,000+ SF</div>{b.contigText}</div>
        )}
        {b.owner && <div className="detail-sec"><div className="stat-l">Owner</div>{b.owner}</div>}
        {b.amenities.length > 0 && (
          <div className="detail-sec"><div className="stat-l">Amenities ({b.amenities.length})</div>
            <div className="amen-chips">{b.amenities.map((a) => <span key={a}>{a}</span>)}</div></div>
        )}
      </div>
      {onDetails && <div className="detail-more"><button className="btn primary" onClick={onDetails}>View full details →</button></div>}

}

// Dropdown with checkboxes: pick any number of options; none picked = all.
function MultiSelect({ options, value, onChange, allLabel, fmt = (x) => x }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const key = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", close); document.addEventListener("keydown", key);
    return () => { document.removeEventListener("mousedown", close); document.removeEventListener("keydown", key); };
  }, [open]);
  const label = !value.length ? allLabel : value.length <= 2 ? value.map(fmt).join(", ") : `${value.length} selected`;
  const toggle = (o) => onChange(value.includes(o) ? value.filter((v) => v !== o) : [...value, o]);
  return (
    <div className={"ms" + (open ? " open" : "")} ref={ref}>
      <button type="button" className={"ms-btn" + (value.length ? " on" : "")} onClick={() => setOpen(!open)} aria-haspopup="listbox" aria-expanded={open}>
        <span className="ms-label">{label}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      {open && (
        <div className="ms-pop" role="listbox" aria-multiselectable="true">
          {options.map(([o, n]) => (
            <label key={o} className="ms-opt">
              <input type="checkbox" checked={value.includes(o)} onChange={() => toggle(o)} />
              <span>{fmt(o)}</span><span className="n">{n}</span>
            </label>
          ))}
          <div className="ms-foot">
            <button type="button" className="link" onClick={() => onChange([])} disabled={!value.length}>Clear</button>
            <button type="button" className="btn sm primary" onClick={() => setOpen(false)}>Done</button>
          </div>
        </div>
      )}
    </div>
  );
}

function ChipGroup({ options, value, onChange }) {
  return (
    <div className="chips">
      {options.map(([opt, n]) => {
        const on = value.includes(opt);
        return (
          <button key={opt} className={"chip" + (on ? " on" : "")} onClick={() => onChange(on ? value.filter((v) => v !== opt) : [...value, opt])}>
            {opt} <span className="n">{n}</span>
          </button>
        );
      })}
    </div>
  );
}

function Range({ f, set, lo, hi, phLo, phHi, step }) {
  return (
    <div className="rng">
      <input type="number" inputMode="decimal" step={step} placeholder={phLo} value={f[lo]} onChange={(e) => set({ [lo]: e.target.value })} />
      <span>–</span>
      <input type="number" inputMode="decimal" step={step} placeholder={phHi} value={f[hi]} onChange={(e) => set({ [hi]: e.target.value })} />
    </div>
  );
}

const countBy = (list, key) => {
  const m = {};
  list.forEach((b) => { const k = b[key]; if (k) m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0]));
};
const bounds = (list, key) => {
  const v = list.map((b) => b[key]).filter((x) => x != null);
  return v.length ? [Math.min(...v), Math.max(...v)] : [null, null];
};

// Layer toggles beside Map / Satellite. Always listed, so it's clear what can be added before the sheet has the data.
function MapLayerBar({ show, setShow, counts }) {

  return (
    <div className="layers">

            <input type="checkbox" disabled={!n} checked={!!n && show[k]} onChange={(e) => setShow((s) => ({ ...s, [k]: e.target.checked }))} />
            {icon}<span>{label}</span>
          </label>
        );
      })}
    </div>
  );
}

                <label key={a} className="toggle">
                  <input type="checkbox" checked={f.amenities.includes(a)}
                    onChange={(e) => set({ amenities: e.target.checked ? [...f.amenities, a] : f.amenities.filter((x) => x !== a) })} />
                  {a}<span className="n">{n}</span>
                </label>
              ))}
            </div>
            {amenCounts.length > 10 && <button className="btn sm" style={{ marginTop: 8 }} onClick={() => setShowAllAmen(!showAllAmen)}>
              {showAllAmen ? "Show fewer" : `Show all ${amenCounts.length}`}</button>}

      <div className="f-foot">

function ListPanel({ list, labels, sort, setSort, activeId, hoveredId, selectedIds, onOpen, onHover, onToggle, canAdd }) {
  const refs = useRef({});
  const box = useRef(null);
  // Scroll only the list (scrollIntoView would also scroll the page and hide the header).
  useEffect(() => {
    const n = activeId && refs.current[activeId], c = box.current;
    if (!n || !c) return;
    const top = n.offsetTop, bottom = top + n.offsetHeight;
    if (top < c.scrollTop) c.scrollTo({ top, behavior: "smooth" });
    else if (bottom > c.scrollTop + c.clientHeight) c.scrollTo({ top: bottom - c.clientHeight, behavior: "smooth" });
  }, [activeId]);
  return (
    <div className="panel">
      <div className="panel-h"><span className="panel-t">{list.length} buildings</span>
        <label className="sort">Sort<select value={sort} onChange={(e) => setSort(e.target.value)}>
          {Object.entries(SORTS).map(([k, s]) => <option key={k} value={k}>{s.label}</option>)}</select></label></div>
      <div className="panel-b" ref={box} style={{ position: "relative" }}>
        {list.length === 0 && <div className="empty">No buildings match these filters.<br />Try widening a range or clearing a filter.</div>}
        {list.map((b) => {
          const sel = selectedIds.includes(b.id);
          return (
            <div key={b.id} ref={(n) => (refs.current[b.id] = n)}
              className={"card" + (b.id === activeId ? " act" : "") + (b.id === hoveredId ? " hov" : "")}
              onClick={() => onOpen(b.id)} onMouseEnter={() => onHover(b.id)} onMouseLeave={() => onHover(null)}>
              <div className={"num" + (sel ? " sel" : "")}>{labels[b.id]}</div>
              <Photo b={b} className="thumb" />
              <div style={{ minWidth: 0, paddingRight: 22 }}>
                <div className="c-name">{b.name}</div>
                <div className="c-addr">{subLine(b)}</div>
                <div className="c-meta">
                  <span><b>{fmtRent(b.totalRent)}</b> total</span>
                  <span>{fmtK(b.rba)} SF</span>
                  <span>{fmtPct(b.leased)} leased</span>
                </div>
              </div>
              <label className="cmp-box" onClick={(e) => e.stopPropagation()} title="Add to compare">
                <input type="checkbox" checked={sel} disabled={!sel && !canAdd} onChange={() => onToggle(b.id)} />
              </label>
              <StarBtn id={b.id} className="card-star" />
            </div>
          );
        })}
      </div>
    </div>
  );
}

const TABLE_COLS = [
  { k: "num", label: "#", get: (b, l) => l[b.id], r: true },
  { k: "photo", label: "", sort: false },
  { k: "address", label: "Address", get: (b) => b.address },
  { k: "name", label: "Property name", get: (b) => b.unit || (b.name === b.address ? "" : b.name), fmt: (b) => b.unit || (b.name === b.address ? "—" : b.name) },
  { k: "submarket", label: "Submarket", get: (b) => b.submarket },
  { k: "cls", label: "Class", get: (b) => b.cls },
  { k: "rba", label: "RBA (SF)", get: (b) => b.rba, fmt: (b) => fmtInt(b.rba), r: true },
  { k: "stories", label: "Stories", get: (b) => b.stories, fmt: (b) => b.stories ?? "—", r: true },
  { k: "yearBuilt", label: "Built", get: (b) => b.yearBuilt, fmt: (b) => b.yearBuilt || "—", r: true },
  { k: "yearReno", label: "Renov.", get: (b) => b.yearReno, fmt: (b) => b.yearReno || "—", r: true },
  { k: "leased", label: "% Leased", get: (b) => b.leased, fmt: (b) => fmtPct(b.leased), r: true },
  { k: "rent", label: "Direct rent", get: (b) => b.rent, fmt: (b) => fmtRent(b.rent), r: true },
  { k: "opex", label: "OPEX", get: (b) => b.opex, fmt: (b) => fmtRent(b.opex), r: true },
  { k: "totalRent", label: "Total rent", get: (b) => b.totalRent, fmt: (b) => fmtRent(b.totalRent), r: true },
  { k: "contig", label: "Available 9K+ SF suites", get: (b) => (b.contig ? 1 : 0), fmt: (b) => (b.contig ? <span title={b.contigText}>{/^(y|yes|true)$/i.test(b.contigText) ? "Yes" : b.contigText}</span> : "—") },
  { k: "amenityCount", label: "Amenities", get: (b) => b.amenityCount, r: true },
  { k: "owner", label: "Owner", get: (b) => b.owner, fmt: (b) => <span title={b.owner}>{b.owner || "—"}</span> },
];

function TableView({ list, labels, selectedIds, onToggle, onOpen, canAdd }) {
  const [sk, setSk] = useState("num"), [dir, setDir] = useState(1);
  const col = TABLE_COLS.find((c) => c.k === sk);
  const rows = useMemo(() => list.slice().sort((a, b) => {
    const x = col.get(a, labels), y = col.get(b, labels);
    if (x == null || x === "") return 1; if (y == null || y === "") return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  }), [list, sk, dir, labels]);
  const click = (c) => { if (c.sort === false) return; if (c.k === sk) setDir(-dir); else { setSk(c.k); setDir(1); } };
  return (
    <div className="panel">
      <div className="panel-h"><span className="panel-t">All options · {list.length} buildings</span>
        <span style={{ marginLeft: "auto", fontSize: 12, color: "var(--ink4)" }}>Click a row for details · tick to compare</span></div>
      <div className="tbl-wrap">
        {list.length === 0 ? <div className="empty">No buildings match these filters.</div> : (
          <table className="tbl prop">
            <thead><tr>
              <th style={{ width: 30 }} title="Compare"></th>
              <th style={{ width: 30 }} title="Shortlist"></th>
              {TABLE_COLS.map((c) => <th key={c.k} className={c.r ? "r" : ""} onClick={() => click(c)}>{c.label}{sk === c.k && <span className="arr">{dir > 0 ? "▲" : "▼"}</span>}</th>)}
            </tr></thead>
            <tbody>
              {rows.map((b) => {
                const sel = selectedIds.includes(b.id);
                return (
                  <tr key={b.id} className={sel ? "sel" : ""} onClick={() => onOpen(b.id)}>
                    <td onClick={(e) => e.stopPropagation()}><input type="checkbox" title="Add to compare" checked={sel} disabled={!sel && !canAdd} onChange={() => onToggle(b.id)} /></td>
                    <td className="c-star" onClick={(e) => e.stopPropagation()}><StarBtn id={b.id} /></td>
                    {TABLE_COLS.map((c) => (
                      <td key={c.k} className={(c.r ? "r " : "") + "c-" + c.k}>
                        {c.k === "photo" ? (b.photo ? <img src={b.photo} alt="" loading="lazy" /> : null)
                          : c.fmt ? c.fmt(b) : (c.get(b, labels) ?? "—")}
                      </td>
                    ))}
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

function CompareView({ all, selectedIds, onRemove, onClear, amenCols, goTo, cm }) {
  const items = selectedIds.map((id) => all.find((b) => b.id === id)).filter(Boolean);
  if (!items.length) return (
    <div className="panel"><div className="empty" style={{ margin: "auto" }}>
      <div style={{ fontSize: 15, fontWeight: 700, color: "var(--navy)", marginBottom: 6 }}>Nothing to compare yet</div>
      Tick the box on up to {MAX_COMPARE} buildings in the Map or Table view, then come back here.
      <div style={{ marginTop: 14, display: "flex", gap: 8, justifyContent: "center" }}>
        <button className="btn primary" onClick={() => goTo("map")}>{I.map} Go to map</button>
        <button className="btn" onClick={() => goTo("table")}>{I.table} Go to table</button></div>
    </div></div>
  );
  const best = (key, dirLow) => {
    const v = items.map((b) => b[key]).filter((x) => x != null);
    if (v.length < 2) return null;
    return dirLow ? Math.min(...v) : Math.max(...v);
  };
  const ROWS = [
    ["Location", null],
    ["Submarket", (b) => b.submarket || "—"],
    ["City", (b) => b.city],
    ["Owner", (b) => b.owner || "—"],
    ["Building", null],
    ["Class", (b) => b.cls || "—"],
    ["Building size (RBA)", (b) => fmtSF(b.rba), "rba", false],
    ["Stories", (b) => b.stories ?? "—"],
    ["Year built", (b) => b.yearBuilt || "—"],
    ["Year renovated", (b) => b.yearReno || "—"],
    ["% Leased", (b) => fmtPct(b.leased)],
    ["Available 9K+ SF suites", (b) => (b.contig ? (/^(y|yes|true)$/i.test(b.contigText) ? "Yes" : b.contigText) : "—")],
    ["Economics ($/SF/yr)", null],
    ["Direct asking rent", (b) => fmtRent(b.rent), "rent", true],
    ["OPEX", (b) => fmtRent(b.opex), "opex", true],
    ["Total rent", (b) => fmtRent(b.totalRent), "totalRent", true],
  ];
  if (cm && cm.hasData && cm.roster.length) {
    const st = {};
    items.forEach((b) => { if (b.lat != null && b.lng != null) st[b.id] = commuteStats(cm.roster, b, cm.minutes, cm.target, cm.homeOf); });
    const bestOf = (fn, low) => { const v = items.map((b) => st[b.id] && fn(st[b.id])).filter((x) => x != null); return v.length < 2 ? null : low ? Math.min(...v) : Math.max(...v); };
    const row = (label, fn, fmt, low) => {
      const bv = bestOf(fn, low);
      return [label, (b) => (st[b.id] ? fmt(fn(st[b.id])) : "—"), null, null, (b) => bv != null && st[b.id] && fn(st[b.id]) === bv];
    };
    ROWS.push(
      [`Drive time${cm.useGoogle ? " · Google" : " (est.)"}${cm.peak !== "am" ? " · " + cm.label : ""}`, null],
      row("Average drive", (s) => s.avg, (v) => v + " min", true),
      row(`Within ${cm.target} min`, (s) => s.within, (v) => v + "%", false),
      row("Team hrs / week", (s) => s.hrsWk, (v) => v.toLocaleString(), true),
      row("vs today (hrs / week)", (s) => s.deltaHrs, (v) => fmtDeltaHrs(v), true),
    );
  }
  const amenUsed = amenCols.filter((a) => items.some((b) => b.amenities.includes(a)));
  return (
    <div className="panel">
      <div className="panel-h"><span className="panel-t">Comparing {items.length} buildings</span>
        <button className="btn sm" style={{ marginLeft: "auto" }} onClick={onClear}>Clear all</button></div>
      <div className="cmp-wrap">
        <table className="cmp">
          <thead><tr><th></th>
            {items.map((b) => (
              <th key={b.id}>
                {b.photo ? <img src={b.photo} alt={b.name} /> : <div className="thumb ph" style={{ width: "100%", height: 130 }}>No photo</div>}
                <div className="cname">{b.name}</div>
                <div className="caddr">{subLine(b)}</div>
                <button className="btn sm" style={{ marginTop: 8 }} onClick={() => onRemove(b.id)}>Remove</button>
              </th>
            ))}</tr></thead>
          <tbody>
            {ROWS.map(([label, fn, key, low, isBest]) => fn == null
              ? <tr key={label} className="grp"><td>{label}</td>{items.map((b) => <td key={b.id}></td>)}</tr>
              : <tr key={label}><td>{label}</td>{items.map((b) => {
                  return <td key={b.id}>{fn(b)}</td>;
                })}</tr>)}
            {amenUsed.length > 0 && <tr className="grp"><td>Amenities</td>{items.map((b) => <td key={b.id}>{b.amenities.length} total</td>)}</tr>}
            {amenUsed.map((a) => (
              <tr key={a}><td style={{ textTransform: "none", letterSpacing: 0, fontSize: 12, fontWeight: 600 }}>{a}</td>
                {items.map((b) => <td key={b.id}>{b.amenities.includes(a) ? <span className="yes">✓</span> : <span className="no">—</span>}</td>)}</tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function exportCSV(list, amenCols) {
  const cols = [["Property Name", (b) => b.name], ["Property Address", (b) => b.address], ["City", (b) => b.city], ["Submarket", (b) => b.submarket],
    ["Class", (b) => b.cls], ["RBA", (b) => b.rba], ["Stories", (b) => b.stories], ["Year Built", (b) => b.yearBuilt], ["Year Renovated", (b) => b.yearReno],
    ["Percent Leased", (b) => b.leased], ["Direct Rent", (b) => b.rent], ["OPEX", (b) => b.opex], ["Total Rent", (b) => b.totalRent],
    ["Contiguous 9,000+ SF", (b) => b.contigText], ["Owner", (b) => b.owner], ["Amenities", (b) => b.amenities.join("; ")]];
  const esc = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [cols.map((c) => c[0]).join(","), ...list.map((b) => cols.map((c) => esc(c[1](b))).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "Cresa_Austin_Office_Options_HR_Green.csv";
  a.click();
}

// ===================== PROPERTY DETAIL PAGE =====================
// "97,149 SF (Bldg contiguous); 32,383 SF (Floor contiguous)" -> [{ sf, label }]
function parseSuites(text) {
  return String(text || "").split(/;\s*/).map((part) => {
    const t = part.trim(); if (!t) return null;
    const m = t.match(/([\d,]+)\s*SF\s*(?:\((.*)\))?/i);
    if (!m) return { sf: null, label: t };
    const raw = (m[2] || "").trim();
    const label = raw.replace(/^Bldg\b/i, "Building").replace(/^Ste\b\.?/i, "Suite").replace(/\bSte\b/g, "Suite") || "Available";
    return { sf: +m[1].replace(/,/g, ""), label };
  }).filter(Boolean);
}

function DetailPage({ b, all, list, cm, layers, amenCols, selected, canAdd, onToggleCompare, onBack, onNav }) {
  const idx = list.findIndex((x) => x.id === b.id);
  const prev = idx > 0 ? list[idx - 1] : null, next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;
  const scroller = useRef(null);
  useEffect(() => { if (scroller.current) scroller.current.scrollTop = 0; }, [b.id]);
  useEffect(() => {
    const k = (e) => {
      if (e.target.closest && e.target.closest("input, select, textarea")) return;
      if (e.key === "Escape") onBack();
      else if (e.key === "ArrowLeft" && prev) onNav(prev.id);
      else if (e.key === "ArrowRight" && next) onNav(next.id);
    };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [prev, next]);

  const suites = parseSuites(b.contigText);
  const largest = Math.max(0, ...suites.map((s) => s.sf || 0)) || null;

  // Commute: this building vs today, and its rank among every mapped option.
  const hasGeo = b.lat != null && b.lng != null;
  const roster = cm.roster;
  const s = hasGeo && roster.length ? commuteStats(roster, b, cm.minutes, cm.target, cm.homeOf) : null;
  const today = roster.length ? todayStats(roster, cm.minutes, cm.target, cm.homeOf) : null;
  const ranks = useMemo(() => {
    if (!roster.length) return null;
    const avgs = all.filter((x) => x.lat != null).map((x) => ({ id: x.id, a: roster.reduce((t, e) => t + cm.minutes(e, x), 0) / roster.length }));
    avgs.sort((p, q) => p.a - q.a);
    return { rank: avgs.findIndex((x) => x.id === b.id) + 1, of: avgs.length };
  }, [all, roster, cm.minutes, b.id]);
  const byOffice = cm.officeNames.map((o) => {
    const r = roster.filter((e) => officeShort(e.office) === o);
    if (!r.length || !hasGeo) return null;
    const here = r.reduce((t, e) => t + cm.minutes(e, b), 0) / r.length;
    const withHome = r.filter((e) => cm.homeOf(e));
    const now = withHome.length ? withHome.reduce((t, e) => t + cm.minutes(e, cm.homeOf(e)), 0) / withHome.length : null;
    return { o, n: r.length, here, now };
  }).filter(Boolean);
  const maxOff = Math.max(30, ...byOffice.map((x) => Math.max(x.here, x.now || 0)));
  const google = cm.useGoogle && cm.coverage([b]) > 0.98;
  const delta = s && today ? Math.round((s.avg - today.avg) * 10) / 10 : null;

  // Nearby: closest competitors plus HR Green's current offices.
  const near = hasGeo ? [
    ...layers.competitors.map((c) => ({ ...c, kind: "comp", d: hav(b, c) })).sort((p, q) => p.d - q.d).slice(0, 4),
    ...cm.offices.map((o) => ({ ...o, kind: "office", d: hav(b, o) })).sort((p, q) => p.d - q.d),
  ] : [];
  const mapItems = useMemo(() => [
    ...competitorItems(layers.competitors), ...officeItems(cm.offices),
    { key: b.id, id: b.id, kind: "bldg", lat: b.lat, lng: b.lng, cls: "pin-bldg act", html: STAR_SVG.replace(/14/g, "16"), tip: `<b>${esc(b.name)}</b><span>${esc(b.address)}</span>` },
  ], [b.id, layers.competitors, cm.offices]);
  const fitPts = hasGeo ? [b, ...near.filter((n) => n.kind === "comp").slice(0, 3)] : [];

  return (
    <div className="dp-scroll" ref={scroller}>
      <div className="dp">
        <div className="dp-nav">
          <button className="link dp-back" onClick={onBack}>← All options</button>
          {idx >= 0 && <div className="dp-step">
            <button className="btn sm" disabled={!prev} onClick={() => prev && onNav(prev.id)} aria-label="Previous building">‹</button>
            <span>Building <b>{idx + 1}</b> of {list.length}</span>
            <button className="btn sm" disabled={!next} onClick={() => next && onNav(next.id)} aria-label="Next building">›</button>
          </div>}
        </div>

        <section className="dp-hero">
          <div className="dp-photo">
            {b.photo ? <img src={b.photo} alt={b.name} /> : <div className="map-msg">No photo</div>}
            {ranks && ranks.rank > 0 && <div className="dp-rank">Commute rank <b>#{ranks.rank}</b> of {ranks.of}</div>}
          </div>
          <div>
            <h1 className="dp-h1">{b.name}</h1>
            <div className="dp-addr">{[b.name === b.address ? b.unit : b.address, b.city + ", TX"].filter(Boolean).join(", ")}</div>
            <div className="dp-facts">{[b.cls && "Class " + b.cls, b.submarket && b.submarket + " submarket", b.yearBuilt && "Built " + b.yearBuilt,
              b.yearReno && "Renovated " + b.yearReno, b.stories && b.stories + " stories"].filter(Boolean).join("  ·  ")}</div>
            <div className="dp-price">
              <span className="dp-big">{fmtRent(b.totalRent)}</span><span className="dp-unit">/SF/yr total</span>
              <div className="dp-split">Direct asking <b>{fmtRent(b.rent)}</b><br />OPEX <b>{fmtRent(b.opex)}</b></div>
            </div>
            <div className="dp-kv">
              <div><div className="l">Largest available</div><div className="v">{largest ? <>{fmtInt(largest)} <small>SF</small></> : "—"}</div></div>
              <div><div className="l">Building size</div><div className="v">{b.rba ? <>{fmtInt(b.rba)} <small>SF</small></> : "—"}</div></div>
              <div><div className="l">Leased</div><div className="v">{fmtPct(b.leased)}</div></div>
            </div>
            <div className="dp-acts">
              <button className={"btn " + (selected ? "primary" : "gold")} onClick={onToggleCompare} disabled={!selected && !canAdd}>
                {selected ? "✓ In compare" : canAdd ? "+ Add to compare" : `Compare full (${MAX_COMPARE})`}</button>
              <StarBtn id={b.id} label />
              <a className="btn" href={mapsLink(b)} target="_blank" rel="noopener">{I.pin} Open in Google Maps</a>
            </div>
          </div>
        </section>

        <section className="dp-grid">
          <div className="dp-card">
            <h2>Available space</h2><div className="dp-sub">Contiguous options of 9,000 SF or more</div>
            {suites.length ? suites.map((x, i) => (
              <div className="dp-suite" key={i}><div className="n">{x.label}</div><div className="s">{x.sf ? fmtInt(x.sf) + " SF" : ""}</div></div>
            )) : <div className="dp-empty">No contiguous availability listed.</div>}
          </div>
          <div className="dp-card">
            <h2>Commute for HR Green</h2>
            <div className="dp-sub">{roster.length} employees · {google ? "Google drive times" : "estimated drive times"} · compared with each person's current office</div>
            {s ? <>
              <div className="dp-cm">
                <div><b>{s.avg}<small> min</small></b><span>average drive in</span></div>
                <div><b>{s.good}<small> of {s.n}</small></b><span>within {cm.target} minutes</span></div>
                {delta != null && <div><b className={delta > 0 ? "bad" : delta < 0 ? "good" : ""}>{delta > 0 ? "+" : ""}{delta}<small> min</small></b><span>vs today's {today.avg} min</span></div>}
              </div>
              {byOffice.length > 0 && <>
                <div className="dp-l">By office <span className="dl-key"><i className="k-new" />here <i className="k-today" />today</span></div>
                {byOffice.map((x) => (
                  <div className="dp-orow" key={x.o}>
                    <span>{x.o}</span>
                    <span className="dept-bars"><span className="k-new" style={{ width: (x.here / maxOff) * 100 + "%" }} />{x.now != null && <span className="k-today" style={{ width: (x.now / maxOff) * 100 + "%" }} />}</span>
                    <span className="dept-v">{x.here.toFixed(1)}{x.now != null && <em> / {x.now.toFixed(1)}</em>}</span>
                  </div>
                ))}
              </>}
              {s.nBase > 0 && <>
                <div className="dp-l">Compared with today</div>
                {[["better", "Shorter by 5+ min"], ["same", "About the same"], ["worse", "Longer by 5+ min"]].map(([k, lbl]) => (
                  <div className="h2h-row" key={k}><span className="h2h-lbl">{lbl}</span>
                    <span className="h2h-track"><span className={"h2h-fill " + k} style={{ width: (s[k] / s.nBase) * 100 + "%" }} /></span><span className="h2h-n">{s[k]}</span></div>
                ))}
              </>}
            </> : <div className="dp-empty">{hasGeo ? "Add an Employees tab to the sheet to see commute times." : "This building has no map location yet."}</div>}
          </div>
        </section>

        {hasGeo && <section className="dp-loc">
          <div className="map-wrap dp-map">
            <MapCanvas items={mapItems} fitKey={b.id} fitTo={fitPts} onClick={() => {}} onHover={() => {}} />
          </div>
          <div className="dp-card">
            <h2>Nearby</h2><div className="dp-sub">Straight-line distance from the building</div>
            {near.length ? <ul className="dp-near">
              {near.map((n, i) => (
                <li key={i}><i className={n.kind === "comp" ? "lg lg-comp" : "lg lg-office"} />
                  <span>{n.kind === "office" ? `HR Green · ${n.name}` : n.name}<small>{n.kind === "office" ? "Current office" : n.address}</small></span>
                  <span className="d">{n.d < 10 ? n.d.toFixed(1) : Math.round(n.d)} mi</span></li>
              ))}
            </ul> : <div className="dp-empty">Add Competitors and Current Offices tabs to the sheet to see what's nearby.</div>}
          </div>
        </section>}

        <section className="dp-grid">
          <div className="dp-card">
            <h2>Amenities</h2><div className="dp-sub">{b.amenities.length} of {amenCols.length} tracked amenities</div>
            <div className="dp-am">
              {amenCols.map((a) => b.amenities.includes(a)
                ? <div key={a}><span className="yes">✓</span>{a}</div>
                : <div key={a} className="off"><span className="no">—</span>{a}</div>)}
            </div>
          </div>
          <div className="dp-card">
            <h2>Building details</h2><div className="dp-sub">Property information</div>
            <dl className="dp-dl">
              <dt>Owner</dt><dd>{b.owner || "—"}</dd>
              <dt>Class</dt><dd>{b.cls || "—"}</dd>
              <dt>Submarket</dt><dd>{b.submarket || "—"}</dd>
              <dt>Year built</dt><dd>{b.yearBuilt || "—"}</dd>
              <dt>Renovated</dt><dd>{b.yearReno || "—"}</dd>
              <dt>Stories</dt><dd>{b.stories ?? "—"}</dd>
              <dt>Rentable area</dt><dd>{fmtSF(b.rba)}</dd>
              <dt>City</dt><dd>{b.city}</dd>
            </dl>
          </div>
        </section>
        <div className="dp-foot"><span>Cresa · Prepared for HR Green · Confidential</span><span>Drive times: {google ? "Google" : "estimated"}</span></div>
      </div>
    </div>
  );
}

// ===================== APP =====================
function App() {
  const data = useListings();
  const all = data.buildings;
  const [view, setView] = useState("map");
  const [f, setF] = useState(EMPTY_FILTERS);
  const [sort, setSort] = useState("total_asc");
  const [activeId, setActiveId] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const go = (v) => { setView(v); setDetailId(null); };
  const [hoveredId, setHoveredId] = useState(null);
  const layers = data.layers || EMPTY_LAYERS;
  const cm = useCommute(layers);
  const [show, setShow] = useState({ comp: true, emp: false, office: true });
  const [selectedIds, setSelectedIds] = useState(() => { try { return JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY + ":compare") || "[]"); } catch (e) { return []; } });

  useEffect(() => { try { localStorage.setItem(LOCAL_CACHE_KEY + ":compare", JSON.stringify(selectedIds)); } catch (e) {} }, [selectedIds]);
  // Drop compare picks that no longer exist after a sheet update.
  useEffect(() => { if (all.length) setSelectedIds((s) => s.filter((id) => all.some((b) => b.id === id))); }, [all]);

  const [shortIds, setShortIds] = useState(() => { try { return JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY + ":shortlist") || "[]"); } catch (e) { return []; } });
  useEffect(() => { try { localStorage.setItem(LOCAL_CACHE_KEY + ":shortlist", JSON.stringify(shortIds)); } catch (e) {} }, [shortIds]);
  useEffect(() => { if (all.length) setShortIds((s) => s.filter((id) => all.some((b) => b.id === id))); }, [all]);
  useEffect(() => { if (!shortIds.length && f.shortOnly) setF((p) => ({ ...p, shortOnly: false })); }, [shortIds.length]);
  const shortCtx = useMemo(() => ({
    ids: shortIds, only: f.shortOnly,
    toggle: (id) => setShortIds((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id])),
    setOnly: (v) => setF((p) => ({ ...p, shortOnly: v })),
    clear: () => { setShortIds([]); setF((p) => ({ ...p, shortOnly: false })); },
  }), [shortIds, f.shortOnly]);
  const list = useMemo(() => applyFilters(all, f, shortIds).sort(SORTS[sort].fn), [all, f, sort, shortIds]);
  const labels = useMemo(() => { const m = {}; list.forEach((b, i) => (m[b.id] = i + 1)); return m; }, [list]);
  const canAdd = selectedIds.length < MAX_COMPARE;
  const toggle = (id) => setSelectedIds((s) => (s.includes(id) ? s.filter((x) => x !== id) : s.length < MAX_COMPARE ? [...s, id] : s));
  const active = activeId && list.find((b) => b.id === activeId);
  const detail = detailId && all.find((b) => b.id === detailId);

  useEffect(() => { if (activeId && !list.some((b) => b.id === activeId)) setActiveId(null); }, [list]);
  useEffect(() => { const k = (e) => { if (e.key === "Escape" && !document.querySelector(".dp")) setActiveId(null); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);

  // Map view: numbered buildings + optional competitor / employee / office layers.
  const mapItems = useMemo(() => {
    const out = [];
    if (show.emp) layers.employees.forEach((e, i) => out.push({ key: "e" + i, lat: e.lat, lng: e.lng,
      cls: "pin-emp", html: "", style: officeColor(cm.offices, (cm.homeOf(e) || {}).key),
      tip: `<b>${esc(officeShort(e.office) || "Employee")}</b><span>${esc(e.dept || "")}</span>` }));
    if (show.comp) out.push(...competitorItems(layers.competitors));
    if (show.office) out.push(...officeItems(cm.offices));
    list.forEach((b) => out.push({ key: b.id, id: b.id, kind: "bldg", lat: b.lat, lng: b.lng, cls: "pin-bldg", html: String(labels[b.id]),
      tip: `<b>${esc(b.name)}</b><span>${fmtRent(b.totalRent)} total · ${fmtK(b.rba)} SF</span>` }));
    return out;
  }, [list, labels, show, layers, cm.offices, cm.homeOf]);
  const mapState = (el, it) => {
    if (it.kind !== "bldg") return;
    el.classList.toggle("short", shortIds.includes(it.id));
    el.classList.toggle("act", it.id === activeId);
    el.classList.toggle("hov", it.id === hoveredId);
    el.classList.toggle("sel", selectedIds.includes(it.id));
  };

  const k = {
    n: list.length,
    rba: list.reduce((s, b) => s + (b.rba || 0), 0),
    total: avg(list.map((b) => b.totalRent)),
    rent: avg(list.map((b) => b.rent)),
    leased: avg(list.map((b) => b.leased)),
  };
  const email = window.__cresaUserEmail || "";
  const statusCls = data.error ? (all.length ? "cached" : "error") : data.loading ? "loading" : "live";
  const statusTxt = data.error ? (all.length ? "Offline copy" : "Not loaded") : data.loading ? "Loading…" : "Live";
  const statusTitle = data.error ? data.error : data.updatedAt ? "Sheet last changed " + new Date(data.updatedAt).toLocaleString() : "";

  return (
    <ShortCtx.Provider value={shortCtx}>
    <div className="app">
      <header className="hdr">
        <img className="hdr-logo" src={LOGO} alt="Cresa" />
        <div className="hdr-sep" />
        <div><div className="hdr-title">Austin Office Options</div><div className="hdr-sub">Prepared for HR Green</div></div>
        <div className="hdr-spacer" />
        <span className={"status " + statusCls} title={statusTitle} onClick={data.reload} style={{ cursor: "pointer" }}><span className="dot" />{statusTxt}</span>
        <nav className="tabs">
          <button className={"tab" + (view === "map" ? " on" : "")} onClick={() => go("map")}>{I.map} Map</button>
          <button className={"tab" + (view === "table" ? " on" : "")} onClick={() => go("table")}>{I.table} Table</button>
          <button className={"tab" + (view === "drive" ? " on" : "")} onClick={() => go("drive")}>{I.car} Drive time</button>
          <button className={"tab" + (view === "compare" ? " on" : "")} onClick={() => go("compare")}>{I.compare} Compare
            {selectedIds.length > 0 && <span className="badge">{selectedIds.length}</span>}</button>
        </nav>
        <button className="btn" onClick={() => exportCSV(list, data.amenCols)} disabled={!list.length}>{I.dl} CSV</button>
        <button className="avatar" title={email ? `${email} — click to sign out` : "Sign out"}
          onClick={() => { if (confirm("Sign out?")) window.__cresaSignOut && window.__cresaSignOut(); }}>{(email[0] || "U").toUpperCase()}</button>
      </header>

      {data.error && !all.length && (
        <div style={{ margin: "14px 22px 0", padding: "12px 16px", background: "#FBE9E9", color: "var(--bad)", borderRadius: 10, fontSize: 13 }}>
          Couldn't load listings: {data.error}. <button className="btn sm" onClick={data.reload}>Retry</button></div>
      )}

      {detail ? <DetailPage b={detail} all={all} list={list.some((x) => x.id === detail.id) ? list : all} cm={cm} layers={layers} amenCols={data.amenCols}
        selected={selectedIds.includes(detail.id)} canAdd={canAdd} onToggleCompare={() => toggle(detail.id)}
        onBack={() => setDetailId(null)} onNav={setDetailId} /> : <>
      <section className="kpis">
        <div className="kpi"><div className="kpi-l">Buildings</div><div className="kpi-v">{k.n}<small>/ {all.length}</small></div><div className="kpi-s">{activeFilterCount(f) ? "matching filters" : "all options"}</div></div>
        <div className="kpi"><div className="kpi-l">Avg total rent</div><div className="kpi-v">{fmtRent(k.total)}<small>/SF</small></div><div className="kpi-s">Direct {fmtRent(k.rent)} + OPEX</div></div>
        <div className="kpi"><div className="kpi-l">Avg % leased</div><div className="kpi-v">{fmtPct(k.leased)}</div><div className="kpi-s">across shown buildings</div></div>
        <div className="kpi"><div className="kpi-l">Total RBA</div><div className="kpi-v">{fmtK(k.rba)}<small>SF</small></div><div className="kpi-s">rentable building area</div></div>
      </section>

      <main className={"body v-" + view}>
        {view !== "drive" && <FiltersPanel all={all} amenCols={data.amenCols} f={f} setF={setF} onReset={() => setF(EMPTY_FILTERS)} shown={list.length}
        />}
        {view === "map" && <>
          <ListPanel list={list} labels={labels} sort={sort} setSort={setSort} activeId={activeId} hoveredId={hoveredId}
            selectedIds={selectedIds} onOpen={(id) => setActiveId(id)} onHover={setHoveredId} onToggle={toggle} canAdd={canAdd} />
          <div className="map-wrap">
            <MapCanvas items={mapItems} state={mapState} stateKey={[activeId, hoveredId, selectedIds.join(","), shortIds.join(",")].join("|")}
              fitKey={list.map((b) => b.id).join("|")} fitTo={list} focus={active ? { key: active.id, lat: active.lat, lng: active.lng } : null}
              onClick={(it) => it.kind === "bldg" && setActiveId(it.id)} onHover={(it) => setHoveredId(it && it.kind === "bldg" ? it.id : null)}>
              <MapLayerBar show={show} setShow={setShow} counts={{ office: cm.offices.length, comp: layers.competitors.length, emp: layers.employees.length }} />
              {show.emp && layers.employees.length > 0 && cm.offices.length > 1 && (
                <div className="map-key">
                  {cm.offices.map((o) => <span key={o.key} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><i className="lg lg-emp" style={{ background: officeColor(cm.offices, o.key) }} />{o.name} staff</span>)}
                </div>
              )}
            </MapCanvas>
            {active && <div className="map-detail"><DetailCard b={active} selected={selectedIds.includes(active.id)} canAdd={canAdd}
              onToggleCompare={() => toggle(active.id)} onClose={() => setActiveId(null)} onDetails={() => setDetailId(active.id)} /></div>}
          </div>
        </>}
        {view === "table" && <TableView list={list} labels={labels} selectedIds={selectedIds} onToggle={toggle} onOpen={setDetailId} canAdd={canAdd} />}
        {view === "drive" && <DriveTimeView list={list} total={all.length} nFilters={activeFilterCount(f)} goTo={setView} layers={layers} cm={cm} selectedIds={selectedIds} onToggle={toggle} canAdd={canAdd} onOpenBuilding={setDetailId} />}
        {view === "compare" && <CompareView all={all} selectedIds={selectedIds} amenCols={data.amenCols} goTo={setView} cm={cm}
          onRemove={(id) => setSelectedIds((s) => s.filter((x) => x !== id))} onClear={() => setSelectedIds([])} />}
      </main>
      </>}

    </div>
    </ShortCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
