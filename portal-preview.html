/* ══════════════════════════════════════════════════════════════════════
   POLISH LAYER — appended last so it wins the cascade.
   Brand-safe: NO changes to Cresa Midnight (#001E5A) or Goldenrod (#FFB600).
   Only motion, focus, elevation, placeholder texture, and a small
   accessibility contrast nudge on the neutral UI grays.
   ══════════════════════════════════════════════════════════════════════ */

/* Shared easing token for consistent, considered motion */
:root { --ease: cubic-bezier(0.4, 0, 0.2, 1); }

/* Wider default content shell — the app was capped at 1560px, which left the
   map-view list column too narrow and clipped card text. One knob drives every
   centered container (topbar, survey header, split, detail, compare, commute). */
:root { --shell-max: 1880px; }

/* Anti-clip on the map-view property cards: let stat labels/values wrap
   gracefully instead of being hard-cut by overflow:hidden + nowrap. With the
   wider shell they rarely need to, but nothing gets chopped either way. */
.split-list .pc-stats > div { overflow: visible; }
.split-list .pc-stat-val,
.split-list .pc-stat-label { white-space: normal; }

/* A11y contrast: the lightest UI gray was ~3:1 on white for 9–11px labels.
   Nudge it darker (Cresa endorses "sufficient on-screen contrast"). This is a
   neutral UI gray, not a brand palette color. */
:root { --ink-4: #6E7891; }

/* Richer, Midnight-tinted layered elevation (shadows aren't brand palette;
   tint kept on Cresa Midnight rgb 0,30,90 for consistency) */
:root {
  --shadow-1: 0 1px 2px rgba(0,30,90,.06), 0 1px 3px rgba(0,30,90,.05);
  --shadow-2: 0 4px 14px -4px rgba(0,30,90,.12), 0 2px 6px -2px rgba(0,30,90,.08);
  --shadow-3: 0 18px 48px -12px rgba(0,30,90,.24);
}

/* Motion — subtle hover lift + real easing on interactive surfaces */
.property-card, .survey-card, .tour-card, .library-card, .doc-tile {
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease),
              transform .18s var(--ease), background .18s var(--ease);
}
.property-card:hover, .survey-card:hover, .tour-card:hover,
.library-card:hover, .doc-tile:hover { transform: translateY(-2px); }
.property-card:active, .survey-card:active { transform: translateY(0); }

.btn {
  transition: background .15s var(--ease), border-color .15s var(--ease),
              color .15s var(--ease), transform .12s var(--ease), box-shadow .15s var(--ease);
}
.btn:not(.ghost):hover { transform: translateY(-1px); box-shadow: var(--shadow-1); }
.btn:active { transform: translateY(0); box-shadow: none; }

/* Staggered entrance for the broker dashboard grid (plays on mount /
   filter change; scoped to the home grid to avoid re-render replays) */
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.survey-grid > * { animation: cardIn .4s var(--ease) both; }
.survey-grid > *:nth-child(2){ animation-delay:.04s }
.survey-grid > *:nth-child(3){ animation-delay:.08s }
.survey-grid > *:nth-child(4){ animation-delay:.12s }
.survey-grid > *:nth-child(5){ animation-delay:.16s }
.survey-grid > *:nth-child(6){ animation-delay:.20s }
.survey-grid > *:nth-child(n+7){ animation-delay:.24s }

/* Focus-visible — crisp Midnight ring for keyboard users (brand navy = --accent) */
:where(button, a, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}
.comment-input:focus-visible, .home-search input:focus-visible { outline: none; }

/* Placeholder imagery — soft diagonal gradient reads intentional vs. the
   wireframe stripes (uses neutral paper grays only) */
.placeholder {
  background: linear-gradient(135deg, var(--paper-2) 0%, var(--paper-3) 100%);
}

/* Sticky compare header gets a hairline elevation when the table scrolls */
.compare-table thead th { position: sticky; top: 0; z-index: 2; }
.compare-row-label { box-shadow: 1px 0 0 var(--rule); }

/* Compare view — table typography matched to the building-detail availability
   (suite) table: 12px data cells, same UI font (Inter) throughout. */
.compare-table th, .compare-table td { font-size: 12px; }
.compare-table .compare-row-label { font-family: var(--sans) !important; font-size: 12px !important; }
.compare-table .vote-btn { font-family: var(--sans); font-size: 13px; }
.compare-name { font-size: 13px; }
.compare-addr { font-size: 10.5px; }

/* Top-left corner (empty cell above the row labels, in the photo row) reads as a
   stray gray box next to the first property's photo — make it blank. */
.compare-table thead tr:first-child .compare-row-label{
  background:transparent !important; box-shadow:none !important;
  border-right-color:transparent !important; border-bottom-color:transparent !important;
}
/* Vote (shortlist / remove) moved into the navy name band — compact icon-only
   buttons that read on the dark background. */
.compare-name-row .compare-namecell-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.compare-name-row .compare-nameblock{ min-width:0; }
.compare-name-row .vote-group{ flex:none; background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.30); }
.compare-name-row .vote-btn{ color:#fff; padding:5px 8px; }
.compare-name-row .vote-btn:hover{ background:rgba(255,255,255,0.16); color:#fff; }
.compare-name-row .vote-btn + .vote-btn{ border-left-color:rgba(255,255,255,0.30); }
.compare-name-row .vote-btn.up.active, .compare-name-row .vote-btn.down.active{ background:var(--gold); color:var(--navy); }
.compare-name-row .vote-btn svg{ width:14px; height:14px; }

/* ── Compare matrix — decision-support upgrades ── */
/* The wrap becomes the vertical scroll region so the navy name band can pin. */
.compare-wrap{ flex:1; min-height:0; overflow:auto; }
/* Photos a touch shorter; grabbable for drag-to-reorder. */
.compare-photo{ height:112px; position:relative; cursor:grab; }
.compare-photo:active{ cursor:grabbing; }
/* A dashed "grab box" + handle appears on hover to signal drag-to-reorder. */
.compare-photo:hover{ outline:2px dashed rgba(0,30,90,.35); outline-offset:-2px; }
.compare-photo .cp-drag{ position:absolute; top:6px; left:6px; display:inline-flex; align-items:center; gap:4px; padding:3px 7px; font-size:9px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:var(--navy); background:rgba(255,255,255,.94); border:1px dashed var(--navy); border-radius:var(--r-sm); opacity:0; transition:opacity .15s var(--ease); pointer-events:none; box-shadow:var(--shadow-1); }
.compare-photo:hover .cp-drag{ opacity:1; }
.cp-grip{ font-size:11px; line-height:1; letter-spacing:-1px; }
/* Shortlist/pass pill on the photo (upper-left) — matches the map & detail hero.
   Hidden on hover so it doesn't collide with the drag cue. */
.compare-photo .cp-badge{ position:absolute; top:8px; left:8px; z-index:4; display:inline-flex; align-items:center; gap:4px; font-size:9px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:3px 8px; border-radius:var(--r-sm); box-shadow:var(--shadow-1); transition:opacity .15s var(--ease); }
.compare-photo .cp-badge.short{ background:var(--gold); color:var(--navy); }
.compare-photo .cp-badge.pass{ background:rgba(14,18,32,.72); color:#fff; }
.compare-photo:hover .cp-badge{ opacity:0; }
.compare-photo .cp-view{ position:absolute; left:0; right:0; bottom:0; padding:14px 10px 6px; font-size:11px; font-weight:700; color:#fff; text-align:center; background:linear-gradient(transparent, rgba(0,30,90,.72)); opacity:0; transition:opacity .15s var(--ease); pointer-events:none; }
.compare-photo:hover .cp-view{ opacity:1; }
.compare-photo .cp-colbar{ position:absolute; top:6px; right:6px; display:flex; gap:3px; opacity:0; transition:opacity .15s var(--ease); }
.compare-photo:hover .cp-colbar{ opacity:1; }
.cp-act{ width:22px; height:22px; display:inline-grid; place-items:center; border:0; border-radius:var(--r-sm); background:rgba(255,255,255,.94); color:var(--navy); font-size:14px; line-height:1; cursor:pointer; box-shadow:var(--shadow-1); }
.cp-act:hover{ background:#fff; }
.cp-act.cp-remove{ color:var(--rose); font-size:11px; }
.cp-act.cp-remove:hover{ background:var(--rose); color:#fff; }
/* Drag feedback: dragged column dims, drop-target column gets a gold outline. */
.compare-table th.col-dragging .compare-photo{ opacity:.4; outline:none; }
.compare-table th.col-dragover .compare-photo{ outline:2px solid var(--gold); outline-offset:-2px; }
/* Section subheaders — Building Info / Economics. Both rows are styled the same;
   the :nth-child(n) bump beats the zebra's odd-row row-label rule so the first
   section (an odd tbody row) doesn't render differently from the rest. */

        }
        const cred = await auth.signInAnonymously();
        const uid = cred.user.uid;   // persists per-origin — revisits reuse it

        const tokSnap = await db.collection('shareTokens').doc(token).get();
        if (!tokSnap.exists) { setState({ phase: 'error', title: 'Link not recognized', message: 'This link is no longer valid. Ask your broker for a fresh one.' }); return; }
        const tok = tokSnap.data();
        const sid = tok.surveyId;
        const savedName = localStorage.getItem('cresaPortalName.v1') || '';
        const pRef = db.collection('surveys').doc(sid).collection('participants').doc(uid);

        /* REVISIT-FIRST. A participant doc grants the read for as long as it
           exists — by rules design, revoking/expiring a token stops NEW joins;
           the broker deletes participant docs to kick someone. So membership is
           checked BEFORE token liveness, and the doc is never rewritten with a
           different viaToken (the update rule forbids it — this was the v2.0
           bug that locked out anyone who had opened an earlier link on the
           same browser). */
        const pSnap = await pRef.get();
        if (pSnap.exists) {
          // Best-effort lastSeen bump. Allowed only while the ORIGINAL token is
          // still live; a failure here must never block the read.
          pRef.set({ lastSeenAt: TS(), name: savedName || pSnap.data().name || '' }, { merge: true }).catch(() => {});
        } else {
          if (tok.revoked) { setState({ phase: 'error', title: 'Link revoked', message: 'Access through this link has been turned off. Ask your broker for a new link.' }); return; }
          if (tok.expiresAt && tok.expiresAt.toMillis() < Date.now()) { setState({ phase: 'error', title: 'Link expired', message: 'This link has expired. Ask your broker for a new one.' }); return; }
          await pRef.set({
            uid, role: tok.role || 'client', name: savedName, email: '',
            viaToken: token,
            joinedAt: TS(), lastSeenAt: TS(),
          });
        }

        unsub = db.collection('surveys').doc(sid).onSnapshot(
          snap => {
            if (!snap.exists) { setState({ phase: 'error', title: 'Survey unavailable', message: 'This survey is no longer available.' }); return; }
            setState({ phase: 'ready', sid, uid, record: snap.data() });
          },
          err => setState({ phase: 'error', title: 'Could not open survey', message: err.message })
        );
      } catch (e) {
        setState({ phase: 'error', title: 'Could not open survey', message: (e && e.message) || String(e) });
      }
    })();
    return () => { if (unsub) unsub(); };
  }, []);
  return state;
}

/* ============================================================================
   INTERACTIONS (build step 3 write paths, degrade-to-read-only)
   ----------------------------------------------------------------------------
   votes/{pid}__{uid}  and  comments/{autoId} per the spec. The CURRENTLY
   published rules deny these subcollections; until the step-3 rules delta is
   published the subscriptions fail with permission-denied and `enabled`
   flips false — vote buttons and the comment composer simply don't render.
   Publish the delta and they light up with no code change.
   ============================================================================ */
function useVotes(sid, uid) {
  const [state, setState] = React.useState({ enabled: false, mine: {}, tally: {} });
  React.useEffect(() => {
    if (!sid) return;
    const compute = (voteDocs) => {
      const mine = {}, tally = {};
      voteDocs.forEach(v => {
        if (!v || !v.pid) return;
        if (v.uid === uid) mine[v.pid] = v.vote || null;
        if (v.vote === 'up' || v.vote === 'down') {
          tally[v.pid] = tally[v.pid] || { up: 0, down: 0 };
          tally[v.pid][v.vote]++;
        }
      });
      setState({ enabled: true, mine, tally });
    };
    if (PREVIEW) {
      const push = () => compute(Object.values(_pv.votes));
      push();
      return _pv.sub(push);
    }
    const unsub = db.collection('surveys').doc(sid).collection('votes').onSnapshot(
      snap => { const docs = []; snap.forEach(d => docs.push(d.data())); compute(docs); },
      () => setState({ enabled: false, mine: {}, tally: {} })   // permission-denied → read-only
    );
    return unsub;
  }, [sid, uid]);
  return state;
}

function useComments(sid) {
  const [state, setState] = React.useState({ enabled: false, byPid: {} });
  React.useEffect(() => {
    if (!sid) return;
    const compute = (docs) => {
      const byPid = {};
      docs.forEach(({ id, c }) => {
        if (!c) return;
        const pid = c.pid || '__survey__';
        (byPid[pid] = byPid[pid] || []).push({
          id, author: c.authorName || 'Client', author_type: c.authorType || 'client',
          initials: initialsOf(c.authorName) || (c.authorType === 'broker' ? 'B' : 'C'),
          body: c.body, ts: fmtWhen(c.at),
        });
      });
      setState({ enabled: true, byPid });
    };
    if (PREVIEW) {
      const push = () => compute(_pv.comments.map(c => ({ id: c.id, c })));
      push();
      return _pv.sub(push);
    }
    const unsub = db.collection('surveys').doc(sid).collection('comments').orderBy('at').onSnapshot(
      snap => { const docs = []; snap.forEach(d => docs.push({ id: d.id, c: d.data() })); compute(docs); },
      () => setState({ enabled: false, byPid: {} })
    );
    return unsub;
  }, [sid]);
  return state;
}

function useActivity(sid) {
  const [rows, setRows] = React.useState([]);
  React.useEffect(() => {
    if (!sid) return;
    if (PREVIEW) {
      setRows([{ id: 'a1', type: 'created', who: 'Grant Mehlhoff', detail: 'Published this survey with 3 properties', when: fmtWhen({ toDate: () => new Date() }) }]);
      return;
    }
    const unsub = db.collection('surveys').doc(sid).collection('activity').orderBy('at').limitToLast(100).onSnapshot(
      snap => {
        const out = [];
        snap.forEach(d => {
          const a = d.data(); if (!a) return;
          out.push({ id: d.id, type: a.type, who: a.actorName || 'Someone', detail: a.detail || '', when: fmtWhen(a.at) });
        });
        setRows(out);
      },
      () => setRows([])
    );
    return unsub;
  }, [sid]);
  return rows;
}

/* One-time display name — shown on votes/comments the broker sees. */
function ensureName() {
  let name = localStorage.getItem('cresaPortalName.v1') || '';
  if (!name) {
    name = (window.prompt('Your name (shown with your comments and votes):') || '').trim();
    if (name) localStorage.setItem('cresaPortalName.v1', name);
  }
  return name;
}

async function castVote(sid, uid, pid, value) {
  if (PREVIEW) {
    _pv.votes[`${pid}__${uid}`] = { pid, uid, vote: value, role: 'client' };
    _pv.notify();
    return;
  }
  const name = ensureName();
  const batch = db.batch();
  batch.set(db.collection('surveys').doc(sid).collection('votes').doc(`${pid}__${uid}`),
    { pid, uid, vote: value, role: 'client', at: TS() });
  batch.set(db.collection('surveys').doc(sid).collection('activity').doc(),
    { type: value === 'up' ? 'vote_up' : value === 'down' ? 'vote_down' : 'vote_cleared',
      actorUid: uid, actorName: name || 'Client', pid, target: null,
      detail: value === 'up' ? 'shortlisted a property' : value === 'down' ? 'discarded a property' : 'cleared a vote',
      at: TS() });
  // Keep the participant doc's name in sync (rules allow: role/viaToken unchanged).
  await batch.commit();
}

async function addComment(sid, uid, pid, body) {
  if (PREVIEW) {
    _pv.comments.push({ id: 'c' + Date.now(), pid, body, authorName: ensureName() || 'You', authorType: 'client', at: { toDate: () => new Date() } });
    _pv.notify();
    return;
  }
  const name = ensureName();
  const batch = db.batch();
  batch.set(db.collection('surveys').doc(sid).collection('comments').doc(),
    { pid, body, authorUid: uid, authorName: name || 'Client', authorType: 'client', at: TS() });
  batch.set(db.collection('surveys').doc(sid).collection('activity').doc(),
    { type: 'comment', actorUid: uid, actorName: name || 'Client', pid, target: null,
      detail: 'commented on a property', at: TS() });
  await batch.commit();
}

Object.assign(window, {
  db, auth, cdnImg, floorplanImg, initialsOf, fmtWhen,
  adaptRecord, mvPremises, mvByLabel,
  useSurvey, useVotes, useComments, useActivity,
  castVote, addComment,
});
</script>

<script type="text/babel" data-presets="react">

];

// Custom OverlayView class that renders an arbitrary HTML element at a lat/lng.
// Defined lazily because google.maps.OverlayView only exists once the API has
// loaded — we instantiate the class inside the component, after the API is
// confirmed available.
function makeHtmlMarkerClass(google) {
  return class HtmlMarker extends google.maps.OverlayView {
    constructor(position, html, handlers) {
      super();
      this._position = position;
      this._html = html;
      this._handlers = handlers || {};
      this._div = null;
    }
    onAdd() {
      const div = document.createElement('div');
      div.style.position = 'absolute';
      div.style.cursor = 'pointer';
      div.style.zIndex = '2';
      div.innerHTML = this._html;
      if (this._handlers.onClick) {
        div.addEventListener('click', (e) => { e.stopPropagation(); this._handlers.onClick(); });
      }
      if (this._handlers.onDblClick) {
        div.addEventListener('dblclick', (e) => { e.stopPropagation(); this._handlers.onDblClick(); });
      }
      // Raise the hovered marker so its info card sits above neighbouring pins.
      div.addEventListener('mouseenter', () => { div.style.zIndex = '999'; });
      div.addEventListener('mouseleave', () => { div.style.zIndex = '2'; });
      this._div = div;
      this.getPanes().overlayMouseTarget.appendChild(div);
    }
    draw() {
      const proj = this.getProjection();
      if (!proj || !this._div) return;
      const point = proj.fromLatLngToDivPixel(this._position);
      // Pin's iconAnchor is bottom-center; offset accordingly. Width/height
      // correspond to our .map-pin shape (~32x38 with selected expanded).
      this._div.style.left = (point.x - 16) + 'px';
      this._div.style.top  = (point.y - 36) + 'px';
    }
    onRemove() {
      if (this._div && this._div.parentNode) this._div.parentNode.removeChild(this._div);
      this._div = null;
    }
    setHtml(html) {
      this._html = html;
      if (this._div) this._div.innerHTML = html;
    }
    setPosition(position) {
      this._position = position;
      if (this._div) this.draw();
    }
  };
}

function pinHtml(idx, isSelected, name, isShort, address, submarket, photoUrl) {
  const cls = 'map-pin' + (isShort ? ' short' : '') + (isSelected ? ' selected' : '');
  const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const nm = esc(name), addr = esc(address), sub = esc(submarket);
  const photo = photoUrl
    ? `<div class="mpc-photo"><img src="${esc(photoUrl)}" alt="" loading="lazy"></div>`
    : `<div class="mpc-photo mpc-photo-ph">Exterior photo</div>`;
  const card = `<div class="map-pin-card">${photo}<div class="mpc-body"><div class="mpc-name">${nm}</div>${addr ? `<div class="mpc-addr">${addr}</div>` : ''}${sub ? `<div class="mpc-sub">${sub}</div>` : ''}</div></div>`;
  return `<div class="${cls}">${card}<div class="map-pin-body"><span class="map-pin-num">${idx + 1}</span></div></div>`;
}

function MapView({ buildings, selectedId, onSelect, onOpen, statuses, mode }) {
  const containerRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const markersRef = React.useRef({}); // id -> HtmlMarker instance
  const [apiReady, setApiReady] = React.useState(!!(window.google && window.google.maps));
  // 'cresa' = the styled cool-blue base map; 'hybrid' = Google's satellite +
  // labels imagery. Switching is via setMapTypeId in the effect below.
  const [mapType, setMapType] = React.useState('cresa');

  // Wait for the Google Maps API to load. The bundle.py loader fires a
  // global event once the SDK is ready; we also poll briefly as a fallback
  // in case the script was already loaded before this component mounted.
  React.useEffect(() => {
    if (apiReady) return;
    const handler = () => setApiReady(true);
    window.addEventListener('cresa-gmaps-loaded', handler);
    const interval = setInterval(() => {
      if (window.google && window.google.maps) {
        setApiReady(true);
        clearInterval(interval);
      }
    }, 200);
    return () => {
      window.removeEventListener('cresa-gmaps-loaded', handler);
      clearInterval(interval);
    };
  }, [apiReady]);

  // Initialize the map once the API is ready.
  React.useEffect(() => {
    if (!apiReady || !containerRef.current || mapRef.current) return;
    const google = window.google;
    const map = new google.maps.Map(containerRef.current, {
      center: { lat: 29.76, lng: -95.40 },
      zoom: 10,
      zoomControl: true,
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false,
      gestureHandling: 'greedy',
      zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_BOTTOM },
      minZoom: 6,
      maxZoom: 20,
      // Map-level styles — applied to the built-in hybrid type so it stays
      // visually quiet (no POI clutter). The custom 'cresa' StyledMapType
      // below has its own full style array so this is ignored in cresa mode.
      styles: [
        { featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] },
        { featureType: 'poi.business', stylers: [{ visibility: 'off' }] },
      ],
    });
    const styledMap = new google.maps.StyledMapType(CRESA_STYLES, { name: 'Map' });
    map.mapTypes.set('cresa', styledMap);
    map.setMapTypeId('cresa');
    mapRef.current = map;

    return () => {
      Object.values(markersRef.current).forEach(m => m.setMap(null));
      markersRef.current = {};
      mapRef.current = null;
    };
  }, [apiReady]);

  // Sync map type when toggle changes ('cresa' = styled blue, 'hybrid' = satellite + labels)
  React.useEffect(() => {
    if (!mapRef.current) return;
    mapRef.current.setMapTypeId(mapType);
  }, [mapType, apiReady]);

  // Render / update markers whenever buildings, selection, or vote status change.
  // Diff against the existing markers map and create/remove only what changed.
  React.useEffect(() => {
    const map = mapRef.current;
    if (!map || !window.google) return;
    const google = window.google;
    const HtmlMarker = makeHtmlMarkerClass(google);

    const seen = new Set();
    buildings.forEach((b, i) => {
      seen.add(b.id);
      const isSelected = b.id === selectedId;
      const isShort = statuses && statuses[b.id] && statuses[b.id].vote === 'up';
      const photoUrl = (b.photos && b.photos[0]) ? cdnImg(b.photos[0], 240) : '';
      const html = pinHtml(i, isSelected, b.name, isShort, b.address, b.submarket, photoUrl);
      const position = new google.maps.LatLng(b.lat, b.lng);

      let marker = markersRef.current[b.id];
      if (!marker) {
        marker = new HtmlMarker(position, html, {
          onClick: () => onSelect(b.id),
          onDblClick: () => onOpen && onOpen(b.id),
        });
        marker.setMap(map);
        markersRef.current[b.id] = marker;
      } else {
        marker.setHtml(html);
        marker.setPosition(position);
      }
    });

    Object.keys(markersRef.current).forEach(id => {
      if (!seen.has(id)) {
        markersRef.current[id].setMap(null);
        delete markersRef.current[id];
      }
    });
  }, [buildings, selectedId, statuses, mode, onSelect, onOpen, apiReady]);

  // Pan to selected pin so it stays visible as the user navigates the list
  React.useEffect(() => {
    const map = mapRef.current;
    if (!map || !selectedId || !window.google) return;
    const b = buildings.find(x => x.id === selectedId);
    if (b) map.panTo({ lat: b.lat, lng: b.lng });
  }, [selectedId, buildings]);

  return (
    <div className="split-map">
      <div ref={containerRef} className="cresa-gmap" />
      {!apiReady && (
        <div className="map-loading">
          <div className="mono-tag">Loading map…</div>
          <div style={{fontSize:11, color:'var(--ink-3)', marginTop:8, lineHeight:1.5}}>
            If this persists, the Google Maps API key may be domain-restricted.
            Edit <code style={{background:'var(--paper-2)', padding:'2px 6px', borderRadius:3}}>GOOGLE_MAPS_API_KEY</code> at the top of the file.
          </div>
        </div>
      )}
      {apiReady && (
        <div className="map-type-toggle">
          <button
            className={'map-type-btn' + (mapType === 'cresa' ? ' active' : '')}
            onClick={() => setMapType('cresa')}
          >Map</button>
          <button
            className={'map-type-btn' + (mapType === 'hybrid' ? ' active' : '')}
            onClick={() => setMapType('hybrid')}
          >Hybrid</button>
        </div>
      )}
      <div className="map-legend">
        <div className="legend-row" style={{fontWeight:700, color:'var(--navy)', letterSpacing:'1px'}}>LEGEND</div>
        <div className="legend-row"><span className="legend-dot" style={{background:'var(--navy)'}}/> Candidate</div>
        <div className="legend-row"><span className="legend-dot" style={{background:'var(--navy)', boxShadow:'0 0 0 2px var(--gold)'}}/> Shortlist</div>
      </div>
    </div>
  );
}

window.MapView = MapView;

</script>

<script type="text/babel" data-presets="react">
// Property card — the demo's card, driven by record strings. No math on
// display values: "Available" stacks the exact premises lines the PDF prints
// (from cfg.matrixView); "Asking rent" is the PDF's rent-range string.

function Photo({ src, w, label, lg }) {
  if (!src) return <Placeholder lg={lg} label={label} />;
  return <img className="real-photo" src={cdnImg(src, w)} alt={label} loading="lazy" />;
}

function VoteTally({ tally }) {
  if (!tally || (!tally.up && !tally.down)) return null;
  return (
    <span className="vote-tally" title="Votes from everyone on this link">
      {tally.up > 0 && <span className="vt up"><Icon.ThumbUp width="10" height="10" /> {tally.up}</span>}
      {tally.down > 0 && <span className="vt down"><Icon.ThumbDown width="10" height="10" /> {tally.down}</span>}
    </span>
  );
}

function PropertyCard({ building, idx, status, selected, matrixView, interactive, onSelect, onOpen, onVote }) {
  const prem = mvPremises(matrixView, building.id);
  const premLines = prem && prem.length ? prem : building.spaces.map(s => s.sf).filter(Boolean);
  const rent = mvByLabel(matrixView, building.id, /RENT/i) || (building.spaces[0] && building.spaces[0].rate) || '';
  const avail = (building.spaces[0] && building.spaces[0].available) || '';
  // Available SF shown as a min–max range across suites (like the rent range),
  // not per-suite lines. Strings stay strings: parse only to pick the min/max
  // suite, then display those original SF strings verbatim.
  const sfList = (building.spaces || []).map(s => s.sf).filter(Boolean);
  const sfNum = (s) => { const m = String(s || '').replace(/,/g, '').match(/\d[\d.]*/); return m ? parseFloat(m[0]) : NaN; };
  const sfRange = (() => {
    if (!sfList.length) return premLines.length ? premLines[0] : '—';
    let lo = sfList[0], hi = sfList[0], loN = sfNum(lo), hiN = loN;
    for (const s of sfList) { const n = sfNum(s); if (isNaN(n)) continue;
      if (isNaN(loN) || n < loN) { loN = n; lo = s; }
      if (isNaN(hiN) || n > hiN) { hiN = n; hi = s; } }
    return lo === hi ? lo : lo + ' – ' + hi;
  })();
  const shortlisted = status?.vote === 'up';
  const passed = status?.vote === 'down';

  return (
    <div
      className={'property-card' + (selected ? ' selected' : '') + (passed ? ' passed' : '')}
      onClick={() => onOpen(building.id)}
      onMouseEnter={() => onSelect(building.id)}
    >
      <div className="pc-pin">{idx + 1}</div>
      <div className="pc-photo" style={{ position: 'relative' }}>
        <Photo src={building.photos[0]} w={640} label="Exterior photo" />
        {shortlisted && <span className="pc-badge short">★ SHORTLIST</span>}
        {passed && <span className="pc-badge pass">REMOVE</span>}
      </div>
      <div className="pc-body">
        <div className="pc-name">{building.name}</div>
        <div className="pc-addr">{[building.address, building.submarket].filter(Boolean).join(' · ')}</div>
        <div className="pc-stats">
          <div className="pc-stat-primary">
            <div className="pc-stat-val">{rent || '—'}</div>
            <div className="pc-stat-label">Asking rent</div>
          </div>
          <div>
            <div className="pc-stat-val">{sfRange}</div>
            <div className="pc-stat-label">Size · SF</div>
          </div>
          <div>
            <div className="pc-stat-val">{avail || '—'}</div>
            <div className="pc-stat-label">Availability</div>
          </div>
        </div>
      </div>
      <div className="pc-actions" onClick={(e) => e.stopPropagation()}>
        {interactive
          ? <VoteGroup vote={status?.vote} onVote={(v) => onVote(building.id, v)} />
          : <VoteTally tally={status?.tally} />}
      </div>
    </div>
  );
}

function GalleryTile({ building, idx, status, cols, onOpen, onSelect }) {
  const rate = (building.spaces[0] && building.spaces[0].rate) || '';
  const sub = [building.submarket, building.spaces[0] && building.spaces[0].sf, building.spaces[0] && building.spaces[0].available].filter(Boolean).join(' · ');
  const shortlisted = status?.vote === 'up';
  const passed = status?.vote === 'down';
  return (
    <div className={'gallery-tile' + (passed ? ' passed' : '')}
         onClick={() => onOpen(building.id)} onMouseEnter={() => onSelect(building.id)}>
      {shortlisted && <span className="gallery-badge short">★ SHORTLIST</span>}
      {passed && <span className="gallery-badge pass">REMOVE</span>}
      {building.photos[0] && <img className="real-photo" src={cdnImg(building.photos[0], 640)} alt="" loading="lazy" />}
      <div className="gallery-cap">
        <div className="gallery-cap-top">
          <span className="gallery-cap-name">{String(idx + 1).padStart(2, '0')} · {building.name}</span>
          <span className={'gallery-cap-price' + (shortlisted ? ' short' : '')}>{rate || '—'}</span>
        </div>
        <div className="gallery-cap-sub">{sub}</div>
      </div>
    </div>
  );
}

// Survey list view — split list + map. Client sees active properties only;
// eliminated stays in the record (votes/comments survive) but never renders here.
function SurveyListView({ buildings, statuses, matrixView, interactive, listView = 'spread', sortIx = 0, showMap = true, onOpen, onVote }) {
  const [selectedId, setSelectedId] = React.useState(buildings[0]?.id);
  const num = (s) => { const m = String(s || '').replace(/,/g, '').match(/[\d.]+/); return m ? parseFloat(m[0]) : NaN; };
  const rateOf = (b) => num(b.spaces[0] && b.spaces[0].rate);
  const sizeOf = (b) => Math.max(...(b.spaces.map(s => num(s.sf)).filter(Number.isFinite)), NaN);

  let ordered = buildings.slice();
  if (sortIx === 1) ordered.sort((a, b) => (rateOf(a) || 1e9) - (rateOf(b) || 1e9));
  if (sortIx === 2) ordered.sort((a, b) => (sizeOf(b) || 0) - (sizeOf(a) || 0));

  const mappable = buildings.filter(b => Number.isFinite(b.lat) && Number.isFinite(b.lng));
  const gallery = listView === 'gallery';
  const mapVisible = gallery ? showMap : true;

  const listEl = gallery ? (
    <div className="gallery-scroll">
      <div className={'gallery-grid ' + (mapVisible ? 'cols2' : 'cols3')}>
        {ordered.map((b) => (
          <GalleryTile key={b.id} building={b} idx={buildings.indexOf(b)} status={statuses[b.id]}
                       onOpen={onOpen} onSelect={setSelectedId} />
        ))}
      </div>
    </div>
  ) : (
    <div className="split-list">
      {ordered.map((b) => (
        <PropertyCard
          key={b.id}
          building={b}
          idx={buildings.indexOf(b)}
          status={statuses[b.id]}
          selected={selectedId === b.id}
          matrixView={matrixView}
          interactive={interactive}
          onSelect={setSelectedId}
          onOpen={onOpen}
          onVote={onVote}
        />
      ))}
      {buildings.length === 0 && (
        <div className="empty-state" style={{ padding: '60px 20px' }}>
          <div className="empty-state-title">No properties yet</div>
          <div className="empty-state-body">Your broker hasn't published properties to this survey.</div>
        </div>
      )}
    </div>
  );

  return (
    <div className={'split' + (mapVisible ? '' : ' no-map')}>
      {listEl}
      {mapVisible && (
        <MapView
          buildings={mappable}
          selectedId={selectedId}
          onSelect={setSelectedId}
          onOpen={onOpen}
          statuses={statuses}
          mode="client"
        />
      )}
    </div>
  );
}

Object.assign(window, { GalleryTile });

Object.assign(window, { Photo, VoteTally, PropertyCard, SurveyListView });
</script>

function PropertyDetail({ building, allBuildings, statuses, comments, brokers, interactive, onBack, onNav, onVote, onComment }) {

  // At-a-glance summary derived from the spaces (ranges shown; per-suite

  const parseN = (v) => { const m = String(v || '').replace(/[$,]/g, '').match(/\d[\d.]*/); return m ? parseFloat(m[0]) : NaN; };
  const rangeStr = (arr) => {
    const items = arr.map(v => ({ v, n: parseN(v) })).filter(x => !isNaN(x.n));
    if (!items.length) return null;
    const lo = items.reduce((a, b) => b.n < a.n ? b : a);
    const hi = items.reduce((a, b) => b.n > a.n ? b : a);
    return lo.v === hi.v ? lo.v : lo.v + '–' + hi.v;
  };
  const sfSummary = rangeStr(building.spaces.map(s => s.sf));
  const rentNums = building.spaces.map(s => parseN(s.rate)).filter(n => !isNaN(n));
  const rentSummary = rentNums.length ? '$' + Math.min(...rentNums).toFixed(2) + '–$' + Math.max(...rentNums).toFixed(2) + '/SF' : null;

  // Suites default to floor order (lowest → highest), read from the suite

    if (isNaN(fa)) return isNaN(fb) ? 0 : 1;
    if (isNaN(fb)) return -1;
    return fa - fb;

          {(() => {

            const I = {

<script type="text/babel" data-presets="react">
// Compare tab — the demo's visual design, driven by cfg.matrixView.
// Rows, order, labels, tints and every cell string are precomputed at save
// time by the SAME registry functions that print the PDF matrix. This view
// cannot disagree with the document in the client's inbox. The demo's
// hardcoded row list (incl. TI and the fabricated commute row) is gone.
// ─────────────────────────────────────────────────────────────────────────
// Commute analysis. In preview we synthesize a deterministic employee roster
// (home ZIP centroids around Houston) and estimate door-to-door drive minutes
// from distance × a peak-dependent effective speed. In production the roster is
// the broker-uploaded home ZIPs and the minutes come from Google Distance Matrix
// — every stat/visual below is data-driven and swaps straight over.
const COMMUTE_ZIPS = [
  ['77002',29.758,-95.368,3],['77006',29.742,-95.390,3],['77007',29.773,-95.411,3],
  ['77008',29.799,-95.411,2],['77019',29.755,-95.409,2],['77025',29.689,-95.434,3],
  ['77027',29.740,-95.447,2],['77056',29.746,-95.467,3],['77024',29.769,-95.519,3],
  ['77079',29.779,-95.590,3],['77042',29.740,-95.556,2],['77082',29.715,-95.600,2],
  ['77094',29.776,-95.680,2],['77450',29.743,-95.737,3],['77494',29.742,-95.830,2],
  ['77384',30.200,-95.500,2],['77381',30.167,-95.503,2],['77573',29.508,-95.090,2],
  ['77584',29.556,-95.350,2],['77489',29.610,-95.470,2],['77477',29.630,-95.570,2],
  ['77070',29.975,-95.560,2],['77339',30.050,-95.180,2],['77546',29.533,-95.220,1],
];
const ZIP_COORDS = {}; COMMUTE_ZIPS.forEach(z => { ZIP_COORDS[z[0]] = { lat: z[1], lng: z[2] }; });
const COMMUTE_DEPTS = ['Engineering', 'Sales', 'Operations', 'Finance', 'Marketing', 'Executive'];
const DEPT_COLORS = { Engineering: '#4E79A7', Sales: '#F28E2B', Operations: '#59A14F', Finance: '#B07AA1', Marketing: '#E15759', Executive: '#C9A227' };
const DEPT_PALETTE = ['#4E79A7', '#F28E2B', '#59A14F', '#B07AA1', '#E15759', '#C9A227', '#76B7B2', '#FF9DA7', '#9C755F', '#BAB0AC'];
const deptColorOf = (name, list) => DEPT_COLORS[name] || DEPT_PALETTE[(list && list.indexOf(name) >= 0 ? list.indexOf(name) : 0) % DEPT_PALETTE.length] || '#8896B0';
// Parse an uploaded/pasted roster: one employee per line, each with a ZIP and an
// optional team (any column that isn't the street address). Preview maps by ZIP
// centroid; production geocodes the full address exactly.
const parseRosterText = (text) => {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const out = [];
  lines.forEach((line, i) => {
    const zm = line.match(/\b(\d{5})\b/);
    if (!zm) return;
    const zip = zm[1];
    const parts = line.split(/[\t,;|]/).map(s => s.trim()).filter(Boolean);
    let dept = '';
    for (const p of parts) {
      if (/\d{5}/.test(p) || /^\d/.test(p)) continue;
      if (/[a-zA-Z]/.test(p) && p.length <= 28 && !/\b(st|ave|blvd|rd|dr|ln|hwy|pkwy|ste|fl)\b|suite|floor|houston|texas|,\s*tx|^tx$/i.test(p)) { dept = p; break; }
    }
    const c = ZIP_COORDS[zip];
    const jx = (((i * 2654435761) >>> 0) % 1000) / 1000 - 0.5;
    const jy = (((i * 40503 + 17) >>> 0) % 1000) / 1000 - 0.5;
    out.push({ id: 'up' + i, zip, dept, lat: (c ? c.lat : 29.758) + jx * 0.03, lng: (c ? c.lng : -95.368) + jy * 0.03, approx: !c });
  });
  return out;
};
const COMMUTE_ROSTER = (function () {
  let seed = 20260803; const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const pool = []; COMMUTE_ZIPS.forEach((z, i) => { for (let k = 0; k < z[3]; k++) pool.push(i); });
  const out = [];
  for (let i = 0; i < 52; i++) {
    const z = COMMUTE_ZIPS[pool[Math.floor(rnd() * pool.length)]];
    out.push({ id: 'emp' + i, zip: z[0], lat: z[1] + (rnd() - 0.5) * 0.028, lng: z[2] + (rnd() - 0.5) * 0.028, dept: COMMUTE_DEPTS[Math.floor(rnd() * COMMUTE_DEPTS.length)] });
  }
  return out;
})();
const COMMUTE_SPEED = { am: 24, pm: 21, off: 34 };
function commuteHav(a, b) {
  const R = 3958.8, d2r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * d2r, dLng = (b.lng - a.lng) * d2r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * d2r) * Math.cos(b.lat * d2r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
function commuteMinutes(emp, place, peak) {
  if (!place || !Number.isFinite(place.lat)) return NaN;
  const mi = commuteHav(emp, place);
  return Math.max(6, Math.round(mi / (COMMUTE_SPEED[peak] || 26) * 60 + 5 + Math.min(mi, 4)));
}
function commuteBand(m, t) { if (!Number.isFinite(m)) return 'na'; if (m <= t) return 'good'; if (m <= t + 15) return 'mid'; return 'far'; }

// Schematic drive-time map: employee dots colored either by their band to the
// selected building (time) or by department, plus isochrone-style reach rings
// and a star marker for the entered existing office. (Production: real isochrones.)
function CommuteMap({ buildings, employees, selectedId, current, peak, threshold, minutesFn, onSelect, colorMode, teams, deptColor }) {
  const dcolor = deptColor || ((n) => DEPT_COLORS[n] || '#8896B0');
  const teamList = teams || COMMUTE_DEPTS;
  const [hover, setHover] = React.useState(null);
  const pts = employees.map(e => ({ lat: e.lat, lng: e.lng })).concat(buildings.filter(b => Number.isFinite(b.lat)).map(b => ({ lat: b.lat, lng: b.lng })));
  if (current) pts.push(current);
  if (!pts.length) return <div className="commute-map"><div className="cm-empty">No mappable data</div></div>;
  const lats = pts.map(p => p.lat), lngs = pts.map(p => p.lng);
  let minLat = Math.min(...lats), maxLat = Math.max(...lats), minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const padLat = (maxLat - minLat) * 0.1 || 0.05, padLng = (maxLng - minLng) * 0.1 || 0.05;
  minLat -= padLat; maxLat += padLat; minLng -= padLng; maxLng += padLng;
  const W = 640, H = 560;
  const x = (lng) => ((lng - minLng) / (maxLng - minLng)) * W;
  const y = (lat) => H - ((lat - minLat) / (maxLat - minLat)) * H;
  const lat0 = (minLat + maxLat) / 2;
  const pxPerMile = (W / ((maxLng - minLng) * 54.6 * Math.cos(lat0 * Math.PI / 180)));
  const sel = buildings.find(b => b.id === selectedId) || buildings[0];
  const ringMi = (min) => (COMMUTE_SPEED[peak] || 26) * min / 60 * pxPerMile;
  const bandColor = { good: 'var(--navy)', mid: '#0056DA', far: 'var(--gold)' };
  const dotFill = (e) => colorMode === 'dept' ? dcolor(e.dept) : bandColor[commuteBand(minutesFn(e, sel), threshold)];
  const legendDepts = colorMode === 'dept' ? teamList.filter(d => employees.some(e => e.dept === d)) : [];
  const star = 'M0,-8 L1.9,-2.5 L7.7,-2.5 L2.9,1.1 L4.7,6.9 L0,3.4 L-4.7,6.9 L-2.9,1.1 L-7.7,-2.5 L-1.9,-2.5 Z';
  const hv = hover && (() => {
    const m = minutesFn(hover, sel), mc = current ? minutesFn(hover, current) : null;
    const diff = mc != null ? m - mc : null, bd = commuteBand(m, threshold);
    const bandLbl = bd === 'good' ? '≤ ' + threshold + ' min' : bd === 'mid' ? (threshold + 1) + '–' + (threshold + 15) + ' min' : (threshold + 15) + '+ min';
    return { m, mc, diff, bd, bandLbl, px: x(hover.lng) / W * 100, py: y(hover.lat) / H * 100 };
  })();
  return (
    <div className="commute-map">
      <div className="cm-svg-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} className="cm-svg" preserveAspectRatio="xMidYMid meet">
        <rect x="0" y="0" width={W} height={H} fill="#EEF3FA" />
        {sel && Number.isFinite(sel.lat) && [threshold + 15, threshold].map((t, k) => (
          <circle key={k} cx={x(sel.lng)} cy={y(sel.lat)} r={ringMi(t)} fill={k === 1 ? 'rgba(0,30,90,0.08)' : 'rgba(0,86,218,0.07)'} stroke={k === 1 ? 'rgba(0,30,90,0.45)' : 'rgba(0,86,218,0.4)'} strokeDasharray="4 4" strokeWidth="1.2" />
        ))}
        {employees.map((e) => (
          <circle key={e.id} cx={x(e.lng)} cy={y(e.lat)} r={hover && hover.id === e.id ? 7 : 4.4} fill={dotFill(e)} fillOpacity="0.9" stroke={hover && hover.id === e.id ? 'var(--navy)' : '#fff'} strokeWidth={hover && hover.id === e.id ? 2 : 1} style={{ cursor: 'pointer' }} onMouseEnter={() => setHover(e)} onMouseLeave={() => setHover(h => (h && h.id === e.id ? null : h))} />
        ))}
        {current && Number.isFinite(current.lat) && (
          <g transform={`translate(${x(current.lng)},${y(current.lat)})`}>
            <circle r="13" fill="#fff" stroke="var(--navy)" strokeWidth="2.5" />
            <path d={star} fill="var(--navy)" transform="scale(0.92)" />
          </g>
        )}
        {buildings.filter(b => Number.isFinite(b.lat)).map((b) => {
          const selp = b.id === selectedId; const s = selp ? 24 : 19;
          return (
            <g key={b.id} transform={`translate(${x(b.lng)},${y(b.lat)})`} onClick={() => onSelect(b.id)} style={{ cursor: 'pointer' }}>
              <rect x={-s / 2} y={-s / 2} width={s} height={s} rx={selp ? 5 : 4} fill={selp ? 'var(--gold)' : 'var(--navy)'} stroke="#fff" strokeWidth="2.5" />
              <text x="0" y="1" textAnchor="middle" dominantBaseline="middle" fontSize="11" fontWeight="800" fill={selp ? 'var(--navy)' : '#fff'}>{buildings.indexOf(b) + 1}</text>
            </g>
          );
        })}
      </svg>
      {hv && (
        <div className={'cm-emp-tip' + (hv.py < 26 ? ' below' : '')} style={{ left: hv.px + '%', top: hv.py + '%' }}>
          <div className="cm-tip-zip">ZIP {hover.zip}{hover.dept ? ' · ' + hover.dept : ''}</div>
          <div className="cm-tip-row"><span>Est. commute</span><b>{hv.m} min</b></div>
          {current && <div className="cm-tip-row"><span>Current</span><b>{hv.mc} min</b></div>}
          {current && <div className="cm-tip-row"><span>Change</span><b className={hv.diff < 0 ? 'g' : hv.diff > 0 ? 'r' : ''}>{hv.diff < 0 ? hv.diff + ' min' : hv.diff > 0 ? '+' + hv.diff + ' min' : '0 min'}</b></div>}
          <div className="cm-tip-band"><i style={{ background: bandColor[hv.bd] }} />{hv.bandLbl}{sel ? ' · to ' + sel.name : ''}</div>
        </div>
      )}
      </div>
      <div className="cm-legend">
        {colorMode === 'dept'
          ? legendDepts.map(d => <span key={d}><i style={{ background: dcolor(d) }} />{d}</span>)
          : (<>
              <span><i style={{ background: 'var(--navy)' }} />≤ {threshold} min</span>
              <span><i style={{ background: '#0056DA' }} />{threshold + 1}–{threshold + 15}</span>
              <span><i style={{ background: 'var(--gold)' }} />{threshold + 15}+</span>
            </>)}
        <span className="cm-legend-mark"><svg width="15" height="15" viewBox="-9 -9 18 18"><circle r="7.5" fill="#fff" stroke="var(--navy)" strokeWidth="1.6" /><path d="M0,-5 L1.2,-1.6 L4.8,-1.6 L1.8,0.7 L2.9,4.3 L0,2.1 L-2.9,4.3 L-1.8,0.7 L-4.8,-1.6 L-1.2,-1.6 Z" fill="var(--navy)" /></svg>Existing office</span>
      </div>
    </div>
