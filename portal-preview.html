.counter-banner-head svg { color: var(--amber-ink); flex-shrink: 0; }
.counter-banner-note {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-3);
  font-style: italic;
  margin-bottom: 10px;
  letter-spacing: -0.1px;
}
.counter-banner-actions {
  display: flex;
  gap: 6px;
}

/* ─── Email preview modal ────────────────────────────────────────── */
.email-modal-body {
  display: grid;
  grid-template-columns: 240px 1fr;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.email-stop-list {
  border-right: 1px solid var(--rule-2);
  background: var(--paper-2);
  padding: 12px 8px;
  overflow-y: auto;
}
.email-list-head {
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--ink-4);
  padding: 4px 10px 8px;
}
.email-stop-pick {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 10px;
  border: 0;
  background: transparent;
  border-radius: 6px;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s;
  margin-bottom: 2px;
}
.email-stop-pick:hover { background: rgba(0, 30, 90, 0.04); }
.email-stop-pick.active {
  background: var(--paper-card);
  box-shadow: 0 0 0 1px var(--navy);
}
.email-stop-pick-head {
  display: flex;
  align-items: center;
  gap: 10px;
}
.email-stop-pick-num {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  background: var(--navy);
  color: #fff;
  border-radius: 50%;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 11px;
  flex-shrink: 0;
}
.email-stop-pick-name {
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.1px;
}
.email-stop-pick-bldg {
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-3);
}
.email-stop-pick-time {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-4);
}

.email-preview {
  overflow-y: auto;
  padding: 18px 22px;
}
.email-preview-head {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--rule-2);
  margin-bottom: 14px;
}
.email-row {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 12px;
  font-family: var(--sans);
  font-size: 12.5px;
  letter-spacing: -0.1px;
}
.email-label {
  color: var(--ink-4);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding-top: 2px;
}
.email-val { color: var(--ink); }
.email-subject { font-weight: 700; color: var(--navy); }
.email-body-wrap {
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--paper-card);
  overflow: hidden;
}
.email-body {
  width: 100%;
  border: 0;
  padding: 14px 16px;
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink);
  resize: vertical;
  outline: none;
  background: transparent;
  letter-spacing: -0.1px;
}
.email-body:focus { background: rgba(0, 30, 90, 0.02); }

/* ─── Simulated leasing-rep view ─────────────────────────────────────
   What the rep sees when they click the magic link in their email.
   Rendered inside a fake browser-chrome frame so it's clearly distinct
   from the broker UI. */
.rep-view-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(4px);
  z-index: 110;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  animation: fadeIn 0.2s ease;
}
.rep-view-frame {
  width: 100%;
  max-width: 820px;
  max-height: calc(100vh - 64px);
  background: var(--paper-card);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
}
.rep-view-chrome {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  background: #E8E8EE;
  border-bottom: 1px solid #D5D5DD;
  flex-shrink: 0;
}
.rep-view-chrome-dots {
  display: flex;
  gap: 6px;
}
.rep-view-chrome-dots span {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #D5D5DD;
}
.rep-view-chrome-dots span:nth-child(1) { background: #FF5F57; }
.rep-view-chrome-dots span:nth-child(2) { background: #FFBD2E; }
.rep-view-chrome-dots span:nth-child(3) { background: #27C93F; }
.rep-view-chrome-url {
  flex: 1;
  background: #FAFAFC;
  border: 1px solid #D5D5DD;
  border-radius: 6px;
  padding: 5px 12px;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 6px;
}
.rep-view-lock { font-size: 10px; }
.rep-view-token { color: var(--ink-4); }
.rep-view-close {
  appearance: none;
  border: 0;
  background: transparent;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  cursor: pointer;
  color: var(--ink-3);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.rep-view-close:hover { background: rgba(0, 0, 0, 0.05); color: var(--ink); }

.rep-view-page {
  padding: 36px 44px 44px;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}
.rep-view-brand {
  margin-bottom: 32px;
}
.rep-view-brand-mark {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 22px;
  color: var(--navy);
  letter-spacing: -0.6px;
}
.rep-view-eyebrow {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--bright-blue);
  margin-bottom: 6px;
}
.rep-view-h {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: -0.5px;
  color: var(--navy);
  margin: 0 0 8px;
  line-height: 1.2;
}
.rep-view-sub {
  font-family: var(--sans);
  font-size: 14px;
  color: var(--ink-3);
  margin-bottom: 24px;
  line-height: 1.5;
  letter-spacing: -0.1px;
}
.rep-view-card {
  background: var(--paper-2);
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 24px;
}
.rep-view-card-row {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 18px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule-2);
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  letter-spacing: -0.1px;
  line-height: 1.4;
}
.rep-view-card-row:last-child { border-bottom: 0; }
.rep-view-card-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink-4);
  padding-top: 2px;
}
.rep-view-card-val strong { color: var(--navy); font-weight: 700; }

.rep-view-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn.rep-confirm {
  background: #1F8A1F;
  color: #fff;
}
.btn.rep-confirm:hover {
  background: #156115;
}

.rep-view-counter {
  background: var(--paper-2);
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.rep-view-counter textarea {
  appearance: none;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 10px 12px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  letter-spacing: -0.1px;
  outline: none;
  resize: vertical;
  line-height: 1.5;
}
.rep-view-counter textarea:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(0, 30, 90, 0.08);
}

.rep-view-success {
  text-align: center;
  padding: 24px 0;
}
.rep-view-success-icon {
  display: inline-grid;
  place-items: center;
  width: 64px;
  height: 64px;
  background: rgba(34, 139, 34, 0.15);
  color: #1F6B1F;
  border-radius: 50%;
  margin-bottom: 20px;
}
.rep-view-success-icon.decline {
  background: rgba(220, 80, 100, 0.12);
  color: #B53A4D;
}
.rep-view-success .rep-view-h { text-align: center; }
.rep-view-success .rep-view-sub { text-align: center; max-width: 480px; margin-left: auto; margin-right: auto; }

/* Email modal — manual-send updates ─────────────────────────────────
   Per-recipient send tracking (since we can't auto-detect when broker
   actually hits Send in Outlook) and clipboard fallback. */
.email-list-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.email-list-progress {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  font-weight: 600;
  text-transform: none;
  letter-spacing: 0;
}
.email-stop-pick.sent {
  background: rgba(34, 139, 34, 0.04);
}
.email-stop-pick.sent .email-stop-pick-name {
  color: var(--ink-2);
}
.email-stop-pick.sent .email-stop-pick-num {
  background: #1F8A1F;
}
.sent-tag {
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: #1F8A1F;
  background: rgba(34, 139, 34, 0.12);
  padding: 2px 6px;
  border-radius: 999px;
}

/* Send row — Open in Outlook + Copy + Mark sent on the same line */
.email-send-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  padding: 14px;
  background: var(--paper-2);
  border-radius: 8px;
  flex-wrap: wrap;
}
.email-send-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.email-send-actions .btn {
  text-decoration: none; /* the mailto link is an <a> styled as a button */
}
.email-mark-action {
  flex-shrink: 0;
}
.mark-sent-btn {
  border: 1px dashed var(--rule);
}
.mark-sent-btn:hover {
  background: rgba(34, 139, 34, 0.06);
  border-color: #1F8A1F;
  border-style: solid;
  color: #1F6B1F;
}
.sent-confirmation {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 600;
  color: #1F6B1F;
  letter-spacing: -0.1px;
}

/* ─── Tour Panel restructure ─────────────────────────────────────────
   New state-aware layout: section headings, upcoming-tour summary card,
   plan-a-tour CTA, past tours expandable rows. */
.tour-section {
  margin-bottom: 32px;
}
.tour-section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 12px;
}
.tour-section-head::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--rule-2);
  margin-left: 8px;
}

/* Upcoming tour summary card — high-level glance with all stops one-liner */
.tour-card.upcoming-tour {
  padding: 22px 24px;
}
.upcoming-tour-stops {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 16px 0;
  padding: 14px 0;
  border-top: 1px solid var(--rule-2);
  border-bottom: 1px solid var(--rule-2);
}
.upcoming-tour-stop {
  display: grid;
  grid-template-columns: 28px 80px 1fr auto;
  gap: 14px;
  align-items: center;
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: -0.1px;
  color: var(--ink-2);
}
.upcoming-stop-num {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  background: var(--navy);
  color: #fff;
  border-radius: 50%;
  font-weight: 700;
  font-size: 11px;
  flex-shrink: 0;
}
.upcoming-stop-time {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--bright-blue);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.upcoming-stop-name {
  font-weight: 700;
  color: var(--navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.upcoming-stop-status {
  flex-shrink: 0;
}
.upcoming-tour-actions {
  display: flex;
  gap: 10px;
}

/* Plan-a-tour CTA card — surfaced when shortlist exists but no itinerary */
.plan-tour-cta {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: center;
  padding: 20px 24px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 12px;
  box-shadow: var(--shadow-1);
}
.plan-tour-cta-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  background: rgba(0, 30, 90, 0.06);
  color: var(--navy);
  border-radius: 50%;
  flex-shrink: 0;
}
.plan-tour-cta-body { min-width: 0; }
.plan-tour-cta-title {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 17px;
  color: var(--navy);
  letter-spacing: -0.3px;
  margin: 0 0 4px;
}
.plan-tour-cta-sub {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
  margin-bottom: 10px;
  line-height: 1.4;
}
.plan-tour-cta-stops {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.plan-tour-cta-chip {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  color: var(--navy);
  background: var(--paper-2);
  padding: 3px 10px;
  border-radius: 999px;
  letter-spacing: -0.1px;
}
.plan-tour-cta-chip.muted {
  color: var(--ink-3);
}

/* Plan-a-tour wizard stops list */
.plan-stops-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}
.plan-stop-row {
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 12px;
  padding: 12px 16px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  align-items: center;
}
.plan-stop-row:hover {
  border-color: var(--ink-4);
  background: var(--paper-2);
}
.plan-stop-row.selected {
  border-color: var(--navy);
  background: rgba(0, 30, 90, 0.04);
  box-shadow: 0 0 0 1px var(--navy);
}
.plan-stop-info { min-width: 0; }
.plan-stop-name {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 14px;
  color: var(--navy);
  margin: 0 0 2px;
  letter-spacing: -0.1px;
}
.plan-stop-addr {
  font-family: var(--sans);
  font-size: 11.5px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
}
.plan-summary {
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-3);
  text-align: right;
  letter-spacing: -0.1px;
  padding-top: 8px;
  border-top: 1px solid var(--rule-2);
}
.plan-summary strong { color: var(--navy); font-weight: 700; }

/* Checkbox label for "propose multiple dates" toggle */
.checkbox-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.1px;
}
.checkbox-label input[type="checkbox"] {
  width: 16px;
  height: 16px;
  cursor: pointer;
}
.alt-dates {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px 14px;
  background: var(--paper-2);
  border-radius: 8px;
}

/* Form textarea (broker note in plan wizard) */
.wizard-form textarea {
  appearance: none;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 10px 12px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  letter-spacing: -0.1px;
  outline: none;
  resize: vertical;
  line-height: 1.5;
}
.wizard-form textarea:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(0, 30, 90, 0.08);
}

/* Past tour expandable rows */
.past-tour {
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 8px;
  transition: box-shadow 0.15s;
}
.past-tour:hover { box-shadow: var(--shadow-1); }
.past-tour.expanded {
  box-shadow: var(--shadow-1);
}
.past-tour-head {
  appearance: none;
  border: 0;
  background: transparent;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 14px 18px;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s;
}
.past-tour-head:hover { background: var(--paper-2); }
.past-tour-eyebrow {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 4px;
}
.past-tour-date {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 15px;
  color: var(--navy);
  letter-spacing: -0.2px;
  margin-bottom: 2px;
}
.past-tour-meta {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
}
.past-tour-outcomes {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.past-tour-toggle {
  color: var(--ink-3);
  font-size: 14px;
  margin-left: 6px;
  width: 16px;
  text-align: center;
}

.outcome-pill {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 999px;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.outcome-pill.outcome-interested {
  background: rgba(34, 139, 34, 0.12);
  color: #1F6B1F;
}
.outcome-pill.outcome-followup {
  background: rgba(255, 182, 0, 0.15);
  color: #6E4D00;
}
.outcome-pill.outcome-discarded,
.outcome-pill.outcome-notinterested {
  background: rgba(220, 80, 100, 0.1);
  color: #B53A4D;
}

.past-tour-body {
  padding: 4px 18px 18px;
  border-top: 1px solid var(--rule-2);
}
.past-tour-summary {
  padding: 14px 0;
  border-bottom: 1px solid var(--rule-2);
  margin-bottom: 14px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-2);
  letter-spacing: -0.1px;
  line-height: 1.5;
}
.past-tour-stops {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.past-tour-stop {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule-2);
}
.past-tour-stop:last-child { border-bottom: 0; padding-bottom: 0; }
.past-stop-num {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  background: var(--paper-2);
  color: var(--ink-3);
  border-radius: 50%;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 11px;
}
.past-stop-info { min-width: 0; }
.past-stop-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.past-stop-name {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 13px;
  color: var(--navy);
  letter-spacing: -0.1px;
}
.past-stop-meta {
  font-family: var(--sans);
  font-size: 11.5px;
  color: var(--ink-3);
  margin-top: 2px;
}
.past-stop-note {
  font-family: var(--sans);
  font-size: 12px;
  font-style: italic;
  color: var(--ink-2);
  margin-top: 6px;
  padding: 8px 12px;
  background: var(--paper-2);
  border-radius: 6px;
  letter-spacing: -0.1px;
  line-height: 1.4;
}


/* === PORTAL v2 additions (real assets replace the demo's placeholders) === */
.real-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.lightbox-body .real-photo { object-fit: contain; max-height: 72vh; border-radius: 6px; background: var(--paper); }
.pc-stat-stack div { line-height: 1.35; }
.vote-tally { display: inline-flex; gap: 6px; align-items: center; flex: none; }
.vote-tally .vt { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 10px;
  padding: 2px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-3); background: var(--paper); }
.vote-tally .vt.up   { color: var(--navy); border-color: var(--navy-tint); background: var(--navy-tint); }
.vote-tally .vt.down { color: var(--ink-3); }
.compare-table tr.tint td { background: var(--paper-2); }
.compare-table tr.tint td.compare-row-label { background: transparent; }



/* ══════════════════════════════════════════════════════════════════════
   DESIGN-HANDOFF RESTYLE  ·  Cresa Market Survey
   Overrides prior styles by cascade order. Tokens & specs taken verbatim
   from design_handoff_survey_tool (README + Survey Prototype.dc.html).
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#FDFDFE;
  --paper:#FFFFFF; --paper-card:#FFFFFF;
  --paper-2:#F8FAFD;          /* table group headers / hover */
  --paper-3:#E8EFF8;          /* photo / input bg */
  --ink:#001E5A; --ink-2:#2B3350; --ink-3:#5A6580; --ink-4:#8A93A8;
  --rule:#E4E8F0; --rule-2:#F0F2F7; --hair:#EEF1F6;
  --navy:#001E5A; --navy-light:#0A2D6E;
  --accent:#001E5A; --accent-2:#0A2D6E; --accent-tint:#E8EFF8;
  --gold:#FFB600; --gold-ink:#B98A00; --shortlist-tint:#FFFDF4;
  --link:#0056DA; --bright-blue:#0056DA;
  --green:#0B7A3E; --amber:#B4540A;
  --shadow-1:0 1px 3px rgba(0,30,90,.06);
  --shadow-2:0 2px 10px rgba(0,30,90,.10);
  --shadow-float:0 2px 12px rgba(0,30,90,.14);
}
body{ background:var(--bg); font-family:var(--sans); color:var(--ink-2); }
.app{ background:var(--bg); }
a{ color:var(--navy); }
a:hover{ color:var(--link); }

/* ───────── Header (58px) ───────── */
.topbar{
  height:58px; padding:0; border-bottom:1px solid var(--rule);
  background:var(--bg); box-shadow:none;
}
.topbar > .brand,
.topbar > .topbar-right{ /* re-centre content under a 1560 cap */ }
.app > .topbar{ position:sticky; top:0; z-index:50; }
/* centre the header contents to max-width 1560 with 36px gutters */
.topbar{ display:block; }
.topbar::before{ content:none; }
.topbar-inner{
  max-width:var(--shell-max); margin:0 auto; height:58px; padding:0 36px;
  display:flex; align-items:center; justify-content:space-between; box-sizing:border-box;
}
.brand{ gap:14px; }
.brand-logo{ height:19px; }
.brand-divider{ width:1px; height:22px; background:var(--rule); margin:0; }
.brand-name{
  font-size:11px; font-weight:700; letter-spacing:2px; color:var(--ink-4);
  text-transform:uppercase;
}
.topbar-right{ gap:26px; }
/* nav tabs → plain text w/ gold underline when active */
.topbar-tabs{
  display:flex; gap:24px; background:transparent; border:0; border-radius:0; padding:0;
  align-self:stretch; align-items:center;
}
.topbar-tab{
  height:58px; padding:0; border:0; border-radius:0; background:transparent;
  color:var(--ink-4); font-size:12.5px; font-weight:700; letter-spacing:-0.1px;
  border-bottom:2px solid transparent; margin-bottom:-1px; gap:0;
}
.topbar-tab svg{ display:none; }
.topbar-tab:hover{ background:transparent; color:var(--ink-2); }
.topbar-tab.active{
  color:var(--navy); border:0; border-bottom:2px solid var(--gold); background:transparent;
}
.topbar-tab .count{
  margin-left:7px; min-width:16px; height:16px; padding:0 4px; font-size:10px;
  background:var(--paper-2); border:1px solid var(--rule); color:var(--ink-3); border-radius:8px;
}
.topbar-tab.active .count{ background:var(--navy); color:#fff; border-color:var(--navy); }
/* avatar → 30px navy circle */
.avatar{ width:30px; height:30px; font-size:11px; font-weight:700; background:var(--navy); color:#fff; font-family:var(--sans); }
.avatar.client{ background:var(--navy); color:#fff; }
.avatar.broker{ background:var(--navy); color:#fff; }
.avatar.lg{ width:30px; height:30px; }
.topbar-right .muted{ color:var(--ink-4); }

/* ───────── Page header block ───────── */
.survey-header{
  max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box;
  padding:30px 36px 20px; border-bottom:0; background:transparent;
}
.survey-header .eyebrow{
  font-size:10.5px; font-weight:700; letter-spacing:2.2px; text-transform:uppercase;
  color:var(--bright-blue); margin-bottom:8px;
}
.survey-title{
  font-size:40px; line-height:1; letter-spacing:-1.6px; font-weight:700; color:var(--navy);
  margin:0;
}
.survey-meta{
  font-size:13px; color:var(--ink-4); font-weight:400; margin-top:8px; letter-spacing:0;
}
.survey-meta .dot{ background:var(--ink-4); }
.survey-meta .live-dot{ background:var(--green); }

/* ───────── List controls (Sort + Spread|Gallery) ───────── */
.list-controls{ display:flex; gap:10px; align-items:center; flex:none; padding-bottom:4px; }
.sortchip,.mapchip{
  border:1px solid var(--rule); border-radius:6px; padding:8px 14px;
  font-size:11.5px; font-weight:700; color:var(--ink-2); cursor:pointer; user-select:none;
  background:#fff; white-space:nowrap;
}
.sortchip:hover,.mapchip:hover{ border-color:var(--navy); }
.mapchip.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
.seg{ display:flex; border:1px solid var(--rule); border-radius:6px; overflow:hidden; }
.seg-btn{
  padding:8px 14px; font-size:11.5px; font-weight:700; cursor:pointer; user-select:none;
  background:#fff; color:var(--ink-4); border:0; white-space:nowrap;
}
.seg-btn + .seg-btn{ border-left:1px solid var(--rule); }
.seg-btn.on{ background:var(--navy); color:#fff; }

/* ───────── Split (fills remaining viewport; list scrolls, map sticky) ───────── */
.split{
  display:flex; flex-direction:row; align-items:stretch;
  flex:1; min-height:0;
  max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box;
  border-top:1px solid var(--rule); gap:0;
}
.split.no-map{ display:block; overflow-y:auto; }
.split.no-map .gallery-scroll{ overflow:visible; height:auto; }
.split-list{
  flex:1; min-width:640px; overflow-y:auto; padding:0; background:transparent; border-right:0;
}
.split .split-map,
.split .cresa-gmap-wrap,
.split > .map-shell{
  flex:1.3; min-width:0; border-left:1px solid var(--rule);
}

/* ───────── Spread row ───────── */
.property-card{
  display:grid; grid-template-columns:52px 170px 1fr auto; gap:20px; align-items:stretch;
  padding:22px 28px; margin:0; border:0; border-bottom:1px solid var(--rule);
  border-radius:0; background:transparent; box-shadow:none; cursor:pointer;
  transition:background .12s;
}
.property-card:hover{ background:var(--paper-2); border-color:var(--rule); box-shadow:none; }
.property-card.selected{ background:var(--paper-2); box-shadow:none; border-color:var(--rule); }
.property-card.passed{ opacity:.45; }
.pc-ghostnum{
  font-size:40px; font-weight:700; color:var(--rule); letter-spacing:-2px; line-height:.85;
  align-self:flex-start;
}
.pc-photo{
  width:170px; height:120px; border-radius:8px; align-self:flex-start;
  background:repeating-linear-gradient(45deg,#E8EFF8,#E8EFF8 9px,#EFF4FB 9px,#EFF4FB 18px);
}
.pc-photo .pc-num{ display:none; }
.pc-photo .placeholder{
  background:repeating-linear-gradient(45deg,#E8EFF8,#E8EFF8 9px,#EFF4FB 9px,#EFF4FB 18px);
  color:var(--ink-4); font-size:9px; letter-spacing:1.2px; font-weight:700;
}
.pc-badge{
  position:absolute; top:10px; left:10px; font-size:9.5px; font-weight:700;
  border-radius:4px; padding:3px 8px; letter-spacing:.6px; z-index:3;
}
.pc-badge.short{ background:var(--gold); color:var(--navy); }
.pc-badge.pass{ background:var(--rule); color:var(--ink-3); }
.pc-body{ display:flex; flex-direction:column; gap:0; min-width:0; }
.pc-name-row{ display:block; }
.pc-name{
  font-size:22px; font-weight:700; color:var(--navy); letter-spacing:-.6px; line-height:1.15;
  white-space:normal; overflow:visible; text-overflow:clip;
}
.pc-addr{
  font-size:12px; color:var(--ink-4); letter-spacing:0; margin:3px 0 14px;
  white-space:normal; overflow:visible; text-overflow:clip;
}
.pc-stats{
  display:flex; border-top:1px solid var(--hair); padding-top:12px; margin-top:auto;
  grid-template-columns:none; gap:0;
}
.pc-stats > div{
  flex:1; min-width:0; overflow:hidden; padding:0 10px 0 14px; border-right:1px solid var(--hair);
}
.pc-stats > div:first-child{ padding-left:0; }
.pc-stats > div:last-child{ border-right:0; }
.pc-stat-label{
  font-size:9px; letter-spacing:1.2px; color:var(--ink-4); font-weight:700; text-transform:uppercase;
  margin-bottom:0; order:2; margin-top:2px; white-space:nowrap;
}
.pc-stat-val{
  font-size:15px; font-weight:700; color:var(--ink-2); letter-spacing:0; white-space:nowrap;
  order:1;
}
.pc-stat-val.pc-stat-stack > div{ font-size:15px; }
.pc-actions{
  flex-direction:column; align-items:flex-end; justify-content:center; gap:8px; align-self:center;
}
.pc-actions .btn.ghost.sm{ display:none; }        /* row is clickable; drop chevron */
.pc-actions .vote-group{ border-color:var(--rule); }

/* ───────── Gallery ───────── */
.gallery-scroll{ flex:1; min-width:0; overflow-y:auto; }
.gallery-grid{
  display:grid; gap:20px; align-content:start; padding:26px 36px 30px;
}
.gallery-grid.cols3{ grid-template-columns:repeat(3,1fr); }
.gallery-grid.cols2{ grid-template-columns:repeat(2,1fr); }
.gallery-tile{
  border-radius:9px; overflow:hidden; position:relative; height:250px; cursor:pointer;
  background:repeating-linear-gradient(45deg,#DCE6F5,#DCE6F5 9px,#E6EEF9 9px,#E6EEF9 18px);
  transition:box-shadow .15s;
}
.gallery-tile:hover{ box-shadow:0 6px 20px rgba(0,30,90,.18); }
.gallery-tile.passed{ opacity:.45; }
.gallery-tile .real-photo{ width:100%; height:100%; object-fit:cover; }
.gallery-cap{
  position:absolute; left:0; right:0; bottom:0; padding:38px 14px 12px;
  background:linear-gradient(to top,rgba(0,21,69,.92),rgba(0,21,69,0));
}
.gallery-cap-top{ display:flex; justify-content:space-between; align-items:baseline; }
.gallery-cap-name{ font-size:15px; font-weight:700; color:#fff; }
.gallery-cap-price{ font-size:13px; font-weight:700; color:#fff; }
.gallery-cap-price.short{ color:var(--gold); }
.gallery-cap-sub{ font-size:10.5px; color:rgba(255,255,255,.75); margin-top:1px; }
.gallery-badge{
  position:absolute; top:12px; left:12px; font-size:9.5px; font-weight:700; border-radius:4px; padding:3px 8px; z-index:2;
}
.gallery-badge.short{ background:var(--gold); color:var(--navy); }
.gallery-badge.pass{ background:var(--rule); color:var(--ink-3); }

/* ───────── Map pins (design semantics) ───────── */
.map-pin-body{
  width:26px; height:26px; border-radius:50%; background:#fff; border:2px solid var(--navy);
  box-shadow:0 2px 6px rgba(0,30,90,.15);
}
.map-pin-num{ color:var(--navy); font-family:var(--mono); font-size:11px; font-weight:700; }
.map-pin.short .map-pin-body{
  background:var(--navy); border:none; box-shadow:0 0 0 3px var(--gold),0 3px 8px rgba(0,30,90,.3);
}
.map-pin.short .map-pin-num{ color:#fff; }
.map-pin.selected .map-pin-body{
  width:26px; height:26px; background:var(--navy); border:none;
  box-shadow:0 0 0 3px var(--gold),0 3px 8px rgba(0,30,90,.3);
}
.map-pin.selected .map-pin-num{ color:#fff; }
.map-pin:hover .map-pin-body{ transform:scale(1.2); }

/* ───────── Detail ───────── */
.detail{ max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box; padding:0 36px; }
.route-fixed{ overflow-y:auto; }
.detail-grid{ display:block; gap:0; margin-top:0; }
.detail-main{ overflow:visible; padding:0 0 30px; }
.detail-aside{
  border-left:0; padding:0; margin-top:8px;
  display:grid; grid-template-columns:1fr 1fr; gap:32px;
}
.detail-nav{ margin:0; padding:14px 0 12px; font-family:var(--mono); }
.detail-nav a{ font-size:12px; font-weight:700; color:var(--ink-2); }
.detail-nav a:hover{ color:var(--link); }
.detail-nav-pager{ border-color:var(--rule); }

.detail-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin:20px 0 4px; }
.detail-name{ font-size:32px; letter-spacing:-1.2px; color:var(--navy); line-height:1; margin:0; }
.detail-addr{ font-size:13px; color:var(--ink-3); margin:6px 0 0; }
.detail-header .badge.submarket{ display:none !important; }   /* submarket now lives in addr line */
.detail-actions{ flex-direction:row; align-items:center; gap:10px; }
.detail-nav-pager{ order:3; }

/* action buttons (Shortlist / Pass / Share) */
.act-btn{
  font-size:12px; font-weight:700; border-radius:8px; padding:10px 18px; cursor:pointer; user-select:none;
  border:1px solid var(--rule); background:#fff; color:var(--ink-3); display:inline-flex; align-items:center; gap:6px;
  white-space:nowrap;
}
.act-btn:hover{ border-color:var(--navy); color:var(--navy); }
.act-btn.short{ background:#fff; color:var(--navy); border-color:var(--rule); }
.act-btn.short.on{ background:var(--gold); color:var(--navy); border-color:var(--gold); }
.act-btn.pass.on{ background:var(--ink-2); color:#fff; border-color:var(--ink-2); }

/* hero split */
.media-grid{ grid-template-columns:1.55fr 1fr; gap:14px; height:290px; margin:0 0 0; align-items:stretch; }
.carousel{ aspect-ratio:auto; height:100%; border-radius:10px; background:repeating-linear-gradient(45deg,#DCE6F5,#DCE6F5 11px,#E8EFF8 11px,#E8EFF8 22px); }
.carousel .placeholder{ background:repeating-linear-gradient(45deg,#DCE6F5,#DCE6F5 11px,#E8EFF8 11px,#E8EFF8 22px); color:var(--ink-4); letter-spacing:1.6px; font-size:10px; font-weight:700; }
.carousel-arrow{ width:32px; height:32px; background:#fff; border:0; box-shadow:0 2px 8px rgba(0,30,90,.15); color:var(--navy); }
.carousel-arrow:hover{ background:var(--navy); color:#fff; }
.carousel-arrow svg{ width:14px; height:14px; }
.carousel-label{ background:rgba(11,22,48,.8); color:#fff; border-radius:12px; padding:4px 10px; font-family:var(--mono); letter-spacing:0; font-weight:700; }
.detail-map{ border-radius:10px; min-height:0; height:100%; background:#EDF2F7; border:0; }

/* gold stat band */
.stat-band{ display:flex; align-items:center; padding:16px 0; border-bottom:1px solid var(--rule-2); margin-top:20px; }
.stat-item{ flex:1; display:flex; gap:12px; align-items:center; padding-left:22px; }
.stat-item:first-child{ padding-left:0; }
.stat-item svg{ width:24px; height:24px; flex:none; }
.stat-item .sv{ font-size:14px; font-weight:700; color:var(--navy); line-height:1.15; }
.stat-item .sl{ font-size:10.5px; color:var(--ink-4); }
.stat-div{ width:1px; height:34px; background:var(--rule-2); flex:none; }

/* description + show more */
.detail-desc{ font-size:12.5px; color:var(--ink-2); line-height:1.6; padding:14px 0 4px; max-width:760px; }
.showmore{ font-size:12px; font-weight:700; color:var(--navy); padding-bottom:14px; cursor:pointer; user-select:none; }
.showmore:hover{ color:var(--link); }

/* sections in single-column detail */
.detail-main .section{ margin-bottom:22px; }
.section-head{ border-bottom:0; padding-bottom:0; margin-bottom:10px; align-items:baseline; }
.section-title{ font-size:16px; font-weight:700; letter-spacing:-.3px; text-transform:none; color:var(--navy); }
.section-title .count{ color:var(--ink-4); font-weight:700; }

/* suites table */
.suites-table{ border:1px solid var(--rule-2); border-radius:10px; overflow:hidden; margin-bottom:8px; }
.suites-head,.suites-row{ display:flex; align-items:center; padding:12px 18px; }
.suites-head{ background:var(--paper-2); font-size:10.5px; font-weight:700; color:var(--ink-4); letter-spacing:.4px; text-transform:uppercase; }
.suites-row{ font-size:12.5px; border-top:1px solid var(--rule-2); }
.suites-row:hover{ background:var(--paper-2); }
.suites-table .c-suite{ flex:1; font-weight:700; color:var(--navy); }
.suites-table .c-size,.suites-table .c-avail,.suites-table .c-type,.suites-table .c-psf{ flex:1; color:var(--ink-2); }
.suites-table .c-mo{ flex:1.2; color:var(--ink-2); }
.suites-table .c-mo b{ color:var(--navy); }
.suites-table .c-mo .u{ color:var(--ink-4); }
.suites-table .c-docs{ flex:.7; display:flex; gap:8px; color:var(--ink-3); }
.suites-foot{ font-size:10.5px; color:var(--ink-4); padding:8px 2px 0; }

/* broker + comments rail cards below */
.detail-aside .section{ margin-top:0; }
.detail-aside .section-head{ margin-bottom:12px; border-bottom:1px solid var(--rule); padding-bottom:8px; }

/* hide info-grid & space-cards (replaced by band + table) */
.detail-main .legacy-hide{ display:none !important; }

/* ───────── Compare — data matrix ───────── */
.compare-wrap{ max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box; padding:24px 36px 40px; overflow-x:auto; }
.compare-table{ border:1px solid var(--rule); border-radius:10px; border-collapse:separate; border-spacing:0; overflow:hidden; }
.compare-table th,.compare-table td{
  border:0; border-bottom:1px solid var(--rule-2); border-right:1px solid var(--rule-2);
  padding:18px 16px; vertical-align:middle; text-align:center;
  font-size:12px; color:var(--ink-2); font-weight:400; background:#fff;
}
.compare-table th:last-child,.compare-table td:last-child{ border-right:0; }
.compare-table tbody tr:last-child td{ border-bottom:0; }
.compare-table tbody tr:nth-child(odd) td{ background:#fff; }   /* kill zebra */
.compare-table tbody tr:first-child td{ background:#fff; }      /* kill navy header row bg */
.compare-table tbody tr.tint td{ background:#fff; }             /* uniform cells, no best-in-row */
.compare-table .compare-row-label{
  position:sticky; left:0; z-index:2; width:200px; min-width:200px;
  background:var(--paper-2) !important; color:var(--ink-4) !important;
  text-align:left !important;
  font-size:10.5px !important; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
}
.compare-table tbody tr:first-child .compare-row-label,
.compare-table tbody tr:nth-child(odd) .compare-row-label{ background:var(--paper-2) !important; color:var(--ink-4) !important; }
.compare-table thead th{ background:#fff; }
.compare-photo{ width:100%; height:132px; border-radius:8px; overflow:hidden; background:var(--paper-3); }
.compare-photo .real-photo{ object-fit:cover; width:100%; height:100%; }
.compare-name{ font-size:12.5px; font-weight:700; color:var(--navy); }
.compare-addr{ font-size:11px; color:var(--ink-4); margin-top:2px; }
/* row-group micro headers */
.compare-table tr.grouprow td{
  background:var(--paper-2) !important; font-size:10px; font-weight:700; letter-spacing:1.4px;
  text-transform:uppercase; color:var(--ink-4); padding:8px 14px;
}
.compare-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:11px; color:var(--ink-4); }
.compare-foot a{ font-size:12px; font-weight:700; color:var(--link); cursor:pointer; }

/* ───────── Buttons / badges ───────── */
.btn{ background:var(--navy); border-color:var(--navy); border-radius:6px; font-size:12.5px; font-weight:700; }
.btn:hover{ background:var(--navy-light); border-color:var(--navy-light); }
.btn.subtle{ background:#fff; border-color:var(--rule); color:var(--ink-2); }
.btn.subtle:hover{ border-color:var(--navy); color:var(--navy); background:#fff; }
.vote-btn.up.active,.vote-btn.down.active{ background:var(--gold); color:var(--navy); }
.badge.submarket{ background:var(--paper-2); color:var(--ink-3); border-color:var(--rule); font-family:var(--sans); text-transform:none; letter-spacing:0; }
.mono-tag{ font-family:var(--mono); }

/* keep the preview tag readable */
.brand .mono-tag{ letter-spacing:.4px; }


/* ══════════ V2 DETAIL — "Airy Broadsheet" ══════════ */
.detail-v2{ max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box; padding:0 36px 40px; }
.detail-titlebar{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; padding:26px 0 20px; }
.detail-pills{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.dpill{ font-size:12px; font-weight:700; padding:6px 14px; border-radius:16px; background:var(--gold); color:var(--navy); white-space:nowrap; }
.dpill.gold{ background:#FFF3D6; color:var(--gold-ink); }
.detail-name-lg{ font-size:42px; line-height:1.03; letter-spacing:-1.4px; font-weight:700; color:var(--navy); margin:0; }
.detail-v2 .detail-addr{ font-size:17px; color:var(--ink-3); margin-top:12px; }
.detail-title-actions{ display:flex; gap:10px; flex:none; padding-top:8px; }
.detail-title-actions .act-btn{ padding:12px 26px; font-size:13px; border-radius:8px; }
/* Vote group sits under the address (moved from the top-right) */
.detail-vote{ margin-top:18px; }
.detail-vote .vote-group{ box-shadow:var(--shadow-1); }
.detail-rule{ height:1px; background:var(--rule); margin:0 0 28px; }
.detail-cols{ display:grid; grid-template-columns:330px minmax(0,1fr) 550px; gap:32px; align-items:start; }
/* Right column is the pinned action rail — decision + comments + documents in
   one panel. Sticky so it stays visible; scrolls internally if it runs long. */
.detail-right{ position:sticky; top:16px; align-self:start; min-height:0; max-height:calc(100vh - 190px); overflow-y:auto;
  border:1px solid var(--rule); border-radius:14px; background:var(--paper-card); box-shadow:var(--shadow-1); }
.detail-right .rail-block{ padding:16px 18px; border-bottom:1px solid var(--rule-2); }
.detail-right .rail-block:last-child{ border-bottom:0; }
.detail-right .rail-label{ font-size:9.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:#6B6B6B; margin-bottom:10px; }
.detail-right .section{ margin-bottom:0; }
.detail-right .docs-grid{ grid-template-columns:1fr; }
.detail-right::-webkit-scrollbar{ width:8px; }
.detail-right::-webkit-scrollbar-track{ background:transparent; }
.detail-right::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:999px; }
.detail-right::-webkit-scrollbar-thumb:hover{ background:var(--ink-4); }

/* Notes block in the left column, below the building specs (parking, etc.) */
.detail-note{ margin-top:22px; padding-top:20px; border-top:1px solid var(--rule-2); }
.detail-note-label{ font-size:9.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:#6B6B6B; margin-bottom:8px; }
.detail-note-body{ font-size:13px; line-height:1.55; color:var(--ink-2); }

/* Suites — a simple single-row-per-suite table below the photo. Neutral
   palette, no heavy navy accents; light header, hairline rows. */
.detail-suites{ margin-top:30px; }
.suite-table-wrap{ margin-top:16px; border:1px solid var(--rule); border-radius:12px; overflow:auto; box-shadow:var(--shadow-1); background:#fff; }
.suite-table{ width:100%; border-collapse:collapse; table-layout:fixed; font-size:12px; font-variant-numeric:tabular-nums; }
.suite-table thead th{ text-align:left; padding:10px 11px; background:var(--paper-2); color:#6B6B6B; font-weight:700; font-size:9px; letter-spacing:.4px; text-transform:uppercase; white-space:normal; border-bottom:1px solid var(--rule); }
/* Wider first three columns, tighter toward the right for even data spacing */
.suite-table th:nth-child(1){ width:14%; }
.suite-table th:nth-child(2){ width:13%; }
.suite-table th:nth-child(3){ width:13%; }
.suite-table th:nth-child(4){ width:10%; }
.suite-table th:nth-child(5){ width:10%; }
.suite-table th:nth-child(6){ width:12%; }
.suite-table th:nth-child(7){ width:10%; }
.suite-table th:nth-child(8){ width:12%; }
.suite-table th:nth-child(9){ width:6%; }
.suite-table tbody td{ padding:11px 11px; border-bottom:1px solid var(--rule-2); color:#2A2A2A; font-weight:600; white-space:nowrap; vertical-align:middle; }
.suite-table tbody tr:last-child td{ border-bottom:0; }
.suite-table tbody tr:hover td{ background:var(--paper-2); }
.st-suite{ white-space:nowrap; }
.st-name{ font-weight:600; color:#2A2A2A; font-size:12px; }
.st-sf{ font-weight:600; color:#6B6B6B; font-size:12px; margin-left:10px; }
.st-plan-col{ text-align:right; width:52px; }
.st-plan{ display:inline-grid; place-items:center; width:30px; height:30px; border-radius:7px; border:1px solid rgba(0,30,90,.18); background:var(--accent-tint); color:var(--navy); cursor:pointer; box-shadow:var(--shadow-1); transition:background .15s var(--ease), border-color .15s, color .15s, transform .1s; }
.st-plan:hover{ background:var(--navy); border-color:var(--navy); color:#fff; }
.st-plan:active{ transform:translateY(1px); }
.st-plan svg{ width:15px; height:15px; }
.st-empty{ padding:20px; color:var(--ink-3); font-style:italic; }

/* left rail */
.spec-list{ display:flex; flex-direction:column; gap:22px; }
.spec-row{ display:flex; gap:12px; align-items:flex-start; }
.spec-row svg{ width:20px; height:20px; flex:none; margin-top:1px; }
.spec-row .sv{ font-size:15px; font-weight:700; color:var(--navy); line-height:1.2; }
.spec-row .sl{ font-size:11px; color:var(--ink-4); margin-top:2px; }
.mini-map{ margin:0 0 24px; border-radius:10px; overflow:hidden; position:relative; height:160px;
  background:#E8EFF8; background-image:radial-gradient(#D4DEEE 1px,transparent 1px); background-size:16px 16px; }
.mini-map .mm-pin{ position:absolute; left:34%; top:46%; transform:translate(-50%,-50%);
  width:26px; height:26px; border-radius:50%; background:var(--navy); box-shadow:0 0 0 3px var(--gold);
  display:grid; place-items:center; color:#fff; font-size:11px; font-weight:700; }
.mini-map .mm-label{ position:absolute; bottom:10px; right:12px; font-size:9px; letter-spacing:1.2px; color:var(--ink-4); font-weight:700; }

/* center */
.detail-hero{ border-radius:16px; overflow:hidden; position:relative; height:420px; display:grid; place-items:center;
  background:repeating-linear-gradient(45deg,#E8EFF8,#E8EFF8 11px,#EFF4FB 11px,#EFF4FB 22px); }
.detail-hero .real-photo{ width:100%; height:100%; object-fit:cover; }
.detail-hero .hero-ph{ font-size:11px; letter-spacing:1.6px; color:var(--ink-4); font-weight:700; }
.hero-nav{ position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%;
  background:#fff; box-shadow:0 2px 8px rgba(0,30,90,.15); display:grid; place-items:center; color:var(--navy); cursor:pointer; border:0; }
.hero-nav:hover{ background:var(--navy); color:#fff; }
.hero-nav.prev{ left:14px; } .hero-nav.next{ right:14px; }
.hero-counter{ position:absolute; bottom:14px; right:14px; background:#fff; border-radius:16px; padding:7px 14px;
  font-size:11px; font-weight:700; color:var(--navy); box-shadow:0 2px 8px rgba(0,30,90,.12); }
.thumbstrip{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:12px; }
.thumb{ height:104px; border-radius:10px; border:2px solid transparent; cursor:pointer; overflow:hidden;
  background-image:repeating-linear-gradient(45deg,#E8EFF8,#E8EFF8 8px,#EFF4FB 8px,#EFF4FB 16px); }
.thumb.on{ border-color:var(--navy); }
.thumb .real-photo{ width:100%; height:100%; object-fit:cover; }
.broker-note{ display:flex; align-items:center; gap:12px; margin-top:22px; font-size:14px; color:var(--ink-3); line-height:1.4; }
.broker-note .avatar{ width:34px; height:34px; flex:none; }
.broker-note b{ color:var(--navy); }

/* right rail — suite cards */
.detail-right{ display:flex; flex-direction:column; gap:16px; }
.suite-card{ border:1px solid var(--rule); border-radius:14px; background:#fff; box-shadow:var(--shadow-1); overflow:hidden; }
/* Navy header bar — suite name + SF (white, inverted) + floor-plan icon */
.suite-cardhead{ display:flex; justify-content:space-between; align-items:center; gap:12px; background:var(--navy); color:#fff; padding:11px 16px; }
.sch-id{ display:flex; align-items:center; gap:12px; min-width:0; }
.sch-name{ font-size:14px; font-weight:700; color:#fff; letter-spacing:-.1px; }
.sch-sf{ font-size:14px; font-weight:700; color:#fff; opacity:.9; white-space:nowrap;
  border-left:1px solid rgba(255,255,255,.28); padding-left:12px; }
.sch-plan{ display:inline-grid; place-items:center; width:28px; height:28px; border-radius:6px; background:rgba(255,255,255,.16); color:#fff; cursor:pointer; transition:background .15s var(--ease); }
.sch-plan:hover{ background:rgba(255,255,255,.30); }
.sch-plan svg{ width:15px; height:15px; }
/* One rent row: Base / OpEx / Total / Monthly — all same size */
.suite-metricrow{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:16px 16px 14px; }
.suite-metarow{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:14px 16px 16px; border-top:1px solid var(--rule-2); }
/* Both rows identical: category label on top, data value below, neutral
   (non-navy) colors so nothing reads as blue text. */
.sm-lbl{ font-size:9px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:#6B6B6B; margin-bottom:4px; }
.sm-val, .sm2-val{ font-size:14px; font-weight:700; color:#2A2A2A; letter-spacing:-.1px; line-height:1.2; }

/* header pager + tabs-in-detail */
.hdr-pager{ display:flex; gap:8px; }
.hdr-pill{ appearance:none; border:1px solid var(--rule); background:#fff; color:var(--ink-3); font-size:12.5px;
  font-weight:700; padding:8px 16px; border-radius:8px; cursor:pointer; white-space:nowrap; }
.hdr-pill:hover{ border-color:var(--navy); color:var(--navy); }

/* extra sections (docs + comments) below the 3-col block */
.detail-extra{ margin-top:44px; display:grid; grid-template-columns:1fr 1fr; gap:44px; align-items:start; }
.detail-extra .section{ margin-bottom:0; }
@media (max-width:1100px){ .detail-cols{ grid-template-columns:1fr; } .detail-extra{ grid-template-columns:1fr; } .detail-right{ position:static; max-height:none; overflow:visible; padding-right:0; } }


/* ══════════ COMMUTE (design 3a — table-first matrix) ══════════ */
.commute-wrap{ display:flex; flex-direction:column; flex:1; min-height:0; max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box; padding:0 36px; }
.commute-head{ display:flex; justify-content:space-between; align-items:center; padding:4px 0 16px; gap:16px; flex-wrap:wrap; }
.commute-head .eyebrow{ font-size:10.5px; font-weight:700; letter-spacing:2.2px; color:var(--bright-blue); text-transform:uppercase; }
.commute-controls{ display:flex; gap:10px; align-items:center; }
.commute-empty{ border:1px dashed var(--rule); border-radius:12px; background:var(--paper-2); padding:20px 22px; margin-bottom:14px; }
.commute-empty-icon{ font-size:20px; }
.commute-empty-title{ font-size:15px; font-weight:700; color:var(--navy); margin:6px 0 4px; }
.commute-empty-body{ font-size:12.5px; color:var(--ink-3); line-height:1.55; max-width:820px; }
.commute-wrap .split{ border-top:1px solid var(--rule); }
.commute-scroll{ flex:1; min-width:640px; overflow-y:auto; }
.commute-table{ width:100%; border-collapse:separate; border-spacing:0; }
.commute-table thead th{ text-align:left; font-size:9px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-4); font-weight:700; padding:16px 14px 10px; border-bottom:1px solid var(--rule); position:sticky; top:0; background:var(--bg); z-index:1; }
.commute-table th.c-bldg{ width:42%; } .commute-table th.c-dist{ width:26%; }
.commute-table tbody tr{ cursor:pointer; }
.commute-table tbody tr:hover td{ background:var(--paper-2); }
.commute-table tbody tr.best td{ background:var(--shortlist-tint); }
.commute-table td{ padding:14px; border-bottom:1px solid var(--rule-2); vertical-align:middle; font-size:13px; color:var(--ink-2); }
.commute-cell-bldg{ display:flex; align-items:center; gap:14px; }
.commute-photo{ width:56px; height:42px; border-radius:6px; overflow:hidden; flex:none; background:var(--paper-3); }
.commute-photo .placeholder{ font-size:9px; }
.commute-name{ font-size:14px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.commute-sub{ font-size:11px; color:var(--ink-4); margin-top:2px; }
.best-tag{ font-size:8.5px; font-weight:700; letter-spacing:.5px; color:var(--gold-ink); background:#FFF3D6; padding:2px 7px; border-radius:4px; }
.commute-table td.c-num{ font-size:15px; font-weight:700; color:var(--navy); }
.commute-table td.c-num.dash{ color:var(--ink-4); font-weight:400; }
.dist-bar{ display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--rule-2); width:100%; max-width:230px; }
.dist-bar span{ display:block; height:100%; }
.commute-legend{ display:flex; gap:18px; align-items:center; padding:14px; font-size:11px; color:var(--ink-4); flex-wrap:wrap; }
.commute-legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle; }
.commute-src{ margin-left:auto; }

/* ══════════════════════════════════════════════════════════════════════
   POLISH LAYER — appended last so it wins the cascade.
   Brand-safe: NO changes to Cresa Midnight (#001E5A) or Goldenrod (#FFB600).
   Only motion, focus, elevation, placeholder texture, and a small
   accessibility contrast nudge on the neutral UI grays.
   ══════════════════════════════════════════════════════════════════════ */

/* Shared easing token for consistent, considered motion */
:root { --ease: cubic-bezier(0.4, 0, 0.2, 1); }

/* Wider default content shell — the app was capped at 1560px, which left the
   map-view list column too narrow and clipped card text. One knob drives every
   centered container (topbar, survey header, split, detail, compare, commute). */
:root { --shell-max: 1880px; }

/* Anti-clip on the map-view property cards: let stat labels/values wrap
   gracefully instead of being hard-cut by overflow:hidden + nowrap. With the
   wider shell they rarely need to, but nothing gets chopped either way. */
.split-list .pc-stats > div { overflow: visible; }
.split-list .pc-stat-val,
.split-list .pc-stat-label { white-space: normal; }

/* A11y contrast: the lightest UI gray was ~3:1 on white for 9–11px labels.
   Nudge it darker (Cresa endorses "sufficient on-screen contrast"). This is a
   neutral UI gray, not a brand palette color. */
:root { --ink-4: #6E7891; }

/* Richer, Midnight-tinted layered elevation (shadows aren't brand palette;
   tint kept on Cresa Midnight rgb 0,30,90 for consistency) */
:root {
  --shadow-1: 0 1px 2px rgba(0,30,90,.06), 0 1px 3px rgba(0,30,90,.05);
  --shadow-2: 0 4px 14px -4px rgba(0,30,90,.12), 0 2px 6px -2px rgba(0,30,90,.08);
  --shadow-3: 0 18px 48px -12px rgba(0,30,90,.24);
}

/* Motion — subtle hover lift + real easing on interactive surfaces */
.property-card, .survey-card, .tour-card, .library-card, .doc-tile {
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease),
              transform .18s var(--ease), background .18s var(--ease);
}
.property-card:hover, .survey-card:hover, .tour-card:hover,
.library-card:hover, .doc-tile:hover { transform: translateY(-2px); }
.property-card:active, .survey-card:active { transform: translateY(0); }

.btn {
  transition: background .15s var(--ease), border-color .15s var(--ease),
              color .15s var(--ease), transform .12s var(--ease), box-shadow .15s var(--ease);
}
.btn:not(.ghost):hover { transform: translateY(-1px); box-shadow: var(--shadow-1); }
.btn:active { transform: translateY(0); box-shadow: none; }

/* Staggered entrance for the broker dashboard grid (plays on mount /
   filter change; scoped to the home grid to avoid re-render replays) */
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.survey-grid > * { animation: cardIn .4s var(--ease) both; }
.survey-grid > *:nth-child(2){ animation-delay:.04s }
.survey-grid > *:nth-child(3){ animation-delay:.08s }
.survey-grid > *:nth-child(4){ animation-delay:.12s }
.survey-grid > *:nth-child(5){ animation-delay:.16s }
.survey-grid > *:nth-child(6){ animation-delay:.20s }
.survey-grid > *:nth-child(n+7){ animation-delay:.24s }

/* Focus-visible — crisp Midnight ring for keyboard users (brand navy = --accent) */
:where(button, a, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 5px;
}
.comment-input:focus-visible, .home-search input:focus-visible { outline: none; }

/* Placeholder imagery — soft diagonal gradient reads intentional vs. the
   wireframe stripes (uses neutral paper grays only) */
.placeholder {
  background: linear-gradient(135deg, var(--paper-2) 0%, var(--paper-3) 100%);
}

/* Sticky compare header gets a hairline elevation when the table scrolls */
.compare-table thead th { position: sticky; top: 0; z-index: 2; }
.compare-row-label { box-shadow: 1px 0 0 var(--rule); }

/* Compare view — larger, consistent table typography. Data cells, the left
   axis labels, and the Shortlist/Pass row all share the same UI font (Inter)
   so nothing reads as a different typeface. */
.compare-table th, .compare-table td { font-size: 14px; }
.compare-table .compare-row-label { font-family: var(--sans) !important; font-size: 12px !important; }
.compare-table .vote-btn { font-family: var(--sans); font-size: 13px; }
.compare-name { font-size: 15px; }
.compare-addr { font-size: 12px; }

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .property-card:hover, .survey-card:hover, .tour-card:hover,
  .library-card:hover, .doc-tile:hover, .btn:hover { transform: none; }
}

  const row = (mv.rows || []).find(r => re.test(r.label || ''));

/* ============================================================================
   THE GATE (kept from portal v1 — the only part of v1 that survives)
   token → anonymous auth → participant doc → survey read. The access check is
   server-side, in the rules; this just walks the path.
   ============================================================================ */
function useSurvey() {
  if (PREVIEW) return { phase: 'ready', sid: '__preview__', uid: '__me__', record: PREVIEW_RECORD, preview: true };
  const [state, setState] = React.useState({ phase: 'loading' });
  React.useEffect(() => {
    let unsub = null;
    (async () => {
      try {
        // Token can arrive as ?s=… or #s=… (hash survives more link-mangling),
        // or as a bare 48-hex string in either. Belt and suspenders — email
        // clients and chat apps love truncating URLs at the '?'.
        const findToken = () => {
          for (const raw of [location.search.slice(1), location.hash.slice(1)]) {
            const qs = new URLSearchParams(raw);
            if (qs.get('s')) return qs.get('s');
            const m = raw.match(/[0-9a-f]{48}/i);
            if (m) return m[0];
          }
          return null;
        };
        const token = findToken();
        if (!token) {
          setState({ phase: 'error', title: 'Missing link token',
            message: 'The link that opened this page arrived without its access code — it was probably cut off at the “?” when copied. Ask your broker to resend it, and copy the whole line.',
            hint: 'This page received: ' + (location.pathname + location.search + location.hash || '/') });
          return;
        }
        const cred = await auth.signInAnonymously();
        const uid = cred.user.uid;   // persists per-origin — revisits reuse it

        const tokSnap = await db.collection('shareTokens').doc(token).get();
        if (!tokSnap.exists) { setState({ phase: 'error', title: 'Link not recognized', message: 'This link is no longer valid. Ask your broker for a fresh one.' }); return; }
        const tok = tokSnap.data();
        const sid = tok.surveyId;
        const savedName = localStorage.getItem('cresaPortalName.v1') || '';
        const pRef = db.collection('surveys').doc(sid).collection('participants').doc(uid);

        /* REVISIT-FIRST. A participant doc grants the read for as long as it
           exists — by rules design, revoking/expiring a token stops NEW joins;
           the broker deletes participant docs to kick someone. So membership is
           checked BEFORE token liveness, and the doc is never rewritten with a
           different viaToken (the update rule forbids it — this was the v2.0
           bug that locked out anyone who had opened an earlier link on the
           same browser). */
        const pSnap = await pRef.get();
        if (pSnap.exists) {
          // Best-effort lastSeen bump. Allowed only while the ORIGINAL token is
          // still live; a failure here must never block the read.
          pRef.set({ lastSeenAt: TS(), name: savedName || pSnap.data().name || '' }, { merge: true }).catch(() => {});
        } else {
          if (tok.revoked) { setState({ phase: 'error', title: 'Link revoked', message: 'Access through this link has been turned off. Ask your broker for a new link.' }); return; }
          if (tok.expiresAt && tok.expiresAt.toMillis() < Date.now()) { setState({ phase: 'error', title: 'Link expired', message: 'This link has expired. Ask your broker for a new one.' }); return; }
          await pRef.set({
            uid, role: tok.role || 'client', name: savedName, email: '',
            viaToken: token,
            joinedAt: TS(), lastSeenAt: TS(),
          });
        }

        unsub = db.collection('surveys').doc(sid).onSnapshot(
          snap => {
            if (!snap.exists) { setState({ phase: 'error', title: 'Survey unavailable', message: 'This survey is no longer available.' }); return; }
            setState({ phase: 'ready', sid, uid, record: snap.data() });
          },
          err => setState({ phase: 'error', title: 'Could not open survey', message: err.message })
        );
      } catch (e) {
        setState({ phase: 'error', title: 'Could not open survey', message: (e && e.message) || String(e) });
      }
    })();
    return () => { if (unsub) unsub(); };
  }, []);
  return state;
}

   INTERACTIONS (build step 3 write paths, degrade-to-read-only)
   ----------------------------------------------------------------------------
   votes/{pid}__{uid}  and  comments/{autoId} per the spec. The CURRENTLY
   published rules deny these subcollections; until the step-3 rules delta is
   published the subscriptions fail with permission-denied and `enabled`
   flips false — vote buttons and the comment composer simply don't render.
   Publish the delta and they light up with no code change.
   ============================================================================ */
function useVotes(sid, uid) {
  const [state, setState] = React.useState({ enabled: false, mine: {}, tally: {} });
  React.useEffect(() => {
    if (!sid) return;
    const compute = (voteDocs) => {
      const mine = {}, tally = {};
      voteDocs.forEach(v => {
        if (!v || !v.pid) return;
        if (v.uid === uid) mine[v.pid] = v.vote || null;
        if (v.vote === 'up' || v.vote === 'down') {
          tally[v.pid] = tally[v.pid] || { up: 0, down: 0 };
          tally[v.pid][v.vote]++;
        }
      });
      setState({ enabled: true, mine, tally });
    };
    if (PREVIEW) {
      const push = () => compute(Object.values(_pv.votes));
      push();
      return _pv.sub(push);
    }
    const unsub = db.collection('surveys').doc(sid).collection('votes').onSnapshot(
      snap => { const docs = []; snap.forEach(d => docs.push(d.data())); compute(docs); },
      () => setState({ enabled: false, mine: {}, tally: {} })   // permission-denied → read-only
    );
    return unsub;
  }, [sid, uid]);
  return state;
}

function useComments(sid) {
  const [state, setState] = React.useState({ enabled: false, byPid: {} });
  React.useEffect(() => {
    if (!sid) return;
    const compute = (docs) => {
      const byPid = {};
      docs.forEach(({ id, c }) => {
        if (!c) return;
        const pid = c.pid || '__survey__';
        (byPid[pid] = byPid[pid] || []).push({
          id, author: c.authorName || 'Client', author_type: c.authorType || 'client',
          initials: initialsOf(c.authorName) || (c.authorType === 'broker' ? 'B' : 'C'),
          body: c.body, ts: fmtWhen(c.at),
        });
      });
      setState({ enabled: true, byPid });
    };
    if (PREVIEW) {
      const push = () => compute(_pv.comments.map(c => ({ id: c.id, c })));
      push();
      return _pv.sub(push);
    }
    const unsub = db.collection('surveys').doc(sid).collection('comments').orderBy('at').onSnapshot(
      snap => { const docs = []; snap.forEach(d => docs.push({ id: d.id, c: d.data() })); compute(docs); },
      () => setState({ enabled: false, byPid: {} })
    );
    return unsub;
  }, [sid]);
  return state;
}

function useActivity(sid) {
  const [rows, setRows] = React.useState([]);
  React.useEffect(() => {
    if (!sid) return;
    if (PREVIEW) {
      setRows([{ id: 'a1', type: 'created', who: 'Grant Mehlhoff', detail: 'Published this survey with 3 properties', when: fmtWhen({ toDate: () => new Date() }) }]);
      return;
    }
    const unsub = db.collection('surveys').doc(sid).collection('activity').orderBy('at').limitToLast(100).onSnapshot(
      snap => {
        const out = [];
        snap.forEach(d => {
          const a = d.data(); if (!a) return;
          out.push({ id: d.id, type: a.type, who: a.actorName || 'Someone', detail: a.detail || '', when: fmtWhen(a.at) });
        });
        setRows(out);
      },
      () => setRows([])
    );
    return unsub;
  }, [sid]);
  return rows;
}

/* One-time display name — shown on votes/comments the broker sees. */
function ensureName() {
  let name = localStorage.getItem('cresaPortalName.v1') || '';
  if (!name) {
    name = (window.prompt('Your name (shown with your comments and votes):') || '').trim();
    if (name) localStorage.setItem('cresaPortalName.v1', name);
  }
  return name;
}

async function castVote(sid, uid, pid, value) {
  if (PREVIEW) {
    _pv.votes[`${pid}__${uid}`] = { pid, uid, vote: value, role: 'client' };
    _pv.notify();
    return;
  }
  const name = ensureName();
  const batch = db.batch();
  batch.set(db.collection('surveys').doc(sid).collection('votes').doc(`${pid}__${uid}`),
    { pid, uid, vote: value, role: 'client', at: TS() });
  batch.set(db.collection('surveys').doc(sid).collection('activity').doc(),
    { type: value === 'up' ? 'vote_up' : value === 'down' ? 'vote_down' : 'vote_cleared',
      actorUid: uid, actorName: name || 'Client', pid, target: null,
      detail: value === 'up' ? 'shortlisted a property' : value === 'down' ? 'discarded a property' : 'cleared a vote',
      at: TS() });
  // Keep the participant doc's name in sync (rules allow: role/viaToken unchanged).
  await batch.commit();
}

async function addComment(sid, uid, pid, body) {
  if (PREVIEW) {
    _pv.comments.push({ id: 'c' + Date.now(), pid, body, authorName: ensureName() || 'You', authorType: 'client', at: { toDate: () => new Date() } });
    _pv.notify();
    return;
  }
  const name = ensureName();
  const batch = db.batch();
  batch.set(db.collection('surveys').doc(sid).collection('comments').doc(),
    { pid, body, authorUid: uid, authorName: name || 'Client', authorType: 'client', at: TS() });
  batch.set(db.collection('surveys').doc(sid).collection('activity').doc(),
    { type: 'comment', actorUid: uid, actorName: name || 'Client', pid, target: null,
      detail: 'commented on a property', at: TS() });
  await batch.commit();
}

Object.assign(window, {
  db, auth, cdnImg, floorplanImg, initialsOf, fmtWhen,
  adaptRecord, mvPremises, mvByLabel,
  useSurvey, useVotes, useComments, useActivity,
  castVote, addComment,
});
</script>

<script type="text/babel" data-presets="react">
// Real Google Map of Houston using the exact cresaStyles array from the
// Cresa Houston Law Firm Database. This is a 1:1 port of the styled map
// type — cool blue-tinted land (#F2F4F8), navy highway accents (#001E5A),
// muted sage parks (#D8E2D6), light blue water (#C9D9EC).

// Exact cresaStyles array — copied verbatim from the Cresa reference file
// so the base map renders identically.
const CRESA_STYLES = [
  { elementType: 'geometry', stylers: [{ color: '#F2F4F8' }] },
  { elementType: 'labels.text.fill', stylers: [{ color: '#5A6580' }] },
  { elementType: 'labels.text.stroke', stylers: [{ color: '#FFFFFF' }, { weight: 3 }] },
  { elementType: 'labels.icon', stylers: [{ visibility: 'off' }] },
  { featureType: 'administrative', elementType: 'geometry.stroke', stylers: [{ color: '#C6CDD9' }, { weight: 0.8 }] },
  { featureType: 'administrative.locality', elementType: 'labels.text.fill', stylers: [{ color: '#2B3350' }, { weight: 600 }] },
  { featureType: 'administrative.neighborhood', elementType: 'labels.text.fill', stylers: [{ color: '#5A6580' }] },
  { featureType: 'landscape.natural', elementType: 'geometry', stylers: [{ color: '#EBEEF4' }] },
  { featureType: 'landscape.man_made', elementType: 'geometry', stylers: [{ color: '#F2F4F8' }] },
  { featureType: 'poi.park', elementType: 'geometry', stylers: [{ color: '#D8E2D6' }] },
  { featureType: 'poi.park', elementType: 'labels.text.fill', stylers: [{ color: '#5A7562' }] },
  { featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] },
  { featureType: 'poi.business', stylers: [{ visibility: 'off' }] },
  { featureType: 'transit', stylers: [{ visibility: 'off' }] },
  { featureType: 'road', elementType: 'geometry.fill', stylers: [{ color: '#FFFFFF' }] },
  { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#E4E8F0' }, { weight: 0.5 }] },
  { featureType: 'road.highway', elementType: 'geometry.fill', stylers: [{ color: '#D6DDEA' }] },
  { featureType: 'road.highway', elementType: 'geometry.stroke', stylers: [{ color: '#001E5A' }, { weight: 0.6 }] },
  { featureType: 'road.highway.controlled_access', elementType: 'geometry.fill', stylers: [{ color: '#C9D2E2' }] },
  { featureType: 'road.highway', elementType: 'labels.text.fill', stylers: [{ color: '#001E5A' }] },
  { featureType: 'road.arterial', elementType: 'geometry.fill', stylers: [{ color: '#FFFFFF' }] },
  { featureType: 'road.arterial', elementType: 'labels.text.fill', stylers: [{ color: '#2B3350' }] },
  { featureType: 'road.local', elementType: 'labels.text.fill', stylers: [{ color: '#5A6580' }] },
  { featureType: 'water', elementType: 'geometry.fill', stylers: [{ color: '#C9D9EC' }] },
  { featureType: 'water', elementType: 'labels.text.fill', stylers: [{ color: '#001E5A' }] },
  { featureType: 'water', elementType: 'labels.text.stroke', stylers: [{ color: '#C9D9EC' }, { weight: 2 }] },
];

// Custom OverlayView class that renders an arbitrary HTML element at a lat/lng.
// Defined lazily because google.maps.OverlayView only exists once the API has
// loaded — we instantiate the class inside the component, after the API is
// confirmed available.
function makeHtmlMarkerClass(google) {
  return class HtmlMarker extends google.maps.OverlayView {
    constructor(position, html, handlers) {
      super();
      this._position = position;
      this._html = html;
      this._handlers = handlers || {};
      this._div = null;
    }
    onAdd() {
      const div = document.createElement('div');
      div.style.position = 'absolute';
      div.style.cursor = 'pointer';
      div.style.zIndex = '2';
      div.innerHTML = this._html;
      if (this._handlers.onClick) {
        div.addEventListener('click', (e) => { e.stopPropagation(); this._handlers.onClick(); });
      }
      if (this._handlers.onDblClick) {
        div.addEventListener('dblclick', (e) => { e.stopPropagation(); this._handlers.onDblClick(); });
      }
      this._div = div;
      this.getPanes().overlayMouseTarget.appendChild(div);
    }
    draw() {
      const proj = this.getProjection();
      if (!proj || !this._div) return;
      const point = proj.fromLatLngToDivPixel(this._position);
      // Pin's iconAnchor is bottom-center; offset accordingly. Width/height
      // correspond to our .map-pin shape (~32x38 with selected expanded).
      this._div.style.left = (point.x - 16) + 'px';
      this._div.style.top  = (point.y - 36) + 'px';
    }
    onRemove() {
      if (this._div && this._div.parentNode) this._div.parentNode.removeChild(this._div);
      this._div = null;
    }
    setHtml(html) {
      this._html = html;
      if (this._div) this._div.innerHTML = html;
    }
    setPosition(position) {
      this._position = position;
      if (this._div) this.draw();
    }
  };
}

function pinHtml(idx, isSelected, name, isShort) {
  const cls = 'map-pin' + (isShort ? ' short' : '') + (isSelected ? ' selected' : '');
  const title = String(name || '').replace(/"/g, '&quot;');
  return `<div class="${cls}" title="${title}"><div class="map-pin-body"><span class="map-pin-num">${idx + 1}</span></div></div>`;
}

function MapView({ buildings, selectedId, onSelect, onOpen, statuses, mode }) {
  const containerRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const markersRef = React.useRef({}); // id -> HtmlMarker instance
  const [apiReady, setApiReady] = React.useState(!!(window.google && window.google.maps));
  // 'cresa' = the styled cool-blue base map; 'hybrid' = Google's satellite +
  // labels imagery. Switching is via setMapTypeId in the effect below.
  const [mapType, setMapType] = React.useState('cresa');

  // Wait for the Google Maps API to load. The bundle.py loader fires a
  // global event once the SDK is ready; we also poll briefly as a fallback
  // in case the script was already loaded before this component mounted.
  React.useEffect(() => {
    if (apiReady) return;
    const handler = () => setApiReady(true);
    window.addEventListener('cresa-gmaps-loaded', handler);
    const interval = setInterval(() => {
      if (window.google && window.google.maps) {
        setApiReady(true);
        clearInterval(interval);
      }
    }, 200);
    return () => {
      window.removeEventListener('cresa-gmaps-loaded', handler);
      clearInterval(interval);
    };
  }, [apiReady]);

  // Initialize the map once the API is ready.
  React.useEffect(() => {
    if (!apiReady || !containerRef.current || mapRef.current) return;
    const google = window.google;
    const map = new google.maps.Map(containerRef.current, {
      center: { lat: 29.755, lng: -95.43 },
      zoom: 11,
      zoomControl: true,
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false,
      gestureHandling: 'greedy',
      zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_BOTTOM },
      minZoom: 6,
      maxZoom: 20,
      // Map-level styles — applied to the built-in hybrid type so it stays
      // visually quiet (no POI clutter). The custom 'cresa' StyledMapType
      // below has its own full style array so this is ignored in cresa mode.
      styles: [
        { featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] },
        { featureType: 'poi.business', stylers: [{ visibility: 'off' }] },
      ],
    });
    const styledMap = new google.maps.StyledMapType(CRESA_STYLES, { name: 'Map' });
    map.mapTypes.set('cresa', styledMap);
    map.setMapTypeId('cresa');
    mapRef.current = map;

    return () => {
      Object.values(markersRef.current).forEach(m => m.setMap(null));
      markersRef.current = {};
      mapRef.current = null;
    };
  }, [apiReady]);

  // Sync map type when toggle changes ('cresa' = styled blue, 'hybrid' = satellite + labels)
  React.useEffect(() => {
    if (!mapRef.current) return;
    mapRef.current.setMapTypeId(mapType);
  }, [mapType, apiReady]);

  // Render / update markers whenever buildings, selection, or vote status change.
  // Diff against the existing markers map and create/remove only what changed.
  React.useEffect(() => {
    const map = mapRef.current;
    if (!map || !window.google) return;
    const google = window.google;
    const HtmlMarker = makeHtmlMarkerClass(google);

    const seen = new Set();
    buildings.forEach((b, i) => {
      seen.add(b.id);
      const isSelected = b.id === selectedId;
      const isShort = statuses && statuses[b.id] && statuses[b.id].vote === 'up';
      const html = pinHtml(i, isSelected, b.name, isShort);
      const position = new google.maps.LatLng(b.lat, b.lng);

      let marker = markersRef.current[b.id];
      if (!marker) {
        marker = new HtmlMarker(position, html, {
          onClick: () => onSelect(b.id),
          onDblClick: () => onOpen && onOpen(b.id),
        });
        marker.setMap(map);
        markersRef.current[b.id] = marker;
      } else {
        marker.setHtml(html);
        marker.setPosition(position);
      }
    });

    Object.keys(markersRef.current).forEach(id => {
      if (!seen.has(id)) {
        markersRef.current[id].setMap(null);
        delete markersRef.current[id];
      }
    });
  }, [buildings, selectedId, statuses, mode, onSelect, onOpen, apiReady]);

  // Pan to selected pin so it stays visible as the user navigates the list
  React.useEffect(() => {
    const map = mapRef.current;
    if (!map || !selectedId || !window.google) return;
    const b = buildings.find(x => x.id === selectedId);
    if (b) map.panTo({ lat: b.lat, lng: b.lng });
  }, [selectedId, buildings]);

  return (
    <div className="split-map">
      <div ref={containerRef} className="cresa-gmap" />
      {!apiReady && (
        <div className="map-loading">
          <div className="mono-tag">Loading map…</div>
          <div style={{fontSize:11, color:'var(--ink-3)', marginTop:8, lineHeight:1.5}}>
            If this persists, the Google Maps API key may be domain-restricted.
            Edit <code style={{background:'var(--paper-2)', padding:'2px 6px', borderRadius:3}}>GOOGLE_MAPS_API_KEY</code> at the top of the file.
          </div>
        </div>
      )}
      {apiReady && (
        <div className="map-type-toggle">
          <button
            className={'map-type-btn' + (mapType === 'cresa' ? ' active' : '')}
            onClick={() => setMapType('cresa')}
          >Map</button>
          <button
            className={'map-type-btn' + (mapType === 'hybrid' ? ' active' : '')}
            onClick={() => setMapType('hybrid')}
          >Hybrid</button>
        </div>
      )}
      <div className="map-legend">
