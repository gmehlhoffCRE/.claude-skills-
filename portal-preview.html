<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cresa — Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* Meridian CRE — survey tool styles */

:root {
  /* === MERIDIAN — Cresa-aligned navy + gold enterprise palette === */
  /* Surfaces — cool blue-tinted off-white bg, white cards on top (Cresa signature) */
  --paper: #FFFFFF;        /* card / surface white */
  --paper-2: #F4F7FC;      /* Cresa blue-softer — subtle layer */
  --paper-3: #E8EFF8;      /* Cresa blue-soft — input/photo bg */
  --paper-card: #FFFFFF;   /* cards are white */
  --bg: #F6F7FB;           /* page background — cool blue-tinted off-white */

  /* Ink — deep navy-ink hierarchy */
  --ink: #0E1220;
  --ink-2: #2B3350;
  --ink-3: #5A6580;
  --ink-4: #8A93A8;

  /* Rules / dividers — cool blue-tinted */
  --rule: #E4E8F0;
  --rule-2: #EEF1F6;

  /* Brand */
  --navy: #001E5A;
  --navy-dark: #001545;
  --navy-light: #0A2D6E;
  --navy-700: #14316B;
  --navy-tint: #E8EFF8;

  /* Primary accent (navy) — used everywhere --accent appears */
  --accent: var(--navy);
  --accent-2: var(--navy-light);
  --accent-tint: var(--navy-tint);

  /* Warm secondary (gold) — sparingly, for highlights/badges */
  --gold: #FFB600;
  --bright-blue: #0056DA;   /* secondary text accent (was gold in some places) */
  --gold-soft: #FFE9B0;
  --amber: #FFB600;
  --amber-tint: #FFE9B0;
  --amber-ink: #8A5C00;

  /* Semantic */
  --rose: #C93B3B;
  --rose-tint: #FBE8E8;
  --green: #1B8F6A;
  --green-tint: #DCEFE6;
  --warn: #B54708;
  --blue-accent: #2E6CC7;

  /* Soft blue-tinted shadows (Cresa) */
  --shadow-1: 0 1px 2px rgba(0,30,90,0.05), 0 1px 3px rgba(0,30,90,0.04);
  --shadow-2: 0 2px 6px rgba(0,30,90,0.06), 0 6px 20px rgba(0,30,90,0.08);
  --shadow-3: 0 10px 40px rgba(0,30,90,0.18);

  /* Type — Inter for UI (screen-optimized grotesque that mirrors Helvetica's
     neutral character), JetBrains Mono for technical data (timestamps, tags,
     coordinates, codes). Helvetica Neue/Helvetica remain as fallbacks so the
     brand's Swiss-grotesque look survives even if Inter fails to load. */
  --serif: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --sans: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* Original warm-paper palette is kept as an opt-in theme */
[data-theme="paper"] {
  --paper: #FAF8F3;
  --paper-2: #F2EFE8;
  --paper-3: #E8E4D9;
  --paper-card: #FAF8F3;
  --ink: #14161A;
  --ink-2: #3A3D44;
  --ink-3: #6B6E76;
  --ink-4: #9A9CA3;
  --rule: #DAD5C8;
  --rule-2: #E8E4D9;
  --accent: oklch(0.48 0.08 195);
  --accent-2: oklch(0.62 0.10 195);
  --accent-tint: oklch(0.94 0.02 195);
  --amber: oklch(0.72 0.13 75);
  --amber-tint: oklch(0.95 0.04 75);
  --amber-ink: oklch(0.42 0.10 75);
  --rose: oklch(0.58 0.13 25);
  --rose-tint: oklch(0.95 0.03 25);
  --green: oklch(0.55 0.10 155);
  --green-tint: oklch(0.93 0.04 155);
  --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

[data-theme="charcoal"] {
  --paper: #0E1220;
  --paper-2: #181D31;
  --paper-3: #232944;
  --paper-card: #181D31;
  --ink: #F4F6FB;
  --ink-2: #C9CEE0;
  --ink-3: #8A93A8;
  --ink-4: #5A6580;
  --rule: #2A3149;
  --rule-2: #1F2540;
  --accent: #5A8DEE;
  --accent-2: #8AB0F5;
  --accent-tint: #1E2A4D;
  --amber: #E0A93A;
  --amber-tint: #3A2D14;
  --amber-ink: #FBC97A;
  --rose: #E36B6B;
  --rose-tint: #3A1F22;
  --green: #4FB893;
  --green-tint: #14302A;
}

[data-theme="forest"] {
  --paper: #F4F2EC;
  --paper-2: #EAE8E0;
  --paper-3: #DEDBD0;
  --paper-card: #FFFFFF;
  --rule: #D8D4C6;
  --rule-2: #E5E2D6;
  --accent: #1F4D3A;
  --accent-2: #2E6B53;
  --accent-tint: #DCE8E1;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg, var(--paper));
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

/* Tabular (monospaced) figures for all numeric displays so columns of SF,
   rent, and stats align digit-for-digit — reads as precise/engineered. */
.stat-num, .metric-val, .pc-stat-val, .info-val, .counter-pill .num,
.space-head .sf, .survey-card-stats .stat-num, .detail-vote-row,
.compare-val, .metric-val .unit, .pc-stat-val .unit, .info-val .unit {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Wrapper for full-page routes (detail, broker-home) that fills the
   remaining viewport space below the topbar and scrolls internally.
   The survey-list route has its own internal scroll (the cards column)
   so it isn't wrapped in this. */
.route-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
/* Variant for routes that manage their own scroll regions internally
   (detail page has a left column for property info and a right rail
   for comments, each with its own scrollbar). */
.route-fixed {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: var(--paper-card);
}

/* Top bar / brand — Cresa header pattern (60px tall, white, subtle navy-tinted shadow) */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  height: 60px;
  border-bottom: 1px solid var(--rule);
  background: var(--paper-card);
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 1px 0 rgba(0,30,90,0.03);
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 16px;
}
.brand-logo {
  height: 22px;
  width: auto;
  display: block;
  flex-shrink: 0;
}
.brand-name {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.1px;
  line-height: 1.1;
  text-transform: none;
  color: var(--navy);
}
.brand-divider {
  width: 1px; height: 28px; background: var(--rule);
  margin: 0 2px;
}
.brand-context {
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 600;
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  line-height: 1.1;
  margin-top: 2px;
}

.topbar-right {
  display: flex; align-items: center; gap: 14px;
}

/* Tabs that live in the topbar (List view / Compare side by side).
   Uses the same gold-soft active treatment as the map-type-toggle for consistency. */
.topbar-tabs {
  display: flex;
  gap: 4px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 3px;
}
.topbar-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border-radius: 4px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.1px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}
.topbar-tab:hover { background: var(--bg); }
.topbar-tab.active {
  border-color: var(--gold);
  background: rgba(255, 182, 0, 0.12);
  color: var(--navy);
}
.topbar-tab .count {
  display: inline-grid;
  place-items: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 9px;
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-3);
  letter-spacing: 0;
}
.topbar-tab.active .count {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

/* Mode toggle — Cresa view-btn pattern */
.mode-toggle {
  display: inline-flex;
  gap: 6px;
  background: transparent;
  border: 0;
  padding: 0;
  border-radius: 0;
}
.mode-toggle button {
  appearance: none;
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--rule);
  background: var(--paper-card);
  color: var(--ink-2);
  border-radius: 6px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.1px;
  text-transform: none;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.mode-toggle button:hover { border-color: var(--ink-4); }
.mode-toggle button.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.mode-toggle button.active:hover { background: var(--accent-2); border-color: var(--accent-2); }

/* Avatar */
.avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px;
  font-weight: 600;
  background: var(--accent);
  color: white;
  font-family: var(--mono);
}
.avatar.client { background: var(--amber); color: var(--ink); }
.avatar.broker { background: var(--accent); color: white; }
.avatar.lg { width: 32px; height: 32px; font-size: 12px; }

/* Survey header */
.survey-header {
  padding: 24px 28px 18px;
  border-bottom: 1px solid var(--rule);
  background: var(--paper-card);
}
.survey-header .eyebrow {
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 10px;
}
.survey-title {
  font-family: var(--sans);
  font-size: clamp(22px, 2.4vw, 28px);
  line-height: 1.15;
  letter-spacing: -0.6px;
  font-weight: 700;
  margin: 0 0 6px;
  max-width: 100%;
  text-wrap: balance;
  color: var(--navy);
}
.survey-title em {
  font-style: normal;
  font-weight: 400;
  color: var(--ink-3);
}
.survey-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  row-gap: 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
  font-family: var(--sans);
  letter-spacing: -0.1px;
  flex-wrap: wrap;
  clear: both;
}
.survey-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-4); }
.survey-meta .pill {
  background: var(--paper-card);
  border: 1px solid var(--rule);
  padding: 3px 10px;
  border-radius: 14px;
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: -0.1px;
}

/* Tabs */
.tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 28px;
  border-bottom: 1px solid var(--rule);
  background: var(--paper-card);
}
.tab {
  appearance: none;
  background: transparent;
  border: 0;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: -0.1px;
  padding: 13px 14px 11px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  margin-bottom: -1px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: color 0.15s;
}
.tab:hover { color: var(--ink-2); }
.tab .count {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  padding: 1px 7px;
  border-radius: 9px;
  color: var(--ink-3);
  letter-spacing: 0.3px;
}
.tab.active {
  color: var(--navy);
  border-bottom-color: var(--navy);
}
.tab.active .count { background: var(--navy); color: #fff; border-color: var(--navy); }

/* Aggregate-summary stat strip — replaces the bottom tab row when the tabs
   live in the topbar. Three metric tiles (Premises SF, Gross rent, Monthly)
   showing ranges across all visible buildings, plus the Export button. */
.survey-metrics {
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 12px 28px;
  border-bottom: 1px solid var(--rule);
  background: var(--paper-card);
  flex-shrink: 0;
}
.survey-metrics .metric {
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: relative;
  padding-right: 28px;
}
.survey-metrics .metric:not(:last-of-type)::after {
  content: '';
  position: absolute;
  right: 0; top: 4px; bottom: 4px;
  width: 1px;
  background: var(--rule-2);
}
.metric-label {
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink-4);
}
.metric-val {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.1px;
  white-space: nowrap;
}
.metric-val .unit {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-4);
  margin-left: 3px;
}

/* Buttons — Cresa .btn dimensions */
.btn {
  appearance: none;
  background: var(--accent);
  color: #fff;
  border: 1px solid var(--accent);
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.1px;
  height: 34px;
  padding: 0 14px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: transparent; }
.btn.ghost:hover { background: var(--paper-2); color: var(--ink); }
.btn.subtle { background: var(--paper-card); border-color: var(--rule); color: var(--ink-2); }
.btn.subtle:hover { background: var(--paper-2); border-color: var(--ink-4); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 11.5px; }
.btn.icon { padding: 0 9px; width: 34px; }
.btn.sm.icon { width: 28px; padding: 0; }

/* Vote buttons */
.vote-group {
  display: inline-flex;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--paper);
  overflow: hidden;
}
.vote-btn {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 9px 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.04em;
  transition: all 0.12s ease;
}
.vote-btn + .vote-btn { border-left: 1px solid var(--rule); }
.vote-btn:hover { background: var(--paper-2); color: var(--ink); }
.vote-btn.up.active { background: #FFB600; color: #1a1300; }
.vote-btn.down.active { background: #FFB600; color: #1a1300; }
.vote-btn svg { width: 15px; height: 15px; }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 500;
}
.badge.submarket { background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--rule); }
.badge.interested { background: var(--accent-tint); color: var(--accent); }
.badge.passed { background: var(--rose-tint); color: var(--rose); }
.badge.novote { background: var(--paper-2); color: var(--ink-3); }
.badge.active { background: var(--green-tint); color: var(--green); }
.badge.draft { background: var(--paper-2); color: var(--ink-3); }
.badge.archived { background: var(--paper-2); color: var(--ink-4); }
.badge.dot::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* Density */
[data-density="comfortable"] .card { padding: 18px; }
[data-density="comfortable"] .property-card { gap: 18px; }
[data-density="compact"] .card { padding: 12px; }
[data-density="compact"] .property-card { gap: 12px; }

/* Layout: split list + map */
.split {
  display: grid;
  grid-template-columns: 704px 1fr;
  flex: 1;
  min-height: 0;
}
.split-list {
  border-right: 1px solid var(--rule);
  overflow-y: auto;
  padding: 18px 20px 32px;
  background: var(--bg);
}
.split-map {
  position: relative;
  background: var(--paper-3);
  overflow: hidden;
}

/* Property card (list view) */
.property-card {
  display: grid;
  grid-template-columns: 112px 1fr auto;
  gap: 14px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--rule);
  background: var(--paper-card);
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  position: relative;
  box-shadow: var(--shadow-1);
}
.property-card:hover {
  border-color: var(--ink-4);
  box-shadow: var(--shadow-2);
}
.property-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,30,90,0.08), var(--shadow-2);
}
.property-card.eliminated { opacity: 0.55; }

.pc-photo {
  position: relative;
  height: 100px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--paper-3);
}
.pc-num {
  position: absolute;
  top: 6px; left: 6px;
  width: 22px; height: 22px;
  border-radius: 4px;
  background: var(--accent);
  color: #fff;
  display: grid; place-items: center;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -0.2px;
  z-index: 2;
}

.pc-body {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.pc-name-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.pc-name {
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.2;
  letter-spacing: -0.005em;
  font-weight: 700;
  color: var(--ink);
}
.pc-addr {
  font-size: 12px;
  color: var(--ink-3);
  font-family: var(--mono);
}
.pc-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px 14px;
  margin-top: 4px;
  padding-top: 8px;
  border-top: 1px solid var(--rule-2);
}
.pc-stat-label {
  font-family: var(--sans);
  font-size: 9px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 2px;
  white-space: nowrap;
  font-weight: 600;
}
.pc-stat-val {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.1px;
  color: var(--ink-2);
  white-space: nowrap;
}
.pc-stat-val .unit {
  font-family: var(--sans);
  font-size: 10px;
  color: var(--ink-4);
  margin-left: 2px;
  font-weight: 600;
}
.pc-name {
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.2;
  letter-spacing: -0.1px;
  font-weight: 700;
  color: var(--navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pc-addr {
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}

.pc-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  justify-content: space-between;
  flex-shrink: 0;
}
/* Compact vote group inside property cards */
.pc-actions .vote-group .vote-btn { padding: 6px 8px; }
.pc-actions .vote-group .vote-btn span { display: none; }

/* Striped placeholder image */
.placeholder {
  width: 100%;
  height: 100%;
  background:
    repeating-linear-gradient(135deg,
      var(--paper-2) 0px,
      var(--paper-2) 6px,
      var(--paper-3) 6px,
      var(--paper-3) 12px);
  display: grid;
  place-items: center;
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.placeholder.lg { font-size: 11px; }

/* Map */
.map-bg {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 1px 1px, var(--ink-4) 1px, transparent 0);
  background-size: 14px 14px;
  opacity: 0.25;
}
.map-overlay {
  position: absolute; inset: 0;
}
/* Map pins — plain navy circles; the selected one turns Cresa gold.
   (Was the demo's numbered teardrop.) Circles anchor at their center. */
.map-pin {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 2;
}
.map-pin.selected { z-index: 3; }
.map-pin-body {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--navy);
  border: 2px solid #fff;
  box-shadow: 0 3px 8px -2px rgba(0,0,0,0.35);
  display: grid;
  place-items: center;
  transition: all 0.15s ease;
}
.map-pin-num {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  line-height: 1;
}
.map-pin.selected .map-pin-body {
  width: 28px; height: 28px;
  background: var(--gold);
  border-color: var(--navy);
}
.map-pin.selected .map-pin-num { color: var(--navy); }
.map-pin:hover .map-pin-body { transform: scale(1.2); }

.map-label {
  position: absolute;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-4);
  pointer-events: none;
  user-select: none;
}
.map-road {
  position: absolute;
  background: var(--paper-3);
  pointer-events: none;
}
.map-water {
  position: absolute;
  background: var(--accent-tint);
  border-radius: 40% 60% 50% 70%;
  opacity: 0.35;
  pointer-events: none;
}
.map-legend {
  position: absolute;
  bottom: 18px; left: 18px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 1000;
  box-shadow: var(--shadow-1);
}
.map-legend .legend-row { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.map-legend .legend-dot { width: 9px; height: 9px; border-radius: 50%; }

.map-attribution {
  position: absolute;
  top: 18px; right: 18px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: 4px 8px;
  border-radius: 4px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* Map / Hybrid toggle — top-left of map view, matches the lease comps pattern.
   White pill with subtle shadow; active button has gold border + soft gold fill. */
.map-type-toggle {
  position: absolute;
  top: 12px; left: 12px;
  z-index: 20;
  display: flex;
  gap: 4px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 3px;
  box-shadow: var(--shadow-1);
}
.map-type-btn {
  display: inline-flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border-radius: 4px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: -0.1px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}
.map-type-btn:hover { background: var(--bg); }
.map-type-btn.active {
  border-color: var(--gold);
  background: rgba(255, 182, 0, 0.12);
  color: var(--navy);
}
.map-type-btn.active:hover { background: rgba(255, 182, 0, 0.18); }

/* ─── Google Maps integration ───────────────────────────────────────────────
   The split-map hosts a real Google Map styled with the exact cresaStyles
   array — cool blue-tinted land (#F2F4F8), navy highway accents (#001E5A),
   muted sage parks (#D8E2D6), light blue water (#C9D9EC). */
.cresa-gmap {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  background: #F2F4F8; /* matches CRESA_STYLES base land color while tiles load */
}
/* Pins are rendered as HTML via google.maps.OverlayView. The overlay
   positions the wrapper at the pin's lat/lng — our existing .map-pin
   shape (rotated rounded-square) renders inside as-is. */
.cresa-gmap .map-pin {
  position: static !important;
  transform: none !important;
}
/* Loading state shown until the Google Maps SDK fires its callback */
.map-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  background: #F2F4F8;
  padding: 20px;
  z-index: 1;
}
.map-loading .mono-tag {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--navy);
  margin-bottom: 4px;
}
/* Google Maps zoom-control restyling to match the Cresa surface system */
.cresa-gmap button[aria-label*="Zoom"],
.cresa-gmap .gm-bundled-control button {
  border-radius: 6px !important;
}
.cresa-gmap .gmnoprint > div {
  background: var(--paper-card) !important;
  box-shadow: var(--shadow-1) !important;
  border-radius: 6px !important;
  border: 1px solid var(--rule) !important;
}

/* Activity / notification banner (broker) — Cresa fallback live-chip style */
.activity-banner {
  margin: 16px 28px 0;
  padding: 12px 16px;
  background: var(--gold-soft);
  border: 1px solid var(--gold);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-2);
  letter-spacing: -0.1px;
}
.activity-banner strong { font-weight: 700; color: var(--navy); }
.activity-banner .ab-icon {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--gold);
  color: var(--navy);
  display: grid; place-items: center;
  flex-shrink: 0;
}

/* Counter pills — Cresa pill pattern */
.counter-pills {
  display: flex; gap: 6px; padding: 14px 28px 0;
  flex-wrap: wrap;
}
.counter-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 12px;
  border-radius: 14px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.1px;
  color: var(--ink-2);
}
.counter-pill .num {
  font-family: var(--sans);
  font-weight: 700;
  color: var(--navy);
  font-size: 13px;
}
.counter-pill.active { border-color: var(--navy); background: var(--navy); color: #fff; }
.counter-pill.active .num { color: #fff; }
.counter-pill.eliminated .num { color: var(--rose); }
.counter-pill.commented .num { color: var(--ink); }
.counter-pill.toggle {
  cursor: pointer;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.counter-pill.toggle:hover {
  background: var(--paper-2);
  border-color: var(--ink-3);
  color: var(--navy);
}
.counter-pill.toggle.on {
  background: var(--navy);
  border-color: var(--navy);
  color: #fff;
}

/* Detail page */
.detail {
  max-width: 1600px;
  margin: 0 auto;
  padding: 24px 32px 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--paper-card);
}
/* 2-column grid below the page-level nav: main content on the left,
   comments rail on the right. Each column has its own scroll, so the
   property info and the comment thread can be scrolled independently. */
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 64px;
  align-items: stretch;
  flex: 1;
  min-height: 0;
  margin-top: 4px;
}
.detail-main {
  overflow-y: auto;
  padding-bottom: 60px;
  padding-right: 48px;
}
.detail-aside {
  overflow-y: auto;
  border-left: 1px solid var(--rule-2);
  padding-left: 32px;
  padding-right: 16px;
  padding-bottom: 24px;
}
/* Soften the comment section heading inside the rail so it doesn't compete
   with the property name on the left */
.detail-aside .section { margin-top: 0; }
.detail-aside .section-head { margin-bottom: 12px; }
.detail-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  font-family: var(--mono);
  font-size: 12px;
}
.detail-nav a {
  color: var(--ink-3);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.detail-nav a:hover { color: var(--ink); }
.detail-nav-pager {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--paper);
  padding: 2px;
}
.detail-nav-pager button {
  appearance: none;
  background: transparent;
  border: 0;
  padding: 7px 11px;
  cursor: pointer;
  color: var(--ink-2);
  border-radius: 4px;
}
.detail-nav-pager button:hover { background: var(--paper-2); }
.detail-nav-pager .counter { padding: 0 14px; color: var(--ink-3); font-size: 12.5px; }

.detail-header {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: start;
  margin-bottom: 24px;
}
.detail-name {
  font-family: var(--sans);
  font-size: 36px;
  line-height: 1.05;
  letter-spacing: -1px;
  font-weight: 700;
  margin: 0 0 6px;
  color: var(--navy);
}
.detail-addr {
  color: var(--ink-3);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.1px;
  margin-bottom: 12px;
}
.detail-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.detail-vote-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.detail-vote-row .label {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: var(--ink-4);
}

.media-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 32px;
  margin-bottom: 32px;
  align-items: stretch;
}
.carousel {
  position: relative;
  aspect-ratio: 16/9;
  border-radius: 12px;
  overflow: hidden;
  background: var(--paper-2);
  height: 100%;
}
.detail-map {
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  height: 100%;
  min-height: 320px;
}
.carousel-controls {
  position: absolute;
  bottom: 14px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 6px;
  z-index: 3;
}
.carousel-dot {
  appearance: none;
  border: 0;
  width: 8px; height: 8px;
  padding: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  cursor: pointer;
  transition: all 0.15s ease;
}
.carousel-dot.active { background: white; width: 22px; border-radius: 999px; }
.carousel-arrow {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--rule);
  display: grid; place-items: center;
  cursor: pointer;
  z-index: 3;
}
.carousel-arrow.prev { left: 14px; }
.carousel-arrow.next { right: 14px; }
.carousel-label {
  position: absolute;
  top: 14px; left: 14px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: var(--paper);
  padding: 4px 8px;
  border-radius: 4px;
  z-index: 3;
}

.detail-map {
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  background: var(--paper-2);
  border: 1px solid var(--rule);
}

/* Section headers */
.section {
  margin-bottom: 36px;
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}
.section-title {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--navy);
  margin: 0;
}
.section-title .count {
  color: var(--navy);
  font-weight: 700;
}

/* Building info grid */
.info-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 10px;
  overflow: hidden;
}
.info-cell {
  background: var(--paper-card);
  padding: 16px 18px;
}
.info-label {
  font-family: var(--sans);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 6px;
}
.info-val {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 20px;
  line-height: 1.1;
  letter-spacing: -0.6px;
  color: var(--navy);
}
.info-val .unit {
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-3);
}

/* Available spaces */
.space-card {
  border: 1px solid var(--rule);
  border-radius: 12px;
  margin-bottom: 12px;
  background: var(--paper);
  overflow: hidden;
}
.space-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--rule);
}
.space-head .suite {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 16px;
}
.space-head .floor {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-left: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.space-head .sf {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 18px;
}
.space-head .sf .unit {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
}
.space-body {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 24px;
  padding: 18px;
}
.space-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 24px;
}
.space-field-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 3px;
}
.space-field-val {
  font-size: 14px;
  color: var(--ink);
}
.floorplan {
  aspect-ratio: 4/3;
  border-radius: 8px;
  overflow: hidden;
  background: var(--paper-2);
  border: 1px solid var(--rule);
}

/* Comments */
.comment {
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--rule-2);
}
.comment:last-of-type { border-bottom: 0; }
.comment-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 4px;
}
.comment-author {
  font-weight: 600;
  font-size: 13px;
}
.comment-role {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.comment-time {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
}
.comment-body {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-2);
}
.comment-input-row {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  gap: 12px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
  align-items: center;
}
.comment-input {
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 9px 12px;
  font-family: var(--sans);
  min-width: 0;
  font-size: 13px;
  background: var(--paper);
  color: var(--ink);
  outline: none;
  transition: border 0.15s ease;
}
.comment-input:focus { border-color: var(--ink); }

/* Compare table */
.compare-wrap {
  padding: 24px 28px;
  overflow-x: auto;
}
.compare-table {
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
}
.compare-table.compare-table--fit {
  width: 100%;
}
.compare-table th, .compare-table td {
  padding: 12px 14px;
  text-align: center;
  border-bottom: 1px solid var(--rule-2);
  vertical-align: top;
  font-size: 11px;
  font-weight: 400;
  color: var(--ink);
}
.compare-table thead th {
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  vertical-align: bottom;
  font-weight: 400;
}
.compare-table tbody tr:nth-child(odd) td { background: #EAEAEA; }
.compare-table tbody tr:first-child td { background: var(--navy); }
.compare-row-label {
  position: sticky;
  left: 0;
  background: var(--paper) !important;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink);
  border-right: 1px solid var(--rule);
  width: 180px;
  z-index: 1;
  text-align: left;
  font-weight: 400;
}
.compare-table tbody tr:nth-child(odd) .compare-row-label {
  background: #EAEAEA !important;
}
.compare-table tbody tr:first-child .compare-row-label {
  background: var(--navy) !important;
  color: #FFFFFF;
}
.compare-table .muted {
  color: var(--ink);
}
.compare-photo {
  width: 100%;
  max-width: 200px;
  aspect-ratio: 16/10;
  border-radius: 8px;
  overflow: hidden;
  margin: 0 auto;
}
.compare-remove-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  background: transparent;
  border: 1px solid var(--rose);
  color: var(--rose);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.compare-remove-btn:hover {
  background: var(--rose);
  color: #FFFFFF;
}
.compare-reactivate-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  background: transparent;
  border: 1px solid var(--green);
  color: var(--green);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.compare-reactivate-btn:hover {
  background: var(--green);
  color: #FFFFFF;
}
.compare-toolbar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 14px;
}
.compare-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--paper);
  border: 1px solid var(--rule);
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.compare-toggle:hover {
  background: var(--paper-2);
  color: var(--navy);
}
.compare-toggle.active {
  background: var(--navy);
  color: #FFFFFF;
  border-color: var(--navy);
}
.compare-removed-pill {
  display: inline-block;
  margin-top: 6px;
  padding: 3px 8px;
  background: var(--rose);
  color: #FFFFFF;
  font-family: var(--sans);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  border-radius: 3px;
}
/* Eliminated column — muted navy header so it reads as inactive */
.compare-table tbody tr:first-child td.compare-elim {
  background: #3a4878 !important;
}
.compare-table tbody tr:first-child td.compare-elim .compare-name {
  color: rgba(255,255,255,0.65);
}
.compare-table tbody tr:first-child td.compare-elim .compare-addr {
  color: rgba(255,182,0,0.55);
}
/* Body rows in eliminated columns: subtle gray text */
.compare-table td.compare-elim {
  color: var(--ink-4);
}
.compare-name {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 13px;
  line-height: 1.2;
  letter-spacing: -0.1px;
  color: #FFFFFF;
  margin-bottom: 4px;
}
.compare-addr {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 400;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.compare-val {
  font-family: var(--sans);
  font-weight: 400;
  font-size: 11px;
  letter-spacing: -0.1px;
  color: var(--ink);
}
.compare-table .vote-btn {
  padding: 6px 10px;
  font-size: 11px;
  gap: 4px;
}
.compare-table .vote-btn svg { width: 12px; height: 12px; }

/* Broker home */
.home {
  max-width: 1400px;
  margin: 0 auto;
  padding: 32px 28px 60px;
}
.home-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--rule);
  gap: 24px;
}
.home-title {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 32px;
  letter-spacing: -0.8px;
  margin: 0;
  color: var(--navy);
}
.home-head-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}
.home-search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 8px 12px;
  width: 320px;
  color: var(--ink-3);
}
.home-search input {
  appearance: none;
  border: 0;
  outline: none;
  background: transparent;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  width: 100%;
  letter-spacing: -0.1px;
}
.home-search input::placeholder { color: var(--ink-4); }
.home-search:focus-within {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(0,30,90,0.08);
}

/* Filter chips — same gold-soft active treatment as the topbar tabs / map
   toggle, for visual consistency across all "view filter" interactions. */
.filter-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.filter-chip {
  appearance: none;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.1px;
  padding: 7px 12px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background .15s, border-color .15s, color .15s;
}
.filter-chip:hover { background: var(--bg); }
.filter-chip.active {
  border-color: var(--gold);
  background: rgba(255, 182, 0, 0.12);
  color: var(--navy);
}
.filter-chip .count {
  display: inline-grid;
  place-items: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  background: var(--bg);
  border-radius: 9px;
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-3);
  letter-spacing: 0;
}
.filter-chip.active .count { background: var(--navy); color: #fff; }

/* Attention strip — frames cards that have unread client activity so brokers
   triage them first. Soft amber treatment because we want it *prominent*
   without screaming "error". */
.attention-section {
  margin-bottom: 32px;
}
.attention-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.attention-icon {
  display: inline-grid;
  place-items: center;
  width: 26px; height: 26px;
  background: var(--amber-tint);
  color: var(--amber-ink);
  border-radius: 50%;
}
.attention-title {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 14px;
  color: var(--navy);
  letter-spacing: -0.2px;
}
.attention-sub {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
}
.survey-card.attention {
  border-color: var(--amber);
  box-shadow: 0 0 0 3px var(--amber-tint), var(--shadow-1);
}
.survey-card.attention:hover { border-color: var(--amber); }

/* Attention reason banner — sits at the top of attention cards above the
   title, calling out the specific actionable signal (new comment, new
   shortlist, etc.) so the broker knows what changed before clicking. */
.attention-reason {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  margin: -18px -18px 14px;
  border-top-left-radius: 9px;
  border-top-right-radius: 9px;
  background: var(--amber-tint);
  border-bottom: 1px solid rgba(255, 182, 0, 0.4);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  color: var(--amber-ink);
  letter-spacing: -0.1px;
}
.attention-reason-icon {
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  width: 18px; height: 18px;
  background: var(--amber);
  color: #1a1300;
  border-radius: 50%;
}
.attention-reason-text {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.attention-reason-age {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--amber-ink);
  opacity: 0.75;
  flex-shrink: 0;
}

/* Section divider between attention strip and "all other surveys" */
.section-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 8px 0 16px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--ink-4);
}
.section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--rule-2);
}

.survey-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

/* Card-level structure ─────────────────────────────────────────────── */
.survey-card {
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 18px;
  background: var(--paper-card);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  position: relative;
  box-shadow: var(--shadow-1);
}
.survey-card:hover { border-color: var(--ink-4); box-shadow: var(--shadow-2); }
.survey-card.featured {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(0,30,90,0.08);
}
.survey-card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}
.survey-card-titles { min-width: 0; flex: 1; }
.survey-card-eyebrow {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2px;
  color: var(--ink-3);
  margin-bottom: 4px;
  text-transform: none;
}
.survey-card-name {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 16px;
  line-height: 1.2;
  letter-spacing: -0.2px;
  margin: 0;
  color: var(--navy);
}

/* Status pill — distinct treatment per state. Awaiting = gold (action),
   tour = teal (in-flight), draft = neutral, archived = muted. */
.survey-card-status {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 999px;
  white-space: nowrap;
  border: 1px solid transparent;
}
.survey-card-status.status-awaiting {
  background: rgba(255,182,0,0.15);
  color: #6E4D00;
  border-color: rgba(255,182,0,0.4);
}
.survey-card-status.status-tour {
  background: rgba(0,30,90,0.08);
  color: var(--navy);
  border-color: rgba(0,30,90,0.2);
}
.survey-card-status.status-draft {
  background: var(--bg);
  color: var(--ink-3);
  border-color: var(--rule);
}
.survey-card-status.status-archived {
  background: var(--bg);
  color: var(--ink-4);
  border-color: var(--rule-2);
}
.survey-card-status.status-active {
  background: rgba(0,30,90,0.08);
  color: var(--navy);
  border-color: rgba(0,30,90,0.2);
}

.survey-card-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  padding: 14px 0;
  border-top: 1px solid var(--rule-2);
  border-bottom: 1px solid var(--rule-2);
  margin-bottom: 14px;
}
.stat {
  display: flex;
  flex-direction: column-reverse;
  gap: 4px;
  justify-content: flex-end;
}
.stat-num {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 22px;
  line-height: 1;
  letter-spacing: -0.6px;
  color: var(--navy);
}
.stat-label {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--ink-4);
}
.stat.alert .stat-num { color: var(--amber-ink); }
.stat.alert .stat-label { color: var(--amber-ink); }
.stat.good .stat-num { color: var(--navy); }

.survey-card-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-family: var(--sans);
  font-size: 11.5px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
}
.survey-card-activity {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  min-width: 0;
}
.last-activity {
  color: var(--ink-2);
  font-weight: 500;
}
.tour-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 4px;
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  white-space: nowrap;
}
.tour-pill.scheduled {
  background: rgba(0,30,90,0.08);
  color: var(--navy);
}
.tour-pill.completed {
  background: rgba(34,139,34,0.1);
  color: #1F6B1F;
}
.survey-card-updated {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
  white-space: nowrap;
}

/* Empty state when no surveys match filter+query */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-3);
}
.empty-state-icon {
  display: inline-grid;
  place-items: center;
  width: 48px; height: 48px;
  background: var(--bg);
  border-radius: 50%;
  margin-bottom: 12px;
  color: var(--ink-4);
}
.empty-state-title {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 16px;
  color: var(--navy);
  margin-bottom: 4px;
}
.empty-state-body {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-3);
}
.link-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--navy);
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  font-size: inherit;
  font-family: inherit;
}
.unread-dot {
  position: absolute;
  top: 14px; right: 14px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 0 3px var(--amber-tint);
}

/* Eliminated section (broker) */
.eliminated-section {
  margin: 28px 28px 0;
  border: 1px dashed var(--rule);
  border-radius: 10px;
  padding: 14px 18px;
}
.eliminated-section summary {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  list-style: none;
}
.eliminated-section summary::-webkit-details-marker { display: none; }
.eliminated-section summary::before {
  content: '▸';
  font-size: 14px;
  color: var(--ink-4);
  transition: transform 0.15s ease;
}
.eliminated-section[open] summary::before { transform: rotate(90deg); }
.eliminated-list {
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Broker controls on cards */
.broker-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--rule);
}
.broker-controls .label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-4);
}

/* Survey header actions */
.survey-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

/* Drag handle */
.drag-handle {
  position: absolute;
  left: 4px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-4);
  cursor: grab;
  opacity: 0;
  transition: opacity 0.15s ease;
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: -1px;
}
.property-card:hover .drag-handle,
[data-mode="broker"] .property-card .drag-handle { opacity: 0.6; }

/* Loading dots / accents */
.live-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 6px;
  position: relative;
}
.live-dot::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1px solid var(--green);
  animation: pulse 1.8s ease-out infinite;
}
@keyframes pulse {
  0% { transform: scale(0.5); opacity: 1; }
  100% { transform: scale(2); opacity: 0; }
}

/* Page transitions */
.page-fade { animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Misc */
.muted { color: var(--ink-3); }
.serif-num { font-family: var(--sans); font-weight: 700; letter-spacing: -0.01em; }
.mono-tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }

/* Scrollbar tweaks */
.split-list::-webkit-scrollbar { width: 8px; }
.split-list::-webkit-scrollbar-track { background: transparent; }
.split-list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 999px; }
.split-list::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

/* Docs grid */
.docs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 8px;
}
.doc-tile {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--paper);
  cursor: pointer;
  transition: all 0.12s ease;
  text-decoration: none;
  color: inherit;
}
.doc-tile:hover { border-color: var(--ink-4); background: var(--paper-2); }
.doc-icon {
  width: 40px; height: 40px;
  border-radius: 6px;
  background: var(--rose-tint);
  color: var(--rose);
  display: grid; place-items: center;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.doc-icon.plan { background: var(--accent-tint); color: var(--accent); }
.doc-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 2px;
}
.doc-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
}

/* Floorplan hover overlay */
.floorplan { position: relative; }
.floorplan-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(20,22,26,0.04), rgba(20,22,26,0.0));
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.15s ease;
}
.floorplan:hover .floorplan-overlay { opacity: 1; }

/* Lightbox */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(20,22,26,0.7);
  display: grid;
  place-items: center;
  z-index: 100;
  padding: 40px;
  animation: fadeIn 0.18s ease;
}
.lightbox-card {
  background: var(--paper);
  border-radius: 14px;
  width: min(1100px, 100%);
  max-height: 90vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,0.5);
}
.lightbox-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 22px;
  border-bottom: 1px solid var(--rule);
}
.lightbox-body {
  flex: 1;
  min-height: 0;
  padding: 22px;
  background: var(--paper-2);
}
.lightbox-body .placeholder { aspect-ratio: 16/10; border-radius: 6px; }
.lightbox-foot {
  padding: 12px 22px;
  border-top: 1px solid var(--rule);
  background: var(--paper);
}

/* ─── New Survey Wizard ──────────────────────────────────────────────
   Multi-step modal triggered from the broker dashboard. 4-step flow:
   Tenant info → Requirements → Buildings → Review. Modal style matches
   the rest of the app — white surface, subtle navy shadow, gold-soft
   accents on active states. */
.wizard-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 30, 90, 0.32);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  animation: fadeIn 0.2s ease;
}
.wizard {
  background: var(--paper-card);
  border-radius: 12px;
  width: 100%;
  max-width: 920px;
  max-height: calc(100vh - 80px);
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 30, 90, 0.25);
  overflow: hidden;
}
.wizard-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 24px 28px 16px;
  border-bottom: 1px solid var(--rule-2);
}
.wizard-title {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.4px;
  color: var(--navy);
  margin: 4px 0 0;
}
.wizard-close {
  appearance: none;
  border: 0;
  background: transparent;
  cursor: pointer;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  color: var(--ink-3);
  transition: background .15s, color .15s;
}
.wizard-close:hover { background: var(--bg); color: var(--ink); }

/* Stepper — horizontal, with done/active states */
.wizard-stepper {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 28px;
  border-bottom: 1px solid var(--rule-2);
  background: var(--paper-2);
}
.wizard-step {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px 4px 4px;
  border-radius: 999px;
  flex-shrink: 0;
}
.wizard-step:not(:last-child)::after {
  content: '';
  display: inline-block;
  width: 24px;
  height: 1px;
  background: var(--rule-2);
  margin-left: 4px;
}
.wizard-step-num {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 50%;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-3);
  flex-shrink: 0;
}
.wizard-step-label {
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: -0.1px;
}
.wizard-step.active .wizard-step-num {
  background: var(--navy);
  border-color: var(--navy);
  color: #fff;
}
.wizard-step.active .wizard-step-label {
  color: var(--navy);
}
.wizard-step.done:not(.active) .wizard-step-num {
  background: var(--gold);
  border-color: var(--gold);
  color: #1a1300;
}
.wizard-step.done:not(.active) .wizard-step-label {
  color: var(--ink-2);
}

/* Body — scrolls if step content exceeds available height */
.wizard-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px 28px;
}
.wizard-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 28px;
  border-top: 1px solid var(--rule-2);
  background: var(--paper-2);
  gap: 12px;
}
.wizard-foot-right {
  display: flex;
  gap: 10px;
}

/* Form fields — used in tenant & requirements steps */
.wizard-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
}
.form-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-field label {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--ink-3);
}
.form-field input,
.form-field select {
  appearance: none;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 10px 12px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  letter-spacing: -0.1px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.form-field input:focus,
.form-field select:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(0, 30, 90, 0.08);
}
.form-field input::placeholder { color: var(--ink-4); }
.field-hint {
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-4);
  letter-spacing: -0.1px;
  line-height: 1.4;
}

/* Submarket multi-select chips */
.chip-multiselect {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.submarket-chip {
  appearance: none;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.submarket-chip:hover { background: var(--bg); }
.submarket-chip.active {
  border-color: var(--gold);
  background: rgba(255, 182, 0, 0.12);
  color: var(--navy);
}

/* Information callout used in step 2 + step 4 */
.info-box {
  display: flex;
  gap: 10px;
  padding: 12px 14px;
  background: var(--paper-2);
  border: 1px solid var(--rule-2);
  border-radius: 8px;
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-2);
  letter-spacing: -0.1px;
  line-height: 1.5;
}
.info-box svg {
  flex-shrink: 0;
  margin-top: 2px;
  color: var(--navy);
}
.info-box strong { color: var(--navy); }

/* Library browse — step 3. Search + filter row, then card grid */
.library-controls {
  display: grid;
  grid-template-columns: 1fr 140px 200px auto;
  gap: 10px;
  margin-bottom: 16px;
  align-items: center;
}
.library-search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 9px 12px;
  color: var(--ink-3);
}
.library-search input {
  appearance: none;
  border: 0;
  outline: none;
  background: transparent;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  width: 100%;
}
.library-controls select {
  appearance: none;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 9px 12px;
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-2);
  cursor: pointer;
}
.library-summary {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-3);
  white-space: nowrap;
}
.library-summary strong { color: var(--navy); font-weight: 700; }

.library-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.library-card {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 12px;
  padding: 14px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.library-card:hover {
  border-color: var(--ink-4);
  background: var(--paper-2);
}
.library-card.selected {
  border-color: var(--navy);
  background: rgba(0, 30, 90, 0.04);
  box-shadow: 0 0 0 1px var(--navy);
}
.library-checkbox {
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--rule);
  border-radius: 4px;
  display: grid;
  place-items: center;
  background: var(--paper-card);
  margin-top: 1px;
  color: #fff;
  transition: background .15s, border-color .15s;
}
.library-card.selected .library-checkbox,
.plan-stop-row.selected .library-checkbox {
  background: var(--navy);
  border-color: var(--navy);
}
.library-card-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.library-name {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 14px;
  color: var(--navy);
  margin: 0;
  letter-spacing: -0.2px;
}
.library-class {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--ink-3);
  background: var(--bg);
  padding: 2px 7px;
  border-radius: 999px;
  flex-shrink: 0;
}
.library-addr {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 2px;
}
.library-meta {
  font-family: var(--sans);
  font-size: 11.5px;
  color: var(--ink-3);
  margin-top: 6px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.library-last-used {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
  margin-top: 8px;
  letter-spacing: 0.1px;
}

/* Review step */
.wizard-review {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.review-section {
  border: 1px solid var(--rule-2);
  border-radius: 8px;
  overflow: hidden;
}
.review-section-head {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 11.5px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink-3);
  background: var(--paper-2);
  padding: 8px 14px;
  border-bottom: 1px solid var(--rule-2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.review-section-head .count-pill {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 18px;
  padding: 0 6px;
  background: var(--navy);
  color: #fff;
  border-radius: 9px;
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
}
.review-grid {
  padding: 14px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px 24px;
}
.review-field {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.review-label {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--ink-4);
}
.review-val {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: -0.1px;
}
.review-buildings {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.review-building {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-2);
}
.review-bullet { color: var(--bright-blue); }
.muted { color: var(--ink-4); }

/* Toast — appears bottom-right after wizard publish */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  background: var(--navy);
  color: #fff;
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0, 30, 90, 0.3);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.1px;
  z-index: 200;
  cursor: pointer;
  animation: toastIn 0.3s ease;
  max-width: 420px;
}
.toast svg { color: var(--bright-blue); flex-shrink: 0; }
@keyframes toastIn {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* ─── Activity Timeline ──────────────────────────────────────────── */
.activity-timeline {
  padding: 24px 28px;
  max-width: 800px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.activity-head {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--rule-2);
}
.activity-title {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.4px;
  color: var(--navy);
  margin: 0 0 4px;
}
.activity-sub {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
}
.timeline {
  display: flex;
  flex-direction: column;
}
.timeline-row {
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--rule-2);
}
.timeline-row:last-child { border-bottom: 0; }
.timeline-icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.timeline-icon.tone-neutral {
  background: var(--paper-2);
  color: var(--ink-3);
}
.timeline-icon.tone-comment {
  background: rgba(0, 30, 90, 0.08);
  color: var(--navy);
}
.timeline-icon.tone-good {
  background: rgba(255, 182, 0, 0.18);
  color: var(--amber-ink);
}
.timeline-icon.tone-discard {
  background: rgba(220, 80, 100, 0.12);
  color: #B53A4D;
}
.timeline-icon.tone-tour {
  background: rgba(0, 30, 90, 0.08);
  color: var(--navy);
}
.timeline-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.timeline-line {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: baseline;
}
.timeline-who {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 13px;
  color: var(--navy);
  letter-spacing: -0.1px;
}
.timeline-detail {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-2);
  letter-spacing: -0.1px;
}
.timeline-when {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-4);
  letter-spacing: 0.1px;
}

/* ─── Tour Panel ─────────────────────────────────────────────────── */
.tour-panel {
  padding: 24px 28px;
  max-width: 1000px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.tour-head {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--rule-2);
}
.tour-title {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.4px;
  color: var(--navy);
  margin: 0 0 4px;
}
.tour-sub {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
}
.tour-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.tour-card {
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 20px 22px;
  background: var(--paper-card);
  box-shadow: var(--shadow-1);
}
.tour-card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 14px;
}
.tour-bldg-eyebrow {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 2px;
}
.tour-bldg-name {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 18px;
  color: var(--navy);
  letter-spacing: -0.3px;
  margin: 0;
}
.tour-bldg-addr {
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-3);
  margin-top: 4px;
  letter-spacing: -0.1px;
}
.tour-state-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  padding: 5px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
.tour-state-pill.none {
  background: var(--bg);
  color: var(--ink-4);
  border: 1px solid var(--rule);
}
.tour-state-pill.awaiting {
  background: rgba(255, 182, 0, 0.15);
  color: #6E4D00;
  border: 1px solid rgba(255, 182, 0, 0.4);
}
.tour-state-pill.confirmed {
  background: rgba(34, 139, 34, 0.12);
  color: #1F6B1F;
  border: 1px solid rgba(34, 139, 34, 0.3);
}
.tour-state-pill.completed {
  background: var(--bg);
  color: var(--ink-3);
  border: 1px solid var(--rule);
}
.tour-empty-cta {
  padding: 16px 0 4px;
}
.tour-meta {
  font-family: var(--sans);
  font-size: 11.5px;
  color: var(--ink-3);
  margin-bottom: 12px;
  letter-spacing: -0.1px;
}
.tour-slots {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tour-slot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--paper-card);
  transition: border-color .15s, background .15s;
}
.tour-slot.status-confirmed {
  border-color: rgba(34, 139, 34, 0.4);
  background: rgba(34, 139, 34, 0.04);
}
.tour-slot.status-declined {
  opacity: 0.55;
}
.tour-slot-info { display: flex; flex-direction: column; gap: 2px; }
.tour-slot-day {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 13px;
  color: var(--navy);
  letter-spacing: -0.1px;
}
.tour-slot-time {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink-3);
}
.tour-slot-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.tour-slot-status-pill.confirmed { color: #1F6B1F; }
.tour-slot-status-pill.declined { color: var(--ink-4); }
.tour-notes {
  margin-top: 14px;
  padding: 12px 14px;
  background: var(--paper-2);
  border-radius: 6px;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-2);
  letter-spacing: -0.1px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.tour-notes-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--ink-4);
}
.tour-card-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--rule-2);
}

/* Btn size variant for sm */
.btn.sm {
  padding: 6px 11px;
  font-size: 11.5px;
}

/* When showing Activity or Tour tab inside survey-list, override the
   split layout — these views need full-width, not the list-map split. */
.split-list:has(.activity-timeline),
.split-list:has(.tour-panel) {
  /* not applicable since Activity/Tour live outside .split */
}

/* ─── Tour Itinerary View ────────────────────────────────────────────
   Two-column layout with stops on the left and a route map on the right.
   The map renders a Google Directions polyline through all stops with
   numbered pins. Drive times pulled from the Directions API. */
.itinerary {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 16px 28px 0;
  overflow: hidden;
}
.itinerary-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--rule-2);
  margin-bottom: 18px;
}

.itinerary-title-row {
  margin-bottom: 16px;
}
.itinerary-title {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: -0.5px;
  color: var(--navy);
  margin: 4px 0 6px;
}
.itinerary-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
}
.itinerary-summary strong { color: var(--navy); font-weight: 700; }
.itinerary-summary .sep { color: var(--ink-4); }

/* Two-column grid for stops + map. Each column scrolls independently
   so a long itinerary doesn't push the map out of view. */
.itinerary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  flex: 1;
  min-height: 0;
}
.itinerary-stops {
  overflow-y: auto;
  padding-right: 16px;
  padding-bottom: 24px;
}
.itinerary-map {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-1);
  border: 1px solid var(--rule);
  min-height: 0;
}
.itinerary-map .cresa-gmap {
  width: 100%;
  height: 100%;
}

/* Itinerary-level note (broker's preamble for the day) */
.itinerary-note {
  display: flex;
  gap: 10px;
  padding: 12px 14px;
  background: rgba(255, 182, 0, 0.08);
  border: 1px solid rgba(255, 182, 0, 0.3);
  border-radius: 8px;
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-2);
  letter-spacing: -0.1px;
  line-height: 1.5;
  margin-bottom: 16px;
}
.itinerary-note svg {
  flex-shrink: 0;
  margin-top: 3px;
  color: var(--amber-ink);
}

.stops-list {
  display: flex;
  flex-direction: column;
}

/* Each stop is a numbered card. The big number on the left ties to the
   numbered pin on the route map. */
.stop-card {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 16px;
  padding: 0;
}
.stop-num {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--navy);
  color: #fff;
  display: grid;
  place-items: center;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0, 30, 90, 0.2);
}
.stop-body {
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 14px 16px;
  box-shadow: var(--shadow-1);
}
.stop-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--rule-2);
}
.stop-time {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--bright-blue);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.stop-name {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 16px;
  color: var(--navy);
  margin: 0 0 4px;
  letter-spacing: -0.2px;
}
.stop-addr {
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
}
.stop-submarket {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--ink-3);
  background: var(--bg);
  padding: 4px 8px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
}
.stop-focus {
  margin-bottom: 12px;
}
.stop-label {
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 4px;
}
.stop-focus > div:not(.stop-label) {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -0.1px;
  line-height: 1.4;
}

/* Broker-only logistics block — entrance, parking, leasing rep, broker note */
.stop-logistics {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--rule-2);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.logistics-row {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 10px;
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-2);
  letter-spacing: -0.1px;
  line-height: 1.4;
}
.logistics-row strong { color: var(--navy); font-weight: 700; }
.phone-link {
  display: inline-block;
  margin-left: 6px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--navy);
  font-weight: 600;
  text-decoration: none;
  border-bottom: 1px dashed var(--ink-4);
}
.phone-link:hover {
  border-bottom-style: solid;
}
.logistics-note {
  display: flex;
  gap: 8px;
  padding: 8px 12px;
  background: var(--paper-2);
  border-radius: 6px;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-2);
  letter-spacing: -0.1px;
  line-height: 1.4;
}
.logistics-note svg {
  flex-shrink: 0;
  margin-top: 3px;
  color: var(--ink-3);
}

/* Drive leg between stops — vertical line with drive-time pill */
.leg-row {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 16px;
  align-items: center;
  padding: 10px 0;
}
.leg-line {
  width: 2px;
  height: 28px;
  background: var(--rule);
  margin: 0 auto;
  border-radius: 1px;
}
.leg-info {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  background: var(--paper-2);
  border-radius: 999px;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
  width: fit-content;
}
.leg-info svg { color: var(--ink-4); }
.leg-info strong { color: var(--navy); font-weight: 700; }
.leg-launch {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--navy);
  font-family: var(--sans);
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  padding: 0;
  border-bottom: 1px dashed transparent;
  transition: border-color 0.15s;
  margin-left: 4px;
}
.leg-launch:hover {
  border-bottom-color: var(--navy);
}

/* Tour head: keep title on left, action button on right */
.tour-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--rule-2);
}
.tour-head-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.btn-count {
  display: inline-grid;
  place-items: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 9px;
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 700;
  margin-left: 6px;
  letter-spacing: 0;
}

/* ─── Confirmation flow ─────────────────────────────────────────────
   Status panel above the stops list, per-stop status pills, counter-
   proposal banner when a leasing rep suggests a different time. */
.conf-panel {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  padding: 14px 18px;
  background: var(--paper-card);
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  margin-bottom: 18px;
}
.conf-panel-summary {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.conf-panel-progress {
  display: flex;
  align-items: center;
  gap: 12px;
}
.conf-progress-track {
  flex: 1;
  height: 6px;
  background: var(--rule-2);
  border-radius: 3px;
  overflow: hidden;
  max-width: 220px;
}
.conf-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), #2ECC71);
  border-radius: 3px;
  transition: width 0.4s ease;
}
.conf-progress-label {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-2);
  letter-spacing: -0.1px;
  white-space: nowrap;
}
.conf-progress-label strong { color: var(--navy); font-weight: 700; }
.conf-panel-states {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.conf-state-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 999px;
  white-space: nowrap;
}
.conf-state-pill.state-confirmed {
  background: rgba(34, 139, 34, 0.12);
  color: #1F6B1F;
}
.conf-state-pill.state-awaiting {
  background: rgba(255, 182, 0, 0.15);
  color: #6E4D00;
}
.conf-state-pill.state-countered {
  background: rgba(0, 30, 90, 0.08);
  color: var(--navy);
}
.conf-state-pill.state-unsent {
  background: var(--bg);
  color: var(--ink-3);
  border: 1px solid var(--rule);
}
.conf-panel-actions {
  flex-shrink: 0;
}

/* Per-stop confirmation pill — sits in the stop card head, next to submarket */
.stop-head-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.conf-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 999px;
  white-space: nowrap;
  border: 0;
  cursor: default;
}
button.conf-pill { cursor: pointer; }
button.conf-pill:hover { filter: brightness(0.96); }
.conf-pill.not-sent {
  background: var(--bg);
  color: var(--ink-4);
  border: 1px solid var(--rule);
}
.conf-pill.awaiting {
  background: rgba(255, 182, 0, 0.15);
  color: #6E4D00;
}
.conf-pill.confirmed {
  background: rgba(34, 139, 34, 0.12);
  color: #1F6B1F;
}
.conf-pill.countered {
  background: rgba(0, 30, 90, 0.08);
  color: var(--navy);
}
.conf-pill.declined {
  background: rgba(220, 80, 100, 0.12);
  color: #B53A4D;
}

/* Counter-proposal banner inside the stop card */
.counter-banner {
  background: rgba(255, 182, 0, 0.08);
  border: 1px solid rgba(255, 182, 0, 0.3);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.counter-banner-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-2);
  margin-bottom: 6px;
  letter-spacing: -0.1px;
}
.counter-banner-head strong { color: var(--navy); font-weight: 700; }
