<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downtown West Options</title>
<style>
  :root {
    --navy: #001E5A;
    --navy-2: #0B2B6E;
    --gold: #FFB600;
    --white: #FFFFFF;
    --gray: #595959;
    --light: #E6E6E6;
    --bg: #F4F5F8;
    --pos: #2E9E5B;
    --neu: #F2B705;
    --neg: #D93A2B;
    --font: Arial, Helvetica, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--navy); font: 14px/1.45 var(--font); }
  button { font-family: inherit; }

  /* ---------- Header (structure from the Cresa Lease Comps Database) ---------- */
  .topbar {
    height: 60px; background: #fff; border-bottom: 1px solid #E4E8F0;
    box-shadow: 0 1px 0 rgba(0,30,90,.03);
    display: flex; align-items: center; gap: 18px; padding: 0 22px;
    position: relative; z-index: 30;
  }
  .topbar .logo svg { height: 20px; width: auto; display: block; }
  .vrule { width: 1px; height: 28px; background: #E4E8F0; flex: none; }
  .topbar .title { font-size: 14px; font-weight: 700; color: var(--navy); line-height: 1.1; }
  .topbar .title span { display: block; font-size: 11px; font-weight: 400; color: #5A6580; margin-top: 3px; }
  .topbar .spacer { flex: 1; }
  .legend { display: flex; gap: 12px; font-size: 11px; font-weight: 700; color: #5A6580; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .score { width: 16px; height: 16px; font-size: 12px; }

  /* ---------- Score icons ---------- */
  .score {
    width: 20px; height: 20px; border-radius: 50%; flex: none;
    display: inline-grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 15px; line-height: 1;
  }
  .score.pos { background: var(--pos); }
  .score.neu { background: var(--neu); color: var(--navy); }
  .score.neg { background: var(--neg); }
  .score.lg { width: 28px; height: 28px; font-size: 20px; }

  /* ---------- Map view ---------- */
  #mapView { padding: 20px 24px 28px; }
  .stage {
    position: relative; margin: 0 auto;
    width: min(100%, calc((100vh - 140px) * var(--ratio, 1.6)));
    aspect-ratio: var(--ratio, 1.6);
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 8px 30px rgba(0, 30, 90, .25);
    background: #2b3240;
  }
  .stage > img, .stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .hint { text-align: center; color: var(--gray); font-size: 12px; margin-top: 10px; }

  .hotspot {
    position: absolute; transform: translate(-50%, -50%);
    width: 22px; height: 22px; border-radius: 50%; padding: 0;
    background: var(--navy); border: 2px solid #fff;
    cursor: pointer; font-size: 0;
    box-shadow: 0 0 0 1px rgba(0,30,90,.35), 0 2px 8px rgba(0,0,0,.45);
    transition: transform .15s ease; z-index: 2;
  }
  /* two blue rings radiating outward, offset so the pulse is continuous */
  .hotspot::before, .hotspot::after {
    /* inset:-2px = exactly the dot's outer edge (its 2px border), so the ring scales from the dot's centre */
    content: ""; position: absolute; inset: -2px; transform-origin: 50% 50%;
    border-radius: 50%; background: rgba(0, 30, 90, .08); border: 1px solid rgba(0, 30, 90, .18);
    animation: ripple 4.2s ease-out infinite; z-index: -1; pointer-events: none;
  }
  .hotspot::after { animation-delay: 2.1s; }
  @keyframes ripple { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.7); opacity: 0; } }
  .hotspot:hover, .hotspot:focus-visible, .hotspot.active { transform: translate(-50%, -50%) scale(1.25); outline: none; }

  /* Intro orbit video: plays over the map, then fades to the still with hotspots */
  .stage > video.intro { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 4; transition: opacity .8s ease; }
  .stage > video.intro.out { opacity: 0; }
  .hotspot { transition: transform .15s ease, opacity .5s ease; }
  .stage.playing .hotspot { opacity: 0; pointer-events: none; }
  .vbtn { position: absolute; right: 12px; bottom: 12px; z-index: 6; height: 32px; padding: 0 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.5); background: rgba(0,30,90,.7); color: #fff; font: 700 12px var(--font); cursor: pointer; backdrop-filter: blur(6px); }
  .vbtn:hover { background: rgba(0,30,90,.9); }
  @keyframes pulse { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }

  /* ---------- Hover card ---------- */
  .card {
    position: absolute; z-index: 5; width: 300px;
    background: var(--white); border-radius: 10px; overflow: hidden;
    box-shadow: 0 24px 50px rgba(0, 15, 45, .45), 0 0 0 1px rgba(0, 30, 90, .06);
    opacity: 0; visibility: hidden; transform: translateY(8px) scale(.98);
    transition: opacity .18s ease, transform .25s cubic-bezier(.2,.8,.2,1), visibility .18s;
  }
  .card.show { opacity: 1; visibility: visible; transform: none; }
  .card .art { height: 160px; position: relative; background: linear-gradient(170deg, #0B3A8C, var(--navy)); overflow: hidden; }
  .card .art > svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; display: block; }
  .card .art .photo { position: absolute; inset: 0; height: auto; }
  .card .price {
    position: absolute; right: 12px; top: 12px; z-index: 1;
    background: #0056DA; color: #fff; border-radius: 999px; padding: 5px 11px;
    font-size: 13px; font-weight: 700; letter-spacing: -.1px; box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .card .price small { font-size: 10px; font-weight: 700; opacity: .85; }
  .card .fb { padding: 16px 18px 6px; }
  .card .nm { font-size: 21px; font-weight: 700; color: var(--navy); letter-spacing: -.5px; line-height: 1.15; }
  .card .ad { font-size: 12px; color: #5A6580; margin-top: 2px; }
  .card .srows { margin-top: 12px; }
  .card .sr { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-top: 1px solid #E4E8F0; font-weight: 700; font-size: 13px; color: #2B3350; }
  .card .sr .score { width: 22px; height: 22px; font-size: 15px; }
  .card .firms { padding: 10px 18px 12px; border-top: 1px solid #E4E8F0; background: #F6F7FB; }
  .card .firms .lbl {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0; border: 0; background: none; cursor: pointer; font-family: inherit;
    font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #5A6580; font-weight: 700;
  }
  .card .firms .lbl:hover { color: var(--navy); }
  .card .firms .lbl .ct { margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #E4E8F0; color: var(--navy); letter-spacing: 0; }
  .card .firms .chev { font-size: 14px; line-height: 1; transition: transform .2s ease; }
  .card .firms.open .chev { transform: rotate(180deg); }
  .card .firms ul { list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--navy); line-height: 1.5; display: none; }
  .card .firms.open ul { display: block; margin-top: 6px; }
  .card .firms li { padding: 3px 0; border-top: 1px solid #E4E8F0; }
  .card .firms li:first-child { border-top: 0; }
  .card .actions { padding: 10px 18px 14px; background: #F6F7FB; }
  .card .actions .btn { border-radius: 6px; padding: 9px 14px; }

  /* Google base map */
  .gmap { position: absolute; inset: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 10px 14px; border: 0; border-radius: 4px; cursor: pointer;
    background: var(--gold); color: var(--navy); font-weight: 700; font-size: 13px;
    text-decoration: none;
  }
  .btn:hover { background: #ffc52e; }
  .btn.ghost { background: transparent; color: var(--white); border: 1px solid rgba(255,255,255,.5); width: auto; }
  .btn.ghost:hover { background: rgba(255,255,255,.1); }

  .coords { position: absolute; left: 10px; bottom: 10px; z-index: 6; background: rgba(0,0,0,.75); color: #fff; font: 12px monospace; padding: 6px 10px; border-radius: 4px; display: none; }
  .edit .coords { display: block; }
  .edit { cursor: crosshair; }

  /* ---------- Detail view ---------- */
  #detailView { display: none; }
  .view-detail #mapView { display: none; }
  .view-detail #detailView { display: block; }
  .hero { background: var(--navy); color: var(--white); padding: 26px 24px 30px; }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .hero-grid { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .hero h2 { margin: 0; font-size: 34px; }
  .hero .addr { color: rgba(255,255,255,.75); margin-top: 4px; }
  .hero .rentbig { text-align: right; }
  .hero .rentbig .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: rgba(255,255,255,.7); font-weight: 700; }
  .hero .rentbig .val { font-size: 38px; font-weight: 700; color: var(--gold); line-height: 1.1; }
  .hero .rentbig .val small { font-size: 15px; color: rgba(255,255,255,.8); font-weight: 400; }
  .tally { display: flex; gap: 16px; margin-top: 18px; font-size: 13px; flex-wrap: wrap; }
  .tally span { display: inline-flex; align-items: center; gap: 6px; }

  .sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 24px 0; }
  .sec { background: var(--white); border-radius: 8px; border: 1px solid var(--light); overflow: hidden; }
  .sec .sh { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--light); }
  .sec h3 { margin: 0; font-size: 15px; }
  .sec .rating { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--gray); }
  .sec .sb { padding: 14px 18px 16px; color: #26324a; }
  .sec .sb ul { margin: 0; padding-left: 18px; }
  .sec .sb li { margin: 3px 0; }
  .sec.wide { grid-column: 1 / -1; }
  .sec.pos { border-top: 4px solid var(--pos); }
  .sec.neu { border-top: 4px solid var(--neu); }
  .sec.neg { border-top: 4px solid var(--neg); }
  .sec.firms { border-top: 4px solid var(--gold); }
  .firm-list { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0 !important; }
  .firm-list li { background: var(--bg); border: 1px solid var(--light); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--navy); margin: 0 !important; }
  .pager { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 36px; }
  .pager a { color: var(--navy); font-weight: 700; text-decoration: none; padding: 10px 14px; border: 1px solid var(--light); background: var(--white); border-radius: 4px; }
  .pager a:hover { border-color: var(--gold); }

  /* ---------- Tabs ---------- */
  .nav { display: flex; gap: 6px; }
  .nav a {
    height: 32px; padding: 0 12px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid #E4E8F0; color: #2B3350;
    font-size: 12px; font-weight: 700; text-decoration: none;
    transition: background .15s, border-color .15s, color .15s;
  }
  .nav a svg { width: 12px; height: 12px; fill: none; stroke: #5A6580; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .nav a:hover { background: #F4F7FC; }
  .nav a.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .nav a.on svg { stroke: #fff; }

  /* ---------- Photos ---------- */
  .photo { position: relative; background: var(--navy-2) center / cover no-repeat; overflow: hidden; }
  .photo.ph { display: grid; place-items: center; background: linear-gradient(135deg, #0B2B6E, #001E5A); }
  .photo.ph svg { width: 34px; height: 34px; opacity: .55; }
  .photo.ph span { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 10px; letter-spacing: .6px; text-transform: uppercase; color: rgba(255,255,255,.5); font-weight: 700; }
  .hero-photo { width: 220px; height: 140px; border-radius: 6px; border: 2px solid var(--gold); flex: none; }

  /* ---------- Matrix view ---------- */
  #matrixView { display: none; padding: 24px; }
  .view-matrix #mapView { display: none; }
  .view-matrix #matrixView { display: block; }
  .matrix-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; max-width: 1400px; margin: 0 auto 14px; flex-wrap: wrap; }
  .matrix-head h2 { margin: 0; font-size: 24px; }
  .matrix-head p { margin: 2px 0 0; color: var(--gray); font-size: 13px; }
  .mx-scroll { max-width: 1400px; margin: 0 auto; overflow-x: auto; background: var(--white); border: 1px solid var(--light); border-radius: 8px; }
  table.mx { border-collapse: collapse; width: 100%; min-width: 1080px; table-layout: fixed; }
  .mx th, .mx td { vertical-align: top; text-align: left; border-bottom: 1px solid var(--light); border-left: 1px solid var(--light); padding: 12px 14px; font-size: 13px; }
  .mx col.rowhead { width: 150px; }
  .mx th.rh, .mx td.rh { position: sticky; left: 0; z-index: 1; background: var(--navy); color: var(--white); font-weight: 700; border-left: 0; border-bottom-color: rgba(255,255,255,.15); }
  .mx thead th { background: var(--white); padding: 0; }
  .mx thead th.rh { background: var(--navy); padding: 12px 14px; vertical-align: bottom; }
  .mx .bh .photo { height: 120px; }
  .mx .bh .meta { padding: 10px 14px 12px; border-top: 3px solid var(--gold); }
  .mx .bh a.bname { color: var(--navy); font-size: 16px; font-weight: 700; text-decoration: none; }
  .mx .bh a.bname:hover { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; }
  .mx .bh .addr { color: var(--gray); font-size: 11px; margin-top: 2px; font-weight: 400; }
  .mx .rentrow td:not(.rh) { font-size: 20px; font-weight: 700; color: var(--navy); }
  .mx .rentrow small { font-size: 12px; color: var(--gray); font-weight: 400; }
  .mx td .cell-score { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 12px; margin-bottom: 8px; }
  .mx td.pos { background: rgba(46,158,91,.07); }
  .mx td.neu { background: rgba(242,183,5,.12); }
  .mx td.neg { background: rgba(217,58,43,.08); }
  .mx td ul { margin: 0; padding-left: 16px; color: #26324a; }
  .mx td li { margin: 2px 0; }
  .mx .tallyrow .t { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; font-weight: 700; }
  .btn.sm { width: auto; padding: 7px 12px; font-size: 12px; }

  @media (max-width: 720px) {
    .hero-photo { width: 100%; height: 160px; }
    #matrixView { padding: 16px; }
    .sections { grid-template-columns: 1fr; }
    .hero h2 { font-size: 26px; }
    .hero .rentbig { text-align: left; }
    .legend, .topbar .title, .topbar .vrule { display: none; }
    .topbar { padding: 0 16px; }
    #mapView, .hero { padding-left: 16px; padding-right: 16px; }
    .card { width: 260px; }
  }
</style>
</head>

function skyline(seed) {
  let v = seed * 9301 + 49297; const r = () => (v = (v * 9301 + 49297) % 233280) / 233280; let p = "";
  for (let x = 0; x < 300; x += 22 + r() * 10) { const h = 30 + r() * 60; p += `<rect x="${x}" y="${120 - h}" width="${16 + r() * 8}" height="${h}" fill="#fff" fill-opacity="${.08 + r() * .1}"/>`; }
  p += `<rect x="122" y="18" width="56" height="102" fill="#FFB600"/><rect x="132" y="8" width="36" height="12" fill="#FFB600"/>`;
  for (let y = 28; y < 112; y += 12) for (let x = 130; x < 172; x += 10) p += `<rect x="${x}" y="${y}" width="5" height="6" fill="#001E5A" fill-opacity=".45"/>`;
  return `<svg viewBox="0 0 300 120" aria-hidden="true">${p}</svg>`;
}

// ---------- Background ----------
let gmap = null;
if (GOOGLE_MAPS_API_KEY) {
  const div = document.createElement("div"); div.className = "gmap"; stage.prepend(div);
  window.initGoogleMap = () => {
    gmap = new google.maps.Map(div, {
      mapTypeId: GOOGLE_MAP_TYPE, tilt: 0, disableDefaultUI: true, zoomControl: true, fullscreenControl: true,
      gestureHandling: "greedy", clickableIcons: false,
    });
    const bounds = new google.maps.LatLngBounds();
    BUILDINGS.forEach(b => bounds.extend({ lat: b.lat, lng: b.lng }));
    gmap.fitBounds(bounds, 90);
    // Keep the HTML markers glued to their buildings as the map moves.
    const ov = new google.maps.OverlayView();
    ov.onAdd = () => {}; ov.onRemove = () => {};
    ov.draw = placeMarkers;
    ov.setMap(gmap);
    window.__ov = ov;
    gmap.addListener("bounds_changed", placeMarkers);
    gmap.addListener("dragstart", () => { pinned = null; hide(); });
    gmap.addListener("click", e => {
      if (!stage.classList.contains("edit")) return;
      const txt = `lat: ${e.latLng.lat().toFixed(6)}, lng: ${e.latLng.lng().toFixed(6)}`;
      coordsBox.textContent = txt + "  (copied)"; navigator.clipboard?.writeText(txt).catch(() => {});
    });
  };
  const sc = document.createElement("script");
  sc.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}&callback=initGoogleMap&v=weekly`;
  sc.async = true;
  sc.onerror = () => { div.remove(); stage.prepend(drawSchematicMap()); };
  document.head.appendChild(sc);
  document.querySelector(".hint").textContent = "Hover a building to see its scorecard · Drag to pan, scroll to zoom";
} else if (AERIAL_IMAGE) {
  const img = new Image(); img.src = AERIAL_IMAGE; img.alt = "Aerial view of downtown";
  // Match the map frame to the image's shape so hotspot % positions line up exactly
  img.onload = () => stage.style.setProperty("--ratio", img.naturalWidth / img.naturalHeight);
  stage.prepend(img);
  document.querySelector(".hint").textContent = "Hover a building to see its scorecard";
} else {
  stage.prepend(drawSchematicMap());
}

// ---------- Intro orbit video (e.g. from Google Earth Studio) ----------
// Plays once over the map; when it ends it fades out to AERIAL_IMAGE (its last frame) and the hotspots appear.
function playIntro() {
  if (!INTRO_VIDEO) return;
  stage.querySelectorAll("video.intro, .vbtn").forEach(n => n.remove());
  pinned = null; hide();
  const v = document.createElement("video");
  v.className = "intro"; v.src = INTRO_VIDEO; v.muted = true; v.playsInline = true; v.autoplay = true; v.preload = "auto";
  const skip = document.createElement("button"); skip.className = "vbtn"; skip.textContent = "Skip ›";
  const finish = () => {
    if (v.classList.contains("out")) return;
    v.classList.add("out"); skip.remove(); stage.classList.remove("playing");
    setTimeout(() => {
      v.remove();
      const again = document.createElement("button"); again.className = "vbtn"; again.textContent = "↻ Replay flyover";
      again.onclick = e => { e.stopPropagation(); playIntro(); };
      stage.appendChild(again);
    }, 800);
  };
  v.onended = finish; v.onerror = finish;
  skip.onclick = e => { e.stopPropagation(); finish(); };
  stage.classList.add("playing");
  stage.append(v, skip);
  v.play().catch(() => {});
}

function placeMarkers() {
  const proj = window.__ov && window.__ov.getProjection();
  if (!proj) return;
  document.querySelectorAll(".hotspot").forEach((el, i) => {
    const pt = proj.fromLatLngToContainerPixel(new google.maps.LatLng(BUILDINGS[i].lat, BUILDINGS[i].lng));
    el.style.left = pt.x + "px"; el.style.top = pt.y + "px";
    el.style.visibility = pt.x < -20 || pt.y < -20 || pt.x > stage.clientWidth + 20 || pt.y > stage.clientHeight + 20 ? "hidden" : "visible";
  });
}

function drawSchematicMap() {
  // Houston CBD, rotated so north points right. Cross streets run vertically, Bagby→Travis horizontally.
  const W = 1600, H = 1000, R = 15; // R = half road width
  const VX = [110, 280, 450, 620, 790, 960, 1130, 1300, 1470];
  const VN = ["Clay", "Polk", "Dallas", "Lamar", "McKinney", "Walker", "Rusk", "Capitol", "Texas"];
  const HY = [120, 310, 500, 690, 880];
  const HN = ["Bagby St", "Smith St", "Louisiana St", "Milam St", "Travis St"];
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const p = [];
  const xs = [0, ...VX, W], ys = [0, ...HY, H];
  const featured = BUILDINGS.filter(b => !b.campus).map(b => [b.x * W / 100, b.y * H / 100]);
  const campus = BUILDINGS.find(b => b.campus);
  const inCampus = (x0, y0) => campus && y0 >= HY[0] && y0 < HY[1] && x0 >= 0 && x0 < VX[2];

  p.push(`<defs>
    <filter id="sh" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="12" dy="10" stdDeviation="5" flood-color="#000" flood-opacity=".5"/></filter>
    <pattern id="trees" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="9" fill="#3d6a3a"/><circle cx="9" cy="9" r="4" fill="#4f8248"/></pattern>
  </defs>
  <rect width="${W}" height="${H}" fill="#3b414c"/>`);

  for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
    const x0 = xs[i] + (i ? R : 0), x1 = xs[i + 1] - (i + 1 < xs.length - 1 ? R : 0);
    const y0 = ys[j] + (j ? R : 0), y1 = ys[j + 1] - (j + 1 < ys.length - 1 ? R : 0);
    if (j === 0) { // west edge: green space along the bayou side
      p.push(`<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#557f4b"/><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="url(#trees)" opacity=".8"/>`);
      continue;
    }
    p.push(`<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#8b9099"/>`);
    if (inCampus(x0, y0)) continue;
    const ix = x0 + 6, iy = y0 + 6, iw = x1 - x0 - 12, ih = y1 - y0 - 12;
    const f = featured.find(([fx, fy]) => fx > x0 && fx < x1 && fy > y0 && fy < y1);
    if (f) {
      const t = Math.min(iw, ih) * 0.72;
      p.push(`<rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" fill="#777c85"/>
        <g filter="url(#sh)"><rect x="${f[0] - t / 2}" y="${f[1] - t / 2}" width="${t}" height="${t}" rx="4" fill="#c3cbd6"/></g>
        <rect x="${f[0] - t / 2 + 14}" y="${f[1] - t / 2 + 14}" width="${t - 28}" height="${t - 28}" rx="3" fill="#d7dee7"/>`);
      continue;
    }
    const cols = 1 + Math.floor(rnd() * 3), rows = 1 + Math.floor(rnd() * 2);
    const lw = iw / cols, lh = ih / rows;
    for (let a = 0; a < cols; a++) for (let b = 0; b < rows; b++) {
      const pad = 4 + rnd() * 8;
      const x = ix + a * lw + pad, y = iy + b * lh + pad, w = lw - pad * 2, h = lh - pad * 2;
      if (rnd() < 0.15) {
        p.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#555a62"/>`);
        for (let k = x + 6; k < x + w - 4; k += 10) p.push(`<line x1="${k}" y1="${y + 4}" x2="${k}" y2="${y + h / 3}" stroke="#ddd" stroke-width="1.5" opacity=".55"/>`);
        continue;
      }
      const g = 125 + Math.floor(rnd() * 60);
      const tall = rnd() < .35 ? ' filter="url(#sh)"' : "";
      p.push(`<g${tall}><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="rgb(${g},${g + 2},${g + 6})"/></g>`);
      if (rnd() < .6) { const s = 10 + rnd() * 12; p.push(`<rect x="${x + 8 + rnd() * Math.max(1, w - s - 16)}" y="${y + 8 + rnd() * Math.max(1, h - s - 16)}" width="${s}" height="${s}" fill="rgb(${g - 28},${g - 26},${g - 22})"/>`); }
    }
  }

  // Allen Center campus (superblock spanning Clay → Dallas)
  if (campus) {
    const x0 = 6, x1 = VX[2] - R - 6, y0 = HY[0] + R + 6, y1 = HY[1] - R - 6;
    p.push(`<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#7d838c"/>
      <path d="M${x0 + 20} ${(y0 + y1) / 2} H${x1 - 20}" stroke="#a9b0a0" stroke-width="10"/>`);
    [[95, 0.68], [280, 0.78], [395, 0.62]].forEach(([cx, s]) => {
      const t = (y1 - y0) * s;
      p.push(`<g filter="url(#sh)"><rect x="${cx - t / 2}" y="${(y0 + y1) / 2 - t / 2}" width="${t}" height="${t}" rx="4" fill="#c3cbd6"/></g>
        <rect x="${cx - t / 2 + 12}" y="${(y0 + y1) / 2 - t / 2 + 12}" width="${t - 24}" height="${t - 24}" rx="3" fill="#d7dee7"/>`);
    });
  }

  // Lane markings + street labels
  VX.forEach((x, i) => {
    p.push(`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#e0c35a" stroke-width="1.5" stroke-dasharray="14 12" opacity=".55"/>`);
    p.push(`<text x="${x}" y="${H - 22}" transform="rotate(-90 ${x} ${H - 22})" dy="4" class="st">${VN[i]}</text>`);
  });
  HY.forEach((y, i) => {
    p.push(`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#e0c35a" stroke-width="1.5" stroke-dasharray="14 12" opacity=".55"/>`);
    [VX[0] + 85, VX[4] + 85, VX[7] + 85].forEach(x => p.push(`<text x="${x}" y="${y}" dy="4" text-anchor="middle" class="st">${HN[i]}</text>`));
  });
  // Compass (north = right)
  p.push(`<g transform="translate(${W - 70} 52)">
    <circle r="30" fill="#001E5A" stroke="#FFB600" stroke-width="3"/>
    <path d="M-16 0 L14 0 M6 -8 L16 0 L6 8" stroke="#FFB600" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="-12" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Arial">N</text></g>`);
  p.push(`<style>.st{fill:#fff;font:700 13px Arial,sans-serif;letter-spacing:.5px;paint-order:stroke;stroke:#2a303a;stroke-width:4px;}</style>`);

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Schematic map of downtown Houston west side");
  svg.innerHTML = p.join("");
  return svg;
}

// ---------- Hotspots + scorecard ----------
let pinned = null, hideTimer = null;

BUILDINGS.forEach((b, i) => {
  const el = document.createElement("button");
  el.className = "hotspot";
  el.style.left = b.x + "%"; el.style.top = b.y + "%";
  el.setAttribute("aria-label", b.name);
  el.addEventListener("mouseenter", () => { if (!pinned) show(b, el); });
  el.addEventListener("mouseleave", () => { if (!pinned) scheduleHide(); });
  el.addEventListener("focus", () => show(b, el));
  el.addEventListener("click", e => {   // click/tap pins the card open (touch screens)
    e.stopPropagation();
    if (pinned === el) { pinned = null; hide(); return; }
    pinned = el; show(b, el);
  });
  stage.appendChild(el);
});

// keep the card open while the mouse is over it, so the button can be clicked
card.addEventListener("mouseenter", () => clearTimeout(hideTimer));
card.addEventListener("mouseleave", () => { if (!pinned) scheduleHide(); });
card.addEventListener("click", e => e.stopPropagation());
stage.addEventListener("click", () => { if (pinned) { pinned = null; hide(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { pinned = null; hide(); } });
window.addEventListener("resize", () => { pinned = null; hide(); });

let firmsOpen = false;   // law-firm list starts collapsed; stays open once expanded
function show(b, el) {
  clearTimeout(hideTimer);
  requestAnimationFrame(() => {
    const t = card.querySelector(".firms .lbl");
    if (t) t.onclick = e => { e.stopPropagation(); firmsOpen = !firmsOpen; show(b, el); };
  });
  document.querySelectorAll(".hotspot.active").forEach(h => h.classList.remove("active"));
  el.classList.add("active");
  card.innerHTML = `
    <div class="art">${skyline(BUILDINGS.indexOf(b) + 3)}${photoLayer(b)}<div class="price">${rentFmt(b.rent)}<small> /SF</small></div></div>
    <div class="fb">
      <div class="nm">${esc(b.name)}</div><div class="ad">${esc(b.address)}</div>
      <div class="srows">${CATEGORIES.map(c => `<div class="sr"><span>${c.label}</span>${icon(b[c.key].score)}</div>`).join("")}</div>
    </div>
    <div class="firms${firmsOpen ? " open" : ""}">
      <button type="button" class="lbl" aria-expanded="${firmsOpen}"><span>Other law firms<span class="ct">${b.firms.length}</span></span><span class="chev">▾</span></button>
      <ul>${b.firms.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>
    <div class="actions"><a class="btn" href="#building/${b.id}">View Details →</a></div>`;

  const s = stage.getBoundingClientRect(), h = el.getBoundingClientRect();
  const px = h.left - s.left + h.width / 2, py = h.top - s.top + h.height / 2;
  const pw = card.offsetWidth, ph = card.offsetHeight, gap = 24;
  let left = px + gap, top = py - ph / 2;
  if (left + pw > s.width - 8) left = px - gap - pw;
  left = Math.max(8, Math.min(left, s.width - pw - 8));
  top = Math.max(8, Math.min(top, s.height - ph - 8));
  card.style.left = left + "px"; card.style.top = top + "px";
  card.classList.add("show");
}
function scheduleHide() { clearTimeout(hideTimer); hideTimer = setTimeout(hide, 180); }
function hide() {
  card.classList.remove("show");
  document.querySelectorAll(".hotspot.active").forEach(h => h.classList.remove("active"));
}

// ---------- Detail page ----------
function renderDetail(b) {
  const i = BUILDINGS.indexOf(b);
  const prev = BUILDINGS[(i - 1 + BUILDINGS.length) % BUILDINGS.length];
  const next = BUILDINGS[(i + 1) % BUILDINGS.length];
  const counts = { pos: 0, neu: 0, neg: 0 };
  CATEGORIES.forEach(c => counts[b[c.key].score]++);
  const list = arr => `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;

  $("#detailView").innerHTML = `
    <section class="hero"><div class="wrap">
      <div class="hero-top">
        <span style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn ghost" href="#">← Back to Map</a><a class="btn ghost" href="#matrix">View Matrix</a></span>
        <span style="color:rgba(255,255,255,.7);font-size:12px">Building ${i + 1} of ${BUILDINGS.length}</span>
      </div>
      <div class="hero-grid">
        <div style="display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap">${photo(b, "hero-photo")}<div><h2>${esc(b.name)}</h2><div class="addr">${esc(b.address)}</div>
          <div class="tally">
            <span>${icon("pos")} ${counts.pos} Favorable</span>
            <span>${icon("neu")} ${counts.neu} Neutral</span>
            <span>${icon("neg")} ${counts.neg} Unfavorable</span>
          </div></div></div>
        <div class="rentbig"><div class="lbl">Asking Rent (Gross)</div><div class="val">${rentFmt(b.rent)} <small>/ SF</small></div></div>
      </div>
    </div></section>
    <div class="wrap">
      <div class="sections">
        ${CATEGORIES.map(c => {
          const d = b[c.key];
          return `<article class="sec ${d.score}">
            <div class="sh"><h3>${c.label}</h3><span class="rating">${SCORE[d.score].label} ${icon(d.score, "lg")}</span></div>
            <div class="sb">${list(d.detail)}</div></article>`;
        }).join("")}
        <article class="sec firms wide">
          <div class="sh"><h3>Other Law Firms in the Building</h3><span class="rating">${b.firms.length} firms</span></div>
          <div class="sb"><ul class="firm-list">${b.firms.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>
        </article>
      </div>
      <nav class="pager">
        <a href="#building/${prev.id}">← ${esc(prev.name)}</a>
        <a href="#building/${next.id}">${esc(next.name)} →</a>
      </nav>
    </div>`;
}

// ---------- Matrix page: every building side by side ----------
function renderMatrix() {
  const list = arr => `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const tally = b => { const c = { pos: 0, neu: 0, neg: 0 }; CATEGORIES.forEach(k => c[b[k.key].score]++); return c; };
  $("#matrixView").innerHTML = `
    <div class="matrix-head">
      <div><h2>Downtown West Matrix</h2><p>All ${BUILDINGS.length} options side by side · click a building name for full details</p></div>
    </div>
    <div class="mx-scroll"><table class="mx">
      <colgroup><col class="rowhead">${BUILDINGS.map(() => "<col>").join("")}</colgroup>
      <thead><tr><th class="rh">Building</th>${BUILDINGS.map(b => `
        <th class="bh">${photo(b)}<div class="meta"><a class="bname" href="#building/${b.id}">${esc(b.name)}</a><div class="addr">${esc(b.address)}</div></div></th>`).join("")}</tr></thead>
      <tbody>
        <tr class="rentrow"><td class="rh">Asking Rent (Gross)</td>${BUILDINGS.map(b => `<td>${rentFmt(b.rent)} <small>/ SF</small></td>`).join("")}</tr>
        <tr class="tallyrow"><td class="rh">Score Summary</td>${BUILDINGS.map(b => { const c = tally(b);
          return `<td><span class="t">${icon("pos")} ${c.pos}</span><span class="t">${icon("neu")} ${c.neu}</span><span class="t">${icon("neg")} ${c.neg}</span></td>`; }).join("")}</tr>
        ${CATEGORIES.map(c => `<tr><td class="rh">${c.label}</td>${BUILDINGS.map(b => { const d = b[c.key];
          return `<td class="${d.score}"><div class="cell-score">${icon(d.score)} ${SCORE[d.score].label}</div>${list(d.detail)}</td>`; }).join("")}</tr>`).join("")}
        <tr><td class="rh">Other Law Firms</td>${BUILDINGS.map(b => `<td>${list(b.firms)}</td>`).join("")}</tr>
        <tr><td class="rh"></td>${BUILDINGS.map(b => `<td><a class="btn sm" href="#building/${b.id}">View Details →</a></td>`).join("")}</tr>
      </tbody>
    </table></div>`;
}

// ---------- Simple router: #building/<id> shows details, anything else shows the map ----------
function route() {
  const m = location.hash.match(/^#building\/(.+)$/);
  const b = m && BUILDINGS.find(x => x.id === m[1]);
  pinned = null; hide();
  const isMatrix = location.hash === "#matrix";
  document.body.classList.toggle("view-detail", !!b);
  document.body.classList.toggle("view-matrix", isMatrix && !b);
  if (b) renderDetail(b);
  if (isMatrix) renderMatrix();
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on",
    a.dataset.nav === (isMatrix ? "matrix" : b ? "" : "map")));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
playIntro();

// ---------- Coordinate picker: press E, then click the map ----------
document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "e" && !e.metaKey && !e.ctrlKey && !document.body.className.includes("view-")) stage.classList.toggle("edit");
});
stage.addEventListener("click", e => {
  if (!stage.classList.contains("edit")) return;
  const s = stage.getBoundingClientRect();
  const txt = `x: ${((e.clientX - s.left) / s.width * 100).toFixed(2)}, y: ${((e.clientY - s.top) / s.height * 100).toFixed(2)}`;
  coordsBox.textContent = txt + "  (copied)";
  navigator.clipboard?.writeText(txt).catch(() => {});
});
</script>
</body>
