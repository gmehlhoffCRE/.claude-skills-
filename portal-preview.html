}

function CommuteUpload({ onApply, onClose, currentAddr }) {
  const [text, setText] = React.useState('');
  const [office, setOffice] = React.useState(currentAddr || '');
  const [fileName, setFileName] = React.useState('');
  const parsed = parseRosterText(text);
  const approxN = parsed.filter(e => e.approx).length;
  const handleFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setFileName(f.name);
    const r = new FileReader();
    r.onload = () => setText(String(r.result || ''));
    r.readAsText(f);
  };
  const placeholder = '77007, Engineering\n1200 Main St, Houston, TX 77002, Sales\n77024, Finance\n77494';
  return (
    <div className="lightbox" onClick={onClose}>
      <div className="lightbox-card cm-upload-card" onClick={e => e.stopPropagation()}>
        <div className="lightbox-head">
          <div><div className="mono-tag">Commute data</div><div style={{ fontSize: 18, fontWeight: 700, color: 'var(--navy)', marginTop: 2 }}>Upload employee &amp; office locations</div></div>
          <button className="btn ghost sm" onClick={onClose}>✕</button>
        </div>
        <div className="cm-upload-body">
          <div className="cm-up-sec">
            <div className="cm-up-label">Employee home addresses</div>
            <div className="cm-up-hint">One employee per line — include a ZIP; add a team after a comma (optional). Paste from a spreadsheet or upload a CSV.</div>
            <label className="cm-up-file"><input type="file" accept=".csv,.txt" onChange={handleFile} /><span>⬆ Choose CSV / TXT</span>{fileName && <em>{fileName}</em>}</label>
            <textarea className="cm-up-text" rows={7} placeholder={placeholder} value={text} onChange={e => setText(e.target.value)} />
            <div className="cm-up-count">{parsed.length} employee{parsed.length === 1 ? '' : 's'} parsed{approxN ? ' · ' + approxN + ' ZIP' + (approxN === 1 ? '' : 's') + ' outside the preview area (approx.)' : ''}</div>
          </div>
          <div className="cm-up-sec">
            <div className="cm-up-label">Current office location</div>
            <input className="cm-addr-in cm-up-office" placeholder="full address (incl. ZIP)" value={office} onChange={e => setOffice(e.target.value)} />
          </div>
        </div>
        <div className="cm-up-actions">
          <span className="cm-up-note">Preview maps by home ZIP. Production geocodes each full address via Google.</span>
          <span style={{ flex: 1 }} />
          <button className="btn ghost sm" onClick={onClose}>Cancel</button>
          <button className="btn sm" disabled={!parsed.length && !office.trim()} onClick={() => onApply(parsed, office)}>Apply</button>
        </div>
      </div>
    </div>
  );
}

function CommuteView({ buildings, statuses, survey, onOpen }) {
  const [peak, setPeak] = React.useState('am');
  const [dept, setDept] = React.useState('all');
  const [threshold, setThreshold] = React.useState(30);
  const [colorMode, setColorMode] = React.useState('time');    // 'time' | 'dept'
  const [curAddr, setCurAddr] = React.useState('');
  const [current, setCurrent] = React.useState(() => {
    const addr = survey && survey.current_address;
    if (!addr) return null;
    const zm = addr.match(/\b(\d{5})\b/); const c = zm && ZIP_COORDS[zm[1]];
    return { addr: addr.trim(), zip: zm ? zm[1] : null, lat: c ? c.lat : 29.758, lng: c ? c.lng : -95.368, approx: !c, fromSurvey: true };
  });
  const [mapSel, setMapSel] = React.useState(null);
  const [detailFor, setDetailFor] = React.useState(null);      // per-building popup
  const [detailMode, setDetailMode] = React.useState('cmp');   // 'cmp' (vs existing) | 'emp'
  const [detailDept, setDetailDept] = React.useState('all');   // in-popup team filter for the employee list
  const [detailSort, setDetailSort] = React.useState({ key: 'a', dir: 'asc' });
  const [sel2, setSel2] = React.useState([]);                  // up to 2 ids ticked for compare
  const [cmpOpen, setCmpOpen] = React.useState(false);
  const [cmpMode, setCmpMode] = React.useState('sum');         // 'sum' (comparison) | 'emp'
  const [cmpDept, setCmpDept] = React.useState('all');
  const [cmpSort, setCmpSort] = React.useState({ key: 'a', dir: 'asc' });
  const [uploadedRoster, setUploadedRoster] = React.useState(null);  // null = preview sample roster
  const [uploadOpen, setUploadOpen] = React.useState(false);

  const mapBuildings = buildings.filter(b => Number.isFinite(b.lat) && Number.isFinite(b.lng));
  const baseRoster = uploadedRoster || COMMUTE_ROSTER;
  const teams = [...new Set(baseRoster.map(e => e.dept).filter(Boolean))];
  const hasDept = teams.length > 0;
  const roster = dept === 'all' ? baseRoster : baseRoster.filter(e => e.dept === dept);
  const minutesFn = (e, place) => commuteMinutes(e, place, peak);
  const setCurrentFromAddr = (addr) => {
    const zm = addr.match(/\b(\d{5})\b/); const c = zm && ZIP_COORDS[zm[1]];
    setCurrent({ addr: addr.trim(), zip: zm ? zm[1] : null, lat: c ? c.lat : 29.758, lng: c ? c.lng : -95.368, approx: !c });
  };

  const stat = (b) => {
    const mins = roster.map(e => minutesFn(e, b)).filter(Number.isFinite).sort((a, c) => a - c);
    if (!mins.length) return null;
    const med = mins[Math.floor(mins.length / 2)];
    const avg = Math.round(mins.reduce((s, m) => s + m, 0) / mins.length);
    const within = Math.round(mins.filter(m => m <= threshold).length / mins.length * 100);
    const hrsWk = Math.round(mins.reduce((s, m) => s + m, 0) * 2 * 5 / 60);
    const good = mins.filter(m => m <= threshold).length, mid = mins.filter(m => m > threshold && m <= threshold + 15).length, far = mins.length - good - mid;
    const pct = (n) => n / mins.length * 100;
    let savedVsCur = null;
    if (current) savedVsCur = Math.round((roster.reduce((s, e) => s + minutesFn(e, current), 0) * 2 * 5 / 60) - hrsWk);
    return { med, avg, within, hrsWk, savedVsCur, bands: { good: pct(good), mid: pct(mid), far: pct(far), gc: good, mc: mid, fc: far } };
  };
  const rows = mapBuildings.map(b => ({ b, s: stat(b) })).filter(r => r.s);   // shared active order — matches every other view
  const bestId = rows.length ? rows.reduce((best, r) => (r.s.avg < best.s.avg ? r : best)).b.id : null;
  const mapSelId = mapSel && rows.some(r => r.b.id === mapSel) ? mapSel : bestId;

  const toggleSel = (id) => setSel2(prev => prev.includes(id) ? prev.filter(x => x !== id) : (prev.length >= 2 ? [prev[1], id] : [...prev, id]));
  const nameOf = (id) => (mapBuildings.find(b => b.id === id) || {}).name || '—';

  const h2hBetween = (A, B) => {
    let better = 0, same = 0, worse = 0;
    roster.forEach(e => { const d = minutesFn(e, A) - minutesFn(e, B); if (d <= -5) better++; else if (d >= 5) worse++; else same++; });
    return { better, same, worse, total: roster.length };
  };

  const rosterDepts = teams.filter(d => baseRoster.some(e => e.dept === d));
  const detailBldg = detailFor && mapBuildings.find(b => b.id === detailFor);
  const detailStat = detailBldg && stat(detailBldg);
  const detailPeople = detailBldg ? roster.map(e => { const a = minutesFn(e, detailBldg); const b = current ? minutesFn(e, current) : null; return { e, a, b, diff: b != null ? a - b : null }; }) : [];
  const curStat = current && stat(current);

  // Shared per-employee table (filter + sort + zebra). aVal/bVal resolve minutes;
  // bLabel null → single-column mode (no B/Change). Same look in both popups.
  const renderEmpTable = ({ people, aLabel, bLabel, dept: pd, setDept: setPd, sort, setSort, foot }) => {
    const filtered = (pd !== 'all' && rosterDepts.includes(pd)) ? people.filter(p => p.e.dept === pd) : people;
    const key = ((sort.key === 'b' || sort.key === 'change') && !bLabel) ? 'a' : sort.key;
    const sorted = [...filtered].sort((x, y) => {
      const dir = sort.dir === 'asc' ? 1 : -1;
      if (key === 'team') return dir * ((x.e.dept || '').localeCompare(y.e.dept || ''));
      const v = (r) => key === 'zip' ? +r.e.zip : key === 'b' ? r.b : key === 'change' ? r.diff : r.a;
      return dir * (v(x) - v(y));
    });
    const arrow = (k) => sort.key === k ? (sort.dir === 'asc' ? ' ↑' : ' ↓') : '';
    const by = (k) => setSort(s => (s.key === k ? { key: k, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key: k, dir: 'asc' }));
    return (
      <>
        {hasDept && rosterDepts.length > 1 && (
          <div className="cm-emp-filter">
            <label className="cm-field"><span>Team</span>
              <select value={rosterDepts.includes(pd) ? pd : 'all'} onChange={e => setPd(e.target.value)}>
                <option value="all">All teams ({people.length})</option>
                {rosterDepts.map(d => <option key={d} value={d}>{d} ({people.filter(p => p.e.dept === d).length})</option>)}
              </select>
            </label>
            <span className="cm-emp-count">{sorted.length} of {people.length} shown</span>
          </div>
        )}
        <div className="cm-people-body">
          <table className="cm-people-table">
            <thead><tr>
              <th>#</th>
              <th className="cm-sort" onClick={() => by('zip')}>Home ZIP{arrow('zip')}</th>
              {hasDept && <th className="cm-sort" onClick={() => by('team')}>Team{arrow('team')}</th>}
              <th className="cm-sort" onClick={() => by('a')}>{aLabel}{arrow('a')}</th>
              {bLabel && <th className="cm-sort" onClick={() => by('b')}>{bLabel}{arrow('b')}</th>}
              {bLabel && <th className="cm-sort" onClick={() => by('change')}>Change{arrow('change')}</th>}
            </tr></thead>
            <tbody>
              {sorted.map(({ e, a, b, diff }, i) => (
                <tr key={e.id}><td className="cm-p-i">{i + 1}</td><td>{e.zip}</td>{hasDept && <td>{e.dept}</td>}<td className="cm-p-m">{a} min</td>{bLabel && <td>{b} min</td>}{bLabel && <td className={diff < 0 ? 'cm-good' : diff > 0 ? 'cm-bad' : ''}>{diff < 0 ? diff + ' min' : diff > 0 ? '+' + diff + ' min' : '0 min'}</td>}</tr>
              ))}
            </tbody>
          </table>
        </div>
        {foot && <div className="cm-emp-foot">{foot}</div>}
      </>
    );
  };
  const detailH2h = detailBldg && current ? h2hBetween(detailBldg, current) : null;

  // Two-building comparison popup (checkbox selection).
  const cmpA = cmpOpen && sel2[0] && mapBuildings.find(b => b.id === sel2[0]);
  const cmpB = cmpOpen && sel2[1] && mapBuildings.find(b => b.id === sel2[1]);
  const cmpStatA = cmpA && stat(cmpA), cmpStatB = cmpB && stat(cmpB);
  const cmpH2h = (cmpA && cmpB) ? h2hBetween(cmpA, cmpB) : null;
  const cmpPeople = (cmpA && cmpB) ? roster.map(e => { const a = minutesFn(e, cmpA); const b = minutesFn(e, cmpB); return { e, a, b, diff: a - b }; }) : [];
  const peakLabel = peak === 'off' ? 'Off-peak' : peak.toUpperCase();

  // Shared comparison body — metric table + per-side distributions + where-each-lands + summary.
  const compareBody = (aName, sA, bName, sB, h2h) => (
    <>
      <table className="cm-cmp-table">
        <thead><tr><th>Metric</th><th>{aName}</th><th>{bName}</th><th>Advantage</th></tr></thead>
        <tbody>
          {[
            ['Avg drive', sA.avg, sB.avg, sA.avg + ' min', sB.avg + ' min', 'min', 'lower'],
            ['Median', sA.med, sB.med, sA.med + ' min', sB.med + ' min', 'min', 'lower'],
            ['Within ' + threshold + ' min', sA.within, sB.within, sA.within + '%', sB.within + '%', 'pp', 'higher'],
            ['Team hrs/wk', sA.hrsWk, sB.hrsWk, sA.hrsWk.toLocaleString(), sB.hrsWk.toLocaleString(), 'hrs', 'lower'],
          ].map(([m, va, vb, a, bb, unit, dir]) => {
            const mag = Math.abs(va - vb);
            const aBetter = dir === 'lower' ? va < vb : va > vb;
            return (
              <tr key={m}><td className="cm-cmp-m">{m}</td>
                <td className={aBetter && mag ? 'cm-cmp-win' : ''}>{a}</td>
                <td className={!aBetter && mag ? 'cm-cmp-win' : ''}>{bb}</td>
                <td className="cm-cmp-d">{mag ? <><b>{aBetter ? aName : bName}</b> by {mag.toLocaleString()} {unit}</> : 'Even'}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div className="cm-cmp-sec">Commute distribution</div>
      {[[aName, sA], [bName, sB]].map(([nm, st]) => (
        <div className="cm-cmp-distrow" key={nm}>
          <div className="cm-cmp-distname">{nm}</div>
          <div className="dist-bar cm-cmp-distbar" title={`≤${threshold}m ${st.bands.gc} · ${threshold}–${threshold + 15}m ${st.bands.mc} · ${threshold + 15}m+ ${st.bands.fc} people`}>
            <span style={{ width: st.bands.good + '%', background: 'var(--navy)' }}>{st.bands.gc || ''}</span>
            <span style={{ width: st.bands.mid + '%', background: '#0056DA' }}>{st.bands.mc || ''}</span>
            <span style={{ width: st.bands.far + '%', background: 'var(--gold)' }}>{st.bands.fc || ''}</span>
          </div>
          <div className="cm-cmp-distpct">{Math.round(st.bands.good)}% ≤ {threshold}m</div>
        </div>
      ))}
      <div className="cm-cmp-distlegend"><span><i style={{ background: 'var(--navy)' }} />≤ {threshold} min</span><span><i style={{ background: '#0056DA' }} />{threshold + 1}–{threshold + 15}</span><span><i style={{ background: 'var(--gold)' }} />{threshold + 15}+</span></div>
      <div className="cm-cmp-sec">Where each employee lands — {aName} vs {bName}</div>
      {[['better', 'good', `5+ min shorter at ${aName}`], ['same', 'mid', 'Within 5 min either way'], ['worse', 'bad', `5+ min shorter at ${bName}`]].map(([k, tone, lbl]) => (
        <div className="cm-h2h-row" key={k}>
          <div className="cm-h2h-lbl">{lbl}</div>
          <div className="cm-h2h-track"><div className={'cm-h2h-fill ' + tone} style={{ width: (h2h[k] / h2h.total * 100) + '%' }} /></div>
          <div className="cm-h2h-cnt">{h2h[k]} <span>({Math.round(h2h[k] / h2h.total * 100)}%)</span></div>
        </div>
      ))}
      <div className="cm-h2h-summary">{h2h.better > h2h.worse
        ? <><b>{aName}</b> gives a shorter commute to <b>{h2h.better}</b> of {h2h.total} employees{sA.hrsWk !== sB.hrsWk ? <> and saves the team <b>{Math.abs(sB.hrsWk - sA.hrsWk).toLocaleString()} hrs/week</b></> : ''}.</>
        : h2h.worse > h2h.better
          ? <><b>{bName}</b> gives a shorter commute to <b>{h2h.worse}</b> of {h2h.total} employees{sA.hrsWk !== sB.hrsWk ? <> and saves the team <b>{Math.abs(sB.hrsWk - sA.hrsWk).toLocaleString()} hrs/week</b></> : ''}.</>
          : <>The two are effectively even across the team.</>}</div>
    </>
  );

  return (
    <div className="commute-wrap page-fade">
      <div className="commute-head">
        <div className="commute-controls">
          <button className="btn subtle sm cm-upload-btn" onClick={() => setUploadOpen(true)}>⬆ Upload roster</button>
          {uploadedRoster && (
            <span className="cm-roster-tag">{baseRoster.length} uploaded<button onClick={() => { setUploadedRoster(null); setDept('all'); }} aria-label="Reset to sample roster">✕</button></span>
          )}
          {hasDept && (
            <label className="cm-field"><span>Team</span>
              <select value={dept} onChange={e => setDept(e.target.value)}>
                <option value="all">All employees ({baseRoster.length})</option>
                {teams.map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            </label>
          )}
          <label className="cm-field cm-slider"><span>Within</span>
            <input type="range" min="10" max="60" step="5" value={threshold} onChange={e => setThreshold(+e.target.value)} />
            <b>{threshold} min</b>
          </label>
          {current ? (
            <span className="cm-cur" title={current.addr}>★ {current.zip || current.addr}{current.approx ? ' (approx)' : ''}<button onClick={() => { setCurrent(null); setCurAddr(''); }} aria-label="Clear existing office">✕</button></span>
          ) : (
            <form className="cm-field cm-addr" onSubmit={e => { e.preventDefault(); if (curAddr.trim()) setCurrentFromAddr(curAddr); }}>
              <span>Existing office</span>
              <input className="cm-addr-in" placeholder="full address (incl. ZIP)" value={curAddr} onChange={e => setCurAddr(e.target.value)} />
              <button className="btn subtle sm" type="submit">Map ★</button>
            </form>
          )}
        </div>
      </div>

      {current && curStat && (
        <div className="commute-quickcmp">
          <div className="cqc-head">
            <span className="cqc-title">Quick comparison</span>
            <span className="cqc-sub">vs current office{current.zip ? ' · ' + current.zip : ''}{current.fromSurvey ? ' · from survey' : ''} — {curStat.avg} min avg · {curStat.within}% within {threshold}</span>
          </div>
          <div className="cqc-chips">
            {rows.map(({ b, s }) => {
              const d = s.avg - curStat.avg;
              return (
                <span className="cqc-chip" key={b.id} title={b.name + ': ' + s.avg + ' min avg vs current ' + curStat.avg + ' min'}>
                  <b>{b.name}</b>
                  <em className={d < 0 ? 'g' : d > 0 ? 'r' : ''}>{d < 0 ? d + ' min' : d > 0 ? '+' + d + ' min' : 'even'}</em>
                </span>
              );
            })}
          </div>
        </div>
      )}

      <div className="commute-body">
        <div className="commute-scroll">
          <div className="cm-tablebar">
            {sel2.length < 2
              ? <span className="cm-selhint">Tick two buildings <b>☑</b> to run a detailed head-to-head →</span>
              : <span className="cm-selhint on"><b>{nameOf(sel2[0])}</b> vs <b>{nameOf(sel2[1])}</b></span>}
            {sel2.length > 0 && (
              <span className="cm-selactions">
                {sel2.length === 2 && <button className="btn sm" onClick={() => { setCmpMode('sum'); setCmpOpen(true); }}>Compare →</button>}
                <button className="btn ghost sm" onClick={() => setSel2([])}>Clear</button>
              </span>
            )}
          </div>
          <table className="commute-table">
            <thead>
              <tr>
                <th className="c-chk"></th>
                <th className="c-bldg">Building</th>
                <th className="c-num">Avg drive</th>
                <th className="c-num">&lt; {threshold} min</th>
                <th className="c-dist">Distribution</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {rows.map(({ b, s }) => (
                <tr key={b.id} className={(b.id === mapSelId ? 'sel ' : '') + (b.id === bestId ? 'best ' : '') + (sel2.includes(b.id) ? 'ticked' : '')} onClick={() => setMapSel(b.id)}>
                  <td className="c-chk" onClick={e => e.stopPropagation()}>
                    <label className="cm-check"><input type="checkbox" checked={sel2.includes(b.id)} onChange={() => toggleSel(b.id)} aria-label={'Select ' + b.name + ' to compare'} /><span /></label>
                  </td>
                  <td className="c-bldg">
                    <div className="commute-cell-bldg">
                      <span className="cm-pin">{buildings.indexOf(b) + 1}</span>
                      <div>
                        <div className="commute-name">{b.name}{b.id === bestId && <span className="best-tag">★ BEST</span>}</div>
                        <div className="commute-sub">{b.submarket}</div>
                      </div>
                    </div>
                  </td>
                  <td className="c-num">{s.avg} <span className="cm-min">min</span></td>
                  <td className="c-num">{s.within}%</td>
                  <td className="c-dist">
                    <div className="dist-bar" title={`≤${threshold}m ${s.bands.gc} · ${threshold}–${threshold + 15}m ${s.bands.mc} · ${threshold + 15}m+ ${s.bands.fc} people`}>
                      <span style={{ width: s.bands.good + '%', background: 'var(--navy)' }}>{s.bands.gc || ''}</span>
                      <span style={{ width: s.bands.mid + '%', background: '#0056DA' }}>{s.bands.mc || ''}</span>
                      <span style={{ width: s.bands.far + '%', background: 'var(--gold)' }}>{s.bands.fc || ''}</span>
                    </div>
                  </td>
                  <td className="c-act"><button className="btn subtle sm" onClick={(e) => { e.stopPropagation(); setDetailMode('cmp'); setDetailFor(b.id); }}>Details</button></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="commute-legend">
            <span><i style={{ background: 'var(--navy)' }} />≤ {threshold} min</span>
            <span><i style={{ background: '#0056DA' }} />{threshold + 1}–{threshold + 15} min</span>
            <span><i style={{ background: 'var(--gold)' }} />{threshold + 15}+ min</span>
            <span className="commute-src">{uploadedRoster ? 'Uploaded roster' : 'Preview roster'} ({roster.length}) · est. from home ZIP → building. Production: Google Distance Matrix.</span>
          </div>
        </div>

        <div className="commute-mapcol">
          <div className="cm-map-head">
            <span className="cm-map-title">Employee map</span>
            {hasDept && (
              <div className="seg cm-colorseg">
                <button className={'seg-btn' + (colorMode === 'time' ? ' on' : '')} onClick={() => setColorMode('time')}>Drive time</button>
                <button className={'seg-btn' + (colorMode === 'dept' ? ' on' : '')} onClick={() => setColorMode('dept')}>Team</button>
              </div>
            )}
          </div>
          <CommuteMap buildings={mapBuildings} employees={roster} selectedId={mapSelId} current={current} peak={peak} threshold={threshold} minutesFn={(e, b) => minutesFn(e, b)} onSelect={setMapSel} colorMode={colorMode} teams={teams} deptColor={(n) => deptColorOf(n, teams)} />
        </div>
      </div>

      {detailBldg && detailStat && (
        <div className="lightbox" onClick={() => setDetailFor(null)}>
          <div className="lightbox-card cm-cmp-card" onClick={e => e.stopPropagation()}>
            <div className="lightbox-head">
              <div>
                <div className="mono-tag">Commute detail · {roster.length} employees</div>
                <div style={{ fontSize: 19, fontWeight: 700, color: 'var(--navy)', marginTop: 2 }}>{detailBldg.name}{detailMode === 'cmp' && current && <span style={{ color: 'var(--ink-4)', fontWeight: 600 }}> vs Existing office</span>}</div>
              </div>
              <button className="btn ghost sm" onClick={() => setDetailFor(null)}>✕</button>
            </div>
            <div className="cm-cmp-body">
              <div className="seg cm-detail-seg">
                <button className={'seg-btn' + (detailMode === 'cmp' ? ' on' : '')} onClick={() => setDetailMode('cmp')}>{current ? 'vs Existing office' : 'Overview'}</button>
                <button className={'seg-btn' + (detailMode === 'emp' ? ' on' : '')} onClick={() => setDetailMode('emp')}>By employee</button>
              </div>

              {detailMode === 'cmp' ? (
                current && curStat && detailH2h
                  ? compareBody(detailBldg.name, detailStat, 'Existing office', curStat, detailH2h)
                  : (
                    <>
                      <div className="cm-detail-stats">
                        <div className="cm-ds"><div className="l">Avg drive</div><div className="v">{detailStat.avg}<span> min</span></div></div>
                        <div className="cm-ds"><div className="l">Median</div><div className="v">{detailStat.med}<span> min</span></div></div>
                        <div className="cm-ds"><div className="l">Within {threshold} min</div><div className="v">{detailStat.within}%</div></div>
                        <div className="cm-ds"><div className="l">Team hrs/wk</div><div className="v">{detailStat.hrsWk.toLocaleString()}</div><div className="s">round-trip</div></div>
                      </div>
                      <div className="cm-detail-note">Add your <b>existing office</b> in the top bar to compare this building head-to-head against your current commute.</div>
                    </>
                  )
              ) : (
                renderEmpTable({ people: detailPeople, aLabel: 'Est. Commute', bLabel: current ? 'Current Commute' : null, dept: detailDept, setDept: setDetailDept, sort: detailSort, setSort: setDetailSort })
              )}
            </div>
            <div className="lightbox-foot" style={{ fontSize: 11, color: 'var(--ink-4)' }}>Home ZIPs only — individual identities are never shown.{current && detailMode === 'emp' && ' Change = this building vs current office · −min (green) shorter here, +min (red) longer.'}</div>
          </div>
        </div>
      )}

      {cmpOpen && cmpA && cmpB && cmpStatA && cmpStatB && cmpH2h && (
        <div className="lightbox" onClick={() => setCmpOpen(false)}>
          <div className="lightbox-card cm-cmp-card" onClick={e => e.stopPropagation()}>
            <div className="lightbox-head">
              <div><div className="mono-tag">Head-to-head · {roster.length} employees</div><div style={{ fontSize: 19, fontWeight: 700, color: 'var(--navy)', marginTop: 2 }}>{cmpA.name} <span style={{ color: 'var(--ink-4)', fontWeight: 600 }}>vs</span> {cmpB.name}</div></div>
              <button className="btn ghost sm" onClick={() => setCmpOpen(false)}>✕</button>
            </div>
            <div className="cm-cmp-body">
              <div className="seg cm-detail-seg">
                <button className={'seg-btn' + (cmpMode === 'sum' ? ' on' : '')} onClick={() => setCmpMode('sum')}>Comparison</button>
                <button className={'seg-btn' + (cmpMode === 'emp' ? ' on' : '')} onClick={() => setCmpMode('emp')}>By employee</button>
              </div>
              {cmpMode === 'sum'
                ? compareBody(cmpA.name, cmpStatA, cmpB.name, cmpStatB, cmpH2h)
                : renderEmpTable({ people: cmpPeople, aLabel: cmpA.name, bLabel: cmpB.name, dept: cmpDept, setDept: setCmpDept, sort: cmpSort, setSort: setCmpSort })}
            </div>
            {cmpMode === 'emp' && <div className="lightbox-foot" style={{ fontSize: 11, color: 'var(--ink-4)' }}>Home ZIPs only — individual identities are never shown. Change = {cmpA.name} vs {cmpB.name} · −min (green) shorter at {cmpA.name}, +min (red) longer.</div>}
          </div>
        </div>
      )}

      {uploadOpen && (
        <CommuteUpload
          currentAddr={current ? current.addr : ''}
          onClose={() => setUploadOpen(false)}
          onApply={(rosterArr, officeAddr) => {
            if (rosterArr && rosterArr.length) { setUploadedRoster(rosterArr); setDept('all'); setDetailDept('all'); setCmpDept('all'); }
            if (officeAddr && officeAddr.trim()) setCurrentFromAddr(officeAddr);
            setUploadOpen(false);
          }}
        />
      )}
    </div>
  );
}

function CompareView({ buildings, matrixView, statuses, interactive, onVote, onOpen, onReorder, onOpenReorder }) {
  // Column order is the shared app order (buildings already arrives ordered).
  // Removing a building from the comparison is view-only (local hidden set).
  const [hidden, setHidden] = React.useState({});
  const [diffOnly, setDiffOnly] = React.useState(false);
  const order = buildings.map(b => b.id);
  const displayed = buildings.filter(b => !hidden[b.id]);
  const removeCol = (id) => setHidden(h => ({ ...h, [id]: true }));
  const addCol = (id) => setHidden(h => { const n = { ...h }; delete n[id]; return n; });
  const resetCols = () => setHidden({});
  const hiddenBuildings = buildings.filter(b => hidden[b.id]);
  const hiddenCount = hiddenBuildings.length;

  // Drag-to-reorder columns by grabbing a building's image → persists the new
  // order app-wide via onReorder (also reflected on the map, list and pager).
  const [dragId, setDragId] = React.useState(null);
  const [overId, setOverId] = React.useState(null);
  const dropOn = (targetId) => {
    if (!dragId || dragId === targetId) { setDragId(null); setOverId(null); return; }
    const o = order.filter(id => id !== dragId);
    const at = o.indexOf(targetId);
    o.splice(at < 0 ? o.length : at, 0, dragId);
    onReorder && onReorder(o); setDragId(null); setOverId(null);
  };

  const fitToScreen = displayed.length <= 8;
  const propWidth = fitToScreen ? `calc((100% - 200px) / ${Math.max(displayed.length, 1)})` : '228px';
  const isShort = (b) => statuses[b.id]?.vote === 'up';
  const isDown = (b) => statuses[b.id]?.vote === 'down';
  const colClass = (b) => (isShort(b) ? ' is-short' : '') + (isDown(b) ? ' is-down' : '');

  // Compare uses the same data points as the building detail page, derived from
  // the building records. Suite-level fields are shown as min–max ranges;
  // strings stay verbatim (parsing is only used to pick the range endpoints).
  const parseN = (v) => { const m = String(v || '').replace(/[$,]/g, '').match(/\d[\d.]*/); return m ? parseFloat(m[0]) : NaN; };
  // Strip a trailing lease-structure token off a rent string ("$42.50 FS" →
  // "$42.50") — the structure now lives in its own "Lease Structure" row.
  const cleanRent = (v) => String(v || '').replace(/\s*(FSG|FS|NNN|MG|IG|Full Service|Modified Gross|Industrial Gross|Gross)\s*$/i, '').trim();
  const rangeOf = (arr) => {
    const items = arr.map(v => ({ v, n: parseN(v) })).filter(x => !isNaN(x.n));
    if (!items.length) return '—';
    const lo = items.reduce((a, b) => b.n < a.n ? b : a);
    const hi = items.reduce((a, b) => b.n > a.n ? b : a);
    return lo.v === hi.v ? lo.v : lo.v + '–' + hi.v;
  };
  const leaseStructOf = (b) => { const t = [...new Set((b.spaces || []).map(s => s.lease).filter(Boolean))]; return t.length ? t.join(' / ') : '—'; };
  const builtOf = (b) => [b.year_built, b.year_renovated].filter(Boolean).join(' / ') || '—';
  const parkCostOf = (b) => [b.parking_reserved && 'Res ' + b.parking_reserved, b.parking_unreserved && 'Unres ' + b.parking_unreserved].filter(Boolean).join(' / ') || '—';
  const monthlyRange = (b) => {
    const vals = (b.spaces || []).map(s => {
      const per = !isNaN(parseN(s.total)) ? parseN(s.total) : parseN(s.rate);
      const sf = parseN(s.sf);
      return (!isNaN(per) && !isNaN(sf)) ? Math.round(per * sf / 12) : NaN;
    }).filter(n => !isNaN(n));
    if (!vals.length) return '—';
    const f = n => '$' + n.toLocaleString('en-US');
    const lo = Math.min(...vals), hi = Math.max(...vals);
    return lo === hi ? f(lo) : f(lo) + '–' + f(hi);
  };
  const compareRows = [
    { g: 'Building Info', label: 'Submarket', get: b => b.submarket || '—' },
    { g: 'Building Info', label: 'Building Class', get: b => b.class ? 'Class ' + b.class : '—' },
    { g: 'Building Info', label: 'Year Built / Renov.', get: builtOf },
    { g: 'Building Info', label: 'Stories', get: b => b.stories || '—' },
    { g: 'Building Info', label: 'Percent Leased', get: b => b.percent_leased || '—' },
    { g: 'Building Info', label: 'Premises SF', get: b => rangeOf((b.spaces || []).map(s => s.sf)) },
    { g: 'Building Info', label: 'Parking Ratio', get: b => b.parking || '—' },
    { g: 'Building Info', label: 'Parking $/Space/Mo', get: parkCostOf },
    { g: 'Building Info', label: 'Landlord', get: b => b.landlord || '—' },
    { g: 'Economics', label: 'Lease Structure', get: leaseStructOf },
    { g: 'Economics', label: 'Base Rent/SF', get: b => rangeOf((b.spaces || []).map(s => cleanRent(s.rate))) },
    { g: 'Economics', label: 'Est. OpEx/SF', get: b => rangeOf((b.spaces || []).map(s => s.opex)) },
    { g: 'Economics', label: 'Total Rent/SF', get: b => rangeOf((b.spaces || []).map(s => cleanRent(s.total))) },
    { g: 'Economics', label: 'Monthly Rent', get: monthlyRange },
  ];

  const allSame = (r) => displayed.length > 1 && displayed.every(b => r.get(b) === r.get(displayed[0]));
  const visibleRows = diffOnly ? compareRows.filter(r => !allSame(r)) : compareRows;
  const exportCSV = () => {
    const esc = (c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"';
    const lines = [['', ...displayed.map(b => b.name)], ['', ...displayed.map(b => b.address || '')]];
    compareRows.forEach(r => lines.push([r.label, ...displayed.map(b => r.get(b))]));
    const csv = lines.map(row => row.map(esc).join(',')).join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    const a = document.createElement('a'); a.href = url; a.download = 'property-comparison.csv'; a.click();
    URL.revokeObjectURL(url);
  };

  let lastGroup = null;

  return (
    <div className="compare-wrap page-fade">
      {displayed.length > 0 && (
        <div className="compare-toolbar">
          <div className="ctb-group">
            {onOpenReorder && <button className="btn subtle sm" onClick={onOpenReorder}>⇅ Reorder</button>}
            <button className={'ctb-chip' + (diffOnly ? ' on' : '')} onClick={() => setDiffOnly(v => !v)} aria-pressed={diffOnly}>Differences only</button>
            {hiddenCount > 0 && (
              <label className="ctb-field"><span>Add</span>
                <select value="" onChange={(e) => { if (e.target.value) addCol(e.target.value); }}>
                  <option value="">+ Add property…</option>
                  {hiddenBuildings.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                </select>
              </label>
            )}
          </div>
          <div className="ctb-group">
            <button className="btn subtle sm" onClick={exportCSV}>Export CSV</button>
            <button className="btn subtle sm" onClick={() => window.print()}>Export PDF</button>
          </div>
        </div>
      )}
      {displayed.length > 0 ? (
        <table className={'compare-table' + (fitToScreen ? ' compare-table--fit' : '')}>
          <caption className="sr-only">Property comparison — {displayed.map(b => b.name).join(', ')}</caption>
          <thead>
            <tr>
              <th className="compare-row-label"></th>
              {displayed.map((b, i) => (
                <th key={b.id} style={{width: propWidth}}
                    className={(dragId === b.id ? 'col-dragging ' : '') + (overId === b.id && dragId && dragId !== b.id ? 'col-dragover' : '')}
                    onDragOver={(e) => { if (dragId) { e.preventDefault(); if (overId !== b.id) setOverId(b.id); } }}
                    onDrop={(e) => { e.preventDefault(); dropOn(b.id); }}>
                  <div className={'compare-photo' + (isShort(b) ? ' shortlisted-top' : '')}
                       draggable
                       onDragStart={(e) => { setDragId(b.id); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', b.id); }}
                       onDragEnd={() => { setDragId(null); setOverId(null); }}
                       onClick={() => onOpen(b.id)}>
                    <Photo src={b.photos[0]} w={480} label={`#${i+1}`} />
                    {isShort(b) && <span className="cp-badge short">★ Shortlist</span>}
                    {isDown(b) && <span className="cp-badge pass">Remove</span>}
                    <div className="cp-view">View details →</div>
                    <div className="cp-drag"><span className="cp-grip">⠿</span> Drag to reorder</div>
                    <div className="cp-colbar" onClick={(e) => e.stopPropagation()}>
                      <button className="cp-act cp-remove" title="Remove from comparison" onClick={() => removeCol(b.id)}>✕</button>
                    </div>
                  </div>
                </th>
              ))}
            </tr>
            <tr className="compare-name-row">
              <th className="compare-row-label"></th>
              {displayed.map(b => (
                <th key={b.id} scope="col" className={'compare-namecell' + colClass(b)}>
                  <div className="compare-namecell-row">
                    <div className="compare-nameblock" style={{cursor:'pointer'}} onClick={() => onOpen(b.id)}>
                      <div className="compare-name">{b.name}</div>
                      <div className="compare-addr">{b.address}</div>
                    </div>
                    {interactive && (
                      <VoteGroup vote={statuses[b.id]?.vote} onVote={(v) => onVote(b.id, v)} size="xs" />
                    )}
                  </div>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {visibleRows.map((r) => {
              const header = r.g !== lastGroup ? r.g : null;
              lastGroup = r.g;
              return (
                <React.Fragment key={r.label}>
                  {header && (
                    <tr className="compare-grouprow">
                      <td className="compare-row-label">{header}</td>
                      {displayed.map(b => <td key={b.id}></td>)}
                    </tr>
                  )}
                  <tr>
                    <td className="compare-row-label" scope="row">{r.label}</td>
                    {displayed.map(b => <td key={b.id} className={colClass(b).trim()}>{r.get(b)}</td>)}
                  </tr>
                </React.Fragment>
              );
            })}
            {visibleRows.length === 0 && (
              <tr><td className="compare-row-label"></td><td colSpan={displayed.length} className="st-empty">All shown data points are identical across these properties.</td></tr>
            )}
          </tbody>
        </table>
      ) : (
        <div className="empty-state" style={{padding:'40px 20px'}}>
          <div className="empty-state-title">{buildings.length === 0 ? 'No properties to compare' : 'All properties removed from comparison'}</div>
          <div className="empty-state-body">
            {buildings.length === 0
              ? 'Add properties to this survey to compare them side by side.'
              : <a onClick={resetCols} style={{cursor:'pointer', color:'var(--link)', fontWeight:700}}>Restore all {buildings.length} →</a>}
          </div>
        </div>
      )}
      {displayed.length > 0 && (
        <div className="compare-foot">
          <span>Data as of {new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' })} · asking terms</span>
          {hiddenCount > 0 && <a onClick={resetCols}>Show all {buildings.length} →</a>}
        </div>
      )}
    </div>
  );
}
Object.assign(window, { CompareView });
</script>

<script type="text/babel" data-presets="react">
function GateScreen({ spinner, title, message, hint }) {
  return (
    <div className="app" style={{display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh'}}>
      <div style={{textAlign:'center', maxWidth:420, padding:'40px 24px'}}>
        <img src={CRESA_LOGO} alt="Cresa" style={{height:22, marginBottom:24}}/>
        <div className="empty-state-title" style={{fontFamily:'var(--serif)', fontSize:24}}>{title}</div>
        {message && <div className="empty-state-body" style={{marginTop:10}}>{message}</div>}
        {hint && <div className="mono-tag" style={{marginTop:18, opacity:0.7}}>{hint}</div>}
        {spinner && <div className="mono-tag" style={{marginTop:18}}><span className="live-dot"/> Loading…</div>}
      </div>
    </div>
  );
}

function App() {
  const gate = useSurvey();
  const sid = gate.phase === 'ready' ? gate.sid : null;
  const uid = gate.phase === 'ready' ? gate.uid : null;

  const votes = useVotes(sid, uid);
  const commentState = useComments(sid);
  const activity = useActivity(sid);

  const [route, setRoute] = React.useState({ name: 'survey-list' });
  const [activeTab, setActiveTab] = React.useState('list');
  const [listView, setListView] = React.useState('spread');   // spread | gallery
  const [sortIx, setSortIx]     = React.useState(0);           // 0 broker · 1 rate · 2 size
  const [showMap, setShowMap]   = React.useState(true);
  // Shared property order (array of ids, or null = broker's default). Set from the
  // Compare view (dropdown or drag) and applied across every view.
  const [propOrder, setPropOrder]   = React.useState(null);
  const [compareSort, setCompareSort] = React.useState('broker');
  const SORTS = ["Broker's order", 'Rate (low → high)', 'Size (large → small)'];

  React.useEffect(() => {
    document.body.setAttribute('data-mode', 'client');
  }, []);

  if (gate.phase === 'loading') return <GateScreen spinner title="Opening your survey" />;
  if (gate.phase === 'error')   return <GateScreen title={gate.title} message={gate.message} hint={gate.hint} />;

  const { survey, buildings } = adaptRecord(gate.sid, gate.record);
  const interactive = votes.enabled || commentState.enabled;

  // Clients see active properties only. Eliminated rows stay in the record —
  // votes / comments / tour history survive — they just never render here.
  const activeUnordered = buildings.filter(b => !b.eliminated);
  // Apply the shared custom order when set; any building not in the saved order
  // (e.g. newly added) falls to the end in its original position.
  const activeBuildings = (() => {
    if (!propOrder) return activeUnordered;
    const byId = {}; activeUnordered.forEach(b => { byId[b.id] = b; });
    const seen = {}; const out = [];
    propOrder.forEach(id => { if (byId[id]) { out.push(byId[id]); seen[id] = 1; } });
    activeUnordered.forEach(b => { if (!seen[b.id]) out.push(b); });
    return out;
  })();

  const statuses = {};
  activeBuildings.forEach(b => {
    statuses[b.id] = { vote: votes.mine[b.id] || null, tally: votes.tally[b.id] || null, eliminated: false };
  });

  const handleVote = (pid, v) => {
    castVote(gate.sid, gate.uid, pid, v).catch(err => console.warn('vote failed:', err.message));
  };
  const handleComment = (pid, body) => {
    addComment(gate.sid, gate.uid, pid, body).catch(err => console.warn('comment failed:', err.message));
  };
  const handleOpenDetail = (id) => { setRoute({ name: 'detail', id }); window.scrollTo(0, 0); };
  const handleNavDetail = (delta) => {
    const cur = activeBuildings.findIndex(b => b.id === route.id);
    const next = (cur + delta + activeBuildings.length) % activeBuildings.length;
    setRoute({ name: 'detail', id: activeBuildings[next].id });
    window.scrollTo(0, 0);
  };

  // Compare-view sort dropdown → writes the shared order (or null to reset).
  const applyCompareSort = (mode) => {
    setCompareSort(mode);
    if (mode === 'broker') { setPropOrder(null); return; }
    if (mode === 'custom') return;
    const num = (v) => { const m = String(v || '').replace(/[$,]/g, '').match(/[\d.]+/); return m ? parseFloat(m[0]) : NaN; };
    const totalOf = (b) => { const xs = (b.spaces || []).map(s => { const t = num(s.total); return isNaN(t) ? num(s.rate) : t; }).filter(n => !isNaN(n)); return xs.length ? Math.min(...xs) : Infinity; };
    const sfOf = (b) => { const xs = (b.spaces || []).map(s => num(s.sf)).filter(n => !isNaN(n)); return xs.length ? Math.max(...xs) : 0; };
    const arr = activeBuildings.slice();
    if (mode === 'shortlist') arr.sort((a, b) => (statuses[b.id]?.vote === 'up' ? 1 : 0) - (statuses[a.id]?.vote === 'up' ? 1 : 0));
    else if (mode === 'rent') arr.sort((a, b) => totalOf(a) - totalOf(b));
    else if (mode === 'sf') arr.sort((a, b) => sfOf(b) - sfOf(a));
    else if (mode === 'name') arr.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
    setPropOrder(arr.map(b => b.id));
  };
  // Drag-to-reorder in Compare → saves that exact order to the shared state.
  const handleManualReorder = (ids) => { setPropOrder(ids); setCompareSort('custom'); };

  // "Custom order" popup — a draggable list with up/down arrows.
  const [reorderOpen, setReorderOpen] = React.useState(false);
  const [dragRow, setDragRow] = React.useState(null);
  const [overRow, setOverRow] = React.useState(null);
  const moveRow = (id, dir) => {
    const o = activeBuildings.map(b => b.id); const i = o.indexOf(id); const j = i + dir;
    if (j < 0 || j >= o.length) return;
    [o[i], o[j]] = [o[j], o[i]];
    handleManualReorder(o);
  };
  const dropRow = (targetId) => {
    if (!dragRow || dragRow === targetId) { setDragRow(null); setOverRow(null); return; }
    const o = activeBuildings.map(b => b.id).filter(x => x !== dragRow);
    const at = o.indexOf(targetId);
    o.splice(at < 0 ? o.length : at, 0, dragRow);
    handleManualReorder(o); setDragRow(null); setOverRow(null);
  };

  const detailBuilding = route.name === 'detail' ? activeBuildings.find(b => b.id === route.id) : null;
  const shortlistedCount = activeBuildings.filter(b => statuses[b.id]?.vote === 'up').length;
  // At-a-glance survey summary (scales to any count of properties).
  const summaryStats = (() => {
    const n = (s) => { const m = String(s || '').replace(/[$,]/g, '').match(/[\d.]+/); return m ? parseFloat(m[0]) : NaN; };
    const rents = activeBuildings.map(b => n(b.spaces && b.spaces[0] && b.spaces[0].rate)).filter(Number.isFinite);
    const sizes = activeBuildings.flatMap(b => (b.spaces || []).map(s => n(s.sf))).filter(Number.isFinite);
    const subs = new Set(activeBuildings.map(b => b.submarket).filter(Boolean));
    const rng = (a, fmt) => a.length ? (Math.min(...a) === Math.max(...a) ? fmt(Math.min(...a)) : fmt(Math.min(...a)) + '–' + fmt(Math.max(...a))) : '—';
    return {
      rent: rng(rents, v => '$' + v),
      size: rng(sizes, v => v.toLocaleString()),
      submarkets: subs.size,
    };
  })();
  const clientName = (PREVIEW && 'Grant') || localStorage.getItem('cresaPortalName.v1') || '';
  const updatedStr = (() => {
    try {
      const d = survey.updated_at && survey.updated_at.toDate ? survey.updated_at.toDate() : null;
      return d ? d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
    } catch { return ''; }
  })();

  return (
    <div className="app">
      <header className="topbar">
       <div className="topbar-inner">
        <div className="brand">
          <img className="brand-logo" src={CRESA_LOGO} alt="Cresa" />
          <div className="brand-divider" />
          <div className="brand-name">{survey.doc_type === 'tour' ? 'Market Tour' : 'Market Survey'}</div>
          {gate.preview && <span className="mono-tag" style={{marginLeft:10, background:'var(--gold)', color:'var(--navy)', fontWeight:700, padding:'3px 7px', borderRadius:4, fontSize:10}}>PREVIEW</span>}
        </div>
        <div className="topbar-right">
          {(route.name === 'survey-list' || route.name === 'detail') && (
            <div className="topbar-tabs">
              <button className={'topbar-tab' + (route.name === 'survey-list' && activeTab === 'list' ? ' active' : '')} onClick={() => { setActiveTab('list'); setRoute({ name: 'survey-list' }); }}>
                Map
              </button>
              <button className={'topbar-tab' + (route.name === 'detail' ? ' active' : '')} onClick={() => { if (activeBuildings[0]) setRoute({ name: 'detail', id: activeBuildings[0].id }); }}>
                Properties
              </button>
              <button className={'topbar-tab' + (route.name === 'survey-list' && activeTab === 'compare' ? ' active' : '')} onClick={() => { setActiveTab('compare'); setRoute({ name: 'survey-list' }); }}>
                Compare
              </button>
              <button className={'topbar-tab' + (route.name === 'survey-list' && activeTab === 'commute' ? ' active' : '')} onClick={() => { setActiveTab('commute'); setRoute({ name: 'survey-list' }); }}>
                Commute
              </button>
              <button className={'topbar-tab' + (route.name === 'survey-list' && activeTab === 'tour' ? ' active' : '')} onClick={() => { setActiveTab('tour'); setRoute({ name: 'survey-list' }); }}>
                Tour
              </button>
            </div>
          )}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div className="avatar client">{initialsOf(clientName) || initialsOf(survey.client_company) || 'C'}</div>
            <div style={{ fontSize: 12, lineHeight: 1.2 }}>
              <div style={{ fontWeight: 500 }}>{clientName || survey.client_company || 'Guest'}</div>
              {clientName && survey.client_company &&
                <div className="muted" style={{ fontFamily: 'var(--mono)', fontSize: 10 }}>{survey.client_company}</div>}
            </div>
          </div>
        </div>
       </div>
      </header>

      {route.name === 'detail' && detailBuilding &&
        <div className="route-fixed">
          <PropertyDetail
            building={detailBuilding}
            allBuildings={activeBuildings}
            statuses={statuses}
            comments={commentState.byPid}
            brokers={survey.brokers}
            interactive={interactive}
            onBack={() => setRoute({ name: 'survey-list' })}
            onNav={handleNavDetail}
            onVote={handleVote}
            onComment={handleComment} />
        </div>
      }

      {route.name === 'survey-list' &&
        <>
          <div className="survey-header">
            <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap' }}>
              <div>
                <h1 className="survey-title">
                  {survey.name || ((survey.city_state ? survey.city_state + ' ' : '') + survey.property_type + ' ' + (survey.doc_type === 'tour' ? 'Tour' : 'Survey'))}
                </h1>
                <div className="survey-meta" style={{ marginTop: 8 }}>
                  <span>{activeBuildings.length} {activeBuildings.length === 1 ? 'candidate' : 'candidates'}</span>
                  <span className="dot" />
                  <span>{shortlistedCount} shortlisted</span>
                  {updatedStr && <><span className="dot" /><span>Updated {updatedStr}</span></>}
                </div>
              </div>
              {activeTab === 'list' && (
                <div className="list-controls">
                  {activeBuildings.length > 1 && (
                    <button className="btn subtle sm" onClick={() => setReorderOpen(true)}>⇅ Reorder</button>
                  )}
                  <div className="seg">
                    <button className={'seg-btn' + (listView === 'spread' ? ' on' : '')} onClick={() => setListView('spread')}>☰ Spread</button>
                    <button className={'seg-btn' + (listView === 'gallery' ? ' on' : '')} onClick={() => setListView('gallery')}>▦ Gallery</button>
                  </div>
                  {listView === 'gallery' && (
                    <span className={'mapchip' + (showMap ? ' on' : '')} onClick={() => setShowMap(!showMap)}>🗺 {showMap ? 'Hide map' : 'Show map'}</span>
                  )}
                </div>
              )}
            </div>
            {activeTab === 'list' && activeBuildings.length > 0 && (
              <div className="survey-summary">
                <div className="ss-item"><div className="ss-val">{summaryStats.rent}<span> /sf</span></div><div className="ss-label">Asking rent</div></div>
                <div className="ss-item"><div className="ss-val">{summaryStats.size}<span> sf</span></div><div className="ss-label">Size range</div></div>
                <div className="ss-item"><div className="ss-val">{summaryStats.submarkets}</div><div className="ss-label">{summaryStats.submarkets === 1 ? 'Submarket' : 'Submarkets'}</div></div>
                <div className="ss-item"><div className="ss-val">{activeBuildings.length}</div><div className="ss-label">{activeBuildings.length === 1 ? 'Candidate' : 'Candidates'}</div></div>
                <div className={'ss-item ss-short' + (shortlistedCount === 0 ? ' empty' : '')}>
                  <div className="ss-val">{shortlistedCount > 0 ? <>{shortlistedCount}<span> of {activeBuildings.length}</span></> : <span className="ss-nudge">★ tap ♥ to add</span>}</div>
                  <div className="ss-label">Shortlisted</div>
                </div>
              </div>
            )}
          </div>

          {activeTab === 'list' && (
            <SurveyListView
              buildings={activeBuildings}
              statuses={statuses}
              matrixView={survey.matrixView}
              interactive={interactive}
              listView={listView}
              sortIx={sortIx}
              showMap={showMap}
              onOpen={handleOpenDetail}
              onVote={handleVote} />
          )}
          {activeTab === 'commute' && (
            <CommuteView
              buildings={activeBuildings}
              statuses={statuses}
              survey={survey}
              onOpen={handleOpenDetail} />
          )}
          {activeTab === 'compare' && (
            <CompareView
              buildings={activeBuildings}
              matrixView={survey.matrixView}
              statuses={statuses}
              interactive={interactive}
              onVote={handleVote}
              onOpen={handleOpenDetail}
              onReorder={handleManualReorder}
              onOpenReorder={() => setReorderOpen(true)} />
          )}
          {activeTab === 'tour' && (
            <TourPanel shortlistedCount={shortlistedCount} />
          )}
          {activeTab === 'activity' && (
            <ActivityTimeline activity={activity} mode="client" />
          )}
        </>
      }

      {reorderOpen && (
        <div className="lightbox" onClick={() => setReorderOpen(false)}>
          <div className="lightbox-card reorder-card" onClick={(e) => e.stopPropagation()}>
            <div className="lightbox-head">
              <div>
                <div className="mono-tag">Property order</div>
                <div style={{fontSize:18, fontWeight:700, color:'var(--navy)', marginTop:2}}>Arrange properties</div>
              </div>
              <button className="btn ghost sm" onClick={() => setReorderOpen(false)}>✕</button>
            </div>
            <div className="reorder-body">
              <div className="reorder-presets">
                {[
                  ['broker', 'Initial order'],
                  ['rent', 'Rent'],
                  ['shortlist', 'Shortlist'],
                  ['custom', 'Manual'],
                ].map(([mode, label]) => (
                  <button key={mode} className={'reorder-preset' + (compareSort === mode ? ' on' : '')} onClick={() => applyCompareSort(mode)}>{label}</button>
                ))}
              </div>
              <div className="reorder-hint">Or drag a row / use the arrows to arrange manually. This order is saved across every view.</div>
              <ul className="reorder-list">
                {activeBuildings.map((b, i) => (
                  <li key={b.id}
                      className={'reorder-item' + (dragRow === b.id ? ' dragging' : '') + (overRow === b.id && dragRow && dragRow !== b.id ? ' dragover' : '')}
                      draggable
                      onDragStart={() => setDragRow(b.id)}
                      onDragOver={(e) => { e.preventDefault(); if (overRow !== b.id) setOverRow(b.id); }}
                      onDrop={(e) => { e.preventDefault(); dropRow(b.id); }}
                      onDragEnd={() => { setDragRow(null); setOverRow(null); }}>
                    <span className="reorder-grip" aria-hidden="true">⠿</span>
                    <span className="reorder-num">{i + 1}</span>
                    <span className="reorder-name">{b.name}<span className="reorder-addr">{b.address}</span></span>
                    <span className="reorder-arrows">
                      <button className="reorder-arrow" disabled={i === 0} onClick={() => moveRow(b.id, -1)} aria-label="Move up">▲</button>
                      <button className="reorder-arrow" disabled={i === activeBuildings.length - 1} onClick={() => moveRow(b.id, 1)} aria-label="Move down">▼</button>
                    </span>
                  </li>
                ))}
              </ul>
            </div>
            <div className="lightbox-foot" style={{display:'flex', justifyContent:'flex-end', alignItems:'center'}}>
              <button className="btn sm" onClick={() => setReorderOpen(false)}>Done</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
