<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cresa Austin Office Options</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script>window.React||document.write('<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"><\/script>')</script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script>window.ReactDOM||document.write('<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"><\/script>')</script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<script>window.Babel||document.write('<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.7/babel.min.js"><\/script>')</script>
<script>
  Babel.registerPreset("react-classic", {
    presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
  });
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; width: 100%; }
  body { font-family: Arial, Helvetica, sans-serif; background: #F6F7FB; color: #0E1220; }
  * { box-sizing: border-box; }
  button, input, select { font-family: inherit; }

  /* ---------- Login gate (same as Houston comps) ---------- */
  .login-screen { position: fixed; inset: 0; background: #F8F9FA; z-index: 9999;
    display: flex; align-items: center; justify-content: center; }
  .login-card { background: #fff; border-radius: 14px; box-shadow: 0 8px 32px rgba(0,30,90,0.18);
    padding: 40px 36px; width: 380px; max-width: 90vw; text-align: center; }
  .login-logo { margin-bottom: 24px; }
  .login-title { font-size: 18px; font-weight: 700; color: #001E5A; margin-bottom: 4px; }
  .login-subtitle { font-size: 13px; color: #8A93A8; margin-bottom: 24px; }
  .login-field { margin-bottom: 14px; text-align: left; }
  .login-field label { display: block; font-size: 11px; font-weight: 600; color: #868E96;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .login-field input { width: 100%; padding: 10px 12px; border: 1.5px solid #DEE2E6; border-radius: 6px;
    font-size: 13px; color: #343A40; background: #fff; }
  .login-field input:focus { outline: none; border-color: #2E6CC7; box-shadow: 0 0 0 3px rgba(46,108,199,0.08); }
  .login-btn { width: 100%; padding: 11px; background: #001E5A; color: #fff; border: none; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px; }
  .login-btn:hover { background: #0A2D6E; }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .login-error { color: #E24B4A; font-size: 12px; margin-top: 10px; display: none; }
  .login-forgot { font-size: 12px; color: #2E6CC7; cursor: pointer; margin-top: 12px;
    display: inline-block; background: none; border: none; }
  .login-forgot:hover { text-decoration: underline; }
  #root { display: none; }
  body.authed #root { display: block; }
  body.authed .login-screen { display: none; }

  /* ---------- App ---------- */
  :root {
    --navy: #001E5A; --navy2: #0A2D6E; --gold: #FFB600; --gold-soft: #FFF3D1;
    --blue-soft: #E8EFF8; --blue-softer: #F4F7FC;
    --ink: #0E1220; --ink2: #2B3350; --ink3: #5A6580; --ink4: #8A93A8;
    --line: #E4E8F0; --line-soft: #EEF1F6; --bg: #F6F7FB; --ok: #1B8F6A; --bad: #C93B3B;
    --shadow1: 0 1px 2px rgba(0,30,90,0.05), 0 1px 3px rgba(0,30,90,0.04);
    --shadow2: 0 2px 6px rgba(0,30,90,0.06), 0 6px 20px rgba(0,30,90,0.08);
    --shadow3: 0 10px 40px rgba(0,30,90,0.18);
  }
  .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .hdr { display: flex; align-items: center; gap: 18px; padding: 0 22px; height: 60px; background: #fff;
    border-bottom: 1px solid var(--line); flex: none; }
  .hdr-logo { height: 22px; display: block; }
  .hdr-sep { width: 1px; height: 26px; background: var(--line); }
  .hdr-title { font-size: 15px; font-weight: 700; color: var(--navy); line-height: 1.15; }
  .hdr-sub { font-size: 11px; color: var(--ink4); letter-spacing: .3px; }
  .hdr-spacer { flex: 1; }
  .tabs { display: flex; gap: 6px; }
  .tab { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; color: var(--ink2); font-size: 13px; font-weight: 600; cursor: pointer; }
  .tab:hover { border-color: #C9D2E3; }
  .tab.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .tab .badge { background: var(--gold); color: var(--navy); border-radius: 10px; font-size: 11px; padding: 1px 7px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; color: var(--ink2); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: #C9D2E3; }
  .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn.gold { background: var(--gold); color: var(--navy); border-color: var(--gold); }
  .btn.sm { padding: 5px 9px; font-size: 12px; }
  .status { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 6px 10px;
    border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.live { background: #E6F5EF; color: var(--ok); }
  .status.loading, .status.cached { background: var(--gold-soft); color: #8A5A00; }
  .status.error { background: #FBE9E9; color: var(--bad); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--blue-soft); color: var(--navy);
    font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }

  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding: 14px 22px 0; flex: none; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow1); }
  .kpi-l { font-size: 10.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--ink4); }
  .kpi-v { font-size: 22px; font-weight: 700; color: var(--navy); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi-v small { font-size: 12px; color: var(--ink3); font-weight: 600; margin-left: 2px; }
  .kpi-s { font-size: 11px; color: var(--ink4); margin-top: 2px; }

  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px 380px 1fr; gap: 14px; padding: 14px 22px 18px; }
  .body.v-table, .body.v-compare { grid-template-columns: 290px 1fr; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow1);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel-h { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line-soft); flex: none; }
  .panel-t { font-size: 13.5px; font-weight: 700; color: var(--navy); }
  .panel-b { flex: 1; overflow: auto; min-height: 0; }

  /* filters */
  .f-sec { padding: 13px 16px; border-bottom: 1px solid var(--line-soft); }
  .f-lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--ink3);
    margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .f-lbl button { background: none; border: none; color: #2E6CC7; font-size: 11px; cursor: pointer; padding: 0; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .search { position: relative; }
  .search input { width: 100%; padding: 9px 10px 9px 32px; border: 1px solid var(--line); border-radius: 7px; font-size: 13px; background: var(--blue-softer); }
  .search input:focus, .rng input:focus { outline: none; border-color: #2E6CC7; background: #fff; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink4); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink2);
    font-size: 12px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
  .chip .n { color: var(--ink4); font-size: 11px; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip.on .n { color: #B9C6E2; }
  .rng { display: flex; align-items: center; gap: 6px; }
  .rng input { width: 100%; min-width: 0; padding: 8px 9px; border: 1px solid var(--line); border-radius: 7px; font-size: 12.5px; background: var(--blue-softer); }
  .rng span { color: var(--ink4); }
  .toggle { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink2); cursor: pointer; padding: 3px 0; }
  .toggle input { width: 15px; height: 15px; accent-color: var(--navy); margin: 0; }
  .amen-list { display: grid; gap: 2px; }
  .amen-list .toggle { font-size: 12.5px; }
  .amen-list .toggle .n { margin-left: auto; color: var(--ink4); font-size: 11px; }
  .f-foot { padding: 12px 16px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; flex: none; }
  .f-foot .btn { flex: 1; justify-content: center; }

  /* list */
  .sort { margin-left: auto; font-size: 12px; color: var(--ink3); display: flex; align-items: center; gap: 6px; }
  .sort select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font-size: 12px; color: var(--ink); background: #fff; }
  .card { display: grid; grid-template-columns: 26px 92px 1fr; gap: 10px; padding: 10px 14px 10px 10px; border-bottom: 1px solid var(--line-soft);
    cursor: pointer; position: relative; }
  .card:hover, .card.hov { background: var(--blue-softer); }
  .card.act { background: var(--blue-soft); }
  .card.act::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); }
  .num { width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .num.sel { background: var(--gold); color: var(--navy); }
  .thumb { width: 92px; height: 66px; border-radius: 6px; object-fit: cover; background: var(--line-soft); display: block; }
  .thumb.ph { display: flex; align-items: center; justify-content: center; color: var(--ink4); font-size: 10px; }
  .c-name { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.25; }
  .c-addr { font-size: 11.5px; color: var(--ink3); margin-top: 1px; }
  .c-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 11.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .c-meta b { color: var(--navy); }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .4px; padding: 2px 6px; border-radius: 4px;
    background: var(--blue-soft); color: var(--navy); text-transform: uppercase; }
  .tag.gold { background: var(--gold-soft); color: #7A4F00; }
  .tag.green { background: #E6F5EF; color: var(--ok); }
  .cmp-box { position: absolute; right: 10px; top: 10px; display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink4); }
  .cmp-box input { accent-color: var(--navy); margin: 0; cursor: pointer; }
  .empty { padding: 40px 20px; text-align: center; color: var(--ink3); font-size: 13px; line-height: 1.5; }

  /* map */
  .map-wrap { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow1); background: #E9EDF5; min-height: 0; }
  .map { position: absolute; inset: 0; }
  .map-ctl { position: absolute; top: 12px; left: 12px; display: flex; background: #fff; border-radius: 8px; box-shadow: var(--shadow2); padding: 3px; z-index: 2; }
  .map-ctl button { border: none; background: none; padding: 7px 12px; font-size: 12px; font-weight: 600; color: var(--ink2); border-radius: 6px; cursor: pointer; }
  .map-ctl button.on { background: var(--gold-soft); color: var(--navy); }
  .map-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink3); font-size: 13px; text-align: center; padding: 30px; }
  .map-detail { position: absolute; left: 12px; bottom: 12px; width: 340px; max-height: calc(100% - 72px); z-index: 3; display: flex; }

  /* detail card */
  .detail { background: #fff; border-radius: 12px; box-shadow: var(--shadow3); overflow: hidden; display: flex; flex-direction: column; max-height: 100%; }
  .detail-photo { position: relative; height: 170px; flex: none; background: var(--line-soft); }
  .detail-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-x { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(0,0,0,.55);
    color: #fff; font-size: 16px; cursor: pointer; line-height: 1; }
  .detail-b { padding: 14px 16px; overflow: auto; }
  .detail-name { font-size: 16px; font-weight: 700; color: var(--navy); }
  .detail-addr { font-size: 12px; color: var(--ink3); margin-top: 2px; }
  .detail-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 12px; }
  .stat-l { font-size: 10px; font-weight: 700; color: var(--ink4); letter-spacing: .6px; text-transform: uppercase; }
  .stat-v { font-size: 13.5px; font-weight: 700; color: var(--ink); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .detail-sec { margin-top: 12px; font-size: 12px; color: var(--ink2); line-height: 1.45; }
  .amen-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .amen-chips span { font-size: 11px; padding: 3px 7px; border-radius: 4px; background: var(--blue-softer); color: var(--ink2); border: 1px solid var(--line-soft); }
  .detail-actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line-soft); flex: none; }
  .detail-actions .btn { flex: 1; justify-content: center; }

  .modal-bg { position: fixed; inset: 0; background: rgba(14,18,32,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg .detail { width: 420px; max-height: 90vh; }

  /* table */
  .tbl-wrap { flex: 1; overflow: auto; min-height: 0; }
  table.tbl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .tbl th { position: sticky; top: 0; background: #F9FAFC; z-index: 1; text-align: left; font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase;
    color: var(--ink3); padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
  .tbl th.r, .tbl td.r { text-align: right; }
  .tbl th .arr { color: var(--navy); margin-left: 3px; }
  .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); color: var(--ink2); font-weight: 400; vertical-align: middle; }
  .tbl.prop td, .tbl.prop td * { color: var(--ink2); font-weight: 400; }
  .tbl.prop td .tsub { font-size: inherit; }
  .tbl.prop td { white-space: nowrap; height: 54px; }
  .tbl.prop td.c-address, .tbl.prop td.c-name { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .tbl.prop td.c-contig { min-width: 240px; }
  .tbl.prop td.c-owner span { display: block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .tbl tr:hover td { background: var(--blue-softer); cursor: pointer; }
  .tbl tr.sel td { background: #FFFBEE; }
  .tbl .tname { font-weight: 700; color: var(--ink); }
  .tbl .tsub { font-size: 11px; color: var(--ink4); }
  .tbl img { width: 54px; height: 38px; object-fit: cover; border-radius: 4px; display: block; }
  .tbl input { accent-color: var(--navy); cursor: pointer; }

  /* compare */
  .cmp-wrap { flex: 1; overflow: auto; min-height: 0; }
  table.cmp { border-collapse: separate; border-spacing: 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .cmp th, .cmp td { padding: 9px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: top; min-width: 200px; max-width: 240px; }
  .cmp th:first-child, .cmp td:first-child { position: sticky; left: 0; background: #F9FAFC; min-width: 170px; z-index: 1;
    font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
  .cmp thead th { position: sticky; top: 0; background: #fff; z-index: 2; text-align: left; }
  .cmp thead th:first-child { z-index: 3; }
  .cmp img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; display: block; }
  .cmp .cname { font-size: 14px; font-weight: 700; color: var(--navy); margin-top: 8px; }
  .cmp .caddr { font-size: 11.5px; color: var(--ink3); font-weight: 400; }
  .cmp .best { color: var(--ok); font-weight: 700; }
  .cmp .best::after { content: " ★"; color: var(--gold); }
  .cmp .grp td { background: var(--blue-softer); font-weight: 700; color: var(--navy); }
  .cmp .grp td:first-child { background: var(--blue-softer); color: var(--navy); }
  .yes { color: var(--ok); font-weight: 700; }
  .no { color: #C5CBD8; }


  /* ---------- page never scrolls on desktop (focus/scrollIntoView can't shift it) ---------- */
  .app { overflow: clip; }
  ::selection { background: #FFE3A3; color: var(--navy); }
  :focus-visible { outline: 2px solid #2E6CC7; outline-offset: 2px; }
  .panel-b::-webkit-scrollbar, .tbl-wrap::-webkit-scrollbar, .cmp-wrap::-webkit-scrollbar { width: 10px; height: 10px; }
  .panel-b::-webkit-scrollbar-thumb, .tbl-wrap::-webkit-scrollbar-thumb, .cmp-wrap::-webkit-scrollbar-thumb { background: #D5DCE8; border-radius: 10px; border: 3px solid #fff; }
  .c-sub { font-size: 11.5px; color: var(--ink3); margin-top: 4px; }
  .c-fit { color: #8A5A00; font-weight: 600; white-space: nowrap; }
  .empty-t { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }

  /* ---------- HTML map pins ---------- */
  .pin-layer { position: absolute; left: 0; top: 0; }
  .pin { position: absolute; left: 0; top: 0; will-change: transform; cursor: pointer; }
  .pin-face { cursor: pointer; }
  .pin-face { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; }
  .pin-tip { position: absolute; left: 0; bottom: 14px; transform: translate(-50%, 4px); background: #fff; color: var(--ink2);
    border-radius: 8px; box-shadow: var(--shadow2); padding: 7px 10px; white-space: nowrap; font: 12px/1.35 Arial, sans-serif;
    opacity: 0; pointer-events: none; transition: opacity .12s ease-out, transform .12s ease-out; z-index: 5; }
  .pin-tip b { display: block; color: var(--navy); font-size: 12.5px; }
  .pin-tip span { display: block; color: var(--ink3); }
  .pin-tip em { display: block; font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--ink4); margin-top: 2px; }
  .pin:hover .pin-tip, .pin.hov .pin-tip { opacity: 1; transform: translate(-50%, 0); }
  .pin:hover, .pin.hov { z-index: 60 !important; }

  .pin-bldg { z-index: 30; }
  .pin-bldg .pin-face { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; border: 2px solid #fff;
    font: 700 11px/1 Arial, sans-serif; box-shadow: 0 1px 3px rgba(0,30,90,.35); transition: width .12s, height .12s, background .12s; }
  .pin-bldg .pin-tip { bottom: 18px; }
  .pin-bldg.sel .pin-face { background: var(--gold); color: var(--navy); }
  .pin-bldg.hov .pin-face { width: 32px; height: 32px; font-size: 12px; }
  .pin-bldg.act { z-index: 50; }
  .pin-bldg.act .pin-face { width: 36px; height: 36px; font-size: 13px; background: var(--gold); color: var(--navy);
    box-shadow: 0 0 0 4px rgba(255,182,0,.28), 0 2px 8px rgba(0,30,90,.35); }

  .pin-comp { z-index: 20; }
  .pin-comp .pin-face { width: 12px; height: 12px; background: #C8102E; border: 2px solid #fff; transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: 0 1px 2px rgba(0,0,0,.3); border-radius: 2px; }
  .pin-comp.hov .pin-face, .pin-comp:hover .pin-face { width: 16px; height: 16px; }

  .pin-office { z-index: 40; }
  .pin-office .pin-face { width: 26px; height: 26px; border-radius: 7px; background: var(--gold); color: var(--navy); border: 2px solid var(--navy);
    box-shadow: 0 2px 6px rgba(0,30,90,.35); }
  .pin-office .pin-tip { bottom: 18px; }

  .pin-emp { z-index: 10; }
  .pin-emp .pin-face { width: 10px; height: 10px; border-radius: 50%; background: var(--c, #0056DA); border: 1.5px solid #fff; opacity: .9;
    box-shadow: 0 0 0 .5px rgba(0,30,90,.25); }
  .pin-emp.band-good .pin-face { --c: var(--navy); }

<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ===================== CONFIG =====================
// Data: Google Sheet -> FirebasePublisher.gs -> Firebase /datasets/<FIREBASE_DATASET>/ -> this page.
const FIREBASE_DB_URL  = "https://project-bf670308-68bc-4a62-863-default-rtdb.firebaseio.com";
const FIREBASE_DATASET = "aus-office-hrgreen"; // must match FB_DATASET in FirebasePublisher.gs
const GOOGLE_MAPS_API_KEY = "AIzaSyAbuuXR2lkGck7cG94qS11CfWWHbLq8AlU";
const LOCAL_CACHE_KEY = "cresa:" + FIREBASE_DATASET + ":v1";
const LOGO = "__LOGO__";
const MAX_COMPARE = 6;
// Only these logins see "Get Google drive times" (each run is billed to the Maps key).
// Their results are saved to Firebase, so every other viewer gets the Google times for free.
const DRIVE_TIME_ADMINS = ["gmehlhoff@cresa.com"].map((e) => e.toLowerCase());
const AUSTIN = { lat: 30.33, lng: -97.77 };

// Known amenity columns. Any column to the right of "Match Note" is also treated as an amenity,
// so new amenity columns added to the sheet show up automatically.
const KNOWN_AMENITIES = ["Fitness Center","Controlled Access","Air Conditioning","Property Manager on Site","Signage",
  "Conferencing Facility","Energy Star Labeled","Shower Facilities","Wheelchair Accessible","Outdoor Seating","Natural Light",
  "Central Heating","24 Hour Access","Food Service","Courtyard","Atrium","Car Charging Station","Restaurant","Balcony",
  "Security System","Banking","Bicycle Storage","Wi-Fi","Accent Lighting","Reception","Convenience Store","Monument Signage",
  "Plug & Play","Storage Space","High Ceilings","Direct Elevator Exposure","Partitioned Offices","Fully Carpeted","Skylights",
  "Waterfront","Energy Performance Rating - A","Roof Terrace","Secure Storage"];

// ===================== PARSING =====================
const num = (v) => {
  if (v == null || v === "") return null;
  if (typeof v === "number") return isFinite(v) ? v : null;
  const s = String(v).replace(/[$,\s]/g, "").replace(/sf$/i, "").replace(/%$/, "");
  if (s === "" || s === "-" || /^n\/?a$/i.test(s)) return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
};
const str = (v) => (v == null ? "" : String(v).trim());
const truthy = (v) => {
  if (v === true) return true;
  if (typeof v === "number") return v > 0;
  return /^(y|yes|true|x|✓|✔|1)$/i.test(str(v));
};
const pct = (v) => {
  const n = num(v);
  if (n == null) return null;
  return n > 0 && n <= 1 && !/%/.test(String(v)) ? n * 100 : n;
};
const normClass = (v) => { const m = str(v).match(/\b([ABC])\b/i) || str(v).match(/^([ABC])/i); return m ? m[1].toUpperCase() : str(v); };
const hasContig = (v) => {
  const s = str(v);
  return !!s && !/^(no|n|none|0|-|—|n\/a|false)$/i.test(s);
};

function rowsFromPayload(data) {
  if (!data || typeof data !== "object") throw new Error("Payload is not an object");
  if (data.error) throw new Error(data.error);
  const rows = data.rows || [];
  if (rows.length && Array.isArray(rows[0]) && Array.isArray(data.headers)) {
    return { headers: data.headers, rows: rows.map((r) => { const o = {}; data.headers.forEach((h, i) => { o[h] = r[i]; }); return o; }) };
  }
  return { headers: rows.length ? Object.keys(rows[0]) : [], rows };
}

function amenityColumns(headers) {
  const i = headers.indexOf("Match Note");
  const after = i >= 0 ? headers.slice(i + 1) : [];
  const set = new Set([...after, ...KNOWN_AMENITIES.filter((a) => headers.includes(a))]);
  return headers.filter((h) => set.has(h));
}

function toBuildings({ headers, rows }) {
  const amenCols = amenityColumns(headers);
  const out = [];
  rows.forEach((r, idx) => {
    const address = str(r["Property Address"]);
    const name = str(r["Property Name"]);
    if (!address && !name) return;
    const amenities = amenCols.filter((a) => truthy(r[a]));
    const yb = num(r["Year Built"]), yr = num(r["Year Renovated"]);
    out.push({
      id: idx + ":" + address,
      address, name: name || address,
      city: str(r["City"]) || "Austin",
      submarket: str(r["Submarket Name"]),
      cls: normClass(r["Building Class"]),
      yearBuilt: yb, yearReno: yr,
      vintage: Math.max(yb || 0, yr || 0) || null,
      stories: num(r["Number of Stories"]),
      rba: num(r["RBA"]),
      leased: pct(r["Percent Leased"]),
      rent: num(r["Avg Rent-Direct (Office)"]),
      opex: num(r["OPEX"]),
      totalRent: num(r["Total Rent"]),
      owner: str(r["Owner Name"]),
      contigText: str(r["Contiguous Suite(s) Over 9,000 SF"]),
      contig: hasContig(r["Contiguous Suite(s) Over 9,000 SF"]),
      lat: num(r["Latitude"]), lng: num(r["Longitude"]),
      amenities,
      amenityCount: num(r["Amenity Count"]) != null ? num(r["Amenity Count"]) : amenities.length,
      photo: null,
    });
  });
  attachPhotos(out);
  return { buildings: out, amenCols };
}

// ===================== PHOTOS (from the CoStar PDFs, matched on address + name) =====================
const PHOTOS = (() => { try { return JSON.parse(document.getElementById("photo-data").textContent); } catch (e) { return []; } })();
const STOP = new Set(["of", "the", "at", "bldg", "building"]);
const ABBR = { north: "n", south: "s", east: "e", west: "w", highway: "hwy", expressway: "expy", parkway: "pky", pkwy: "pky",
  boulevard: "blvd", street: "st", road: "rd", drive: "dr", lane: "ln", avenue: "ave", trail: "trl", terrace: "ter", circle: "cir" };
const toks = (s) => String(s || "").toLowerCase().replace(/&/g, " and ").split(/[^a-z0-9]+/)
  .filter(Boolean).map((t) => ABBR[t] || t).filter((t) => !STOP.has(t));
const addrKey = (s) => toks(s).sort().join(" ");
const nameKey = (s) => toks(s).join(" ");
const overlap = (a, b) => { const A = new Set(toks(a)), B = toks(b); if (!A.size || !B.length) return 0; return B.filter((t) => A.has(t)).length / Math.max(A.size, B.length); };

function attachPhotos(buildings) {
  const byAddr = {};
  PHOTOS.forEach((p) => { (byAddr[addrKey(p.a)] = byAddr[addrKey(p.a)] || []).push(p); });
  const res = buildings.map((b) => {
    const cands = byAddr[addrKey(b.address)] || [];
    if (cands.length === 1) return { best: cands[0], sure: true, cands };
    if (cands.length > 1) {
      const exact = cands.find((p) => nameKey(p.n) === nameKey(b.name));
      if (exact) return { best: exact, sure: true, cands };
      const ranked = cands.slice().sort((x, y) => overlap(b.name, y.n) - overlap(b.name, x.n));
      // A tie means the name can't tell the buildings at this address apart.
      return { best: ranked[0], sure: overlap(b.name, ranked[0].n) > overlap(b.name, ranked[1].n), cands };
    }
    const byName = PHOTOS.find((p) => p.n && nameKey(p.n) === nameKey(b.name)) || null; // address typo fallback
    return { best: byName, sure: !!byName, cands };
  });
  // Elimination: at a shared address, if every other building is matched for sure, the one left is this one.
  res.forEach((r, i) => {
    if (r.sure || r.cands.length < 2) return;
    const sameAddr = res.filter((o, j) => j !== i && o.cands === r.cands);
    const claimed = new Set(sameAddr.filter((o) => o.sure).map((o) => o.best));
    const left = r.cands.filter((p) => !claimed.has(p));
    const unsureHere = sameAddr.filter((o) => !o.sure).length;
    if (left.length === 1 && unsureHere === 0) { r.best = left[0]; r.sure = true; }
  });
  buildings.forEach((b, i) => {
    const { best, sure } = res[i];
    b.photo = best ? best.src : null;
    // CoStar's name often carries the building number the sheet leaves off ("Cielo Center" -> "Cielo Center II").
    if (best && best.n && sure) {
      const sheetName = b.name === b.address ? "" : b.name;
      const extra = sheetName && best.n.toLowerCase().startsWith(sheetName.toLowerCase()) ? best.n.slice(sheetName.length) : null;
      if (!sheetName) b.name = best.n;
      else if (extra && /^\s*[-,]?\s*(bldg\.?|building|tower|phase|plaza)?\s*([IVX]+|\d+|[A-Z])\b/i.test(extra)) b.name = best.n;
    }
  });
}

// ===================== DATA LOADING =====================
async function fetchText(url, timeoutMs, label) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctl.signal, cache: "no-store" });
    if (!res.ok) throw new Error(`${label}: HTTP ${res.status}${res.status === 401 ? " (permission denied — check Firebase rules for this dataset)" : ""}`);
    return await res.text();
  } catch (e) {
    if (e.name === "AbortError") throw new Error(`${label}: timed out`);
    throw e;
  } finally { clearTimeout(t); }
}
function waitForIdToken() {
  const a = firebase.auth();
  if (a.currentUser) return a.currentUser.getIdToken();
  return new Promise((resolve) => { const unsub = a.onAuthStateChanged((u) => { if (u) { unsub(); resolve(u.getIdToken()); } }); });
}
async function firebaseGet(node, token, timeoutMs) {
  const url = `${FIREBASE_DB_URL}/datasets/${encodeURIComponent(FIREBASE_DATASET)}/${node}.json?auth=${encodeURIComponent(token)}`;
  return JSON.parse(await fetchText(url, timeoutMs, "Firebase"));
}
const localCache = {
  read() { try { const meta = JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY + ":meta") || "null"); const payload = localStorage.getItem(LOCAL_CACHE_KEY + ":data");
    return meta && meta.hash && typeof payload === "string" ? { meta, payload } : null; } catch (e) { return null; } },
  write(meta, payload) { try { localStorage.removeItem(LOCAL_CACHE_KEY + ":meta"); localStorage.setItem(LOCAL_CACHE_KEY + ":data", payload);
    localStorage.setItem(LOCAL_CACHE_KEY + ":meta", JSON.stringify(meta)); } catch (e) { try { localStorage.removeItem(LOCAL_CACHE_KEY + ":data"); } catch (e2) {} } },
};
const EMPTY_LAYERS = { employees: [], competitors: [], offices: [] };
function parseLayers(data) {
  const L = (data && data.layers) || {};
  const ok = (p) => p && Number.isFinite(+p.lat) && Number.isFinite(+p.lng);
  const fix = (p) => ({ ...p, lat: +p.lat, lng: +p.lng });
  return {
    employees: (L.employees || []).filter(ok).map(fix),
    competitors: (L.competitors || []).filter(ok).map(fix).map((c) => ({ ...c, name: String(c.name || "").trim() })),
    offices: (L.offices || []).filter(ok).map(fix),
  };
}
const parsePayload = (payload) => {
  const data = typeof payload === "string" ? JSON.parse(payload) : payload;
  return { ...toBuildings(rowsFromPayload(data)), layers: parseLayers(data) };
};

function useListings() {
  const [state, setState] = useState(() => {
    if (window.__AUS_TEST_PAYLOAD) return { ...parsePayload(window.__AUS_TEST_PAYLOAD), source: "live", loading: false, error: null, updatedAt: Date.now() };
    const c = localCache.read();
    if (c) { try { return { ...parsePayload(c.payload), source: "cached", loading: true, error: null, updatedAt: c.meta.updatedAt, hash: c.meta.hash }; } catch (e) {} }
    return { buildings: [], amenCols: [], layers: EMPTY_LAYERS, source: "none", loading: true, error: null };
  });
  const hashRef = useRef(state.hash || null);

  const load = useCallback(async () => {
    if (window.__AUS_TEST_PAYLOAD) return;
    setState((s) => ({ ...s, loading: true }));
    let lastErr = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const token = await waitForIdToken();
        const meta = await firebaseGet("meta", token, 15000);
        if (!meta || !meta.hash) throw new Error("No data published yet — run publishToFirebase in the sheet's Apps Script");
        if (meta.hash === hashRef.current) { setState((s) => ({ ...s, loading: false, error: null, source: "live", updatedAt: meta.updatedAt })); return; }
        const payload = await firebaseGet("data", token, 45000);
        if (typeof payload !== "string") throw new Error("Firebase: data node missing");
        const parsed = parsePayload(payload);
        localCache.write(meta, payload);
        hashRef.current = meta.hash;
        setState({ ...parsed, loading: false, error: null, source: "live", updatedAt: meta.updatedAt });
        return;
      } catch (err) {
        lastErr = err;
        if (attempt === 0) await new Promise((r) => setTimeout(r, 1500));
      }
    }
    setState((s) => ({ ...s, loading: false, error: lastErr ? lastErr.message : "Load failed", source: s.buildings.length ? "cached" : "none" }));
  }, []);

  useEffect(() => {
    load();
    const t = setInterval(load, 5 * 60 * 1000); // pick up sheet edits while the page is open
    return () => clearInterval(t);
  }, [load]);
  return { ...state, reload: load };
}

function applyFilters(list, f) {
  const q = f.q.trim().toLowerCase();
  const inRange = (v, lo, hi) => {
    const a = num(lo), b = num(hi);
    if (a == null && b == null) return true;
    if (v == null) return false;
    return (a == null || v >= a) && (b == null || v <= b);
  };
  return list.filter((b) => {
    if (q && ![b.name, b.address, b.owner, b.submarket, b.city].some((s) => s.toLowerCase().includes(q))) return false;
    if (f.submarkets.length && !f.submarkets.includes(b.submarket)) return false;
    if (f.classes.length && !f.classes.includes(b.cls)) return false;
    if (f.cities.length && !f.cities.includes(b.city)) return false;
    if (!inRange(b.totalRent, f.totalMin, f.totalMax)) return false;
    if (!inRange(b.rent, f.rentMin, f.rentMax)) return false;
    if (!inRange(b.rba, f.rbaMin, f.rbaMax)) return false;
    if (!inRange(b.leased, f.leasedMin, f.leasedMax)) return false;
    if (num(f.storiesMin) != null && !(b.stories >= num(f.storiesMin))) return false;
    if (num(f.since) != null && !(b.vintage >= num(f.since))) return false;
    if (f.contigOnly && !b.contig) return false;
    if (f.amenities.length && !f.amenities.every((a) => b.amenities.includes(a))) return false;
    return true;
  });
}

// HTML pins drawn in a single OverlayView: crisp at any DPI, styled with CSS, no marker images.
function createPinLayer(g) {
  class PinLayer extends g.OverlayView {
    constructor() {
      super();
      this.div = document.createElement("div");
      this.div.className = "pin-layer";
      this.els = {};
      g.OverlayView.preventMapHitsAndGesturesFrom(this.div);
    }
    onAdd() { this.getPanes().overlayMouseTarget.appendChild(this.div); }
    onRemove() { this.div.remove(); }
    setItems(items, handlers) {
      this.div.textContent = "";
      this.els = {};
      items.forEach((it) => {
        const el = document.createElement("div");
        el.className = "pin " + it.cls;
        el.innerHTML = `<div class="pin-face">${it.html || ""}</div>`;
        if (it.style) el.style.setProperty("--c", it.style);
        if (it.tip) {
          const tip = document.createElement("div");
          tip.className = "pin-tip";
          tip.innerHTML = it.tip;
          el.appendChild(tip);
        }
        if (it.label) el.setAttribute("aria-label", it.label);
        el.addEventListener("click", (e) => { e.stopPropagation(); handlers.onClick && handlers.onClick(it); });
        el.addEventListener("mouseenter", () => handlers.onHover && handlers.onHover(it));
        el.addEventListener("mouseleave", () => handlers.onHover && handlers.onHover(null));
        this.div.appendChild(el);
        this.els[it.key] = { el, it };
      });
      this.draw();
    }
    setState(fn) { Object.values(this.els).forEach(({ el, it }) => fn(el, it)); }
    draw() {
      const p = this.getProjection();
      if (!p) return;
      Object.values(this.els).forEach(({ el, it }) => {
        const pt = p.fromLatLngToDivPixel(new g.LatLng(it.lat, it.lng));
        el.style.transform = `translate(${pt.x}px, ${pt.y}px)`;
      });
    }
  }
  return new PinLayer();
}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STAR_SVG = "<svg viewBox='0 0 24 24' width='14' height='14'><path fill='currentColor' d='M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.6l-5.4 2.9 1.1-6.1L3.2 9.2l6.1-.8z'/></svg>";

// Shared map. `items`: [{key, lat, lng, cls, html, tip, label, ...}] — any mix of layers.
// `state(el, it)` restyles pins without rebuilding them (hover / active / selection).
function MapCanvas({ items, state, stateKey, fitKey, fitTo, focus, onClick, onHover, children }) {
  const el = useRef(null), mapRef = useRef(null), layer = useRef(null);
  const [status, setStatus] = useState("loading");
  const [type, setType] = useState("cresa");
  const handlers = useRef({});
  handlers.current = { onClick, onHover };

  useEffect(() => { loadGoogleMapsScript(GOOGLE_MAPS_API_KEY).then(() => setStatus("ready")).catch(() => setStatus("error")); }, []);

  useEffect(() => {
    if (status !== "ready" || mapRef.current) return;
    const g = window.google.maps;
    mapRef.current = new g.Map(el.current, {
      center: AUSTIN, zoom: 10, mapTypeControl: false, streetViewControl: false, fullscreenControl: true, clickableIcons: false,
      zoomControlOptions: { position: g.ControlPosition.RIGHT_BOTTOM },
      fullscreenControlOptions: { position: g.ControlPosition.RIGHT_TOP },
      styles: [{ featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] }],
    });
    mapRef.current.mapTypes.set("cresa", new g.StyledMapType(CRESA_MAP_STYLE, { name: "Map" }));
    mapRef.current.setMapTypeId("cresa");
    layer.current = createPinLayer(g);
    layer.current.setMap(mapRef.current);
  }, [status]);

  useEffect(() => { if (mapRef.current) mapRef.current.setMapTypeId(type); }, [type, status]);

  useEffect(() => {
    if (!layer.current) return;
    layer.current.setItems(items.filter((it) => it.lat != null && it.lng != null), {
      onClick: (it) => handlers.current.onClick && handlers.current.onClick(it),
      onHover: (it) => handlers.current.onHover && handlers.current.onHover(it),
    });
    if (state) layer.current.setState(state);
  }, [status, items]);

  useEffect(() => { if (layer.current && state) layer.current.setState(state); }, [status, stateKey]);

  // Fit to the data; re-fit when the container is resized, until the user pans or zooms.
  const fitRef = useRef(null), userMoved = useRef(false);
  useEffect(() => {
    if (status !== "ready" || !mapRef.current) return;
    const pts = (fitTo || items).filter((p) => p.lat != null && p.lng != null);
    if (!pts.length) return;
    const g = window.google.maps, b = new g.LatLngBounds();
    pts.forEach((p) => b.extend({ lat: p.lat, lng: p.lng }));
    fitRef.current = () => {
      if (!el.current || el.current.offsetHeight < 80) return;
      if (pts.length === 1) { mapRef.current.setCenter(b.getCenter()); mapRef.current.setZoom(14); }
      else mapRef.current.fitBounds(b, { top: 64, right: 40, bottom: 30, left: 40 });
    };
    userMoved.current = false;
    fitRef.current();
  }, [status, fitKey]);
  useEffect(() => {
    if (status !== "ready" || !el.current) return;
    const mark = () => { userMoved.current = true; };
    el.current.addEventListener("wheel", mark, { passive: true });
    el.current.addEventListener("pointerdown", mark);
    let last = 0;
    const ro = new ResizeObserver(() => {
      const h = el.current ? el.current.offsetHeight : 0;
      if (Math.abs(h - last) > 20 && !userMoved.current && fitRef.current) { last = h; fitRef.current(); }
    });
    ro.observe(el.current);
    return () => ro.disconnect();
  }, [status]);

  // Bring the opened building into view (it may be off-screen or under the detail card).
  useEffect(() => {
    if (status !== "ready" || !mapRef.current || !focus || focus.lat == null) return;
    const m = mapRef.current, g = window.google.maps, pos = new g.LatLng(focus.lat, focus.lng);
    const b = m.getBounds(), proj = m.getProjection();
    if (!b || !proj) { m.panTo(pos); return; }
    // Keep the pin clear of the 340px detail card on the left.
    const scale = Math.pow(2, m.getZoom()), w = el.current.offsetWidth;
    const ne = proj.fromLatLngToPoint(b.getNorthEast()), sw = proj.fromLatLngToPoint(b.getSouthWest());
    const pt = proj.fromLatLngToPoint(pos);
    const x = (pt.x - sw.x) * scale, y = (pt.y - ne.y) * scale, h = el.current.offsetHeight;
    const safeLeft = w > 700 ? 380 : 40;
    if (x < safeLeft || x > w - 60 || y < 70 || y > h - 40) {
      const target = w > 700 ? safeLeft + (w - safeLeft) / 2 : w / 2;
      const center = proj.fromLatLngToPoint(m.getCenter());
      const dx = (x - target) / scale, dy = (y - h / 2) / scale;
      m.panTo(proj.fromPointToLatLng(new g.Point(center.x + dx, center.y + dy)));
    }
  }, [status, focus && focus.key]);

  return (
    <>
      <div className="map" ref={el} />
      {status === "ready" && (
        <div className="map-ctl">
          <button className={type === "cresa" ? "on" : ""} onClick={() => setType("cresa")}>Map</button>
          <button className={type === "hybrid" ? "on" : ""} onClick={() => setType("hybrid")}>Satellite</button>
        </div>
      )}
      {status === "loading" && <div className="map-msg">Loading map…</div>}
      {status === "error" && <div className="map-msg">The map couldn't load. Check your connection, or that the Google Maps key allows this page.</div>}
      {children}
    </>
  );
}

// ===================== DRIVE TIME =====================
// Estimates work instantly from straight-line distance (calibrated effective speeds by time of day).
// "Use Google drive times" replaces them with Google's traffic-aware times, cached in this browser.
// One scenario: Google's standard home → office drive time (no live traffic). One run covers every pair.
const PEAKS = { am: "typical drive" };
const PEAK_HINT = { am: "Home → office, Google's standard drive time (no live traffic)" };
const SPEED = { am: 24, pm: 21, off: 34 };
const TARGETS = [20, 30, 45];
const DRIVE_CACHE_KEY = LOCAL_CACHE_KEY + ":drive";

function hav(a, b) {
  const R = 3958.8, d = Math.PI / 180;
  const dLat = (b.lat - a.lat) * d, dLng = (b.lng - a.lng) * d;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * d) * Math.cos(b.lat * d) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
const estMinutes = (e, p, peak) => { const mi = hav(e, p); return Math.max(5, Math.round(mi / SPEED[peak] * 60 + 4 + Math.min(mi, 4))); };
const ptKey = (p) => p.lat.toFixed(4) + "," + p.lng.toFixed(4);
const officeShort = (s) => String(s || "").replace(/^[A-Z0-9]{1,4}\s*-\s*/, "").trim();

function nextWeekday(peak) {
  const d = new Date();
  const [h, m] = peak === "am" ? [8, 0] : peak === "pm" ? [17, 30] : [11, 0];
  d.setHours(h, m, 0, 0);
  do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
  return d;
}

function readDriveCache() { try { return JSON.parse(localStorage.getItem(DRIVE_CACHE_KEY) || "{}"); } catch (e) { return {}; } }
function writeDriveCache(c) { try { localStorage.setItem(DRIVE_CACHE_KEY, JSON.stringify(c)); } catch (e) {} }

// Fetch drive times from Google's Routes API (computeRouteMatrix) for every (employee point × place) pair not
// cached yet. TRAFFIC_UNAWARE = Google's standard drive time (no live or rush-hour traffic), billed on the
// "Compute Route Matrix Essentials" SKU, whose first 10,000 elements each month are free.
const ROUTES_URL = "https://routes.googleapis.com/distanceMatrix/v2:computeRouteMatrix";
async function fetchGoogleTimes(emps, places, peak, cache, onProgress) {
  const homes = [...new Map(emps.map((e) => [ptKey(e), e])).values()];
  const dests = [...new Map(places.map((p) => [ptKey(p), p])).values()];
  const bucket = (cache[peak] = cache[peak] || {});
  const CH = 25; // 25 × 25 = 625 pairs, the per-request maximum
  const todo = [];
  for (let i = 0; i < homes.length; i += CH) for (let j = 0; j < dests.length; j += CH) {
    const hs = homes.slice(i, i + CH), ds = dests.slice(j, j + CH);
    if (hs.some((h) => ds.some((d) => bucket[ptKey(h) + ">" + ptKey(d)] == null))) todo.push([hs, ds]);
  }
  const wp = (p) => ({ waypoint: { location: { latLng: { latitude: p.lat, longitude: p.lng } } } });
  let done = 0;
  for (const [hs, ds] of todo) {
    const body = JSON.stringify({ origins: hs.map(wp), destinations: ds.map(wp), travelMode: "DRIVE",
      routingPreference: "TRAFFIC_UNAWARE" });
    let rows, tries = 0;
    for (;;) {
      let res, text;
      try {
        res = await fetch(ROUTES_URL, { method: "POST", body, headers: { "Content-Type": "application/json",
          "X-Goog-Api-Key": GOOGLE_MAPS_API_KEY, "X-Goog-FieldMask": "originIndex,destinationIndex,duration,condition" } });
        text = await res.text();
      } catch (e) { throw new Error("Couldn't reach Google (" + e.message + "). Showing estimates."); }
      if (res.ok) { rows = JSON.parse(text || "[]"); break; }
      if ((res.status === 429 || res.status >= 500) && tries++ < 4) { await new Promise((r) => setTimeout(r, 1500 * tries)); continue; }
      let msg = text; try { msg = JSON.parse(text).error.message; } catch (e) {}
      if (res.status === 403 || res.status === 401) {
        throw new Error("Google refused the request: " + msg + " — enable the Routes API for this Maps key (and add it to the key's API restrictions), then try again.");
      }
      throw new Error("Google drive times failed (" + res.status + "): " + msg);
    }
    (Array.isArray(rows) ? rows : []).forEach((el) => {
      if (el.condition !== "ROUTE_EXISTS" || !el.duration) return;
      const h = hs[el.originIndex || 0], d = ds[el.destinationIndex || 0];
      bucket[ptKey(h) + ">" + ptKey(d)] = Math.round(parseInt(el.duration, 10) / 60);
    });
    done++;
    onProgress(done / todo.length);
  }
  writeDriveCache(cache);
}

function median(a) { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; }

// Stats for one destination over a roster. `home(e)` = the employee's current office (or null).
function commuteStats(roster, place, minutes, target, home) {
  const m = roster.map((e) => minutes(e, place));
  if (!m.length) return null;
  const sum = m.reduce((a, b) => a + b, 0);
  const good = m.filter((x) => x <= target).length, mid = m.filter((x) => x > target && x <= target + 15).length;
  let better = 0, same = 0, worse = 0, nBase = 0, todaySum = 0, newSum = 0;
  roster.forEach((e, i) => {
    const h = home(e); if (!h) return;
    const t0 = minutes(e, h), d = m[i] - t0;
    nBase++; todaySum += t0; newSum += m[i];
    if (d <= -5) better++; else if (d >= 5) worse++; else same++;
  });
  return {
    n: m.length, avg: Math.round(sum / m.length), med: median(m), good, mid, far: m.length - good - mid,
    within: Math.round(good / m.length * 100), hrsWk: Math.round(sum * 10 / 60),
    nBase, better, same, worse, deltaHrs: nBase ? Math.round((newSum - todaySum) * 10 / 60) : null,
    deltaAvg: nBase ? Math.round((newSum - todaySum) / nBase) : null,
  };
}

// Today: every employee to their own current office.
function todayStats(roster, minutes, target, home) {
  const withHome = roster.filter((e) => home(e));
  if (!withHome.length) return null;
  const m = withHome.map((e) => minutes(e, home(e)));
  const sum = m.reduce((a, b) => a + b, 0);
  const good = m.filter((x) => x <= target).length, mid = m.filter((x) => x > target && x <= target + 15).length;
  return { n: m.length, avg: Math.round(sum / m.length), med: median(m), good, mid, far: m.length - good - mid,
    within: Math.round(good / m.length * 100), hrsWk: Math.round(sum * 10 / 60) };
}

// App-level commute state, shared by the Drive Time and Compare tabs.
function useCommute(layers) {
  const [peak, setPeak] = useState("am");
  const [target, setTarget] = useState(30);
  const [office, setOffice] = useState("all");
  const [dept, setDept] = useState("all");
  const [cache, setCache] = useState(readDriveCache);
  const [useGoogle, setUseGoogle] = useState(() => Object.keys(readDriveCache()).length > 0);
  const [fetching, setFetching] = useState(null); // null | 0..1
  const [error, setError] = useState(null);
  const [notice, setNotice] = useState(null);
  const isAdmin = DRIVE_TIME_ADMINS.includes(String(window.__cresaUserEmail || "").toLowerCase()) || !!(window.__AUS_TEST_PAYLOAD && window.__AUS_TEST_ADMIN);

  // Load the shared Google drive times (fetched once by an admin) from Firebase.
  useEffect(() => {
    if (window.__AUS_TEST_PAYLOAD) return;
    let alive = true;
    (async () => {
      try {
        const token = await waitForIdToken();
        const raw = await firebaseGet("drivetimes", token, 20000);
        if (!alive || typeof raw !== "string") return;
        const shared = JSON.parse(raw);
        setCache((c) => {
          const m = { ...c };
          Object.keys(shared).forEach((k) => { if (k !== "updatedAt") m[k] = { ...(shared[k] || {}), ...(c[k] || {}) }; });
          writeDriveCache(m);
          return m;
        });
        setUseGoogle(true);
      } catch (e) { /* none shared yet, or no access: estimates still work */ }
    })();
    return () => { alive = false; };
  }, []);

  const offices = useMemo(() => layers.offices.map((o) => ({ ...o, key: o.code || o.name })), [layers.offices]);
  const homeOf = useCallback((e) => {
    if (!e.office) return null;
    const lo = e.office.toLowerCase();
    return offices.find((o) => (o.code && lo.startsWith(o.code.toLowerCase())) || (o.name && lo.includes(o.name.toLowerCase()))) || null;
  }, [offices]);

  const officeNames = useMemo(() => [...new Set(layers.employees.map((e) => officeShort(e.office)).filter(Boolean))].sort(), [layers.employees]);
  const depts = useMemo(() => [...new Set(layers.employees.map((e) => e.dept).filter(Boolean))].sort(), [layers.employees]);
  const roster = useMemo(() => layers.employees.filter((e) =>
    (office === "all" || officeShort(e.office) === office) && (dept === "all" || e.dept === dept)), [layers.employees, office, dept]);

  const minutes = useCallback((e, p) => {
    if (useGoogle) { const v = cache[peak] && cache[peak][ptKey(e) + ">" + ptKey(p)]; if (v != null) return v; }
    return estMinutes(e, p, peak);
  }, [useGoogle, cache, peak]);

  const fetchGoogle = async (places) => {
    if (!isAdmin) return;
    setError(null); setNotice(null); setFetching(0);
    const c = { ...cache };
    try {
      await fetchGoogleTimes(layers.employees, [...places, ...offices], peak, c, setFetching);
      setUseGoogle(true);
    } catch (err) { setError(err.message); }
    setCache({ ...c });
    setFetching(null);
    // Share with every viewer so nobody else has to pay for the same lookups.
    try {
      const token = await waitForIdToken();
      const url = `${FIREBASE_DB_URL}/datasets/${encodeURIComponent(FIREBASE_DATASET)}/drivetimes.json?auth=${encodeURIComponent(token)}`;
      const res = await fetch(url, { method: "PUT", body: JSON.stringify(JSON.stringify({ ...c, updatedAt: Date.now() })) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      setNotice("Saved for everyone — other viewers now see these Google drive times.");
    } catch (e) {
      setError("Google times are saved in this browser only: Firebase didn't accept the shared copy (" + e.message + "). A database rule allowing your login to write datasets/" + FIREBASE_DATASET + "/drivetimes fixes this.");
    }
  };
  const coverage = (places) => {
    if (!useGoogle || !layers.employees.length) return 0;
    const b = cache[peak] || {};
    let have = 0, total = 0;
    const homes = [...new Set(layers.employees.map(ptKey))];
    [...places, ...offices].forEach((p) => homes.forEach((h) => { total++; if (b[h + ">" + ptKey(p)] != null) have++; }));
    return total ? have / total : 0;
  };
  const lookupsNeeded = (places) => {
    const b = cache[peak] || {};
    const homes = [...new Set(layers.employees.map(ptKey))];
    const dests = [...new Set([...places, ...offices].map(ptKey))];
    let n = 0; homes.forEach((h) => dests.forEach((d) => { if (b[h + ">" + d] == null) n++; }));
    return n;
  };

  return { peak, setPeak, target, setTarget, office, setOffice, dept, setDept, officeNames, depts, roster, offices, homeOf,
    minutes, useGoogle, setUseGoogle, fetching, error, notice, isAdmin, fetchGoogle, coverage, lookupsNeeded, hasData: layers.employees.length > 0 };
}

function Seg({ value, options, onChange }) {
  return (
    <div className="seg" role="radiogroup">
      {options.map(([v, label]) => (
        <button key={v} role="radio" aria-checked={value === v} className={value === v ? "on" : ""} onClick={() => onChange(v)}>{label}</button>
      ))}
    </div>
  );
}

function DistBar({ s, target }) {
  const pct = (n) => (n / s.n) * 100;
  return (
    <div className="dist" title={`≤${target} min: ${s.good} · ${target + 1}–${target + 15}: ${s.mid} · ${target + 15}+: ${s.far}`}>
      <span className="d-good" style={{ width: pct(s.good) + "%" }} />
      <span className="d-mid" style={{ width: pct(s.mid) + "%" }} />
      <span className="d-far" style={{ width: pct(s.far) + "%" }} />
    </div>
  );
}

const bandOf = (m, t) => (m <= t ? "good" : m <= t + 15 ? "mid" : "far");
const fmtDeltaHrs = (h) => (h == null ? "—" : h === 0 ? "±0" : (h < 0 ? "−" : "+") + Math.abs(h).toLocaleString());

function exportDriveMatrix(roster, places, minutes, homeOf, useGoogle) {
  const escC = (v) => { const t = v == null ? "" : String(v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const head = ["Employee", "Office", "Department", "Home ZIP", "Today (own office)", ...places.map((p) => p.name)];
  const lines = roster.map((e, i) => {
    const h = homeOf(e);
    return [i + 1, officeShort(e.office), e.dept, e.zip, h ? minutes(e, h) : "", ...places.map((p) => minutes(e, p))].map(escC).join(",");
  });
  const note = useGoogle ? "Minutes, home to office, Google standard drive time (no live traffic)" : "Minutes, estimated from distance";
  const csv = [escC(note), head.map(escC).join(","), ...lines].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "HR_Green_Austin_Drive_Times.csv";
  a.click();
}

function DriveTimeView({ list, total, nFilters, goTo, layers, cm, selectedIds, onToggle, canAdd, onOpenBuilding }) {
  const [sk, setSk] = useState("rank"), [dir, setDir] = useState(1);

  const [hoverId, setHoverId] = useState(null);
  const [showComp, setShowComp] = useState(true);
  const { roster, target, minutes, homeOf } = cm;

  const mapped = useMemo(() => list.filter((b) => b.lat != null && b.lng != null), [list]);
  const rows = useMemo(() => mapped.map((b) => ({ b, s: commuteStats(roster, b, minutes, target, homeOf) })).filter((r) => r.s), [mapped, roster, minutes, target, homeOf]);
  const today = useMemo(() => todayStats(roster, minutes, target, homeOf), [roster, minutes, target, homeOf]);
  const rank = useMemo(() => { const m = {}; rows.slice().sort((a, b) => a.s.avg - b.s.avg || a.s.hrsWk - b.s.hrsWk).forEach((r, i) => (m[r.b.id] = i + 1)); return m; }, [rows]);
  const KEYS = { rank: (r) => rank[r.b.id], name: (r) => r.b.name, avg: (r) => r.s.avg, med: (r) => r.s.med, within: (r) => -r.s.within, hrs: (r) => r.s.hrsWk, delta: (r) => r.s.deltaHrs, better: (r) => -(r.s.better - r.s.worse) };
  const sorted = useMemo(() => rows.slice().sort((a, b) => {
    const x = KEYS[sk](a), y = KEYS[sk](b);
    if (typeof x === "string") return x.localeCompare(y) * dir;
    return ((x ?? 1e9) - (y ?? 1e9)) * dir || a.s.avg - b.s.avg;
  }), [rows, sk, dir, rank]);
  const by = (k) => { if (k === sk) setDir(-dir); else { setSk(k); setDir(1); } };
  const arr = (k) => (sk === k ? <span className="arr">{dir > 0 ? "▲" : "▼"}</span> : null);

  const bestId = sorted.length ? Object.keys(rank).find((id) => rank[id] === 1) : null;
  const sel = rows.find((r) => r.b.id === selId) || rows.find((r) => r.b.id === bestId) || null;
  const focusId = hoverId || (sel && sel.b.id);
  const focus = rows.find((r) => r.b.id === focusId) || sel;

  // Map layers: employees coloured by drive band to the focused building.
  const items = useMemo(() => {
    const out = [];
    if (showComp) out.push(...competitorItems(layers.competitors));
    out.push(...officeItems(cm.offices));
    // Employee dots are built once; their colour and minutes are set in pinState so hovering never rebuilds pins.
    roster.forEach((e, i) => out.push({ key: "e" + i, kind: "emp", emp: e, lat: e.lat, lng: e.lng, cls: "pin-emp",
      tip: `<b class="emp-min"></b><span>${esc(e.dept || "Employee")}${e.zip ? " · " + esc(e.zip) : ""}</span>` }));
    rows.forEach((r) => out.push({ key: r.b.id, id: r.b.id, kind: "bldg", lat: r.b.lat, lng: r.b.lng, cls: "pin-bldg", html: String(rank[r.b.id]),
      tip: `<b>${esc(r.b.name)}</b><span>${r.s.avg} min avg · ${r.s.within}% ≤ ${target}</span>` }));
    return out;
  }, [rows, roster, target, showComp, layers.competitors, cm.offices, rank]);

  const stateKey = [focusId, sel && sel.b.id, selectedIds.join(","), cm.peak, cm.useGoogle, target, items.length].join("|");
  const pinState = (el, it) => {
    if (it.kind === "emp") {
      const m = focus ? minutes(it.emp, focus.b) : null;
      const band = m == null ? "" : bandOf(m, target);
      ["good", "mid", "far"].forEach((k) => el.classList.toggle("band-" + k, band === k));
      const t = el.querySelector(".emp-min"); if (t) t.textContent = m == null ? "" : m + " min to " + focus.b.name;
      return;
    }
    if (it.kind !== "bldg") return;
    el.classList.toggle("act", sel && it.id === sel.b.id);
    el.classList.toggle("hov", it.id === hoverId);
    el.classList.toggle("sel", selectedIds.includes(it.id));
  };

  if (!cm.hasData) return (
    <div className="panel"><div className="empty" style={{ margin: "auto", maxWidth: 520 }}>
      <div className="empty-t">No employee locations yet</div>
      Add an <b>Employees</b> tab to the Google Sheet (home address, department, office) and a <b>Current Offices</b> tab
      (Name, Address, Code). The publisher script locates each address and this tab fills in on the next refresh.
    </div></div>
  );

  const deptRows = focus ? cm.depts.map((d) => {
    const r = roster.filter((e) => e.dept === d);
    if (!r.length) return null;
    const ms = r.map((e) => minutes(e, focus.b));
    const tm = r.filter((e) => homeOf(e)).map((e) => minutes(e, homeOf(e)));
    return { d, n: r.length, avg: Math.round(ms.reduce((a, b) => a + b, 0) / ms.length), today: tm.length ? Math.round(tm.reduce((a, b) => a + b, 0) / tm.length) : null };
  }).filter(Boolean).sort((a, b) => b.n - a.n) : [];
  const maxDept = Math.max(60, ...deptRows.map((r) => Math.max(r.avg, r.today || 0)));
  const need = cm.lookupsNeeded(mapped);

  return (

          <select value={cm.office} onChange={(e) => cm.setOffice(e.target.value)}>

            {cm.officeNames.map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
          <select value={cm.dept} onChange={(e) => cm.setDept(e.target.value)}>

        </div>
        <div className="db-src">

          {cm.fetching != null ? (
            <span className="src-chip live"><span className="spin" />Getting Google times… {Math.round(cm.fetching * 100)}%</span>
          ) : cm.useGoogle && cover > 0.98 ? (
            <><span className="src-chip live" title={PEAK_HINT[cm.peak]}>Google drive times</span>
              {cm.isAdmin && <button className="btn sm" onClick={() => cm.setUseGoogle(false)}>Use estimates</button>}</>
          ) : (
            <><span className="src-chip est" title="Straight-line distance at typical Austin speeds for the time of day">
                {cm.useGoogle && cover > 0 ? "Partly estimated" : "Estimated"}</span>

                if (!need) { cm.setUseGoogle(true); return; }
                if (confirm(`Look up ${need.toLocaleString()} drive times from Google?\n\nGoogle's first 10,000 each month are free (Route Matrix Essentials); beyond that it's billed to the Maps key. Results are saved for everyone who opens this page, so it only needs doing once. Buildings or employees added later cost only their new pairs.`)) cm.fetchGoogle(mapped);
              }}>{need ? `Get Google drive times (${need.toLocaleString()})` : "Use Google drive times"}</button>}</>

              <span className={"num sm" + (rank[focus.b.id] === 1 ? " best" : "")}>{rank[focus.b.id]}</span>

              <button className="btn sm" onClick={() => onOpenBuilding(focus.b.id)}>Details</button>
            </div>
            <div className="ins-big">
              <div><b>{focus.s.good}</b><span>of {focus.s.n} within {target} min</span></div>
              <div><b>{focus.s.avg}<small> min</small></b><span>average drive in</span></div>
              {focus.s.deltaHrs != null && <div><b className={focus.s.deltaHrs < 0 ? "good" : focus.s.deltaHrs > 0 ? "bad" : ""}>{fmtDeltaHrs(focus.s.deltaHrs)}<small> hrs</small></b><span>team time / week vs today</span></div>}
            </div>
            {focus.s.nBase > 0 && (
              <div className="h2h">
                <div className="ins-l">Compared with each person's current office</div>
                {[["better", "Shorter by 5+ min"], ["same", "About the same"], ["worse", "Longer by 5+ min"]].map(([k, lbl]) => (
                  <div className="h2h-row" key={k}>
                    <span className="h2h-lbl">{lbl}</span>
                    <span className="h2h-track"><span className={"h2h-fill " + k} style={{ width: (focus.s[k] / focus.s.nBase) * 100 + "%" }} /></span>
                    <span className="h2h-n">{focus.s[k]}</span>
                  </div>
                ))}
              </div>
            )}
            {deptRows.length > 1 && (
              <div className="depts">
                <div className="ins-l">Average by department <span className="dl-key"><i className="k-new" />here <i className="k-today" />today</span></div>
                {deptRows.slice(0, 5).map((r) => (
                  <div className="dept-row" key={r.d} title={`${r.n} people`}>
                    <span className="dept-n">{r.d}</span>
                    <span className="dept-bars">
                      <span className="k-new" style={{ width: (r.avg / maxDept) * 100 + "%" }} />
                      {r.today != null && <span className="k-today" style={{ width: (r.today / maxDept) * 100 + "%" }} />}
                    </span>
                    <span className="dept-v">{r.avg}{r.today != null && <em> / {r.today}</em>}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function ChipGroup({ options, value, onChange }) {
  return (
    <div className="chips">
      {options.map(([opt, n]) => {
        const on = value.includes(opt);
        return (
          <button key={opt} className={"chip" + (on ? " on" : "")} onClick={() => onChange(on ? value.filter((v) => v !== opt) : [...value, opt])}>
            {opt} <span className="n">{n}</span>
          </button>
        );
      })}
    </div>
  );
}

function Range({ f, set, lo, hi, phLo, phHi, step }) {
  return (
    <div className="rng">
      <input type="number" inputMode="decimal" step={step} placeholder={phLo} value={f[lo]} onChange={(e) => set({ [lo]: e.target.value })} />
      <span>–</span>
      <input type="number" inputMode="decimal" step={step} placeholder={phHi} value={f[hi]} onChange={(e) => set({ [hi]: e.target.value })} />
    </div>
  );
}

const countBy = (list, key) => {
  const m = {};
  list.forEach((b) => { const k = b[key]; if (k) m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0]));
};
const bounds = (list, key) => {
  const v = list.map((b) => b[key]).filter((x) => x != null);
  return v.length ? [Math.min(...v), Math.max(...v)] : [null, null];
};

// "Show on map" toggles. Always listed, so it's clear what can be added even before the sheet has the data.
function MapLayersSection({ show, setShow, counts }) {

      <div className="f-lbl">Show on map</div>
      <div className="maplayers">
        {rows.map(([k, label, icon, hint]) => {
          const n = counts[k] || 0;
          return (
            <label key={k} className={"ml-row" + (n ? "" : " off")} title={n ? "" : hint}>
              <span className="ml-ic">{icon}</span>
              <span className="ml-t">{label}<small>{n ? `${n} location${n > 1 ? "s" : ""}` : "No data yet"}</small></span>
              <input type="checkbox" role="switch" className="switch" disabled={!n} checked={!!n && show[k]}

function FiltersPanel({ all, amenCols, f, setF, onReset, shown, mapLayers }) {

  return (
    <div className="panel">

        </div>
        <div className="f-sec">
          <label className="toggle"><input type="checkbox" checked={f.contigOnly} onChange={(e) => set({ contigOnly: e.target.checked })} />

        {subs.length > 0 && <div className="f-sec"><div className="f-lbl">Submarket {f.submarkets.length > 0 && <button onClick={() => set({ submarkets: [] })}>Clear</button>}</div>
          <ChipGroup options={subs} value={f.submarkets} onChange={(v) => set({ submarkets: v })} /></div>}
        {classes.length > 0 && <div className="f-sec"><div className="f-lbl">Building class</div>
          <ChipGroup options={classes.map(([c, n]) => [c, n])} value={f.classes} onChange={(v) => set({ classes: v })} /></div>}
        {cities.length > 1 && <div className="f-sec"><div className="f-lbl">City</div>
          <ChipGroup options={cities} value={f.cities} onChange={(v) => set({ cities: v })} /></div>}
        <div className="f-sec"><div className="f-lbl">Total rent ($/SF/yr)</div>
          <Range f={f} set={set} lo="totalMin" hi="totalMax" step="0.5" phLo={tLo != null ? "$" + Math.floor(tLo) : "Min"} phHi={tHi != null ? "$" + Math.ceil(tHi) : "Max"} /></div>

        <div className="f-sec"><div className="f-lbl">% Leased</div>

        </div>

          <div className="f-sec"><div className="f-lbl">Must have amenities {f.amenities.length > 0 && <button onClick={() => set({ amenities: [] })}>Clear</button>}</div>
            <div className="amen-list">
              {amenShown.map(([a, n]) => (
                <label key={a} className="toggle">
                  <input type="checkbox" checked={f.amenities.includes(a)}
                    onChange={(e) => set({ amenities: e.target.checked ? [...f.amenities, a] : f.amenities.filter((x) => x !== a) })} />
                  {a}<span className="n">{n}</span>
                </label>
              ))}
            </div>
            {amenCounts.length > 10 && <button className="btn sm" style={{ marginTop: 8 }} onClick={() => setShowAllAmen(!showAllAmen)}>
