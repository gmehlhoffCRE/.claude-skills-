<script type="text/babel" data-presets="react">
// Property card — the demo's card, driven by record strings. No math on
// display values: "Available" stacks the exact premises lines the PDF prints
// (from cfg.matrixView); "Asking rent" is the PDF's rent-range string.

function Photo({ src, w, label, lg }) {
  if (!src) return <Placeholder lg={lg} label={label} />;
  return <img className="real-photo" src={cdnImg(src, w)} alt={label} loading="lazy" />;
}

function VoteTally({ tally }) {
  if (!tally || (!tally.up && !tally.down)) return null;
  return (
    <span className="vote-tally" title="Votes from everyone on this link">
      {tally.up > 0 && <span className="vt up"><Icon.ThumbUp width="10" height="10" /> {tally.up}</span>}
      {tally.down > 0 && <span className="vt down"><Icon.ThumbDown width="10" height="10" /> {tally.down}</span>}
    </span>
  );
}

function PropertyCard({ building, idx, status, selected, matrixView, interactive, onSelect, onOpen, onVote }) {
  const prem = mvPremises(matrixView, building.id);
  const premLines = prem && prem.length ? prem : building.spaces.map(s => s.sf).filter(Boolean);
  const rent = mvByLabel(matrixView, building.id, /RENT/i) || (building.spaces[0] && building.spaces[0].rate) || '';
  const avail = (building.spaces[0] && building.spaces[0].available) || '';
  // Available SF shown as a min–max range across suites (like the rent range),
  // not per-suite lines. Strings stay strings: parse only to pick the min/max
  // suite, then display those original SF strings verbatim.
  const sfList = (building.spaces || []).map(s => s.sf).filter(Boolean);
  const sfNum = (s) => { const m = String(s || '').replace(/,/g, '').match(/\d[\d.]*/); return m ? parseFloat(m[0]) : NaN; };
  const sfRange = (() => {
    if (!sfList.length) return premLines.length ? premLines[0] : '—';
    let lo = sfList[0], hi = sfList[0], loN = sfNum(lo), hiN = loN;
    for (const s of sfList) { const n = sfNum(s); if (isNaN(n)) continue;
      if (isNaN(loN) || n < loN) { loN = n; lo = s; }
      if (isNaN(hiN) || n > hiN) { hiN = n; hi = s; } }
    return lo === hi ? lo : lo + ' – ' + hi;
  })();
  const shortlisted = status?.vote === 'up';
  const passed = status?.vote === 'down';

  return (
    <div
      className={'property-card' + (selected ? ' selected' : '') + (passed ? ' passed' : '')}
      onClick={() => onOpen(building.id)}
      onMouseEnter={() => onSelect(building.id)}
    >
      <div className="pc-ghostnum">{String(idx + 1).padStart(2, '0')}</div>
      <div className="pc-photo" style={{ position: 'relative' }}>
        <Photo src={building.photos[0]} w={640} label="Exterior photo" />
        {shortlisted && <span className="pc-badge short">★ SHORTLISTED</span>}
        {passed && <span className="pc-badge pass">PASSED</span>}
      </div>
      <div className="pc-body">
        <div className="pc-name">{building.name}</div>
        <div className="pc-addr">{[building.address, building.submarket].filter(Boolean).join(' · ')}</div>
        <div className="pc-stats">
          <div>
            <div className="pc-stat-val">{sfRange}</div>
            <div className="pc-stat-label">SF</div>
          </div>
          <div>
            <div className="pc-stat-val">{rent || '—'}</div>
            <div className="pc-stat-label">Total Asking Rent</div>
          </div>
          <div>
            <div className="pc-stat-val">{avail || '—'}</div>
            <div className="pc-stat-label">Availability</div>
          </div>
        </div>
      </div>
      <div className="pc-actions" onClick={(e) => e.stopPropagation()}>
        {interactive
          ? <VoteGroup vote={status?.vote} onVote={(v) => onVote(building.id, v)} />
          : <VoteTally tally={status?.tally} />}
      </div>
    </div>
  );
}

function GalleryTile({ building, idx, status, cols, onOpen, onSelect }) {
  const rate = (building.spaces[0] && building.spaces[0].rate) || '';
  const sub = [building.submarket, building.spaces[0] && building.spaces[0].sf, building.spaces[0] && building.spaces[0].available].filter(Boolean).join(' · ');
  const shortlisted = status?.vote === 'up';
  const passed = status?.vote === 'down';
  return (
    <div className={'gallery-tile' + (passed ? ' passed' : '')}
         onClick={() => onOpen(building.id)} onMouseEnter={() => onSelect(building.id)}>
      {shortlisted && <span className="gallery-badge short">★ SHORTLIST</span>}
      {passed && <span className="gallery-badge pass">PASSED</span>}
      {building.photos[0] && <img className="real-photo" src={cdnImg(building.photos[0], 640)} alt="" loading="lazy" />}
      <div className="gallery-cap">
        <div className="gallery-cap-top">
          <span className="gallery-cap-name">{String(idx + 1).padStart(2, '0')} · {building.name}</span>
          <span className={'gallery-cap-price' + (shortlisted ? ' short' : '')}>{rate || '—'}</span>
        </div>
        <div className="gallery-cap-sub">{sub}</div>
      </div>
    </div>
  );
}

// Survey list view — split list + map. Client sees active properties only;
// eliminated stays in the record (votes/comments survive) but never renders here.
function SurveyListView({ buildings, statuses, matrixView, interactive, listView = 'spread', sortIx = 0, showMap = true, onOpen, onVote }) {
  const [selectedId, setSelectedId] = React.useState(buildings[0]?.id);
  const num = (s) => { const m = String(s || '').replace(/,/g, '').match(/[\d.]+/); return m ? parseFloat(m[0]) : NaN; };
  const rateOf = (b) => num(b.spaces[0] && b.spaces[0].rate);
  const sizeOf = (b) => Math.max(...(b.spaces.map(s => num(s.sf)).filter(Number.isFinite)), NaN);

  let ordered = buildings.slice();
  if (sortIx === 1) ordered.sort((a, b) => (rateOf(a) || 1e9) - (rateOf(b) || 1e9));
  if (sortIx === 2) ordered.sort((a, b) => (sizeOf(b) || 0) - (sizeOf(a) || 0));

  const mappable = buildings.filter(b => Number.isFinite(b.lat) && Number.isFinite(b.lng));
  const gallery = listView === 'gallery';
  const mapVisible = gallery ? showMap : true;

  const listEl = gallery ? (
    <div className="gallery-scroll">
      <div className={'gallery-grid ' + (mapVisible ? 'cols2' : 'cols3')}>
        {ordered.map((b) => (
          <GalleryTile key={b.id} building={b} idx={buildings.indexOf(b)} status={statuses[b.id]}
                       onOpen={onOpen} onSelect={setSelectedId} />
        ))}
      </div>
    </div>
  ) : (
    <div className="split-list">
      {ordered.map((b) => (
        <PropertyCard
          key={b.id}
          building={b}
          idx={buildings.indexOf(b)}
          status={statuses[b.id]}
          selected={selectedId === b.id}
          matrixView={matrixView}
          interactive={interactive}
          onSelect={setSelectedId}
          onOpen={onOpen}
          onVote={onVote}
        />
      ))}
      {buildings.length === 0 && (
        <div className="empty-state" style={{ padding: '60px 20px' }}>
          <div className="empty-state-title">No properties yet</div>
          <div className="empty-state-body">Your broker hasn't published properties to this survey.</div>
        </div>
      )}
    </div>
  );

  return (
    <div className={'split' + (mapVisible ? '' : ' no-map')}>
      {listEl}
      {mapVisible && (
        <MapView
          buildings={mappable}
          selectedId={selectedId}
          onSelect={setSelectedId}
          onOpen={onOpen}
          statuses={statuses}
          mode="client"
        />
      )}
    </div>
  );
}

Object.assign(window, { GalleryTile });

Object.assign(window, { Photo, VoteTally, PropertyCard, SurveyListView });
</script>

<script type="text/babel" data-presets="react">
// Activity timeline — a chronological log of every state-changing event in
// the survey. Shown as a third tab alongside List view and Compare side by
// side. In production this is generated server-side from an audit log.
function ActivityTimeline({ activity, mode }) {
  const iconFor = (type) => {
    if (type === 'created')        return { Icon: Icon.Plus,    tone: 'neutral' };
    if (type === 'props_added')    return { Icon: Icon.Plus,    tone: 'neutral' };
    if (type === 'shared')         return { Icon: Icon.Send,    tone: 'neutral' };
    if (type === 'comment')        return { Icon: Icon.Send,    tone: 'comment' };
    if (type === 'vote_up')        return { Icon: Icon.ThumbUp, tone: 'good' };
    if (type === 'vote_down')      return { Icon: Icon.ThumbDown,tone: 'discard' };
    if (type === 'tour_proposed')  return { Icon: Icon.Calendar,tone: 'tour' };
    if (type === 'tour_confirmed') return { Icon: Icon.Check,   tone: 'good' };
    return { Icon: Icon.List, tone: 'neutral' };
  };

  return (
    <div className="activity-timeline page-fade">
      <div className="activity-head">
        <h2 className="activity-title">Activity</h2>
        <div className="activity-sub">Every action across this survey, newest first.</div>
      </div>
      <div className="timeline">
        {[...activity].reverse().map((evt) => {
          const { Icon: I, tone } = iconFor(evt.type);
          return (
            <div key={evt.id} className="timeline-row">
              <div className={'timeline-icon tone-' + tone}>
                <I width="13" height="13"/>
              </div>
              <div className="timeline-body">
                <div className="timeline-line">
                  <span className="timeline-who">{evt.who}</span>
                  <span className="timeline-detail">{evt.detail}</span>
                </div>
                <div className="timeline-when">{evt.when}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

window.ActivityTimeline = ActivityTimeline;

</script>


<!-- ===== components-compare.jsx (client, matrixView-driven) ===== -->
<script type="text/babel" data-presets="react">
// Compare tab — the demo's visual design, driven by cfg.matrixView.
// Rows, order, labels, tints and every cell string are precomputed at save
// time by the SAME registry functions that print the PDF matrix. This view
// cannot disagree with the document in the client's inbox. The demo's
// hardcoded row list (incl. TI and the fabricated commute row) is gone.
function CommuteView({ buildings, statuses, survey, onOpen }) {
  const [peak, setPeak] = React.useState('am');   // am | off
  const cData = (b) => (b.commute && (b.commute[peak] || b.commute)) || null;
  const hasData = buildings.some(b => { const c = cData(b); return c && c.avg; });
  const geocoded = survey && survey.commute && survey.commute.employeesGeocoded;
  const num = (s) => { const m = String(s || '').match(/[\d.]+/); return m ? parseFloat(m[0]) : NaN; };

  let rows = buildings.map((b, i) => ({ b, i, c: cData(b) }));
  if (hasData) rows = rows.slice().sort((x, y) => (num(x.c && x.c.avg) || 1e9) - (num(y.c && y.c.avg) || 1e9));
  const bestId = hasData ? rows[0].b.id : null;
  const mappable = buildings.filter(b => Number.isFinite(b.lat) && Number.isFinite(b.lng));

  return (
    <div className="commute-wrap page-fade">
      <div className="commute-head">
        <div className="eyebrow">
          {(survey && survey.client_company ? survey.client_company + ' · ' : '')}
          {geocoded ? geocoded + ' employees geocoded' : 'employee commute analysis'}
        </div>
        <div className="commute-controls">
          <div className="seg">
            <button className={'seg-btn' + (peak === 'am' ? ' on' : '')} onClick={() => setPeak('am')}>AM peak</button>
            <button className={'seg-btn' + (peak === 'off' ? ' on' : '')} onClick={() => setPeak('off')}>Off-peak</button>
          </div>
          <span className="sortchip">All employees ▾</span>
          <span className="act-btn short" title="Roster upload is managed by your broker" style={{ cursor: 'default' }}>↑ Upload roster CSV</span>
        </div>
      </div>

      {!hasData && (
        <div className="commute-empty">
          <div className="commute-empty-icon">🚗</div>
          <div className="commute-empty-title">Commute analysis not available yet</div>
          <div className="commute-empty-body">Once your broker uploads an employee roster (home ZIP codes only, for privacy), average and median drive times to each building — plus an under-30-minute distribution — populate the table below for AM-peak and off-peak. Building rows are shown now so you can see how each candidate will rank.</div>
        </div>
      )}

      <div className="split">
        <div className="commute-scroll">
          <table className="commute-table">
            <thead>
              <tr>
                <th className="c-bldg">Building</th>
                <th>Avg drive</th>
                <th>Median</th>
                <th>&lt; 30 min</th>
                <th className="c-dist">Distribution</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(({ b, i, c }) => (
                <tr key={b.id} className={b.id === bestId ? 'best' : ''} onClick={() => onOpen(b.id)}>
                  <td className="c-bldg">
                    <div className="commute-cell-bldg">
                      <div className="commute-photo"><Photo src={b.photos[0]} w={200} label={String(i + 1)} /></div>
                      <div>
                        <div className="commute-name">{b.name}{b.id === bestId && <span className="best-tag">★ BEST FOR TEAM</span>}</div>
                        <div className="commute-sub">{b.submarket}</div>
                      </div>
                    </div>
                  </td>
                  <td className={'c-num' + (c && c.avg ? '' : ' dash')}>{c && c.avg ? c.avg : '—'}</td>
                  <td className={'c-num' + (c && c.median ? '' : ' dash')}>{c && c.median ? c.median : '—'}</td>
                  <td className={'c-num' + (c && c.under30 ? '' : ' dash')}>{c && c.under30 ? c.under30 : '—'}</td>
                  <td className="c-dist">
                    <div className="dist-bar">
                      {c ? <>
                        <span style={{ width: (num(c.under20) || 0) + '%', background: 'var(--green)' }} />
                        <span style={{ width: (num(c.mid) || 0) + '%', background: 'var(--gold)' }} />
                        <span style={{ width: (num(c.over35) || 0) + '%', background: 'var(--rule)' }} />
                      </> : null}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="commute-legend">
            <span><i style={{ background: 'var(--green)' }} />Under 20 min</span>
            <span><i style={{ background: 'var(--gold)' }} />20–35 min</span>
            <span><i style={{ background: 'var(--rule)' }} />35+ min</span>
            <span className="commute-src">Source: Google Distance Matrix · home ZIPs only</span>
          </div>
        </div>
        <MapView buildings={mappable} selectedId={bestId} onSelect={() => {}} onOpen={onOpen} statuses={statuses} mode="client" />
      </div>
    </div>
  );
}

function CompareView({ buildings, matrixView, statuses, interactive, onVote, onOpen }) {
  const rows = matrixView.rows || [];
  const cells = matrixView.cells || {};
  const fitToScreen = buildings.length <= 8;
  const propWidth = fitToScreen ? `calc((100% - 200px) / ${buildings.length})` : '228px';

  const GROUPS = {
    submarket: 'The Space', premises: 'The Space', askingRent: 'The Space', opex: 'The Space', leaseType: 'The Space',
    class: 'The Building', built: 'The Building', totalSize: 'The Building', parking: 'The Building',
  };
  const groupOf = (k) => GROUPS[k] || 'Details';

  const cellVal = (pid, key) => {
    const v = (cells[pid] || {})[key];
    if (Array.isArray(v)) return v.length ? v.map((l, i) => <div key={i}>{l}</div>) : '—';
    return (v && String(v).trim()) ? v : '—';
  };

  const statusLabel = (b) => {
    const v = statuses[b.id]?.vote;
    return v === 'up' ? '★ Shortlisted' : v === 'down' ? 'Passed' : 'Under review';
  };

  let lastGroup = null;

  return (
    <div className="compare-wrap page-fade">
      <table className={'compare-table' + (fitToScreen ? ' compare-table--fit' : '')}>
        <thead>
          <tr>
            <th className="compare-row-label"></th>
            {buildings.map((b, i) => (
              <th key={b.id} style={{width: propWidth}}>
                <div className="compare-photo" onClick={() => onOpen(b.id)} style={{cursor:'pointer'}}>
                  <Photo src={b.photos[0]} w={480} label={`#${i+1}`} />
                </div>
                <div className="compare-name" style={{cursor:'pointer', marginTop:8}} onClick={() => onOpen(b.id)}>{b.name}</div>
                <div className="compare-addr">{b.address}</div>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map(r => (
            <tr key={r.key}>
              <td className="compare-row-label">{r.label}</td>
              {buildings.map(b => <td key={b.id}>{cellVal(b.id, r.key)}</td>)}
            </tr>
          ))}
          {interactive && (
            <tr>
              <td className="compare-row-label">Shortlist / Pass</td>
              {buildings.map(b => (
                <td key={b.id}>
                  <VoteGroup vote={statuses[b.id]?.vote} onVote={(v) => onVote(b.id, v)}/>
                </td>
              ))}
            </tr>
          )}
        </tbody>
      </table>
      {rows.length > 0 && (
        <div className="compare-foot">
          <span>Data as of {new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' })} · asking terms</span>
          <a onClick={() => window.print()}>Export comparison PDF →</a>
        </div>
      )}
      {rows.length === 0 && (
        <div className="empty-state" style={{padding:'40px 20px'}}>
          <div className="empty-state-title">Comparison not available</div>
          <div className="empty-state-body">This survey was published before comparison data was added. Ask your broker to re-publish it.</div>
        </div>
      )}
    </div>
  );
}
Object.assign(window, { CompareView });
</script>

<!-- ===== app.jsx (client) ===== -->
<script type="text/babel" data-presets="react">
function GateScreen({ spinner, title, message, hint }) {
  return (
    <div className="app" style={{display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh'}}>
      <div style={{textAlign:'center', maxWidth:420, padding:'40px 24px'}}>
        <img src={CRESA_LOGO} alt="Cresa" style={{height:22, marginBottom:24}}/>
        <div className="empty-state-title" style={{fontFamily:'var(--serif)', fontSize:24}}>{title}</div>
        {message && <div className="empty-state-body" style={{marginTop:10}}>{message}</div>}
        {hint && <div className="mono-tag" style={{marginTop:18, opacity:0.7}}>{hint}</div>}
        {spinner && <div className="mono-tag" style={{marginTop:18}}><span className="live-dot"/> Loading…</div>}
      </div>
    </div>
  );
}

function App() {
  const gate = useSurvey();
  const sid = gate.phase === 'ready' ? gate.sid : null;
  const uid = gate.phase === 'ready' ? gate.uid : null;

  const votes = useVotes(sid, uid);
  const commentState = useComments(sid);
  const activity = useActivity(sid);

  const [route, setRoute] = React.useState({ name: 'survey-list' });
  const [activeTab, setActiveTab] = React.useState('list');
  const [listView, setListView] = React.useState('spread');   // spread | gallery
  const [sortIx, setSortIx]     = React.useState(0);           // 0 broker · 1 rate · 2 size
  const [showMap, setShowMap]   = React.useState(true);
  const SORTS = ["Broker's order", 'Rate (low → high)', 'Size (large → small)'];

  React.useEffect(() => {
    document.body.setAttribute('data-mode', 'client');
  }, []);

  if (gate.phase === 'loading') return <GateScreen spinner title="Opening your survey" />;
  if (gate.phase === 'error')   return <GateScreen title={gate.title} message={gate.message} hint={gate.hint} />;

  const { survey, buildings } = adaptRecord(gate.sid, gate.record);
  const interactive = votes.enabled || commentState.enabled;

  // Clients see active properties only. Eliminated rows stay in the record —
  // votes / comments / tour history survive — they just never render here.
  const activeBuildings = buildings.filter(b => !b.eliminated);

  const statuses = {};
  activeBuildings.forEach(b => {
    statuses[b.id] = { vote: votes.mine[b.id] || null, tally: votes.tally[b.id] || null, eliminated: false };
  });

  const handleVote = (pid, v) => {
    castVote(gate.sid, gate.uid, pid, v).catch(err => console.warn('vote failed:', err.message));
  };
  const handleComment = (pid, body) => {
    addComment(gate.sid, gate.uid, pid, body).catch(err => console.warn('comment failed:', err.message));
  };
  const handleOpenDetail = (id) => { setRoute({ name: 'detail', id }); window.scrollTo(0, 0); };
  const handleNavDetail = (delta) => {
    const cur = activeBuildings.findIndex(b => b.id === route.id);
    const next = (cur + delta + activeBuildings.length) % activeBuildings.length;
    setRoute({ name: 'detail', id: activeBuildings[next].id });
    window.scrollTo(0, 0);
  };

  const detailBuilding = route.name === 'detail' ? activeBuildings.find(b => b.id === route.id) : null;
  const shortlistedCount = activeBuildings.filter(b => statuses[b.id]?.vote === 'up').length;
  const clientName = localStorage.getItem('cresaPortalName.v1') || '';
  const updatedStr = (() => {
    try {
      const d = survey.updated_at && survey.updated_at.toDate ? survey.updated_at.toDate() : null;
      return d ? d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
    } catch { return ''; }
  })();

  return (
    <div className="app">
      <header className="topbar">
       <div className="topbar-inner">
        <div className="brand">
          <img className="brand-logo" src={CRESA_LOGO} alt="Cresa" />
          <div className="brand-divider" />
          <div className="brand-name">{survey.doc_type === 'tour' ? 'Market Tour' : 'Market Survey'}</div>
          {gate.preview && <span className="mono-tag" style={{marginLeft:10, background:'var(--gold)', color:'var(--navy)', fontWeight:700, padding:'3px 7px', borderRadius:4, fontSize:10}}>PREVIEW</span>}
        </div>
        <div className="topbar-right">
          {(route.name === 'survey-list' || route.name === 'detail') && (
            <div className="topbar-tabs">
              <button className={'topbar-tab' + (((route.name === 'survey-list' && activeTab === 'list') || route.name === 'detail') ? ' active' : '')} onClick={() => { setActiveTab('list'); setRoute({ name: 'survey-list' }); }}>
                Properties <span className="count">{activeBuildings.length}</span>
              </button>
              <button className={'topbar-tab' + (route.name === 'survey-list' && activeTab === 'commute' ? ' active' : '')} onClick={() => { setActiveTab('commute'); setRoute({ name: 'survey-list' }); }}>
                Commute
              </button>
              <button className={'topbar-tab' + (route.name === 'survey-list' && activeTab === 'compare' ? ' active' : '')} onClick={() => { setActiveTab('compare'); setRoute({ name: 'survey-list' }); }}>
                Compare
              </button>
              <button className={'topbar-tab' + (route.name === 'survey-list' && activeTab === 'tour' ? ' active' : '')} onClick={() => { setActiveTab('tour'); setRoute({ name: 'survey-list' }); }}>
                Tour
              </button>
              <button className={'topbar-tab' + (route.name === 'survey-list' && activeTab === 'activity' ? ' active' : '')} onClick={() => { setActiveTab('activity'); setRoute({ name: 'survey-list' }); }}>
                Activity
              </button>
            </div>
          )}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div className="avatar client">{initialsOf(clientName) || initialsOf(survey.client_company) || 'C'}</div>
            <div style={{ fontSize: 12, lineHeight: 1.2 }}>
              <div style={{ fontWeight: 500 }}>{clientName || survey.client_company || 'Guest'}</div>
              {clientName && survey.client_company &&
                <div className="muted" style={{ fontFamily: 'var(--mono)', fontSize: 10 }}>{survey.client_company}</div>}
            </div>
          </div>
        </div>
       </div>
      </header>

      {route.name === 'detail' && detailBuilding &&
        <div className="route-fixed">
          <PropertyDetail
            building={detailBuilding}
            allBuildings={activeBuildings}
            statuses={statuses}
            comments={commentState.byPid}
            brokers={survey.brokers}
            interactive={interactive}
            onBack={() => setRoute({ name: 'survey-list' })}
            onNav={handleNavDetail}
            onVote={handleVote}
            onComment={handleComment} />
        </div>
      }

      {route.name === 'survey-list' &&
        <>
          <div className="survey-header">
            <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap' }}>
              <div>
                <div className="eyebrow">
                  {('Prepared for ' + (survey.client_company || 'client') + (updatedStr ? ' · ' + updatedStr : '')).toUpperCase()}
                </div>
                <h1 className="survey-title">
                  {survey.name || ((survey.city_state ? survey.city_state + ' ' : '') + survey.property_type + ' ' + (survey.doc_type === 'tour' ? 'Tour' : 'Survey'))}
                </h1>
                <div className="survey-meta" style={{ marginTop: 8 }}>
                  <span>{activeBuildings.length} {activeBuildings.length === 1 ? 'candidate' : 'candidates'}</span>
                  <span className="dot" />
                  <span>{shortlistedCount} shortlisted</span>
                  {updatedStr && <><span className="dot" /><span>Updated {updatedStr}</span></>}
                </div>
              </div>
              {activeTab === 'list' && (
                <div className="list-controls">
                  <span className="sortchip" onClick={() => setSortIx((sortIx + 1) % 3)}>Sort: {SORTS[sortIx]} ▾</span>
                  <div className="seg">
                    <button className={'seg-btn' + (listView === 'spread' ? ' on' : '')} onClick={() => setListView('spread')}>☰ Spread</button>
                    <button className={'seg-btn' + (listView === 'gallery' ? ' on' : '')} onClick={() => setListView('gallery')}>▦ Gallery</button>
                  </div>
                  {listView === 'gallery' && (
                    <span className={'mapchip' + (showMap ? ' on' : '')} onClick={() => setShowMap(!showMap)}>🗺 {showMap ? 'Hide map' : 'Show map'}</span>
                  )}
                </div>
              )}
            </div>
          </div>

          {activeTab === 'list' && (
            <SurveyListView
              buildings={activeBuildings}
              statuses={statuses}
              matrixView={survey.matrixView}
              interactive={interactive}
              listView={listView}
              sortIx={sortIx}
              showMap={showMap}
              onOpen={handleOpenDetail}
              onVote={handleVote} />
          )}
          {activeTab === 'commute' && (
            <CommuteView
              buildings={activeBuildings}
              statuses={statuses}
              survey={survey}
              onOpen={handleOpenDetail} />
          )}
          {activeTab === 'compare' && (
            <CompareView
              buildings={activeBuildings}
              matrixView={survey.matrixView}
              statuses={statuses}
              interactive={interactive}
              onVote={handleVote}
              onOpen={handleOpenDetail} />
          )}
          {activeTab === 'tour' && (
            <TourPanel shortlistedCount={shortlistedCount} />
          )}
          {activeTab === 'activity' && (
            <ActivityTimeline activity={activity} mode="client" />
          )}
        </>
      }
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
