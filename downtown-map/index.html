<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downtown West Options</title>
<style>
  /* Design tokens — matched to the Cresa Houston Lease Comps Database */
  :root {
    --navy: #001E5A; --navy-dark: #001545; --navy-light: #0A2D6E;
    --gold: #FFB600; --gold-soft: #FFE9B0;
    --blue-soft: #E8EFF8; --blue-softer: #F4F7FC;
    --ink: #0E1220; --ink2: #2B3350; --ink3: #5A6580; --ink4: #8A93A8;
    --line: #E4E8F0; --line-soft: #EEF1F6; --bg: #F6F7FB; --white: #FFFFFF;
    --pos: #1B8F6A; --pos-soft: #EAF6F1;
    --neu: #E8AE00; --neu-soft: #FFF5D6; --neu-ink: #7A5A00;
    --neg: #C93B3B; --neg-soft: #FDF0F0;
    --font: Arial, Helvetica, sans-serif;
    --shadow1: 0 1px 2px rgba(0,30,90,.05), 0 1px 3px rgba(0,30,90,.04);
    --shadow2: 0 2px 6px rgba(0,30,90,.06), 0 6px 20px rgba(0,30,90,.08);
    --shadow3: 0 10px 40px rgba(0,30,90,.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); display: flex; flex-direction: column; }
  a { color: inherit; }
  .ico { width: 14px; height: 14px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Top bar ---------- */
  .topbar {
    height: 60px; flex: none; background: var(--white); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 18px; padding: 0 22px; position: relative; z-index: 30;
  }
  .topbar .logo svg { height: 20px; width: auto; display: block; }
  .vrule { width: 1px; height: 28px; background: var(--line); flex: none; }
  .title b { display: block; font-size: 14px; color: var(--navy); line-height: 1.1; }
  .title span { font-size: 11px; color: var(--ink3); }
  .spacer { flex: 1; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--ink3); font-weight: 700; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .tabs { display: flex; gap: 6px; }
  .tab {
    height: 32px; padding: 0 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px;
    background: var(--white); border: 1px solid var(--line); color: var(--ink2);
    font: 700 12px var(--font); text-decoration: none; transition: background .15s, color .15s, border-color .15s;
  }
  .tab .ico { width: 12px; height: 12px; color: var(--ink3); }
  .tab.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .tab.on .ico { color: #fff; }

  /* ---------- Buttons / pills ---------- */
  .btn {
    height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--navy);
    background: var(--navy); color: #fff; font: 700 12.5px var(--font);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: background .15s;
  }
  .btn:hover { background: var(--navy-light); }
  .btn.outline { background: #fff; color: var(--ink2); border-color: var(--line); }
  .btn.outline:hover { background: var(--blue-softer); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
  .btn.block { width: 100%; }
  .pill { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 12px; background: var(--blue-soft); color: var(--navy); font-size: 11px; font-weight: 700; }
  .eyebrow { font-size: 10px; font-weight: 700; color: var(--ink4); text-transform: uppercase; letter-spacing: .8px; }

  /* ---------- Score icon + badge ---------- */
  .score { width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; color: #fff; font: 700 13px/1 var(--font); }
  .score.pos { background: var(--pos); }
  .score.neu { background: var(--neu); color: var(--navy); }
  .score.neg { background: var(--neg); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 12px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge.pos { background: var(--pos-soft); color: var(--pos); }
  .badge.neu { background: var(--neu-soft); color: var(--neu-ink); }
  .badge.neg { background: var(--neg-soft); color: var(--neg); }

  /* ---------- Views ---------- */
  .view { display: none; flex: 1; min-height: 0; }
  body[data-view="map"] #mapView,
  body[data-view="matrix"] #matrixView,
  body[data-view="detail"] #detailView { display: flex; flex-direction: column; }
  body[data-view="map"] { overflow: hidden; }
  #matrixView, #detailView { overflow: auto; }

  /* ---------- Stats strip ---------- */
  .stats { display: flex; gap: 10px; padding: 16px 22px 0; flex: none; }
  .stat { flex: 1; min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow1); position: relative; overflow: hidden; }
  .stat.accent::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); }
  .stat .v { font-size: 24px; font-weight: 700; color: var(--navy); letter-spacing: -.8px; line-height: 1; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .v small { font-size: 14px; color: var(--ink3); font-weight: 400; letter-spacing: 0; }
  .stat .sub { font-size: 10.5px; color: var(--ink4); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .sub b { color: var(--ink2); }

  /* ---------- Map working area ---------- */
  .work { display: flex; gap: 14px; flex: 1; min-height: 0; padding: 14px 22px 22px; }
  .listPanel { width: 380px; flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .listHead { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
  .listHead b { color: var(--navy); font-size: 12px; }
  .listHead span { color: var(--ink3); font-size: 11px; }
  .list { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .bcard { display: flex; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow1); cursor: pointer; text-decoration: none; color: inherit; transition: all .15s; flex: none; }
  .bcard:hover, .bcard.active { border-color: var(--navy); background: var(--blue-softer); box-shadow: var(--shadow2); }
  .bcard .thumb { width: 92px; flex: none; position: relative; border-right: 1px solid var(--line); }
  .bcard .num { position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: var(--navy); font-weight: 700; font-size: 11px; display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.15); z-index: 1; }
  .bcard .body { flex: 1; min-width: 0; padding: 10px 14px; }
  .bcard .nm { font-size: 14px; font-weight: 700; color: var(--navy); letter-spacing: -.2px; }
  .bcard .ad { font-size: 11.5px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bcard .row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; gap: 8px; }
  .mini .k { font-size: 8.5px; color: var(--ink4); letter-spacing: .8px; text-transform: uppercase; }
  .mini .val { font-size: 14px; font-weight: 700; color: var(--navy); letter-spacing: -.3px; margin-top: 2px; }
  .mini .val small { font-size: 9px; color: var(--ink4); font-weight: 400; }
  .dots { display: flex; gap: 4px; }
  .dots .score { width: 16px; height: 16px; font-size: 12px; }

  .mapPanel { flex: 1; min-width: 0; position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow1); background: #3b414c; container-type: size; display: grid; place-items: center; }
  .stage { position: relative; width: min(100cqw, 160cqh); aspect-ratio: 16 / 10; }
  .stage > img, .stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .mapNote { position: absolute; right: 10px; bottom: 10px; z-index: 3; background: rgba(255,255,255,.92); color: var(--ink3); font-size: 10.5px; padding: 4px 8px; border-radius: 4px; }

  .hotspot {
    position: absolute; transform: translate(-50%, -50%); z-index: 2;
    width: 28px; height: 28px; border-radius: 50%; padding: 0; cursor: pointer;
    background: var(--navy); color: #fff; border: 2.5px solid #fff; font: 700 12px var(--font);
    display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.45); transition: transform .15s, background .15s, color .15s;
  }
  .hotspot::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; background: rgba(255,182,0,.35); animation: pulse 2.4s ease-out infinite; z-index: -1; }
  .hotspot:hover, .hotspot:focus-visible, .hotspot.active { transform: translate(-50%, -50%) scale(1.2); background: var(--gold); color: var(--navy); outline: none; }
  @keyframes pulse { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }

  /* ---------- Hover scorecard ---------- */
  .card {
    position: absolute; z-index: 5; width: 300px; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow3);
    opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .12s, transform .12s, visibility .12s;
  }
  .card.show { opacity: 1; visibility: visible; transform: none; }
  .card .photo { height: 128px; }
  .card .cb { padding: 14px 16px 4px; }
  .card .nm { font-size: 17px; font-weight: 700; color: var(--navy); letter-spacing: -.3px; }
  .card .ad { font-size: 12px; color: var(--ink3); margin-top: 2px; }
  .card .rent { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding: 10px 12px; background: var(--blue-softer); border: 1px solid var(--line-soft); border-radius: 8px; }
  .card .rent .val { font-size: 20px; font-weight: 700; color: var(--navy); letter-spacing: -.5px; }
  .card .rent .val small { font-size: 11px; color: var(--ink3); font-weight: 400; }
  .card ul.sc { list-style: none; margin: 6px 0 0; padding: 0; }
  .card ul.sc li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; font-weight: 700; color: var(--ink2); }
  .card ul.sc li:last-child { border-bottom: 0; }
  .card .firms { padding: 10px 16px 12px; border-top: 1px solid var(--line); background: var(--bg); }
  .card .firms .eyebrow { margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chips .pill { font-size: 10.5px; padding: 3px 8px; }
  .card .actions { padding: 12px 16px 14px; border-top: 1px solid var(--line); }

  /* ---------- Photos ---------- */
  .photo { position: relative; background: center / cover no-repeat; }
  .photo.ph { background: repeating-linear-gradient(135deg, #D8DFE9 0 8px, #CFD7E2 8px 16px); display: grid; place-items: center; }
  .photo.ph .ico { width: 24px; height: 24px; color: rgba(0,30,90,.4); stroke-width: 1.5; }
  .photo.ph span { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 8.5px; letter-spacing: .6px; text-transform: uppercase; color: rgba(0,30,90,.45); font-weight: 700; }

  /* ---------- Page header (matrix + detail) ---------- */
  .pagehead { display: flex; align-items: center; gap: 12px; padding: 16px 22px 0; flex-wrap: wrap; }
  .pagehead h2 { margin: 0; font-size: 18px; color: var(--navy); letter-spacing: -.3px; }
  .pagehead p { margin: 1px 0 0; font-size: 12px; color: var(--ink3); }
  .summary { display: flex; gap: 10px; padding: 14px 22px; }
  .sbox { flex: 1; min-width: 0; padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .sbox .p { font-size: 15px; font-weight: 700; color: var(--navy); margin-top: 3px; }
  .sbox .p small { font-size: 11px; color: var(--ink3); font-weight: 400; }
  .sbox .s { font-size: 10.5px; color: var(--ink3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Matrix ---------- */
  .mxWrap { padding: 0 22px 22px; }
  .mx { background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow1); overflow: auto; }
  .mxRow { display: grid; grid-template-columns: 170px repeat(var(--n), minmax(190px, 1fr)); border-bottom: 1px solid var(--line-soft); }
  .mxRow:nth-child(odd):not(.mxHead) > div:not(.rl) { background: var(--bg); }
  .mxRow > div { padding: 12px 14px; border-left: 1px solid var(--line-soft); min-width: 0; }
  .mxRow > .rl { position: sticky; left: 0; z-index: 1; background: #fff; border-left: 0; border-right: 1.5px solid var(--line); font-weight: 700; color: var(--ink); font-size: 13px; }
  .mxHead { border-bottom: 2px solid var(--line); }
  .mxHead > div { text-align: center; padding: 14px 14px 16px; }
  .mxHead .photo { height: 120px; border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .mxHead .num { position: absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: var(--navy); font-weight: 700; font-size: 11px; display: grid; place-items: center; z-index: 1; }
  .mxHead a.nm { font-size: 14px; font-weight: 700; color: var(--navy); text-decoration: none; letter-spacing: -.2px; }
  .mxHead a.nm:hover { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; }
  .mxHead .ad { font-size: 11px; color: var(--ink3); margin-top: 2px; }
  .mxRent { font-size: 18px; font-weight: 700; color: var(--navy); letter-spacing: -.4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mxRent small { font-size: 11px; color: var(--ink3); font-weight: 400; }
  .tag { font-size: 9px; font-weight: 700; letter-spacing: .6px; padding: 2px 6px; border-radius: 3px; }
  .tag.low { background: var(--pos-soft); color: var(--pos); }
  .tag.high { background: var(--neg-soft); color: var(--neg); }
  .cellList { margin: 8px 0 0; padding-left: 16px; color: var(--ink2); }
  .cellList li { margin: 2px 0; }
  .tally { display: flex; gap: 10px; flex-wrap: wrap; font-weight: 700; color: var(--ink2); }
  .tally span { display: inline-flex; align-items: center; gap: 4px; }

  /* ---------- Detail ---------- */
  .detail { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 14px; padding: 14px 22px 22px; align-items: start; }
  .side { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow2); position: sticky; top: 14px; }
  .side .photo { height: 200px; }
  .side .sb { padding: 16px 18px 18px; }
  .side .nm { font-size: 20px; font-weight: 700; color: var(--navy); letter-spacing: -.4px; }
  .side .ad { font-size: 12px; color: var(--ink3); margin-top: 2px; }
  .side .rentBox { margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: var(--navy); color: #fff; position: relative; overflow: hidden; }
  .side .rentBox::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); }
  .side .rentBox .eyebrow { color: rgba(255,255,255,.65); }
  .side .rentBox .val { font-size: 28px; font-weight: 700; color: var(--gold); letter-spacing: -.8px; margin-top: 2px; }
  .side .rentBox .val small { font-size: 13px; color: rgba(255,255,255,.75); font-weight: 400; letter-spacing: 0; }
  .side .field { padding: 10px 0; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .side .field:last-child { border-bottom: 0; }
  .side .field b { font-size: 13px; color: var(--ink2); }
  .secs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .sec { background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow1); overflow: hidden; position: relative; }
  .sec::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .sec.pos::before { background: var(--pos); } .sec.neu::before { background: var(--neu); } .sec.neg::before { background: var(--neg); } .sec.gold::before { background: var(--gold); }
  .sec .sh { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
  .sec h3 { margin: 0; font-size: 14px; color: var(--navy); }
  .sec .sbd { padding: 12px 16px 14px; color: var(--ink2); }
  .sec .sbd ul { margin: 0; padding-left: 18px; }
  .sec .sbd li { margin: 3px 0; }
  .sec.wide { grid-column: 1 / -1; }
  .chips.lg .pill { font-size: 12px; padding: 5px 12px; }

  /* coordinate picker */
  .coords { position: absolute; left: 10px; bottom: 10px; z-index: 6; background: rgba(0,0,0,.78); color: #fff; font: 12px monospace; padding: 6px 10px; border-radius: 4px; display: none; }
  .edit .coords { display: block; } .edit { cursor: crosshair; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .legend { display: none; }
    .stats .stat:nth-child(n+4) { display: none; }
    .listPanel { width: 300px; }
  }
  @media (max-width: 760px) {
    body[data-view="map"] { overflow: auto; }
    .topbar { padding: 0 16px; gap: 12px; }
    .topbar .title, .topbar .vrule { display: none; }
    .view, .work, .stats { flex: none !important; }
    .stats .stat:nth-child(3) { display: none; }
    .stat .v { font-size: 20px; }
    .stats, .pagehead, .summary, .mxWrap { padding-left: 16px; padding-right: 16px; }
    .summary { flex-wrap: wrap; } .sbox { flex: 1 1 45%; }
    .work { flex-direction: column-reverse; padding: 14px 16px 16px; }
    .listPanel { width: 100%; }
    .list { overflow: visible; }
    .mapPanel { flex: none; height: 62vw; }
    .detail { grid-template-columns: 1fr; padding: 14px 16px 16px; }
    .side { position: static; }
    .secs { grid-template-columns: 1fr; }
    .card { width: 250px; }
    .card .photo { height: 90px; }
  }
</style>
</head>

const avgRent = rents.reduce((a, b) => a + b, 0) / rents.length;
const bestPos = Math.max(...BUILDINGS.map(b => tally(b).pos));
const strongest = BUILDINGS.filter(b => tally(b).pos === bestPos);
const allTally = BUILDINGS.reduce((t, b) => { const c = tally(b); t.pos += c.pos; t.neu += c.neu; t.neg += c.neg; return t; }, { pos: 0, neu: 0, neg: 0 });
const nameOf = r => BUILDINGS.filter(b => b.rent === r).map(b => b.name).join(", ");

$("#stats").innerHTML = `
  <div class="stat accent"><div class="eyebrow">Options</div><div class="v">${BUILDINGS.length} <small>buildings</small></div><div class="sub">Downtown West · Houston CBD</div></div>
  <div class="stat"><div class="eyebrow">Avg asking rent</div><div class="v">${money(avgRent)} <small>/SF</small></div><div class="sub">Gross</div></div>
  <div class="stat"><div class="eyebrow">Rent range</div><div class="v">${money(minRent)}–${money(maxRent)}</div><div class="sub">Low: <b>${esc(nameOf(minRent))}</b></div></div>
  <div class="stat"><div class="eyebrow">Strongest scorecard</div><div class="v" style="font-size:18px;line-height:24px;margin-top:6px">${strongest.map(b => esc(b.name)).join(" · ")}</div><div class="sub">${bestPos} of ${CATEGORIES.length} favorable</div></div>
  <div class="stat"><div class="eyebrow">Watch items</div><div class="v">${allTally.neg + allTally.neu}</div><div class="sub"><b>${allTally.neg}</b> unfavorable · <b>${allTally.neu}</b> neutral</div></div>`;

// ---------- Building list ----------
$("#listCount").textContent = `${BUILDINGS.length} buildings`;
$("#list").innerHTML = BUILDINGS.map((b, i) => `
  <a class="bcard" href="#building/${b.id}" data-i="${i}">
    <div class="thumb">${photo(b)}<div class="num">${i + 1}</div></div>
    <div class="body">
      <div class="nm">${esc(b.name)}</div>
      <div class="ad">${esc(b.address)}</div>
      <div class="row">
        <div class="mini"><div class="k">Asking rent</div><div class="val">${money(b.rent)}<small> /SF</small></div></div>
        <div class="dots">${CATEGORIES.map(c => icon(b[c.key].score)).join("")}</div>
      </div>
    </div>
  </a>`).join("");
document.querySelectorAll(".bcard .thumb .photo").forEach(p => { p.style.position = "absolute"; p.style.inset = "0"; });

// ---------- Map background ----------
if (AERIAL_IMAGE) {
  const img = new Image(); img.src = AERIAL_IMAGE; img.alt = "Aerial view of downtown";
  stage.prepend(img);
} else {
  stage.prepend(drawSchematicMap());
}

function drawSchematicMap() {
  // Houston CBD, rotated so north points right. Cross streets run vertically, Bagby→Travis horizontally.
  const W = 1600, H = 1000, R = 15;
  const VX = [110, 280, 450, 620, 790, 960, 1130, 1300, 1470];
  const VN = ["Clay", "Polk", "Dallas", "Lamar", "McKinney", "Walker", "Rusk", "Capitol", "Texas"];
  const HY = [120, 310, 500, 690, 880];
  const HN = ["Bagby St", "Smith St", "Louisiana St", "Milam St", "Travis St"];
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const p = [];
  const xs = [0, ...VX, W], ys = [0, ...HY, H];
  const featured = BUILDINGS.filter(b => !b.campus).map(b => [b.x * W / 100, b.y * H / 100]);
  const campus = BUILDINGS.find(b => b.campus);
  const inCampus = (x0, y0) => campus && y0 >= HY[0] && y0 < HY[1] && x0 < VX[2];

  p.push(`<defs>
    <filter id="sh" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="12" dy="10" stdDeviation="5" flood-color="#000" flood-opacity=".5"/></filter>
    <pattern id="trees" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="9" fill="#3d6a3a"/><circle cx="9" cy="9" r="4" fill="#4f8248"/></pattern>
  </defs><rect width="${W}" height="${H}" fill="#3b414c"/>`);

  for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
    const x0 = xs[i] + (i ? R : 0), x1 = xs[i + 1] - (i + 1 < xs.length - 1 ? R : 0);
    const y0 = ys[j] + (j ? R : 0), y1 = ys[j + 1] - (j + 1 < ys.length - 1 ? R : 0);
    if (j === 0) {
      p.push(`<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#557f4b"/><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="url(#trees)" opacity=".8"/>`);
      continue;
    }
    p.push(`<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#8b9099"/>`);
    if (inCampus(x0, y0)) continue;
    const ix = x0 + 6, iy = y0 + 6, iw = x1 - x0 - 12, ih = y1 - y0 - 12;
    const f = featured.find(([fx, fy]) => fx > x0 && fx < x1 && fy > y0 && fy < y1);
    if (f) {
      const t = Math.min(iw, ih) * 0.72;
      p.push(`<rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" fill="#777c85"/>
        <g filter="url(#sh)"><rect x="${f[0] - t / 2}" y="${f[1] - t / 2}" width="${t}" height="${t}" rx="4" fill="#c3cbd6"/></g>
        <rect x="${f[0] - t / 2 + 14}" y="${f[1] - t / 2 + 14}" width="${t - 28}" height="${t - 28}" rx="3" fill="#d7dee7"/>`);
      continue;
    }
    const cols = 1 + Math.floor(rnd() * 3), rows = 1 + Math.floor(rnd() * 2);
    const lw = iw / cols, lh = ih / rows;
    for (let a = 0; a < cols; a++) for (let b = 0; b < rows; b++) {
      const pad = 4 + rnd() * 8;
      const x = ix + a * lw + pad, y = iy + b * lh + pad, w = lw - pad * 2, h = lh - pad * 2;
      if (rnd() < 0.15) {
        p.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#555a62"/>`);
        for (let k = x + 6; k < x + w - 4; k += 10) p.push(`<line x1="${k}" y1="${y + 4}" x2="${k}" y2="${y + h / 3}" stroke="#ddd" stroke-width="1.5" opacity=".55"/>`);
        continue;
      }
      const g = 125 + Math.floor(rnd() * 60);
      const tall = rnd() < .35 ? ' filter="url(#sh)"' : "";
      p.push(`<g${tall}><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="rgb(${g},${g + 2},${g + 6})"/></g>`);
      if (rnd() < .6) { const s = 10 + rnd() * 12; p.push(`<rect x="${x + 8 + rnd() * Math.max(1, w - s - 16)}" y="${y + 8 + rnd() * Math.max(1, h - s - 16)}" width="${s}" height="${s}" fill="rgb(${g - 28},${g - 26},${g - 22})"/>`); }
    }
  }
  if (campus) { // Allen Center superblock (Clay → Dallas)
    const x0 = 6, x1 = VX[2] - R - 6, y0 = HY[0] + R + 6, y1 = HY[1] - R - 6;
    p.push(`<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#7d838c"/><path d="M${x0 + 20} ${(y0 + y1) / 2} H${x1 - 20}" stroke="#a9b0a0" stroke-width="10"/>`);
    [[95, .68], [280, .78], [395, .62]].forEach(([cx, s]) => {
      const t = (y1 - y0) * s, cy = (y0 + y1) / 2;
      p.push(`<g filter="url(#sh)"><rect x="${cx - t / 2}" y="${cy - t / 2}" width="${t}" height="${t}" rx="4" fill="#c3cbd6"/></g>
        <rect x="${cx - t / 2 + 12}" y="${cy - t / 2 + 12}" width="${t - 24}" height="${t - 24}" rx="3" fill="#d7dee7"/>`);
    });
  }
  VX.forEach((x, i) => {
    p.push(`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#e0c35a" stroke-width="1.5" stroke-dasharray="14 12" opacity=".55"/>`);
    p.push(`<text x="${x}" y="${H - 22}" transform="rotate(-90 ${x} ${H - 22})" dy="4" class="st">${VN[i]}</text>`);
  });
  HY.forEach((y, i) => {
    p.push(`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#e0c35a" stroke-width="1.5" stroke-dasharray="14 12" opacity=".55"/>`);
    [VX[0] + 85, VX[4] + 85, VX[7] + 85].forEach(x => p.push(`<text x="${x}" y="${y}" dy="4" text-anchor="middle" class="st">${HN[i]}</text>`));
  });
  p.push(`<g transform="translate(${W - 70} 52)"><circle r="30" fill="#001E5A" stroke="#FFB600" stroke-width="3"/>
    <path d="M-16 0 L14 0 M6 -8 L16 0 L6 8" stroke="#FFB600" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="-12" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Arial">N</text></g>
    <style>.st{fill:#fff;font:700 13px Arial,sans-serif;letter-spacing:.5px;paint-order:stroke;stroke:#2a303a;stroke-width:4px;}</style>`);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Schematic map of downtown Houston, west side");
  svg.innerHTML = p.join("");
  return svg;
}

// ---------- Hotspots + scorecard ----------
let pinned = null, hideTimer = null;
const hotspots = BUILDINGS.map((b, i) => {
  const el = document.createElement("button");
  el.className = "hotspot";
  el.style.left = b.x + "%"; el.style.top = b.y + "%";
  el.textContent = i + 1;
  el.setAttribute("aria-label", b.name);
  el.addEventListener("mouseenter", () => { if (!pinned) show(i); });
  el.addEventListener("mouseleave", () => { if (!pinned) scheduleHide(); });
  el.addEventListener("focus", () => show(i));
  el.addEventListener("click", e => {
    e.stopPropagation();
    if (pinned === i) { pinned = null; hide(); return; }
    pinned = i; show(i);
  });
  stage.appendChild(el);
  return el;
});
document.querySelectorAll(".bcard").forEach(c => {
  c.addEventListener("mouseenter", () => { pinned = null; show(+c.dataset.i); });
  c.addEventListener("mouseleave", scheduleHide);
});
card.addEventListener("mouseenter", () => clearTimeout(hideTimer));
card.addEventListener("mouseleave", () => { if (pinned == null) scheduleHide(); });
card.addEventListener("click", e => e.stopPropagation());
stage.addEventListener("click", () => { if (pinned != null) { pinned = null; hide(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { pinned = null; hide(); } });
window.addEventListener("resize", () => { pinned = null; hide(); });

function show(i) {
  const b = BUILDINGS[i], el = hotspots[i];
  clearTimeout(hideTimer);
  hotspots.forEach(h => h.classList.toggle("active", h === el));
  document.querySelectorAll(".bcard").forEach(c => c.classList.toggle("active", +c.dataset.i === i));
  card.innerHTML = `
    ${photo(b)}
    <div class="cb">
      <div class="nm">${esc(b.name)}</div>
      <div class="ad">${esc(b.address)}</div>
      <div class="rent"><span class="eyebrow">Asking rent (gross)</span><span class="val">${money(b.rent)}<small> /SF</small></span></div>
      <ul class="sc">${CATEGORIES.map(c => `<li><span>${c.label}</span>${icon(b[c.key].score)}</li>`).join("")}</ul>
    </div>
    <div class="firms"><div class="eyebrow">Other law firms</div><div class="chips">${b.firms.map(f => `<span class="pill">${esc(f)}</span>`).join("")}</div></div>
    <div class="actions"><a class="btn block" href="#building/${b.id}">View Details ${ico("arrow")}</a></div>`;
  const s = stage.getBoundingClientRect(), h = el.getBoundingClientRect();
  const px = h.left - s.left + h.width / 2, py = h.top - s.top + h.height / 2;
  const pw = card.offsetWidth, ph = card.offsetHeight, gap = 24;
  let left = px + gap, top = py - ph / 2;
  if (left + pw > s.width - 8) left = px - gap - pw;
  left = Math.max(8, Math.min(left, s.width - pw - 8));
  top = Math.max(8, Math.min(top, s.height - ph - 8));
  card.style.left = left + "px"; card.style.top = top + "px";
  card.classList.add("show");
}
function scheduleHide() { clearTimeout(hideTimer); hideTimer = setTimeout(hide, 180); }
function hide() {
  card.classList.remove("show");
  hotspots.forEach(h => h.classList.remove("active"));
  document.querySelectorAll(".bcard.active").forEach(c => c.classList.remove("active"));
}

// ---------- Matrix (all buildings side by side) ----------
function renderMatrix() {
  const n = BUILDINGS.length;
  const row = (label, cells, cls = "") => `<div class="mxRow ${cls}"><div class="rl">${label}</div>${cells.join("")}</div>`;
  $("#matrixView").innerHTML = `
    <div class="pagehead">
      <a class="btn outline sm" href="#">${ico("back")}Map</a>
      <div><h2>Compare ${n} buildings</h2><p>Side-by-side matrix · click a building for full details</p></div>
    </div>
    <div class="summary">
      <div class="sbox"><div class="eyebrow">Rent range</div><div class="p">${money(minRent)} – ${money(maxRent)}<small> /SF gross</small></div><div class="s">${money(maxRent - minRent)} spread · avg ${money(avgRent)}</div></div>
      <div class="sbox"><div class="eyebrow">Lowest rent</div><div class="p">${esc(nameOf(minRent))}</div><div class="s">${money(minRent)} /SF gross</div></div>
      <div class="sbox"><div class="eyebrow">Strongest scorecard</div><div class="p">${strongest.map(b => esc(b.name)).join(" · ")}</div><div class="s">${bestPos} of ${CATEGORIES.length} categories favorable</div></div>
      <div class="sbox"><div class="eyebrow">Watch items</div><div class="p">${allTally.neg} unfavorable · ${allTally.neu} neutral</div><div class="s">${BUILDINGS.filter(b => tally(b).neg).map(b => esc(b.name)).join(", ") || "None"}</div></div>
    </div>
    <div class="mxWrap"><div class="mx" style="--n:${n}">
      ${row("", BUILDINGS.map((b, i) => `<div>
          <div style="position:relative">${photo(b)}<div class="num">${i + 1}</div></div>
          <a class="nm" href="#building/${b.id}">${esc(b.name)}</a><div class="ad">${esc(b.address)}</div></div>`), "mxHead")}
      ${row("Asking Rent (Gross)", BUILDINGS.map(b => `<div><div class="mxRent">${money(b.rent)}<small>/SF</small>
          ${b.rent === minRent ? '<span class="tag low">LOWEST</span>' : b.rent === maxRent ? '<span class="tag high">HIGHEST</span>' : ""}</div></div>`))}
      ${row("Score Summary", BUILDINGS.map(b => { const c = tally(b);
          return `<div><div class="tally"><span>${icon("pos")}${c.pos}</span><span>${icon("neu")}${c.neu}</span><span>${icon("neg")}${c.neg}</span></div></div>`; }))}
      ${CATEGORIES.map(c => row(c.label, BUILDINGS.map(b => `<div>${badge(b[c.key].score)}${list(b[c.key].detail)}</div>`))).join("")}
      ${row("Other Law Firms", BUILDINGS.map(b => `<div>${list(b.firms)}</div>`))}
      ${row("", BUILDINGS.map(b => `<div><a class="btn sm" href="#building/${b.id}">View Details ${ico("arrow")}</a></div>`))}
    </div></div>`;
}

// ---------- Detail page ----------
function renderDetail(b) {
  const i = BUILDINGS.indexOf(b), n = BUILDINGS.length;
  const prev = BUILDINGS[(i - 1 + n) % n], next = BUILDINGS[(i + 1) % n];
  const c = tally(b);
  $("#detailView").innerHTML = `
    <div class="pagehead">
      <a class="btn outline sm" href="#">${ico("back")}Map</a>
      <a class="btn outline sm" href="#matrix">${ico("table")}Matrix</a>
      <div class="spacer"></div>
      <a class="btn outline sm" href="#building/${prev.id}">${ico("back")}${esc(prev.name)}</a>
      <a class="btn outline sm" href="#building/${next.id}">${esc(next.name)}${ico("arrow")}</a>
    </div>
    <div class="detail">
      <aside class="side">
        <div style="position:relative">${photo(b)}<span class="pill" style="position:absolute;top:12px;left:12px;background:rgba(255,255,255,.95)">BUILDING ${i + 1} OF ${n}</span></div>
        <div class="sb">
          <div class="nm">${esc(b.name)}</div>
          <div class="ad">${esc(b.address)}</div>
          <div class="rentBox"><div class="eyebrow">Asking rent (gross)</div><div class="val">${money(b.rent)} <small>/SF</small></div></div>
          <div style="margin-top:8px">
            <div class="field"><span class="eyebrow">Favorable</span><b>${c.pos} of ${CATEGORIES.length}</b></div>
            <div class="field"><span class="eyebrow">Neutral</span><b>${c.neu}</b></div>
            <div class="field"><span class="eyebrow">Unfavorable</span><b>${c.neg}</b></div>
            <div class="field"><span class="eyebrow">Other law firms</span><b>${b.firms.length}</b></div>
          </div>
        </div>
      </aside>
      <section class="secs">
        ${CATEGORIES.map(k => { const d = b[k.key];
          return `<article class="sec ${d.score}"><div class="sh"><h3>${k.label}</h3>${badge(d.score)}</div><div class="sbd"><ul>${d.detail.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></article>`; }).join("")}
        <article class="sec gold wide"><div class="sh"><h3>Other Law Firms in the Building</h3><span class="eyebrow">${b.firms.length} firms</span></div>
          <div class="sbd"><div class="chips lg">${b.firms.map(f => `<span class="pill">${esc(f)}</span>`).join("")}</div></div></article>
      </section>
    </div>`;
}

// ---------- Router: #matrix · #building/<id> · anything else = map ----------
function route() {
  const m = location.hash.match(/^#building\/(.+)$/);
  const b = m && BUILDINGS.find(x => x.id === m[1]);
  const view = b ? "detail" : location.hash === "#matrix" ? "matrix" : "map";
  pinned = null; hide();
  if (view === "detail") renderDetail(b);
  if (view === "matrix") renderMatrix();
  document.body.dataset.view = view;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.nav === view));
  document.querySelectorAll(".view").forEach(v => v.scrollTop = 0);
}
window.addEventListener("hashchange", route);
route();

// ---------- Coordinate picker: press E on the map, then click ----------
document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "e" && !e.metaKey && !e.ctrlKey && document.body.dataset.view === "map") stage.classList.toggle("edit");
});
stage.addEventListener("click", e => {
  if (!stage.classList.contains("edit")) return;
  const s = stage.getBoundingClientRect();
  const txt = `x: ${((e.clientX - s.left) / s.width * 100).toFixed(2)}, y: ${((e.clientY - s.top) / s.height * 100).toFixed(2)}`;
  coordsBox.textContent = txt + "  (copied)";
  navigator.clipboard?.writeText(txt).catch(() => {});
});
</script>
</body>
