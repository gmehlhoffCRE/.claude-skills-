  background: rgba(255, 182, 0, 0.15);
  color: #6E4D00;
}
.conf-pill.confirmed {
  background: rgba(34, 139, 34, 0.12);
  color: #1F6B1F;
}
.conf-pill.countered {
  background: rgba(0, 30, 90, 0.08);
  color: var(--navy);
}
.conf-pill.declined {
  background: rgba(220, 80, 100, 0.12);
  color: #B53A4D;
}

/* Counter-proposal banner inside the stop card */
.counter-banner {
  background: rgba(255, 182, 0, 0.08);
  border: 1px solid rgba(255, 182, 0, 0.3);
  border-radius: var(--r-sm);
  padding: 12px 14px;
  margin-bottom: 12px;
}
.counter-banner-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-2);
  margin-bottom: 6px;
  letter-spacing: -0.1px;
}
.counter-banner-head strong { color: var(--navy); font-weight: 700; }
.counter-banner-head svg { color: var(--amber-ink); flex-shrink: 0; }
.counter-banner-note {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-3);
  font-style: italic;
  margin-bottom: 10px;
  letter-spacing: -0.1px;
}
.counter-banner-actions {
  display: flex;
  gap: 6px;
}

/* ─── Email preview modal ────────────────────────────────────────── */
.email-modal-body {
  display: grid;
  grid-template-columns: 240px 1fr;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.email-stop-list {
  border-right: 1px solid var(--rule-2);
  background: var(--paper-2);
  padding: 12px 8px;
  overflow-y: auto;
}
.email-list-head {
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--ink-4);
  padding: 4px 10px 8px;
}
.email-stop-pick {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 10px;
  border: 0;
  background: transparent;
  border-radius: var(--r-sm);
  text-align: left;
  cursor: pointer;
  transition: background 0.15s;
  margin-bottom: 2px;
}
.email-stop-pick:hover { background: rgba(0, 30, 90, 0.04); }
.email-stop-pick.active {
  background: var(--paper-card);
  box-shadow: 0 0 0 1px var(--navy);
}
.email-stop-pick-head {
  display: flex;
  align-items: center;
  gap: 10px;
}
.email-stop-pick-num {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  background: var(--navy);
  color: #fff;
  border-radius: 50%;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 11px;
  flex-shrink: 0;
}
.email-stop-pick-name {
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.1px;
}
.email-stop-pick-bldg {
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-3);
}
.email-stop-pick-time {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-4);
}

.email-preview {
  overflow-y: auto;
  padding: 18px 22px;
}
.email-preview-head {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--rule-2);
  margin-bottom: 14px;
}
.email-row {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 12px;
  font-family: var(--sans);
  font-size: 12.5px;
  letter-spacing: -0.1px;
}
.email-label {
  color: var(--ink-4);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding-top: 2px;
}
.email-val { color: var(--ink); }
.email-subject { font-weight: 700; color: var(--navy); }
.email-body-wrap {
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  background: var(--paper-card);
  overflow: hidden;
}
.email-body {
  width: 100%;
  border: 0;
  padding: 14px 16px;
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink);
  resize: vertical;
  outline: none;
  background: transparent;
  letter-spacing: -0.1px;
}
.email-body:focus { background: rgba(0, 30, 90, 0.02); }

/* ─── Simulated leasing-rep view ─────────────────────────────────────
   What the rep sees when they click the magic link in their email.
   Rendered inside a fake browser-chrome frame so it's clearly distinct
   from the broker UI. */
.rep-view-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(4px);
  z-index: 110;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  animation: fadeIn 0.2s ease;
}
.rep-view-frame {
  width: 100%;
  max-width: 820px;
  max-height: calc(100vh - 64px);
  background: var(--paper-card);
  border-radius: var(--r-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
}
.rep-view-chrome {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  background: #E8E8EE;
  border-bottom: 1px solid #D5D5DD;
  flex-shrink: 0;
}
.rep-view-chrome-dots {
  display: flex;
  gap: 6px;
}
.rep-view-chrome-dots span {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #D5D5DD;
}
.rep-view-chrome-dots span:nth-child(1) { background: #FF5F57; }
.rep-view-chrome-dots span:nth-child(2) { background: #FFBD2E; }
.rep-view-chrome-dots span:nth-child(3) { background: #27C93F; }
.rep-view-chrome-url {
  flex: 1;
  background: #FAFAFC;
  border: 1px solid #D5D5DD;
  border-radius: var(--r-sm);
  padding: 5px 12px;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 6px;
}
.rep-view-lock { font-size: 10px; }
.rep-view-token { color: var(--ink-4); }
.rep-view-close {
  appearance: none;
  border: 0;
  background: transparent;
  width: 24px;
  height: 24px;
  border-radius: var(--r-sm);
  cursor: pointer;
  color: var(--ink-3);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.rep-view-close:hover { background: rgba(0, 0, 0, 0.05); color: var(--ink); }

.rep-view-page {
  padding: 36px 44px 44px;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}
.rep-view-brand {
  margin-bottom: 32px;
}
.rep-view-brand-mark {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 22px;
  color: var(--navy);
  letter-spacing: -0.6px;
}
.rep-view-eyebrow {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--bright-blue);
  margin-bottom: 6px;
}
.rep-view-h {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: -0.5px;
  color: var(--navy);
  margin: 0 0 8px;
  line-height: 1.2;
}
.rep-view-sub {
  font-family: var(--sans);
  font-size: 14px;
  color: var(--ink-3);
  margin-bottom: 24px;
  line-height: 1.5;
  letter-spacing: -0.1px;
}
.rep-view-card {
  background: var(--paper-2);
  border: 1px solid var(--rule-2);
  border-radius: var(--r-md);
  padding: 16px 20px;
  margin-bottom: 24px;
}
.rep-view-card-row {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 18px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule-2);
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  letter-spacing: -0.1px;
  line-height: 1.4;
}
.rep-view-card-row:last-child { border-bottom: 0; }
.rep-view-card-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink-4);
  padding-top: 2px;
}
.rep-view-card-val strong { color: var(--navy); font-weight: 700; }

.rep-view-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn.rep-confirm {
  background: #1F8A1F;
  color: #fff;
}
.btn.rep-confirm:hover {
  background: #156115;
}

.rep-view-counter {
  background: var(--paper-2);
  border: 1px solid var(--rule-2);
  border-radius: var(--r-md);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.rep-view-counter textarea {
  appearance: none;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  letter-spacing: -0.1px;
  outline: none;
  resize: vertical;
  line-height: 1.5;
}
.rep-view-counter textarea:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(0, 30, 90, 0.08);
}

.rep-view-success {
  text-align: center;
  padding: 24px 0;
}
.rep-view-success-icon {
  display: inline-grid;
  place-items: center;
  width: 64px;
  height: 64px;
  background: rgba(34, 139, 34, 0.15);
  color: #1F6B1F;
  border-radius: 50%;
  margin-bottom: 20px;
}
.rep-view-success-icon.decline {
  background: rgba(220, 80, 100, 0.12);
  color: #B53A4D;
}
.rep-view-success .rep-view-h { text-align: center; }
.rep-view-success .rep-view-sub { text-align: center; max-width: 480px; margin-left: auto; margin-right: auto; }

/* Email modal — manual-send updates ─────────────────────────────────
   Per-recipient send tracking (since we can't auto-detect when broker
   actually hits Send in Outlook) and clipboard fallback. */
.email-list-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.email-list-progress {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  font-weight: 600;
  text-transform: none;
  letter-spacing: 0;
}
.email-stop-pick.sent {
  background: rgba(34, 139, 34, 0.04);
}
.email-stop-pick.sent .email-stop-pick-name {
  color: var(--ink-2);
}
.email-stop-pick.sent .email-stop-pick-num {
  background: #1F8A1F;
}
.sent-tag {
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: #1F8A1F;
  background: rgba(34, 139, 34, 0.12);
  padding: 2px 6px;
  border-radius: 999px;
}

/* Send row — Open in Outlook + Copy + Mark sent on the same line */
.email-send-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  padding: 14px;
  background: var(--paper-2);
  border-radius: var(--r-sm);
  flex-wrap: wrap;
}
.email-send-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.email-send-actions .btn {
  text-decoration: none; /* the mailto link is an <a> styled as a button */
}
.email-mark-action {
  flex-shrink: 0;
}
.mark-sent-btn {
  border: 1px dashed var(--rule);
}
.mark-sent-btn:hover {
  background: rgba(34, 139, 34, 0.06);
  border-color: #1F8A1F;
  border-style: solid;
  color: #1F6B1F;
}
.sent-confirmation {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 600;
  color: #1F6B1F;
  letter-spacing: -0.1px;
}

/* ─── Tour Panel restructure ─────────────────────────────────────────
   New state-aware layout: section headings, upcoming-tour summary card,
   plan-a-tour CTA, past tours expandable rows. */
.tour-section {
  margin-bottom: 32px;
}
.tour-section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 12px;
}
.tour-section-head::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--rule-2);
  margin-left: 8px;
}

/* Upcoming tour summary card — high-level glance with all stops one-liner */
.tour-card.upcoming-tour {
  padding: 22px 24px;
}
.upcoming-tour-stops {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 16px 0;
  padding: 14px 0;
  border-top: 1px solid var(--rule-2);
  border-bottom: 1px solid var(--rule-2);
}
.upcoming-tour-stop {
  display: grid;
  grid-template-columns: 28px 80px 1fr auto;
  gap: 14px;
  align-items: center;
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: -0.1px;
  color: var(--ink-2);
}
.upcoming-stop-num {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  background: var(--navy);
  color: #fff;
  border-radius: 50%;
  font-weight: 700;
  font-size: 11px;
  flex-shrink: 0;
}
.upcoming-stop-time {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--bright-blue);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.upcoming-stop-name {
  font-weight: 700;
  color: var(--navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.upcoming-stop-status {
  flex-shrink: 0;
}
.upcoming-tour-actions {
  display: flex;
  gap: 10px;
}

/* Plan-a-tour CTA card — surfaced when shortlist exists but no itinerary */
.plan-tour-cta {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: center;
  padding: 20px 24px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-1);
}
.plan-tour-cta-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  background: rgba(0, 30, 90, 0.06);
  color: var(--navy);
  border-radius: 50%;
  flex-shrink: 0;
}
.plan-tour-cta-body { min-width: 0; }
.plan-tour-cta-title {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 17px;
  color: var(--navy);
  letter-spacing: -0.3px;
  margin: 0 0 4px;
}
.plan-tour-cta-sub {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
  margin-bottom: 10px;
  line-height: 1.4;
}
.plan-tour-cta-stops {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.plan-tour-cta-chip {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  color: var(--navy);
  background: var(--paper-2);
  padding: 3px 10px;
  border-radius: 999px;
  letter-spacing: -0.1px;
}
.plan-tour-cta-chip.muted {
  color: var(--ink-3);
}

/* Plan-a-tour wizard stops list */
.plan-stops-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}
.plan-stop-row {
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 12px;
  padding: 12px 16px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  align-items: center;
}
.plan-stop-row:hover {
  border-color: var(--ink-4);
  background: var(--paper-2);
}
.plan-stop-row.selected {
  border-color: var(--navy);
  background: rgba(0, 30, 90, 0.04);
  box-shadow: 0 0 0 1px var(--navy);
}
.plan-stop-info { min-width: 0; }
.plan-stop-name {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 14px;
  color: var(--navy);
  margin: 0 0 2px;
  letter-spacing: -0.1px;
}
.plan-stop-addr {
  font-family: var(--sans);
  font-size: 11.5px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
}
.plan-summary {
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-3);
  text-align: right;
  letter-spacing: -0.1px;
  padding-top: 8px;
  border-top: 1px solid var(--rule-2);
}
.plan-summary strong { color: var(--navy); font-weight: 700; }

/* Checkbox label for "propose multiple dates" toggle */
.checkbox-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.1px;
}
.checkbox-label input[type="checkbox"] {
  width: 16px;
  height: 16px;
  cursor: pointer;
}
.alt-dates {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px 14px;
  background: var(--paper-2);
  border-radius: var(--r-sm);
}

/* Form textarea (broker note in plan wizard) */
.wizard-form textarea {
  appearance: none;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  letter-spacing: -0.1px;
  outline: none;
  resize: vertical;
  line-height: 1.5;
}
.wizard-form textarea:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(0, 30, 90, 0.08);
}

/* Past tour expandable rows */
.past-tour {
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  overflow: hidden;
  margin-bottom: 8px;
  transition: box-shadow 0.15s;
}
.past-tour:hover { box-shadow: var(--shadow-1); }
.past-tour.expanded {
  box-shadow: var(--shadow-1);
}
.past-tour-head {
  appearance: none;
  border: 0;
  background: transparent;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 14px 18px;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s;
}
.past-tour-head:hover { background: var(--paper-2); }
.past-tour-eyebrow {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 4px;
}
.past-tour-date {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 15px;
  color: var(--navy);
  letter-spacing: -0.2px;
  margin-bottom: 2px;
}
.past-tour-meta {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: -0.1px;
}
.past-tour-outcomes {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.past-tour-toggle {
  color: var(--ink-3);
  font-size: 14px;
  margin-left: 6px;
  width: 16px;
  text-align: center;
}

.outcome-pill {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 999px;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.outcome-pill.outcome-interested {
  background: rgba(34, 139, 34, 0.12);
  color: #1F6B1F;
}
.outcome-pill.outcome-followup {
  background: rgba(255, 182, 0, 0.15);
  color: #6E4D00;
}
.outcome-pill.outcome-discarded,
.outcome-pill.outcome-notinterested {
  background: rgba(220, 80, 100, 0.1);
  color: #B53A4D;
}

.past-tour-body {
  padding: 4px 18px 18px;
  border-top: 1px solid var(--rule-2);
}
.past-tour-summary {
  padding: 14px 0;
  border-bottom: 1px solid var(--rule-2);
  margin-bottom: 14px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink-2);
  letter-spacing: -0.1px;
  line-height: 1.5;
}
.past-tour-stops {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.past-tour-stop {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule-2);
}
.past-tour-stop:last-child { border-bottom: 0; padding-bottom: 0; }
.past-stop-num {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  background: var(--paper-2);
  color: var(--ink-3);
  border-radius: 50%;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 11px;
}
.past-stop-info { min-width: 0; }
.past-stop-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.past-stop-name {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 13px;
  color: var(--navy);
  letter-spacing: -0.1px;
}
.past-stop-meta {
  font-family: var(--sans);
  font-size: 11.5px;
  color: var(--ink-3);
  margin-top: 2px;
}
.past-stop-note {
  font-family: var(--sans);
  font-size: 12px;
  font-style: italic;
  color: var(--ink-2);
  margin-top: 6px;
  padding: 8px 12px;
  background: var(--paper-2);
  border-radius: var(--r-sm);
  letter-spacing: -0.1px;
  line-height: 1.4;
}


/* === PORTAL v2 additions (real assets replace the demo's placeholders) === */
.real-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.lightbox-body .real-photo { object-fit: contain; max-height: 72vh; border-radius: var(--r-sm); background: var(--paper); }
.pc-stat-stack div { line-height: 1.35; }
.vote-tally { display: inline-flex; gap: 6px; align-items: center; flex: none; }
.vote-tally .vt { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 10px;
  padding: 2px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-3); background: var(--paper); }
.vote-tally .vt.up   { color: var(--navy); border-color: var(--navy-tint); background: var(--navy-tint); }
.vote-tally .vt.down { color: var(--ink-3); }
.compare-table tr.tint td { background: var(--paper-2); }
.compare-table tr.tint td.compare-row-label { background: transparent; }



/* ══════════════════════════════════════════════════════════════════════
   DESIGN-HANDOFF RESTYLE  ·  Cresa Market Survey
   Overrides prior styles by cascade order. Tokens & specs taken verbatim
   from design_handoff_survey_tool (README + Survey Prototype.dc.html).
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#FDFDFE;
  --paper:#FFFFFF; --paper-card:#FFFFFF;
  --paper-2:#F8FAFD;          /* table group headers / hover */
  --paper-3:#E8EFF8;          /* photo / input bg */
  --ink:#001E5A; --ink-2:#2B3350; --ink-3:#5A6580; --ink-4:#8A93A8;
  --rule:#E4E8F0; --rule-2:#F0F2F7; --hair:#EEF1F6;
  --navy:#001E5A; --navy-light:#0A2D6E;
  --accent:#001E5A; --accent-2:#0A2D6E; --accent-tint:#E8EFF8;
  --gold:#FFB600; --gold-ink:#B98A00; --shortlist-tint:#FFFDF4;
  --link:#0056DA; --bright-blue:#0056DA;
  --green:#0B7A3E; --amber:#B4540A;
  --shadow-1:0 1px 3px rgba(0,30,90,.06);
  --shadow-2:0 2px 10px rgba(0,30,90,.10);
  --shadow-float:0 2px 12px rgba(0,30,90,.14);
}
body{ background:var(--bg); font-family:var(--sans); color:var(--ink-2); }
.app{ background:var(--bg); }
a{ color:var(--navy); }
a:hover{ color:var(--link); }

/* ───────── Header (58px) ───────── */
.topbar{
  height:58px; padding:0; border-bottom:1px solid var(--rule);
  background:var(--bg); box-shadow:none;
}
.topbar > .brand,
.topbar > .topbar-right{ /* re-centre content under a 1560 cap */ }
.app > .topbar{ position:sticky; top:0; z-index:50; }
/* centre the header contents to max-width 1560 with 36px gutters */
.topbar{ display:block; }
.topbar::before{ content:none; }
.topbar-inner{
  max-width:var(--shell-max); margin:0 auto; height:58px; padding:0 40px;
  display:flex; align-items:center; justify-content:space-between; box-sizing:border-box;
}
.brand{ gap:14px; }
.brand-logo{ height:19px; }
.brand-divider{ width:1px; height:22px; background:var(--rule); margin:0; }
.brand-name{
  font-size:11px; font-weight:700; letter-spacing:2px; color:var(--ink-4);
  text-transform:uppercase;
}
.topbar-right{ gap:26px; }
/* nav tabs → plain text w/ gold underline when active */
.topbar-tabs{
  display:flex; gap:24px; background:transparent; border:0; border-radius:0; padding:0;
  align-self:stretch; align-items:center;
}
.topbar-tab{
  height:58px; padding:0; border:0; border-radius:0; background:transparent;
  color:var(--ink-4); font-size:12.5px; font-weight:700; letter-spacing:-0.1px;
  border-bottom:2px solid transparent; margin-bottom:-1px; gap:0;
}
.topbar-tab svg{ display:none; }
.topbar-tab:hover{ background:transparent; color:var(--ink-2); }
.topbar-tab.active{
  color:var(--navy); border:0; border-bottom:2px solid var(--gold); background:transparent;
}
.topbar-tab .count{
  margin-left:7px; min-width:16px; height:16px; padding:0 4px; font-size:10px;
  background:var(--paper-2); border:1px solid var(--rule); color:var(--ink-3); border-radius:var(--r-sm);
}
.topbar-tab.active .count{ background:var(--navy); color:#fff; border-color:var(--navy); }
/* avatar → 30px navy circle */
.avatar{ width:30px; height:30px; font-size:11px; font-weight:700; background:var(--navy); color:#fff; font-family:var(--sans); }
.avatar.client{ background:var(--navy); color:#fff; }
.avatar.broker{ background:var(--navy); color:#fff; }
.avatar.lg{ width:30px; height:30px; }
.topbar-right .muted{ color:var(--ink-4); }

/* ───────── Page header block ───────── */
.survey-header{
  max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box;
  padding:34px 40px 26px; border-bottom:0; background:transparent;
}
.survey-header .eyebrow{
  font-size:10.5px; font-weight:700; letter-spacing:2.2px; text-transform:uppercase;
  color:var(--bright-blue); margin-bottom:8px;
}
.survey-title{
  /* Matches the building-detail page title (.detail-name-lg) for consistent
     header sizing across every view. */
  font-size:30px; line-height:1.08; letter-spacing:-0.8px; font-weight:700; color:var(--navy);
  margin:0;
}
.survey-meta{
  font-size:13px; color:var(--ink-4); font-weight:400; margin-top:10px; letter-spacing:0;
}
.survey-meta .dot{ background:var(--ink-4); }
.survey-meta .live-dot{ background:var(--green); }

/* ───────── List controls (Sort + Spread|Gallery) ───────── */
.list-controls{ display:flex; gap:10px; align-items:center; flex:none; padding-bottom:4px; }
/* Compare "Reorder" dropdown — reorders columns and saves the order app-wide. */
.sort-select-wrap{ display:inline-flex; align-items:center; gap:8px; }
.sort-select-label{ font-family:var(--sans); font-size:12px; font-weight:700; color:var(--ink-3); letter-spacing:-.1px; }
.sort-select{ appearance:none; -webkit-appearance:none; font-family:var(--sans); font-size:12px; font-weight:600; color:var(--navy); background-color:var(--paper-card); border:1px solid var(--rule); border-radius:var(--r-sm); padding:8px 32px 8px 12px; cursor:pointer; letter-spacing:-.1px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23001E5A' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; background-size:13px; }
.sort-select:hover{ border-color:var(--ink-4); }
.sort-select:focus-visible{ outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(0,30,90,.10); }
.sortchip,.mapchip{
  border:1px solid var(--rule); border-radius:var(--r-sm); padding:8px 14px;
  font-size:11.5px; font-weight:700; color:var(--ink-2); cursor:pointer; user-select:none;
  background:#fff; white-space:nowrap;
}
.sortchip:hover,.mapchip:hover{ border-color:var(--navy); }
.mapchip.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
.seg{ display:flex; border:1px solid var(--rule); border-radius:var(--r-sm); overflow:hidden; }
.seg-btn{
  padding:8px 14px; font-size:11.5px; font-weight:700; cursor:pointer; user-select:none;
  background:#fff; color:var(--ink-4); border:0; white-space:nowrap;
}
.seg-btn + .seg-btn{ border-left:1px solid var(--rule); }
.seg-btn.on{ background:var(--navy); color:#fff; }

/* ───────── Split (fills remaining viewport; list scrolls, map sticky) ───────── */
.split{
  display:flex; flex-direction:row; align-items:stretch;
  flex:1; min-height:0;
  max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box;
  border-top:1px solid var(--rule); gap:0;
}
.split.no-map{ display:block; overflow-y:auto; }
.split.no-map .gallery-scroll{ overflow:visible; height:auto; }
.split-list{
  flex:1; min-width:640px; overflow-y:auto; padding:0; background:transparent; border-right:0;
}
.split .split-map,
.split .cresa-gmap-wrap,
.split > .map-shell{
  flex:1.3; min-width:0; border-left:1px solid var(--rule);
}

/* ───────── Spread row ───────── */
.property-card{
  display:grid; grid-template-columns:52px 170px 1fr auto; gap:20px; align-items:stretch;
  padding:22px 28px; margin:0; border:0; border-bottom:1px solid var(--rule);
  border-radius:0; background:transparent; box-shadow:none; cursor:pointer;
  transition:background .12s;
}
.property-card:hover{ background:var(--paper-2); border-color:var(--rule); box-shadow:none; }
.property-card.selected{ background:var(--paper-2); box-shadow:inset 3px 0 0 var(--gold); border-color:var(--rule); }
.property-card.passed{ opacity:.45; }
.pc-pin{
  width:30px; height:30px; align-self:flex-start; margin-top:2px; justify-self:center;
  display:inline-grid; place-items:center; border-radius:var(--r-sm);
  background:var(--navy); color:#fff; font-size:13px; font-weight:800; letter-spacing:0;
}
.pc-photo{
  width:170px; height:120px; border-radius:var(--r-sm); align-self:flex-start;
  background:var(--paper-3); border:1px solid var(--rule); overflow:hidden;
}
.pc-photo .pc-num{ display:none; }
.pc-photo .placeholder{
  background:var(--paper-3);
  color:var(--ink-4); font-size:9px; letter-spacing:1.2px; font-weight:700;
}
.pc-badge{
  position:absolute; top:10px; left:10px; font-size:9.5px; font-weight:700;
  border-radius:var(--r-sm); padding:3px 8px; letter-spacing:.6px; z-index:3;
}
.pc-badge.short{ background:var(--gold); color:var(--navy); }
.pc-badge.pass{ background:var(--rule); color:var(--ink-3); }
.pc-body{ display:flex; flex-direction:column; gap:0; min-width:0; }
.pc-name-row{ display:block; }
.pc-name{
  font-size:22px; font-weight:700; color:var(--navy); letter-spacing:-.6px; line-height:1.15;
  white-space:normal; overflow:visible; text-overflow:clip;
}
.pc-addr{
  font-size:12px; color:var(--ink-4); letter-spacing:0; margin:3px 0 14px;
  white-space:normal; overflow:visible; text-overflow:clip;
}
.pc-stats{
  display:flex; border-top:1px solid var(--hair); padding-top:12px; margin-top:auto;
  grid-template-columns:none; gap:0;
}
.pc-stats > div{
  flex:1; min-width:0; overflow:hidden; padding:0 10px 0 14px; border-right:1px solid var(--hair);
}
.pc-stats > div:first-child{ padding-left:0; }
.pc-stats > div:last-child{ border-right:0; }
.pc-stat-label{
  font-size:9px; letter-spacing:1.2px; color:var(--ink-4); font-weight:700; text-transform:uppercase;
  margin-bottom:0; order:2; margin-top:2px; white-space:nowrap;
}
.pc-stat-val{
  font-size:14px; font-weight:700; color:var(--navy); letter-spacing:0; white-space:nowrap;
  order:1;
}
.pc-stat-val.pc-stat-stack > div{ font-size:14px; }
.pc-actions{
  flex-direction:column; align-items:flex-end; justify-content:center; gap:8px; align-self:center;
}
.pc-actions .btn.ghost.sm{ display:none; }        /* row is clickable; drop chevron */
.pc-actions .vote-group{ border-color:var(--rule); }
/* Rent leads by position; all values share one uniform type treatment */
.pc-stats > .pc-stat-primary{ flex:1.4; }
/* Hover labels on the shortlist / remove thumbs. The vote pill clips its own
   overflow (rounded corners), so the tooltip lives on the non-clipped parent
   and swaps its text via :has(). */
.pc-actions{ position:relative; }
.pc-actions::after{
  content:''; position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
  background:var(--navy); color:#fff; font-size:10.5px; font-weight:700; letter-spacing:.2px;
  padding:4px 9px; border-radius:var(--r-sm); white-space:nowrap; pointer-events:none;
  opacity:0; transition:opacity .12s; z-index:20; box-shadow:0 6px 16px -6px rgba(0,0,0,.4);
}
.pc-actions::before{
  content:''; position:absolute; bottom:calc(100% + 3px); left:50%; transform:translateX(-50%);
  border:5px solid transparent; border-top-color:var(--navy); opacity:0; transition:opacity .12s; pointer-events:none; z-index:20;
}
.pc-actions:has(.vote-btn.up:hover)::after{ content:'Shortlist'; opacity:1; }
.pc-actions:has(.vote-btn.down:hover)::after{ content:'Remove'; opacity:1; }
.pc-actions:has(.vote-btn:hover)::before{ opacity:1; }
/* Survey summary strip — at-a-glance, scales to any property count */
.survey-summary{ display:flex; flex-wrap:wrap; margin-top:18px; border:1px solid var(--rule); border-radius:var(--r-md); background:var(--paper); overflow:hidden; }
.survey-summary .ss-item{ flex:1; min-width:128px; padding:11px 18px; border-right:1px solid var(--rule); }
.survey-summary .ss-item:last-child{ border-right:0; }
.survey-summary .ss-val{ font-size:18px; font-weight:800; color:var(--navy); letter-spacing:-.4px; white-space:nowrap; }
.survey-summary .ss-val span{ font-size:11px; font-weight:600; color:var(--ink-4); letter-spacing:0; }
.survey-summary .ss-label{ font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--ink-4); margin-top:3px; }
.survey-summary .ss-short.empty .ss-val{ font-weight:700; }
.survey-summary .ss-nudge{ font-size:12px; font-weight:700; color:var(--gold-ink, #B4820A); white-space:nowrap; }

/* ───────── Gallery ───────── */
.gallery-scroll{ flex:1; min-width:0; overflow-y:auto; }
.gallery-grid{
  display:grid; gap:20px; align-content:start; padding:26px 36px 30px;
}
.gallery-grid.cols3{ grid-template-columns:repeat(3,1fr); }
.gallery-grid.cols2{ grid-template-columns:repeat(2,1fr); }
.gallery-tile{
  border-radius:var(--r-sm); overflow:hidden; position:relative; height:250px; cursor:pointer;
  background:repeating-linear-gradient(45deg,#DCE6F5,#DCE6F5 9px,#E6EEF9 9px,#E6EEF9 18px);
  transition:box-shadow .15s;
}
.gallery-tile:hover{ box-shadow:0 6px 20px rgba(0,30,90,.18); }
.gallery-tile.passed{ opacity:.45; }
.gallery-tile .real-photo{ width:100%; height:100%; object-fit:cover; }
.gallery-cap{
  position:absolute; left:0; right:0; bottom:0; padding:38px 14px 12px;
  background:linear-gradient(to top,rgba(0,21,69,.92),rgba(0,21,69,0));
}
.gallery-cap-top{ display:flex; justify-content:space-between; align-items:baseline; }
.gallery-cap-name{ font-size:15px; font-weight:700; color:#fff; }
.gallery-cap-price{ font-size:13px; font-weight:700; color:#fff; }
.gallery-cap-price.short{ color:var(--gold); }
.gallery-cap-sub{ font-size:10.5px; color:rgba(255,255,255,.75); margin-top:1px; }
.gallery-badge{
  position:absolute; top:12px; left:12px; font-size:9.5px; font-weight:700; border-radius:var(--r-sm); padding:3px 8px; z-index:2;
}
.gallery-badge.short{ background:var(--gold); color:var(--navy); }
.gallery-badge.pass{ background:var(--rule); color:var(--ink-3); }

/* ───────── Map pins (design semantics) ───────── */
/* Numbered navy squares — same badge as the property-card / commute pins */
.map-pin-body{
  width:28px; height:28px; border-radius:var(--r-sm); background:var(--navy); border:none;
  box-shadow:0 2px 6px rgba(0,30,90,.28);
}
.map-pin-num{ color:#fff; font-family:var(--sans); font-size:12px; font-weight:800; }
.map-pin.short .map-pin-body{
  background:var(--navy); border:none; box-shadow:0 0 0 3px var(--gold),0 3px 8px rgba(0,30,90,.3);
}
.map-pin.short .map-pin-num{ color:#fff; }
.map-pin.selected .map-pin-body{
  width:30px; height:30px; background:var(--gold); border:none;
  box-shadow:0 3px 10px rgba(0,30,90,.35);
}
.map-pin.selected .map-pin-num{ color:var(--navy); }
.map-pin:hover .map-pin-body{ transform:scale(1.12); }
/* Hover card: photo thumbnail + name + address */
.map-pin-card{
  position:absolute; bottom:calc(100% + 10px); left:50%;
  transform:translateX(-50%) translateY(5px);
  width:204px; background:#fff; border:1px solid var(--rule); border-radius:var(--r-md);
  box-shadow:0 14px 34px -10px rgba(0,30,90,.4); overflow:hidden;
  opacity:0; pointer-events:none; transition:opacity .14s ease, transform .14s ease; z-index:30;
}
.map-pin:hover .map-pin-card{ opacity:1; transform:translateX(-50%) translateY(0); }
.map-pin-card::after{
  content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%);
  border:6px solid transparent; border-top-color:#fff;
}
.map-pin-card .mpc-photo{ height:106px; background:var(--paper-3); }
.map-pin-card .mpc-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
.map-pin-card .mpc-photo-ph{ display:grid; place-items:center; color:var(--ink-4); font-size:9px; letter-spacing:1.2px; font-weight:700; text-transform:uppercase; }
.map-pin-card .mpc-body{ padding:9px 12px 11px; }
.map-pin-card .mpc-name{ font-size:13px; font-weight:800; color:var(--navy); letter-spacing:-.2px; line-height:1.2; }
.map-pin-card .mpc-addr{ font-size:11px; color:var(--ink-3); margin-top:3px; line-height:1.35; }
.map-pin-card .mpc-sub{ font-size:9.5px; font-weight:500; letter-spacing:0; color:var(--ink-4); margin-top:2px; }

/* ───────── Detail ───────── */
.detail{ max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box; padding:0 36px; }
.route-fixed{ overflow:hidden; }   /* detail page scrolls inside .detail-cols, not here */
.detail-grid{ display:block; gap:0; margin-top:0; }
.detail-main{ overflow:visible; padding:0 0 30px; }
.detail-aside{
  border-left:0; padding:0; margin-top:8px;
  display:grid; grid-template-columns:1fr 1fr; gap:32px;
}
.detail-nav{ margin:0; padding:14px 0 12px; font-family:var(--mono); }
.detail-nav a{ font-size:12px; font-weight:700; color:var(--ink-2); }
.detail-nav a:hover{ color:var(--link); }
.detail-nav-pager{ border-color:var(--rule); }

.detail-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin:20px 0 4px; }
.detail-name{ font-size:32px; letter-spacing:-1.2px; color:var(--navy); line-height:1; margin:0; }
.detail-addr{ font-size:13px; color:var(--ink-3); margin:6px 0 0; }
.detail-header .badge.submarket{ display:none !important; }   /* submarket now lives in addr line */
.detail-actions{ flex-direction:row; align-items:center; gap:10px; }
.detail-nav-pager{ order:3; }

/* action buttons (Shortlist / Pass / Share) */
.act-btn{
  font-size:12px; font-weight:700; border-radius:var(--r-sm); padding:10px 18px; cursor:pointer; user-select:none;
  border:1px solid var(--rule); background:#fff; color:var(--ink-3); display:inline-flex; align-items:center; gap:6px;
  white-space:nowrap;
}
.act-btn:hover{ border-color:var(--navy); color:var(--navy); }
.act-btn.short{ background:#fff; color:var(--navy); border-color:var(--rule); }
.act-btn.short.on{ background:var(--gold); color:var(--navy); border-color:var(--gold); }
.act-btn.pass.on{ background:var(--ink-2); color:#fff; border-color:var(--ink-2); }

/* hero split */
.media-grid{ grid-template-columns:1.55fr 1fr; gap:14px; height:290px; margin:0 0 0; align-items:stretch; }
.carousel{ aspect-ratio:auto; height:100%; border-radius:var(--r-md); background:repeating-linear-gradient(45deg,#DCE6F5,#DCE6F5 11px,#E8EFF8 11px,#E8EFF8 22px); }
.carousel .placeholder{ background:repeating-linear-gradient(45deg,#DCE6F5,#DCE6F5 11px,#E8EFF8 11px,#E8EFF8 22px); color:var(--ink-4); letter-spacing:1.6px; font-size:10px; font-weight:700; }
.carousel-arrow{ width:32px; height:32px; background:#fff; border:0; box-shadow:0 2px 8px rgba(0,30,90,.15); color:var(--navy); }
.carousel-arrow:hover{ background:var(--navy); color:#fff; }
.carousel-arrow svg{ width:14px; height:14px; }
.carousel-label{ background:rgba(11,22,48,.8); color:#fff; border-radius:var(--r-md); padding:4px 10px; font-family:var(--mono); letter-spacing:0; font-weight:700; }
.detail-map{ border-radius:var(--r-md); min-height:0; height:100%; background:#EDF2F7; border:0; }

/* gold stat band */
.stat-band{ display:flex; align-items:center; padding:16px 0; border-bottom:1px solid var(--rule-2); margin-top:20px; }
.stat-item{ flex:1; display:flex; gap:12px; align-items:center; padding-left:22px; }
.stat-item:first-child{ padding-left:0; }
.stat-item svg{ width:24px; height:24px; flex:none; }
.stat-item .sv{ font-size:14px; font-weight:700; color:var(--navy); line-height:1.15; }
.stat-item .sl{ font-size:10.5px; color:var(--ink-4); }
.stat-div{ width:1px; height:34px; background:var(--rule-2); flex:none; }

/* description + show more */
.detail-desc{ font-size:12.5px; color:var(--ink-2); line-height:1.6; padding:14px 0 4px; max-width:760px; }
.showmore{ font-size:12px; font-weight:700; color:var(--navy); padding-bottom:14px; cursor:pointer; user-select:none; }
.showmore:hover{ color:var(--link); }

/* sections in single-column detail */
.detail-main .section{ margin-bottom:28px; }
.section-head{ border-bottom:0; padding-bottom:0; margin-bottom:10px; align-items:baseline; }
.section-title{ font-size:16px; font-weight:700; letter-spacing:-.3px; text-transform:none; color:var(--navy); }
.section-title .count{ color:var(--ink-4); font-weight:700; }

/* suites table */
.suites-table{ border:1px solid var(--rule-2); border-radius:var(--r-md); overflow:hidden; margin-bottom:8px; }
.suites-head,.suites-row{ display:flex; align-items:center; padding:12px 18px; }
.suites-head{ background:var(--paper-2); font-size:10.5px; font-weight:700; color:var(--ink-4); letter-spacing:.4px; text-transform:uppercase; }
.suites-row{ font-size:12.5px; border-top:1px solid var(--rule-2); }
.suites-row:hover{ background:var(--paper-2); }
.suites-table .c-suite{ flex:1; font-weight:700; color:var(--navy); }
.suites-table .c-size,.suites-table .c-avail,.suites-table .c-type,.suites-table .c-psf{ flex:1; color:var(--ink-2); }
.suites-table .c-mo{ flex:1.2; color:var(--ink-2); }
.suites-table .c-mo b{ color:var(--navy); }
.suites-table .c-mo .u{ color:var(--ink-4); }
.suites-table .c-docs{ flex:.7; display:flex; gap:8px; color:var(--ink-3); }
.suites-foot{ font-size:10.5px; color:var(--ink-4); padding:8px 2px 0; }

/* broker + comments rail cards below */
.detail-aside .section{ margin-top:0; }
.detail-aside .section-head{ margin-bottom:12px; border-bottom:1px solid var(--rule); padding-bottom:8px; }

/* hide info-grid & space-cards (replaced by band + table) */
.detail-main .legacy-hide{ display:none !important; }

/* ───────── Compare — data matrix ───────── */
.compare-wrap{ max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box; padding:0 40px 40px; overflow-x:auto; }
/* No overflow:hidden here — it would trap position:sticky so the name band
   couldn't pin to the scroll wrap. Corners are rounded on the end cells instead. */
.compare-table{ border:1px solid var(--rule); border-radius:var(--r-md); border-collapse:separate; border-spacing:0; }
.compare-table thead tr:first-child th:first-child{ border-top-left-radius:10px; }
.compare-table thead tr:first-child th:last-child{ border-top-right-radius:10px; }
.compare-table tbody tr:last-child td:first-child{ border-bottom-left-radius:10px; }
.compare-table tbody tr:last-child td:last-child{ border-bottom-right-radius:10px; }
.compare-table th,.compare-table td{
  border:0; border-bottom:1px solid var(--rule-2); border-right:1px solid var(--rule-2);
  padding:14px 16px; vertical-align:middle; text-align:left;
  font-size:12px; color:#2A2A2A; font-weight:600; background:#fff;
  font-variant-numeric:tabular-nums;
}
.compare-table th:last-child,.compare-table td:last-child{ border-right:0; }
.compare-table tbody tr:last-child td{ border-bottom:0; }
.compare-table tbody tr:nth-child(odd) td{ background:#fff; }
.compare-table tbody tr:nth-child(even) td{ background:var(--paper-2); }  /* subtle zebra */
.compare-table tbody tr:hover td{ background:var(--paper-3); }            /* row highlight */
.compare-table .compare-row-label{
  position:sticky; left:0; z-index:2; width:210px; min-width:210px;
  padding:13px 32px 13px 18px;
  background:var(--paper-2) !important; color:#6B6B6B !important;
  text-align:left !important;
  font-size:12px !important; font-weight:700; letter-spacing:.2px; text-transform:uppercase;
}
.compare-table tbody tr:first-child .compare-row-label,
.compare-table tbody tr:nth-child(odd) .compare-row-label{ background:var(--paper-2) !important; color:#6B6B6B !important; }
.compare-table tbody tr:hover .compare-row-label{ background:var(--paper-3) !important; }
.compare-table thead th{ background:#fff; text-align:left; }
.compare-photo{ width:200px; max-width:100%; height:132px; border-radius:var(--r-sm); overflow:hidden; background:var(--paper-3); margin:0 auto 0 0; }
.compare-photo .real-photo{ object-fit:cover; width:100%; height:100%; }
/* Navy band spanning the full header row (name + address) — anchors the table */
.compare-name-row th{ background:var(--navy) !important; text-align:left; padding:12px 16px; border-right:0 !important; vertical-align:top; }
.compare-name-row .compare-row-label{ background:var(--navy) !important; }
.compare-name{ font-size:12px; font-weight:700; color:#fff; letter-spacing:-.1px; }
.compare-addr{ font-size:12px; color:rgba(255,255,255,.72); font-weight:600; margin-top:3px; }
/* row-group micro headers */
.compare-table tr.grouprow td{
  background:var(--paper-2) !important; font-size:10px; font-weight:700; letter-spacing:1.4px;
  text-transform:uppercase; color:var(--ink-4); padding:8px 14px;
}
.compare-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:11px; color:var(--ink-4); }
.compare-foot a{ font-size:12px; font-weight:700; color:var(--link); cursor:pointer; }

/* ───────── Buttons / badges ───────── */
.btn{ background:var(--navy); border-color:var(--navy); border-radius:var(--r-sm); font-size:12.5px; font-weight:700; }
.btn:hover{ background:var(--navy-light); border-color:var(--navy-light); }
.btn.subtle{ background:#fff; border-color:var(--rule); color:var(--ink-2); }
.btn.subtle:hover{ border-color:var(--navy); color:var(--navy); background:#fff; }
.vote-btn.up.active,.vote-btn.down.active{ background:var(--gold); color:var(--navy); }
.badge.submarket{ background:var(--paper-2); color:var(--ink-3); border-color:var(--rule); font-family:var(--sans); text-transform:none; letter-spacing:0; }
.mono-tag{ font-family:var(--mono); }

/* keep the preview tag readable */
.brand .mono-tag{ letter-spacing:.4px; }


/* ══════════ V2 DETAIL — "Airy Broadsheet" ══════════ */
.detail-v2{ max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box; padding:0 40px;
  height:100%; display:flex; flex-direction:column; }
.detail-titlebar{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; padding:18px 0 16px; flex:none; }
.detail-pills{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.dpill{ font-size:12px; font-weight:700; padding:6px 14px; border-radius:var(--r-lg); background:var(--gold); color:var(--navy); white-space:nowrap; }
.dpill.gold{ background:#FFF3D6; color:var(--gold-ink); }
.detail-name-lg{ font-size:30px; line-height:1.08; letter-spacing:-0.8px; font-weight:700; color:var(--navy); margin:0; }
.detail-v2 .detail-addr{ font-size:18px; color:var(--ink-3); margin-top:6px; }
.detail-summary{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:14px; font-size:13.5px; color:var(--ink-3); font-weight:500; letter-spacing:-.1px; }
.detail-summary strong{ color:var(--navy); font-weight:700; }
.detail-summary .sep{ color:var(--ink-4); }
.detail-titlebar{ align-items:stretch; }
.detail-title-actions{ display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; gap:12px; flex:none; padding-top:0; }
.detail-title-actions .act-btn{ padding:12px 26px; font-size:13px; border-radius:var(--r-sm); }
/* "Map" button pairs with the submarket pill — same height, font size & weight */
.return-map-btn{ display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:var(--r-lg); border:1px solid rgba(0,30,90,.18); background:var(--accent-tint); color:var(--navy); font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:-.1px; cursor:pointer; box-shadow:var(--shadow-1); transition:background .15s var(--ease), color .15s, border-color .15s, transform .1s; }
.return-map-btn svg{ width:13px; height:13px; }
.return-map-btn:hover{ background:var(--navy); border-color:var(--navy); color:#fff; }
.return-map-btn:active{ transform:translateY(1px); }
.hdr-pager{ align-items:center; }
.hdr-counter{ padding:0 12px; font-size:12.5px; font-weight:600; color:var(--ink-2); white-space:nowrap; }
.detail-title-actions .hdr-pill{ display:inline-flex; align-items:center; justify-content:center; padding:8px 12px; }
/* The title block (name/address) and this divider stay OUT of the scroll region
   — only .detail-cols scrolls (see .detail-v2 / .route-fixed below). A tall page
   would otherwise promote the whole scroller to a compositing layer, and on
   fractional-DPI displays a 1px line inside a composited scroller stops snapping
   to the device grid and washes out to invisible (isolating just the line onto
   its own layer did not help — the fractional offset comes from the scroller).
   Kept outside the scroller, the divider paints on the normal pixel-snapped path. */
.detail-rule{ height:1px; background:var(--rule); margin:0 0 24px; flex:none; }
.detail-cols{ display:grid; grid-template-columns:310px minmax(0,1fr) 420px; gap:40px; align-items:start;
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding-bottom:40px; }
/* Right column is the pinned action rail — decision + comments + documents in
   one panel. Sticky so it stays visible; scrolls internally if it runs long. */
.detail-right{ position:sticky; top:0; align-self:start; min-height:0; max-height:calc(100vh - 174px); overflow-y:auto;
  border:1px solid var(--rule); border-radius:var(--r-lg); background:var(--paper-card); box-shadow:none; }
.detail-right .rail-block{ padding:16px 18px; border-bottom:1px solid var(--rule-2); }
.detail-right .rail-block:last-child{ border-bottom:0; }
.detail-right .rail-label{ font-size:9.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:#6B6B6B; margin-bottom:10px; }
.detail-right .section{ margin-bottom:0; }
.detail-right .docs-grid{ grid-template-columns:1fr; }
/* Vote block — clear full-width segmented button control */
.detail-right .vote-group{ display:flex; width:100%; margin-top:2px; border:1px solid var(--rule); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow-1); background:#fff; }
.detail-right .vote-btn{ flex:1; justify-content:center; padding:12px 10px; font-size:13px; font-weight:600; color:var(--ink-2); }
.detail-right .vote-btn:hover{ background:var(--paper-2); color:var(--navy); }
.detail-right .vote-btn + .vote-btn{ border-left:1px solid var(--rule); }
.detail-right::-webkit-scrollbar{ width:8px; }
.detail-right::-webkit-scrollbar-track{ background:transparent; }
.detail-right::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:999px; }
.detail-right::-webkit-scrollbar-thumb:hover{ background:var(--ink-4); }

/* Notes block in the left column, below the building specs (parking, etc.) */
.detail-note{ margin-top:22px; }
.detail-note-label{ font-size:9.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--navy); margin-bottom:12px; padding-bottom:6px; border-bottom:1px solid var(--rule-2); }
.detail-note-body{ font-size:13px; line-height:1.55; color:var(--ink-2); }

/* Suites — a simple single-row-per-suite table below the photo. Neutral
   palette, no heavy navy accents; light header, hairline rows. */
.detail-suites{ margin-top:36px; }
/* Rows open a full-detail popup; hint shows only when columns are condensed. */
.suite-table .st-row{ cursor:pointer; }
.suite-hint{ display:none; font-size:11px; font-weight:600; color:var(--ink-3); letter-spacing:-.1px; margin:-4px 0 10px; }
/* Suite detail popup — all data points for one space, incl. the condensed ones. */
.suite-modal-card{ width:min(520px,100%); }
.suite-modal-body{ padding:22px; background:var(--paper-2); }
.suite-modal-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:var(--r-md); overflow:hidden; }
.sm-cell{ background:var(--paper-card); padding:13px 16px; }
.sm-l{ font-size:9px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-4); margin-bottom:5px; }
.sm-v{ font-size:15px; font-weight:700; color:var(--navy); letter-spacing:-.2px; }
/* Custom-order popup — draggable list with up/down arrows. */
.reorder-card{ width:min(460px,100%); }
.reorder-body{ padding:18px 20px; background:var(--paper-2); }
/* Quick-sort preset chips at the top of the popup. */
.reorder-presets{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.reorder-preset{ appearance:none; font-family:var(--sans); font-size:11.5px; font-weight:600; letter-spacing:-.1px; color:var(--ink-2); background:var(--paper-card); border:1px solid var(--rule); border-radius:999px; padding:6px 12px; cursor:pointer; transition:background .12s, border-color .12s, color .12s; }
.reorder-preset:hover{ border-color:var(--ink-4); }
.reorder-preset.on{ background:var(--navy); border-color:var(--navy); color:#fff; }
.reorder-hint{ font-size:12px; color:var(--ink-3); margin:0 2px 12px; letter-spacing:-.1px; }
.reorder-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.reorder-item{ display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--paper-card); border:1px solid var(--rule); border-radius:var(--r-md); cursor:grab; transition:border-color .12s, box-shadow .12s, opacity .12s; }
.reorder-item:hover{ border-color:var(--ink-4); }
.reorder-item.dragging{ opacity:.4; cursor:grabbing; }
.reorder-item.dragover{ border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold); }
.reorder-grip{ color:var(--ink-4); font-size:13px; line-height:1; letter-spacing:-1px; flex:none; }
.reorder-num{ flex:none; width:22px; height:22px; display:inline-grid; place-items:center; border-radius:var(--r-sm); background:var(--navy); color:#fff; font-size:11px; font-weight:700; }
.reorder-name{ flex:1; min-width:0; font-size:13px; font-weight:700; color:var(--navy); letter-spacing:-.1px; display:flex; flex-direction:column; gap:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.reorder-addr{ font-size:11px; font-weight:500; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.reorder-arrows{ flex:none; display:flex; gap:4px; }
.reorder-arrow{ width:26px; height:26px; display:inline-grid; place-items:center; border:1px solid var(--rule); background:var(--paper-card); color:var(--navy); border-radius:var(--r-sm); cursor:pointer; font-size:10px; line-height:1; transition:background .12s, border-color .12s; }
.reorder-arrow:hover{ background:var(--paper-2); border-color:var(--ink-4); }
.reorder-arrow:disabled{ opacity:.3; cursor:default; }
.suite-table-wrap{ margin-top:16px; border:1px solid var(--rule); border-radius:var(--r-md); overflow:auto; box-shadow:none; background:#fff; }
.suite-table{ width:100%; border-collapse:collapse; table-layout:fixed; font-size:12px; font-variant-numeric:tabular-nums; }
.suite-table thead th{ text-align:left; padding:10px 11px; background:var(--paper-2); color:#6B6B6B; font-weight:700; font-size:9px; letter-spacing:.4px; text-transform:uppercase; white-space:normal; border-bottom:1px solid var(--rule); }
/* Wider first three columns, tighter toward the right for even data spacing */
.suite-table th:nth-child(1){ width:14%; }
.suite-table th:nth-child(2){ width:13%; }
.suite-table th:nth-child(3){ width:13%; }
.suite-table th:nth-child(4){ width:10%; }
.suite-table th:nth-child(5){ width:10%; }
.suite-table th:nth-child(6){ width:12%; }
.suite-table th:nth-child(7){ width:10%; }
.suite-table th:nth-child(8){ width:12%; }
.suite-table th:nth-child(9){ width:6%; }
.suite-table tbody td{ padding:16px 13px; border-bottom:1px solid var(--rule-2); color:#2A2A2A; font-weight:600; white-space:nowrap; vertical-align:middle; }
.suite-table tbody tr:last-child td{ border-bottom:0; }
.suite-table tbody tr:nth-child(even) td{ background:var(--paper-2); }  /* faint zebra — matches the compare table */
.suite-table tbody tr:hover td{ background:var(--paper-3); }
.st-suite{ white-space:nowrap; }
.st-name{ font-weight:600; color:#2A2A2A; font-size:12px; }
.st-sf{ font-weight:600; color:#6B6B6B; font-size:12px; margin-left:10px; }
.st-plan-col{ text-align:right; width:52px; }
.st-plan{ display:inline-grid; place-items:center; width:30px; height:30px; border-radius:var(--r-sm); border:1px solid rgba(0,30,90,.18); background:var(--accent-tint); color:var(--navy); cursor:pointer; box-shadow:var(--shadow-1); transition:background .15s var(--ease), border-color .15s, color .15s, transform .1s; }
.st-plan:hover{ background:var(--navy); border-color:var(--navy); color:#fff; }
.st-plan:active{ transform:translateY(1px); }
.st-plan svg{ width:15px; height:15px; }
.st-empty{ padding:20px; color:var(--ink-3); font-style:italic; }
/* Mobile: collapse the suite table into stacked cards (labels from data-label) */
@media (max-width:700px){
  .suite-table-wrap{ border:0; box-shadow:none; background:transparent; overflow:visible; margin-top:12px; }
  .suite-table{ table-layout:auto; }
  .suite-table thead{ display:none; }
  .suite-table, .suite-table tbody, .suite-table tr, .suite-table td{ display:block; width:auto; }
  .suite-table tr{ border:1px solid var(--rule); border-radius:var(--r-md); background:#fff; box-shadow:var(--shadow-1); padding:4px 16px 8px; margin-bottom:12px; }
  .suite-table tbody tr:hover td{ background:transparent; }
  .suite-table td{ display:flex; justify-content:space-between; align-items:center; gap:16px; text-align:right !important; padding:10px 0 !important; border-bottom:1px solid var(--rule-2); white-space:normal; }
  .suite-table td:last-child{ border-bottom:0; }
  .suite-table td::before{ content:attr(data-label); font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:#6B6B6B; text-align:left; flex:none; }
  .suite-table td.st-suite{ font-size:16px; }
  .suite-table td.st-plan-col{ justify-content:space-between; }
  .hero-row{ flex-direction:column; }
  .thumbstrip{ flex-direction:row; width:auto; }
  .thumbstrip .thumb{ flex:1; height:72px; }
}

/* left rail */
.spec-list{ display:flex; flex-direction:column; gap:22px; }
.spec-groups{ display:flex; flex-direction:column; gap:22px; }
.spec-group-label{ font-size:9.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--navy); margin-bottom:12px; padding-bottom:6px; border-bottom:1px solid var(--rule-2); }
.spec-group .spec-list{ gap:26px; }
/* Vote buttons use the UI font (Inter), not the mono face */
.vote-btn{ font-family:var(--sans); letter-spacing:0; }
.spec-row{ display:flex; gap:12px; align-items:flex-start; }
.spec-row svg{ width:20px; height:20px; flex:none; margin-top:1px; }
.spec-row .sv{ font-size:14px; font-weight:700; color:var(--navy); line-height:1.2; }
.spec-row .sl{ font-size:11px; color:var(--ink-4); margin-top:2px; }
.mini-map{ margin:0 0 24px; border-radius:var(--r-md); overflow:hidden; position:relative; height:180px;
  background:#E8EFF8; background-image:radial-gradient(#D4DEEE 1px,transparent 1px); background-size:16px 16px; }
.mini-map .mm-pin{ position:absolute; left:34%; top:46%; transform:translate(-50%,-50%);
  width:28px; height:28px; border-radius:var(--r-sm); background:var(--navy); box-shadow:0 2px 6px rgba(0,30,90,.28);
  display:grid; place-items:center; color:#fff; font-family:var(--sans); font-size:12px; font-weight:800; }
.mini-map .mm-label{ position:absolute; bottom:10px; right:12px; font-size:9px; letter-spacing:1.2px; color:var(--ink-4); font-weight:700; }

/* center */
.hero-row{ display:flex; gap:12px; align-items:stretch; }
/* Hero stays roughly the same size (capped); extra center width goes to the
   secondary photos, which flex-grow wider. */
.hero-row .detail-hero{ flex:1 1 520px; min-width:0; max-width:880px; }
.detail-hero{ border-radius:var(--r-lg); overflow:hidden; position:relative; height:420px; max-width:720px; display:grid; place-items:center;
  background:repeating-linear-gradient(45deg,#E8EFF8,#E8EFF8 11px,#EFF4FB 11px,#EFF4FB 22px); }
.detail-hero .real-photo{ width:100%; height:100%; object-fit:cover; }
.detail-hero .hero-ph{ font-size:11px; letter-spacing:1.6px; color:var(--ink-4); font-weight:700; }
/* Bottom gradient scrim so the photo counter stays legible on any image */
.detail-hero::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:120px; background:linear-gradient(to top, rgba(8,16,36,.55), rgba(8,16,36,0)); pointer-events:none; z-index:1; }
.detail-hero .hero-counter{ z-index:2; background:transparent; box-shadow:none; color:#fff; font-weight:700; }
/* Shortlist/pass pill over the hero (upper-left) — mirrors the map/list badge. */
.detail-hero .hero-badge{ position:absolute; top:14px; left:14px; z-index:3; display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:5px 11px; border-radius:var(--r-sm); box-shadow:var(--shadow-2); }
.detail-hero .hero-badge.short{ background:var(--gold); color:var(--navy); }
.detail-hero .hero-badge.pass{ background:rgba(14,18,32,.72); color:#fff; }
.hero-nav{ position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%;
  background:#fff; box-shadow:0 2px 8px rgba(0,30,90,.15); display:grid; place-items:center; color:var(--navy); cursor:pointer; border:0; }
.hero-nav:hover{ background:var(--navy); color:#fff; }
.hero-nav.prev{ left:14px; } .hero-nav.next{ right:14px; }
.hero-counter{ position:absolute; bottom:14px; right:14px; background:#fff; border-radius:var(--r-lg); padding:7px 14px;
  font-size:11px; font-weight:700; color:var(--navy); box-shadow:0 2px 8px rgba(0,30,90,.12); }
.thumbstrip{ display:flex; flex-direction:column; gap:10px; width:auto; flex:1 1 160px; min-width:128px; max-width:200px; margin-top:0; }
.thumb{ flex:1; min-height:0; border-radius:var(--r-md); border:2px solid transparent; cursor:pointer; overflow:hidden;
  background-image:repeating-linear-gradient(45deg,#E8EFF8,#E8EFF8 8px,#EFF4FB 8px,#EFF4FB 16px); }
.thumb.on{ border-color:var(--navy); }
.thumb .real-photo{ width:100%; height:100%; object-fit:cover; }
.broker-note{ display:flex; align-items:center; gap:12px; margin-top:22px; font-size:14px; color:var(--ink-3); line-height:1.4; }
.broker-note .avatar{ width:34px; height:34px; flex:none; }
.broker-note b{ color:var(--navy); }

/* right rail — suite cards */
.detail-right{ display:flex; flex-direction:column; gap:16px; }
.suite-card{ border:1px solid var(--rule); border-radius:var(--r-lg); background:#fff; box-shadow:var(--shadow-1); overflow:hidden; }
/* Navy header bar — suite name + SF (white, inverted) + floor-plan icon */
.suite-cardhead{ display:flex; justify-content:space-between; align-items:center; gap:12px; background:var(--navy); color:#fff; padding:11px 16px; }
.sch-id{ display:flex; align-items:center; gap:12px; min-width:0; }
.sch-name{ font-size:14px; font-weight:700; color:#fff; letter-spacing:-.1px; }
.sch-sf{ font-size:14px; font-weight:700; color:#fff; opacity:.9; white-space:nowrap;
  border-left:1px solid rgba(255,255,255,.28); padding-left:12px; }
.sch-plan{ display:inline-grid; place-items:center; width:28px; height:28px; border-radius:var(--r-sm); background:rgba(255,255,255,.16); color:#fff; cursor:pointer; transition:background .15s var(--ease); }
.sch-plan:hover{ background:rgba(255,255,255,.30); }
.sch-plan svg{ width:15px; height:15px; }
/* One rent row: Base / OpEx / Total / Monthly — all same size */
.suite-metricrow{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:16px 16px 14px; }
.suite-metarow{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:14px 16px 16px; border-top:1px solid var(--rule-2); }
/* Both rows identical: category label on top, data value below, neutral
   (non-navy) colors so nothing reads as blue text. */
.sm-lbl{ font-size:9px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:#6B6B6B; margin-bottom:4px; }
.sm-val, .sm2-val{ font-size:14px; font-weight:700; color:#2A2A2A; letter-spacing:-.1px; line-height:1.2; }

/* header pager + tabs-in-detail */
.hdr-pager{ display:flex; gap:8px; }
.hdr-pill{ appearance:none; border:1px solid var(--rule); background:#fff; color:var(--ink-3); font-size:12.5px;
  font-weight:700; padding:8px 16px; border-radius:var(--r-sm); cursor:pointer; white-space:nowrap; }
.hdr-pill:hover{ border-color:var(--navy); color:var(--navy); }

/* extra sections (docs + comments) below the 3-col block */
.detail-extra{ margin-top:44px; display:grid; grid-template-columns:1fr 1fr; gap:44px; align-items:start; }
.detail-extra .section{ margin-bottom:0; }
/* Smaller laptops: hide the secondary-photo rail (hero becomes a full-width
   carousel via its own arrows + counter), trim type/spacing, and shorten the
   hero so the whole page fits with far less scrolling. The suite table drops its
   secondary columns instead of shrinking — full details open in a popup when a
   space is clicked. */
@media (max-width:1600px){
  .thumbstrip{ display:none; }
  .hero-row .detail-hero{ flex:1 1 auto; max-width:none; }
  .detail-hero{ height:360px; }
  .detail-cols{ gap:30px; grid-template-columns:280px minmax(0,1fr) 380px; }
  .detail-name-lg{ font-size:26px; }
  .detail-v2 .detail-addr{ font-size:16px; }
  .spec-row .sv{ font-size:13px; }
  .spec-row .sl{ font-size:10.5px; }
  .spec-groups{ gap:18px; }
  .spec-group .spec-list{ gap:18px; }
  .spec-row svg{ width:18px; height:18px; }
  .mini-map{ height:148px; margin-bottom:18px; }
  .detail-titlebar{ padding:10px 0 10px; }
  .detail-rule{ margin:0 0 14px; }
  .detail-suites{ margin-top:22px; }
  /* Condense the table: hide secondary columns; they live in the popup. */
  .suite-table .st-hide-sm{ display:none; }
  .suite-hint{ display:block; }
}
@media (max-width:1100px){ .detail-cols{ grid-template-columns:1fr; } .detail-extra{ grid-template-columns:1fr; } .detail-right{ position:static; max-height:none; overflow:visible; padding-right:0; } }


/* ══════════ COMMUTE (design 3a — table-first matrix) ══════════ */
.commute-wrap{ display:flex; flex-direction:column; flex:1; min-height:0; max-width:var(--shell-max); margin:0 auto; width:100%; box-sizing:border-box; padding:0 40px; }
.commute-head{ display:flex; justify-content:space-between; align-items:center; padding:4px 0 16px; gap:16px; flex-wrap:wrap; }
.commute-head .eyebrow{ font-size:10.5px; font-weight:700; letter-spacing:2.2px; color:var(--bright-blue); text-transform:uppercase; }
.commute-controls{ display:flex; gap:10px; align-items:center; }
.commute-empty{ border:1px dashed var(--rule); border-radius:var(--r-md); background:var(--paper-2); padding:20px 22px; margin-bottom:14px; }
.commute-empty-icon{ font-size:20px; }
.commute-empty-title{ font-size:15px; font-weight:700; color:var(--navy); margin:6px 0 4px; }
.commute-empty-body{ font-size:12.5px; color:var(--ink-3); line-height:1.55; max-width:820px; }
.commute-wrap .split{ border-top:1px solid var(--rule); }
.commute-scroll{ flex:1; min-width:640px; overflow-y:auto; }
.commute-table{ width:100%; border-collapse:separate; border-spacing:0; }
.commute-table thead th{ text-align:left; font-size:9px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-4); font-weight:700; padding:16px 14px 10px; border-bottom:1px solid var(--rule); position:sticky; top:0; background:var(--bg); z-index:1; }
.commute-table th.c-bldg{ width:34%; } .commute-table th.c-dist{ width:24%; }
.commute-table tbody tr{ cursor:pointer; }
.commute-table tbody tr:hover td{ background:var(--paper-2); }
.commute-table tbody tr.best td{ background:var(--shortlist-tint); }
.commute-table td{ padding:14px; border-bottom:1px solid var(--rule-2); vertical-align:middle; font-size:13px; color:var(--ink-2); }
.commute-cell-bldg{ display:flex; align-items:center; gap:14px; }
.commute-photo{ width:56px; height:42px; border-radius:var(--r-sm); overflow:hidden; flex:none; background:var(--paper-3); }
.commute-photo .placeholder{ font-size:9px; }
.commute-name{ font-size:14px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.commute-sub{ font-size:11px; color:var(--ink-4); margin-top:2px; }
.best-tag{ font-size:8.5px; font-weight:700; letter-spacing:.5px; color:var(--gold-ink); background:#FFF3D6; padding:2px 7px; border-radius:var(--r-sm); }
.commute-table td.c-num{ font-size:15px; font-weight:700; color:var(--navy); }
.commute-table td.c-num.dash{ color:var(--ink-4); font-weight:400; }
.dist-bar{ display:flex; height:22px; border-radius:var(--r-sm); overflow:hidden; background:var(--rule-2); width:100%; max-width:none; }
.dist-bar span{ display:flex; align-items:center; justify-content:center; height:100%; min-width:0; overflow:hidden; font-size:10.5px; font-weight:800; color:#fff; letter-spacing:-.2px; }
.dist-bar span:nth-child(3){ color:var(--navy); }
.commute-legend{ display:flex; gap:18px; align-items:center; padding:14px; font-size:11px; color:var(--ink-4); flex-wrap:wrap; }
.commute-legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle; }
.commute-src{ margin-left:auto; }

/* ── Commute v2 ── */
.commute-wrap{ overflow-y:auto; padding-bottom:40px; }
.commute-head{ padding:6px 0 14px; }
.commute-controls{ flex-wrap:wrap; gap:16px 32px; align-items:center; }
/* Quick comparison strip — auto-shown when a current office (survey or manual) is set */
.commute-quickcmp{ display:flex; align-items:center; gap:18px 24px; flex-wrap:wrap; margin:0 0 18px; padding:12px 16px; background:var(--paper-2); border:1px solid var(--rule); border-radius:var(--r-md); }
.cqc-head{ display:flex; flex-direction:column; gap:2px; }
.cqc-title{ font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--navy); }
.cqc-sub{ font-size:11.5px; color:var(--ink-4); }
.cqc-chips{ display:flex; gap:10px; flex-wrap:wrap; margin-left:auto; }
.cqc-chip{ display:inline-flex; align-items:center; gap:8px; background:var(--paper-card); border:1px solid var(--rule); border-radius:999px; padding:6px 13px; font-size:12px; }
.cqc-chip b{ color:var(--navy); font-weight:700; }
.cqc-chip em{ font-style:normal; font-weight:800; }
.cqc-chip em.g{ color:var(--green); } .cqc-chip em.r{ color:var(--rose); }
.cm-field{ display:inline-flex; align-items:center; gap:8px; font-family:var(--sans); font-size:12px; font-weight:700; color:var(--ink-3); letter-spacing:-.1px; }
.cm-field select, .cm-zip{ appearance:none; font-family:var(--sans); font-size:12px; font-weight:600; color:var(--navy); background:var(--paper-card); border:1px solid var(--rule); border-radius:var(--r-sm); padding:7px 11px; cursor:pointer; }
.cm-field select{ padding-right:26px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23001E5A' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 9px center; background-size:12px; }
.cm-zip{ width:96px; cursor:text; }
.cm-slider input[type=range]{ width:120px; accent-color:var(--navy); }
.cm-slider b{ color:var(--navy); font-size:12px; min-width:48px; }
.cm-cur{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--navy); background:var(--accent-tint); border:1px solid rgba(0,30,90,.18); border-radius:999px; padding:5px 6px 5px 12px; }
.cm-cur button{ border:0; background:rgba(0,30,90,.10); color:var(--navy); width:18px; height:18px; border-radius:50%; cursor:pointer; font-size:10px; line-height:1; }
/* Stat tiles */
.commute-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:2px 0 18px; }
.cm-tile{ border:1px solid var(--rule); border-radius:var(--r-md); background:var(--paper-card); padding:16px 18px; }
.cm-tile-l{ font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--ink-4); margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cm-tile-v{ font-size:24px; font-weight:800; color:var(--navy); letter-spacing:-.6px; line-height:1.05; }
.cm-tile-v .cm-unit{ font-size:12px; font-weight:700; color:var(--ink-4); }
.cm-tile-s{ font-size:11.5px; color:var(--ink-3); margin-top:6px; }
.cm-good{ color:var(--green); font-weight:700; }
.cm-bad{ color:var(--rose); font-weight:700; }
/* Body split: table + map */
.commute-body{ display:grid; grid-template-columns:minmax(0,1fr) 860px; gap:28px; align-items:start; }
.commute-scroll{ min-width:0; overflow:visible; }
.commute-table thead th{ position:static; background:transparent; padding:8px 9px 10px; }
.commute-table td{ padding:20px 9px; }
.commute-table td.c-num.soft{ font-weight:600; color:var(--ink-3); font-size:13px; }
.commute-table tbody tr.sel td{ background:var(--accent-tint); }
.cm-pin{ width:26px; height:26px; flex:none; display:inline-grid; place-items:center; border-radius:var(--r-sm); background:var(--navy); color:#fff; font-size:12px; font-weight:800; }
.commute-table td.c-act{ text-align:right; }
.link-btn{ border:0; background:transparent; color:var(--link); font-family:var(--sans); font-size:12px; font-weight:700; cursor:pointer; }
.commute-src{ font-size:11px; color:var(--ink-4); padding:12px 4px 0; margin-left:0; }
/* Map */
.commute-map{ position:sticky; top:8px; }
.cm-svg{ width:100%; height:auto; border:1px solid var(--rule); border-radius:var(--r-md); display:block; background:#EEF3FA; }
.cm-empty{ display:grid; place-items:center; height:300px; color:var(--ink-4); }
.cm-legend{ display:flex; gap:16px; flex-wrap:wrap; padding:10px 2px 0; font-size:11px; color:var(--ink-3); }
.cm-legend i{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
/* Head-to-head */
.commute-h2h{ margin-top:24px; border:1px solid var(--rule); border-radius:var(--r-lg); background:var(--paper-card); padding:18px 20px; }
.cm-h2h-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
.cm-h2h-head h3{ margin:0; font-size:13px; font-weight:800; letter-spacing:.3px; text-transform:uppercase; color:var(--navy); }
.cm-h2h-picks{ display:inline-flex; align-items:center; gap:10px; }
.cm-h2h-picks select{ appearance:none; font-family:var(--sans); font-size:12px; font-weight:700; color:var(--navy); background:var(--paper-card); border:1px solid var(--rule); border-radius:var(--r-sm); padding:7px 26px 7px 11px; cursor:pointer; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23001E5A' stroke-width='2.2'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 9px center; background-size:12px; }
.cm-vs{ font-size:11px; font-weight:700; color:var(--ink-4); text-transform:uppercase; }
