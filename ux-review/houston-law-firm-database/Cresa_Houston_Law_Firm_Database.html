// Helper: given a marker, figure out if it currently represents a cluster
// and whether any firm inside is selected. Used by hover/highlight paths
// to stamp the correct icon without clobbering the cluster count label.
function getMarkerGroupState(m){
  if(!m||!m._groupKey)return {isCluster:false,hasSelected:false};
  const g=getCurrentGroup(m._groupKey);
  if(!g)return {isCluster:false,hasSelected:false};
  const isCluster=g.firms.length>1;
  const hasSelected=g.firms.some(f=>selectedIds.has(f.id));
  return {isCluster,hasSelected,group:g};
}

// Reset a marker to its baseline (no hover, no highlight) state.
function resetMarkerIcon(m){ paintMarker(m,false,false); }

let highlightedMarkerId=null;
function highlightMarker(firmId){
  // Reset previous highlight
  if(highlightedMarkerId!=null&&!selectedIds.has(highlightedMarkerId)){
    const prevKey=firmToGroupKey.get(highlightedMarkerId);
    const prev=prevKey?groupMarkerByKey.get(prevKey):null;
    if(prev)paintMarker(prev,false,false);
  }
  highlightedMarkerId=firmId;
  const firm=FIRMS[firmId];
  const key=firmToGroupKey.get(firmId);
  const m=key?groupMarkerByKey.get(key):null;
  if(m){
    paintMarker(m,true,false);
    if(firm&&firm.lat&&firm.lng&&map)map.panTo({lat:firm.lat,lng:firm.lng});
  }
}

function clearMarkerHighlight(){
  if(highlightedMarkerId!=null&&!selectedIds.has(highlightedMarkerId)){
    const key=firmToGroupKey.get(highlightedMarkerId);
    const m=key?groupMarkerByKey.get(key):null;
    if(m)paintMarker(m,false,false);
  }
  highlightedMarkerId=null;
}

// Lightweight hover effect: show a gold RING around the marker without
// panning or changing selection state. Used when a user hovers a firm card
// in the left panel so the corresponding property pops on the map.
let hoveredMarkerId=null;
function hoverMarker(firmId){
  if(hoveredMarkerId===firmId)return;
  // Reset previous hover (skip if that marker is click-highlighted or selected)
  if(hoveredMarkerId!=null&&hoveredMarkerId!==highlightedMarkerId&&!selectedIds.has(hoveredMarkerId)){
    const prevKey=firmToGroupKey.get(hoveredMarkerId);
    const prev=prevKey?groupMarkerByKey.get(prevKey):null;
    if(prev)resetMarkerIcon(prev);
  }
  hoveredMarkerId=firmId;
  if(firmId==null)return;
  if(firmId===highlightedMarkerId||selectedIds.has(firmId))return;
  const key=firmToGroupKey.get(firmId);
  const m=key?groupMarkerByKey.get(key):null;
  // Hover emphasis via the `hover` class — works for both clusters (keeps the
  // count) and single pins, and animates through CSS.
  if(m)paintMarker(m,false,true);
}
function clearMarkerHover(){hoverMarker(null);}

function updateMarkerSelections(){
  // Iterate groups. Each marker's selection state depends on whether ANY
  // firm inside the group is currently selected.
  groupMarkerByKey.forEach((m,key)=>{
    resetMarkerIcon(m);
  });
  // Re-apply hover/highlight if still active so they survive selection changes.
  if(hoveredMarkerId!=null&&hoveredMarkerId!==highlightedMarkerId&&!selectedIds.has(hoveredMarkerId)){
    const k=firmToGroupKey.get(hoveredMarkerId);
    const m=k?groupMarkerByKey.get(k):null;
    if(m)paintMarker(m,false,true);
  }
  if(highlightedMarkerId!=null&&!selectedIds.has(highlightedMarkerId)){
    const k=firmToGroupKey.get(highlightedMarkerId);
    const m=k?groupMarkerByKey.get(k):null;
    if(m)paintMarker(m,true,false);
  }
}

/* FILTERS */
const debouncedFilter = debounce(applyFilters, 150);
function applyFilters(){
  let f=[...FIRMS];
  // Single source of truth: left-rail filters. The table view shares the same
  // rail (no duplicate controls), so the same reads work for every view.
  const sideSearch=document.getElementById('sideSearch');
  const search=sideSearch?sideSearch.value:'';
  if(search){const s=search.toLowerCase();f=f.filter(x=>(x.n||'').toLowerCase().includes(s)||(x.addr||'').toLowerCase().includes(s)||(x.sm||'').toLowerCase().includes(s)||(x.ll||'').toLowerCase().includes(s));}

  // Tier — multi-select pills
  const tierArr=[...document.querySelectorAll('.tier-pill.active')].map(p=>p.dataset.val);
  if(tierArr.length)f=f.filter(x=>tierArr.includes(x.tier));

  // Category (number of sites)
  const catArr=[...document.querySelectorAll('.cat-pill.active')].map(p=>p.dataset.val);
  if(catArr.length)f=f.filter(x=>catArr.includes(x.cat));

  // Submarket (sidebar dropdown only)
  const smArr=[...document.querySelectorAll('.sm-check:checked')].map(c=>c.value);
  if(smArr.length)f=f.filter(x=>smArr.includes(x.sm));

  // Firm size — multi-select pills
  const sizeArr=[...document.querySelectorAll('.size-pill.active')].map(p=>p.dataset.val);
  if(sizeArr.length>0){
    f=f.filter(x=>{
      if(x.att==null)return false;
      return sizeArr.some(sz=>{
        if(sz==='0-9')return x.att<10;
        if(sz==='10-24')return x.att>=10&&x.att<25;
        if(sz==='25-49')return x.att>=25&&x.att<50;
        if(sz==='50-99')return x.att>=50&&x.att<100;
        if(sz==='100+')return x.att>=100;
        return false;
      });
    });
  }

  // Lease Expiration — multi-select pills
  const leaseArr=[...document.querySelectorAll('.lease-pill.active')].map(p=>p.dataset.val);
  if(leaseArr.length>0){
    const now=new Date();const nowY=now.getFullYear();const nowM=now.getMonth()+1;
    f=f.filter(x=>{
      return leaseArr.some(band=>{
        if(!x.le)return false;
        let leY,leM;
        if(/^\d{4}-\d{2}$/.test(x.le)){const p=x.le.split('-');leY=+p[0];leM=+p[1];}
        else if(/^\d{4}$/.test(x.le)){leY=+x.le;leM=12;}
        else return false;
        const mo=(leY-nowY)*12+(leM-nowM);
        if(mo<=0)return false;
        if(band==='0-12')return mo<=12;
        if(band==='12-24')return mo>12&&mo<=24;
        if(band==='24-60')return mo>24&&mo<=60;
        if(band==='60+')return mo>60;
        return false;
      });
    });
  }

  // Update table lease label
  // Sort — the cards-sort dropdown drives sort on map view; table view lets
   // header clicks drive sort (via tableSort) so we don't read the dropdown
   // when on table view or it would stomp the user's header click.
  const sortEl=document.getElementById('cardSort');
  if(sortEl&&currentView!=='table'){const[k,d]=sortEl.value.split('-');sortKey=k;sortDir=d;}
  f.sort((a,b)=>{
    let av=a[sortKey],bv=b[sortKey];
    if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;
    if(sortKey==='bc'){const ao=CLASS_ORDER[av]||99,bo=CLASS_ORDER[bv]||99;return sortDir==='asc'?ao-bo:bo-ao;}
    if(sortKey==='le'){
      // Lease expiration comes in as 'YYYY-MM' or 'YYYY' — coerce to a
      // comparable YYYYMM integer so mixed formats still sort correctly.
      const toN=v=>{const s=String(v);if(/^\d{4}-\d{2}$/.test(s))return parseInt(s.slice(0,4)+s.slice(5,7),10);if(/^\d{4}$/.test(s))return parseInt(s+'12',10);return 0;};
      const an=toN(av),bn=toN(bv);
      return sortDir==='asc'?an-bn:bn-an;
    }
    if(typeof av==='string')return sortDir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
    return sortDir==='asc'?av-bv:bv-av;
  });

  filteredFirms=f;
  renderCards();renderStats();
  if(currentView==='map')plotMarkers(f);
  if(currentView==='table')renderTable();
  updateSelUI();

  // Update submarket button label
  const smBtnText=document.getElementById('smBtnText');
  if(smBtnText){
    const checked=[...document.querySelectorAll('.sm-check:checked')];
    smBtnText.textContent=checked.length===0?'All Submarkets':checked.length===SUBMARKETS.length?'All Submarkets':checked.length+' Submarket'+(checked.length!==1?'s':'')+' Selected';
  }
}

/* RENDER STATS */
// True when the OS/browser is set to reduce motion — every animation
// helper checks this and falls back to an instant final value.
function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
// Eased count-up from `from` to `to`, formatting each frame with `fmt`.
// Cancels any in-flight animation on the same node so rapid filter
// changes don't stack tweens.
function animateCount(node,from,to,fmt){
  if(node._raf)cancelAnimationFrame(node._raf);
  if(prefersReducedMotion()||from===to){node.textContent=fmt(to);return;}
  const dur=520,t0=performance.now();
  const ease=x=>1-Math.pow(1-x,3);
  function step(now){
    const p=Math.min(1,(now-t0)/dur);
    node.textContent=fmt(from+(to-from)*ease(p));
    if(p<1)node._raf=requestAnimationFrame(step);else node._raf=null;
  }
  node._raf=requestAnimationFrame(step);
}

function renderStats(){
  const hasSelection=selectedIds.size>0;
  const f=hasSelection?filteredFirms.filter(x=>selectedIds.has(x.id)):filteredFirms;
  const label=hasSelection?'Selected Firms':'Filtered Firms';
  const avg=(key)=>{const v=f.map(x=>x[key]).filter(v=>v!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:0;};
  const sum=(key)=>f.map(x=>x[key]).filter(v=>v!=null).reduce((s,x)=>s+x,0);
  const wAvgRent=()=>{const v=f.filter(x=>x.rsf!=null&&x.grs!=null);const totalSF=v.reduce((s,x)=>s+x.rsf,0);return totalSF>0?v.reduce((s,x)=>s+x.rsf*x.grs,0)/totalSF:0;};
  // Each stat carries a numeric target `n` plus a formatter so the value
  // can be animated (count-up) from its previous reading to the new one.
  const intFmt=v=>Math.round(v).toLocaleString();
  const s=[
    {n:f.length,fmt:intFmt,l:label},
    {n:sum('att'),fmt:intFmt,l:'Total Attorneys'},
    {n:sum('rsf'),fmt:intFmt,l:'Total SF'},
    {n:avg('rsf'),fmt:intFmt,l:'Avg SF'},
    {n:wAvgRent(),fmt:v=>fmtMoney(v),l:'Avg MKT Rent/SF'},
    {n:sum('att')>0?sum('rsf')/sum('att'):null,fmt:intFmt,l:'Avg SF/Attorney'},
  ];
  const bar=document.getElementById('statsBar');
  bar.classList.toggle('has-selection',hasSelection);
  const prev=renderStats._prev||[];
  bar.innerHTML=s.map((x,i)=>{
    const start=x.n==null?'—':x.fmt(prev[i]!=null?prev[i]:0);
    return`<div class="stat-card"><div class="stat-val">${start}</div><div class="stat-label">${x.l}</div></div>`;
  }).join('');
  bar.querySelectorAll('.stat-val').forEach((node,i)=>{
    const x=s[i];
    if(x.n==null){node.textContent='—';return;}
    animateCount(node,prev[i]!=null?prev[i]:0,x.n,x.fmt);
  });
  renderStats._prev=s.map(x=>x.n);
}

      <div class="card-body">

    {k:'le',     l:'Lease Exp',     w:120, num:1, fmt:f=>fmtLE(f.le)},
    {k:'ll',     l:'Landlord',      w:200},
    {k:'lr',     l:'Landlord Rep',  w:190},
  ];
  const monoCols=new Set(['rank','ofc','att','rsf','sfa','grs','agr','agra','le']);
  const allSelected=filteredFirms.length>0&&filteredFirms.every(f=>selectedIds.has(f.id));

  const el=document.getElementById('tableArea');
  // Navy sticky header row — Cresa pattern: uppercase eyebrow, gold active-sort indicator
  const header=`<div class="cresa-t-header">
    <div class="cresa-t-chk" onclick="tableToggleAll(${!allSelected})">
      <div class="cresa-t-chkbox ${allSelected?'on':''}">${allSelected?'✓':''}</div>
    </div>
    ${cols.map(c=>{
      const active=sortKey===c.k;
      const arrow=active?(sortDir==='asc'?'▲':'▼'):'';
      return `<div class="cresa-t-head ${active?'active':''}" style="width:${c.w}px;min-width:${c.w}px" onclick="tableSort('${c.k}')">
        <span>${c.l}</span>${active?`<span class="cresa-t-arrow">${arrow}</span>`:''}
      </div>`;
    }).join('')}
  </div>`;

  const rows=filteredFirms.map((f,i)=>{
    const sel=selectedIds.has(f.id);
    const selIdx=sel?[...selectedIds].indexOf(f.id)+1:0;
    const rowCls=`cresa-t-row${sel?' selected':''}${i%2===1?' striped':''}`;
    return `<div class="${rowCls}" onclick="openDashboard(FIRMS[${f.id}])">
      <div class="cresa-t-chk" onclick="event.stopPropagation();toggleSelect(${f.id});renderTable()">
        <div class="cresa-t-chkbox ${sel?'on':''}">${sel?selIdx:''}</div>
      </div>
      ${cols.map(c=>{
        let v;
        if(c.fmt)v=c.fmt(f);
        else v=f[c.k]||'—';
        const cls='cresa-t-cell'+(monoCols.has(c.k)?' mono':'')+(c.k==='n'?' primary':'');
        return `<div class="${cls}" style="width:${c.w}px;min-width:${c.w}px">${typeof v==='string'?esc(v):v}</div>`;
      }).join('')}
    </div>`;
  }).join('');

  const body=filteredFirms.length===0
    ? emptyStateHtml('No firms match','Try widening a filter or clearing your search to see more of the Houston market.')
    : `<div class="cresa-t-inner">${header}${rows}</div>`;
  el.innerHTML=`<div class="cresa-t-wrap">${body}</div>`;
}
function tableToggleAll(checked){
  if(checked)filteredFirms.forEach(f=>selectedIds.add(f.id));
  else selectedIds.clear();
  updateSelUI();renderStats();renderTable();updateMarkerSelections();
}
function tableSort(key){
  // Numeric/size columns default to descending on first click (biggest-first
  // is what users usually want). Lease expiration defaults to ascending
  // (soonest-first, the tenant-rep lens). Text columns default to ascending.
  const descFirst=new Set(['rank','att','rsf','sfa','grs','agr','agra','ofc']);
  if(sortKey===key){
    sortDir=sortDir==='asc'?'desc':'asc';
  } else {
    sortKey=key;
    sortDir=descFirst.has(key)?'desc':'asc';
  }
  applyFilters();
}

/* DASHBOARD */
function getHeadcountBand(att){
  if(att==null)return{min:0,max:9,label:'< 10 Attorneys'};
  if(att<10)return{min:0,max:9,label:'< 10 Attorneys'};
  if(att<25)return{min:10,max:24,label:'10–24 Attorneys'};
  if(att<50)return{min:25,max:49,label:'25–49 Attorneys'};
  if(att<100)return{min:50,max:99,label:'50–99 Attorneys'};
  return{min:100,max:9999,label:'100+ Attorneys'};
}
function getPeerSet(f){
  const band=getHeadcountBand(f.att);
  return{firms:FIRMS.filter(x=>x.id!==f.id&&x.att!=null&&x.att>=band.min&&x.att<=band.max),label:band.label};
}

  // Wire sliders
  function wireSlider(sliderId,numId,key,parse,fmt){
    const slider=document.getElementById(sliderId);
    const num=document.getElementById(numId);

    slider.addEventListener('input',function(){const v=parse(this.value);modelState[key]=v;num.value=format(v);updateModelOutputs();});
    num.addEventListener('input',function(){let v=parse(this.value.replace(/[^0-9.\-]/g,''));if(isNaN(v))return;v=Math.max(parseFloat(slider.min),Math.min(parseFloat(slider.max),v));modelState[key]=v;slider.value=v;updateModelOutputs();});

  }
  wireSlider('mAttySlider','mAttyNum','attys',v=>parseInt(v));

function updateModelPeers(){
  const checks=document.querySelectorAll('#mPeerList input:checked');
  modelState.peerSets=Array.from(checks).map(c=>c.value);
  if(modelState.peerSets.length===0){modelState.peerSets=['0-9'];document.querySelector('#mPeerList input[value="0-9"]').checked=true;}
  const bandLabels={'0-9':'< 10','10-24':'10–24','25-49':'25–49','50-99':'50–99','100-9999':'100+'};
  const label=modelState.peerSets.length===1?bandLabels[modelState.peerSets[0]]+' Attys':modelState.peerSets.length+' bands';
  document.getElementById('mPeerLabel').textContent=label;
  updateModelOutputs();
}
function updateModelSM(){
  const checks=document.querySelectorAll('#mSmChecks input:checked');
  modelState.submarkets=Array.from(checks).map(c=>c.value);
  const allSM=[...new Set(FIRMS.map(f=>f.sm).filter(Boolean))];
  const label=modelState.submarkets.length===allSM.length?'All':modelState.submarkets.length===0?'None':modelState.submarkets.length+' selected';
  document.getElementById('mSmLabel').textContent=label;
  // Update select all checkbox
  const selAll=document.querySelector('#mSmList > label input');
  if(selAll)selAll.checked=modelState.submarkets.length===allSM.length;
  updateModelOutputs();
}
function toggleAllModelSM(on){
  document.querySelectorAll('#mSmChecks input').forEach(c=>{c.checked=on;});
  updateModelSM();
}

async function exportComparePDF(){
  const btn=document.getElementById('exportPdfBtn');
  const origText=btn.innerHTML;
  btn.innerHTML='Generating...';btn.disabled=true;

  try{
    const {jsPDF}=window.jspdf;
    const compareArea=document.getElementById('compareArea');
    const firms=FIRMS.filter(f=>selectedIds.has(f.id));
    const firmNames=firms.map(f=>f.n).join(' vs ');

    const wrapper=document.createElement('div');
    wrapper.style.cssText='position:fixed;top:-9999px;left:0;width:1600px;background:#fff;padding:0;font-family:system-ui,-apple-system,sans-serif;z-index:-1';
    document.body.appendChild(wrapper);

    const logoSrc=PDF_LOGO_SRC;
    const dateStr=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

    wrapper.innerHTML=`
      <div style="padding:32px 48px 24px;background:#fff;font-family:Arial,Helvetica,sans-serif">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #E4E8F0">
          <div style="display:flex;align-items:center;gap:28px">
            <img src="${logoSrc}" alt="Cresa Law Firm Practice Group" style="height:64px;width:auto">
            <div style="height:56px;width:1px;background:#E4E8F0"></div>
            <div>
              <div style="font-size:22px;font-weight:700;color:#001E5A;line-height:1.1;letter-spacing:-.3px">Houston Law Firm Database</div>
              <div style="font-size:11px;font-weight:600;color:#8A93A8;text-transform:uppercase;letter-spacing:1.2px;margin-top:5px">Firm Comparison &middot; ${firms.length} firms</div>
            </div>
          </div>
          <div style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid #E4E8F0;border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;color:#001E5A;letter-spacing:.5px">
            <span style="width:8px;height:8px;border-radius:4px;background:#1B8F6A;display:inline-block"></span>
            ${dateStr.toUpperCase()}
          </div>
        </div>
      </div>`;

    const clone=compareArea.cloneNode(true);
    // Convert canvases to images — maintain natural proportions within container
    const origCanvases=compareArea.querySelectorAll('canvas');
    const cloneCanvases=clone.querySelectorAll('canvas');
    // Remove X buttons from compare cards
    clone.querySelectorAll('.compare-remove').forEach(el=>el.remove());
    // Force equal-width chart columns in PDF
    clone.querySelectorAll('[style*="grid-template-columns"]').forEach(el=>{
      if(el.style.gridTemplateColumns==='1fr 1fr'){
        el.style.gridTemplateColumns='minmax(0,1fr) minmax(0,1fr)';
        Array.from(el.children).forEach(ch=>{ch.style.minWidth='0';ch.style.overflow='hidden';});
      }
    });
    // Fix overflow
    clone.style.cssText='width:100%;overflow:visible;height:auto';
    clone.querySelectorAll('[style*="overflow:auto"]').forEach(el=>{el.style.overflow='visible';el.style.height='auto';});

    // Append clone FIRST so it gets layout dimensions
    wrapper.firstElementChild.appendChild(clone);

    // Helper: set chart fonts to match comparison table size, horizontal labels
    function setPdfChartFonts(opts){
      if(!opts.plugins)opts.plugins={};
      if(!opts.plugins.legend)opts.plugins.legend={};
      if(!opts.plugins.legend.labels)opts.plugins.legend.labels={};
      opts.plugins.legend.labels.font={size:12,weight:'600'};
      opts.plugins.legend.labels.padding=12;
      if(opts.scales){
        ['x','y','r'].forEach(axis=>{
          if(!opts.scales[axis])return;
          if(!opts.scales[axis].ticks)opts.scales[axis].ticks={};
          opts.scales[axis].ticks.font={size:12,weight:'500'};
          // Force horizontal labels on x-axis
          if(axis==='x'){
            opts.scales[axis].ticks.maxRotation=0;
            opts.scales[axis].ticks.minRotation=0;
            opts.scales[axis].ticks.autoSkip=false;
          }
          if(opts.scales[axis].title){
            if(!opts.scales[axis].title.font)opts.scales[axis].title.font={};
            opts.scales[axis].title.font={size:12,weight:'600'};
          }
          if(opts.scales[axis].pointLabels){
            opts.scales[axis].pointLabels.font={size:12,weight:'600'};
          }
        });
      }
    }

    // Re-render charts at PDF container dimensions
    const cloneCanvasesLive=clone.querySelectorAll('canvas');
    const chartPromises=[];
    cloneCanvasesLive.forEach((cc,i)=>{
      try{
        const oc=origCanvases[i];
        const chartInstance=Chart.getChart(oc);
        if(!chartInstance){cc.remove();return;}
        const parent=cc.parentElement;
        parent.style.overflow='hidden';
        const isBar=chartInstance.config.type==='bar';
        // Bar charts: wide canvas for label room. Bubble: match container ratio for round circles.
        let cw,ch;
        if(isBar){
          cw=1400;ch=500;
        } else {
          // Read actual container dimensions so canvas ratio matches — keeps circles round
          const pw=parent.offsetWidth||800;
          const ph=parent.offsetHeight||400;
          const ratio=ph/pw;
          cw=1200;ch=Math.round(1200*ratio);
        }
        const newCanvas=document.createElement('canvas');
        newCanvas.width=cw;newCanvas.height=ch;
        newCanvas.style.cssText='width:100%;height:100%;display:block';
        cc.parentElement.replaceChild(newCanvas,cc);
        const cfg=chartInstance.config;
        const clonedData=JSON.parse(JSON.stringify(cfg.data));
        const clonedOpts=JSON.parse(JSON.stringify(cfg.options));
        setPdfChartFonts(clonedOpts);
        // Bar charts: larger labels, more padding for numbers
        if(isBar){
          clonedOpts.scales.x.ticks.font={size:14,weight:'600'};
          clonedOpts.scales.y.ticks.font={size:13,weight:'500'};
          clonedData.datasets.forEach(ds=>{if(ds.barPercentage!=null)ds.barPercentage*=0.65;});
          if(!clonedOpts.layout)clonedOpts.layout={};
          clonedOpts.layout.padding={top:10,right:16,bottom:10,left:16};
        } else {
          clonedData.datasets.forEach(ds=>{if(ds.barPercentage!=null)ds.barPercentage*=0.7;});
          if(!clonedOpts.layout)clonedOpts.layout={};
          clonedOpts.layout.padding={top:8,right:8,bottom:8,left:8};
        }
        clonedOpts.maintainAspectRatio=false;
        const newChart=new Chart(newCanvas,{
          type:cfg.type,
          data:clonedData,
          options:{...clonedOpts,responsive:false,animation:false}
        });
        chartPromises.push(new Promise(r=>setTimeout(r,150)));
      }catch(e){console.log('Chart re-render error:',e);}
    });
    await Promise.all(chartPromises);

    const footer=document.createElement('div');
    footer.style.cssText='padding:14px 36px;border-top:1px solid #E4E8F0;display:flex;justify-content:space-between;font-size:9px;color:#8A93A8;text-transform:uppercase;letter-spacing:1px;font-weight:600;font-family:Arial,Helvetica,sans-serif';
    footer.innerHTML='<span>Cresa Houston | Confidential</span><span>Generated from Houston Law Firm Database</span>';
    wrapper.firstElementChild.appendChild(footer);

    const canvas=await html2canvas(wrapper,{scale:3,useCORS:true,backgroundColor:'#ffffff',logging:false,width:1600});

    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'letter',compress:true});
    const pdfW=pdf.internal.pageSize.getWidth();
    const pdfH=pdf.internal.pageSize.getHeight();
    const margin=4;
    const usableW=pdfW-margin*2;
    const usableH=pdfH-margin*2;
    const imgRatio=canvas.height/canvas.width;
    let finalW=usableW;
    let finalH=usableW*imgRatio;
    if(finalH>usableH){finalH=usableH;finalW=usableH/imgRatio;}

    const imgData=canvas.toDataURL('image/jpeg',0.95);
    pdf.addImage(imgData,'JPEG',(pdfW-finalW)/2,(pdfH-finalH)/2,finalW,finalH);
    pdf.save('Cresa_Firm_Comparison_'+firms.length+'_firms.pdf');

    wrapper.querySelectorAll("canvas").forEach(c=>{const ch=Chart.getChart(c);if(ch)ch.destroy();});document.body.removeChild(wrapper);
  }catch(e){
    console.error('PDF export error:',e);
    alert('Error generating PDF. Please try again.');
  }
  btn.innerHTML=origText;btn.disabled=false;
}

// Helper: convert an <img> element to a data-URL source so html2canvas
// can read its pixels without tripping CORS. Google Drive's
// /thumbnail?id=... endpoint serves images fine for direct <img> tags but
// does NOT send Access-Control-Allow-Origin headers, which means:
//   - Loading with crossOrigin='anonymous' → canvas gets tainted → toDataURL throws
//   - fetch() → CORS error → blocked
// The fix is to route through a CORS-friendly mirror. Google's own
// lh3.googleusercontent.com CDN (used internally by Drive) does send
// CORS headers, and images.weserv.nl is a free proxy that adds CORS to
// arbitrary image URLs as a fallback.
function corsUrlVariants(originalUrl){
  const out=[originalUrl];
  // Drive thumbnail → googleusercontent CDN (same image, CORS headers)
  const m=originalUrl.match(/drive\.google\.com\/thumbnail\?id=([a-zA-Z0-9_-]+)(?:&sz=([^&]+))?/);
  if(m){
    const id=m[1];
    const size=m[2]||'w800';
    out.unshift('https://lh3.googleusercontent.com/d/'+id+'='+size);
  }
  // images.weserv.nl proxy — works for any public image URL. We strip the
  // protocol per their API convention (ssl:1 makes it re-issue over HTTPS).
  const stripped=originalUrl.replace(/^https?:\/\//,'');
  out.push('https://images.weserv.nl/?url='+encodeURIComponent(stripped));
  return out;
}

function loadImageAsDataUrl(imgEl){
  return new Promise(resolve=>{
    const originalSrc=imgEl.getAttribute('src');
    if(!originalSrc||originalSrc.startsWith('data:')){resolve();return;}

    const replaceWithPlaceholder=()=>{
      const svg='<svg viewBox="0 0 24 24" fill="none" stroke="#8A93A8" stroke-width="1" style="width:80px;height:80px"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M9 22V12h6v10"/></svg>';
      if(imgEl.parentElement)imgEl.parentElement.innerHTML=svg;
      resolve();
    };

    const urls=corsUrlVariants(originalSrc);

    // Try each URL variant in order. For each, attempt crossOrigin-load and
    // canvas export; fall through to the next URL on any failure.
    const tryNext=(idx)=>{
      if(idx>=urls.length){replaceWithPlaceholder();return;}
      const src=urls[idx];
      const loader=new Image();
      loader.crossOrigin='anonymous';
      let done=false;
      const timer=setTimeout(()=>{if(!done){done=true;tryNext(idx+1);}},8000);
      loader.onload=()=>{
        if(done)return;done=true;clearTimeout(timer);
        try{
          const cvs=document.createElement('canvas');
          cvs.width=loader.naturalWidth||800;
          cvs.height=loader.naturalHeight||600;
          const ctx=cvs.getContext('2d');
          ctx.drawImage(loader,0,0);
          // toDataURL throws SecurityError if canvas is tainted.
          const dataUrl=cvs.toDataURL('image/jpeg',0.92);
          imgEl.setAttribute('src',dataUrl);
          resolve();
        }catch(e){
          console.log('[PDF img] canvas tainted for',src,'— trying next');
          tryNext(idx+1);
        }
      };
      loader.onerror=()=>{
        if(done)return;done=true;clearTimeout(timer);
        console.log('[PDF img] load error for',src,'— trying next');
        tryNext(idx+1);
      };
      loader.src=src;
    };
    tryNext(0);
  });
}

/* =============================================================
   FIRM PROFILE PDF EXPORT — port the live dashboard view
   Clones the dashboard DOM as-is, drops the peer table + peer
   locations map (navigation aids, not signal for a deliverable),
   fixes two html2canvas quirks, and emits a PDF at custom page
   dimensions matching the measured output exactly — no scaling,
   no distortion. The PDF looks identical to the dashboard.

   Two quirks fixed:
     1. Building photo. html2canvas 1.4.1 doesn't honor
        object-fit:cover on <img> tags (the image stretches to
        fill the box and gets squished). We swap the <img> for
        a background-image on the same parent, which html2canvas
        captures with the expected cover crop.
     2. Chart canvas aspect. Re-rendering a Chart.js canvas with
        buffer dimensions that differ from its CSS dimensions
        causes independent-axis scaling — bubbles turn oval,
        radar squashes. We measure each canvas's live display
        size and create the replacement with a 2× buffer at the
        same aspect, so CSS can only scale uniformly.
   ============================================================= */

// Scale every font size in a Chart.js options object by `factor`.
// Chart.js scatters font.size all over the options tree (axes, legend,
// tooltip, datalabels, radar point labels), so we visit each known
// location. Where a size isn't explicitly set we fall back to the
// Chart.js default, multiplied by the factor, so charts that relied
// on defaults also scale up.
function pdfBumpChartFonts(opts, factor){
  factor = factor || 1.5;
  // Chart.js defaults — used when a given option never set font.size.
  const DEF_TICKS=12, DEF_LEGEND=12, DEF_TITLE=14, DEF_POINT_LBL=10, DEF_TOOLTIP=12;
  const bump=(obj, def)=>{
    if(!obj)return;
    if(!obj.font)obj.font={};
    obj.font.size=Math.round((obj.font.size||def)*factor);
  };

  if(!opts.plugins)opts.plugins={};

  // Legend labels + legend title
  if(opts.plugins.legend){
    if(!opts.plugins.legend.labels)opts.plugins.legend.labels={};
    bump(opts.plugins.legend.labels, DEF_LEGEND);
    if(opts.plugins.legend.title)bump(opts.plugins.legend.title, DEF_LEGEND);
  }
  // Chart title
  if(opts.plugins.title)bump(opts.plugins.title, DEF_TITLE);
  // Datalabels (chartjs-plugin-datalabels)
  if(opts.plugins.datalabels)bump(opts.plugins.datalabels, DEF_LEGEND);
  // Tooltip (title + body + footer)
  if(opts.plugins.tooltip){
    const tt=opts.plugins.tooltip;
    if(!tt.titleFont)tt.titleFont={};
    tt.titleFont.size=Math.round((tt.titleFont.size||DEF_TOOLTIP)*factor);
    if(!tt.bodyFont)tt.bodyFont={};
    tt.bodyFont.size=Math.round((tt.bodyFont.size||DEF_TOOLTIP)*factor);
    if(!tt.footerFont)tt.footerFont={};
    tt.footerFont.size=Math.round((tt.footerFont.size||DEF_TOOLTIP)*factor);
  }

  // Axes: x, y (cartesian) and r (radar). Each has ticks, title, and
  // pointLabels (radar only).
  if(opts.scales){
    ['x','y','r'].forEach(axis=>{
      const s=opts.scales[axis];
      if(!s)return;
      if(!s.ticks)s.ticks={};
      bump(s.ticks, DEF_TICKS);
      if(s.title)bump(s.title, DEF_TITLE);
      if(s.pointLabels)bump(s.pointLabels, DEF_POINT_LBL);
    });
  }
}

// The donut center-text plugin (id='ct') draws its percentage label
// with a hardcoded '700 16px Arial' font inside afterDraw — there's
// no option-level setting to scale. Detect that plugin and swap it
// for an equivalent that renders with the bumped font size.
function pdfBumpPlugins(plugins, factor){
  factor = factor || 1.5;
  return plugins.map(p=>{
    if(p&&p.id==='ct'&&typeof p.afterDraw==='function'){
      const px=Math.round(16*factor);
      return {
        id:'ct',
        afterDraw(c){
          // The original plugin reads its value from a closure in
          // openDashboard. We recover it from the chart's own data
          // (datasets[0].data[0] is the "filled" percentage).
          const {ctx:x, width:w, height:h}=c;
          const val=c&&c.data&&c.data.datasets&&c.data.datasets[0]&&c.data.datasets[0].data?c.data.datasets[0].data[0]:'';
          x.save();
          x.font='700 '+px+'px Arial';
          x.fillStyle='#001E5A';
          x.textAlign='center';
          x.textBaseline='middle';
          x.fillText(val+'%', w/2, h/2);
          x.restore();
        }
      };
    }
    return p;
  });
}

async function exportDashboardPDF(){
  const btn=document.getElementById('dashExportBtn');
  if(!btn)return;

  const firmIdPre=window._dashboardFirmId;
  const firmPre=firmIdPre!=null?FIRMS[firmIdPre]:null;
  if(!firmPre){alert('No firm loaded for export.');return;}
  const defaultTitle=firmPre.n+' — Firm Profile';
  const userTitle=window.prompt('Report title',defaultTitle);
  if(userTitle===null)return;
  const reportTitle=(userTitle||'').trim()||defaultTitle;

  const origText=btn.innerHTML;
  btn.innerHTML='Generating...';btn.disabled=true;

  let wrapper=null;
  try{
    const {jsPDF}=window.jspdf;
    const firm=firmPre;
    const logoSrc=PDF_LOGO_SRC;
    const dateStr=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

    const dashboardEl=document.getElementById('dashboard');
    const contentEl=dashboardEl.querySelector('div[style*="display:flex"][style*="flex:1"][style*="overflow:hidden"]');
    if(!contentEl){alert('Dashboard content not found.');btn.innerHTML=origText;btn.disabled=false;return;}

    // --- Clone the dashboard content ---
    const clone=contentEl.cloneNode(true);

    // Bake <img> sources to data URLs so html2canvas can read pixels
    // without cross-origin trouble.
    await Promise.all([...clone.querySelectorAll('img')].map(img=>loadImageAsDataUrl(img)));

    // Drop the peer-table + peer-map row (navigation aids the user
    // specifically asked to omit from exports).
    const peerTableEl=clone.querySelector('#dashPeerTable');
    const peerMapEl=clone.querySelector('#dashPeerMap');
    [peerTableEl,peerMapEl].forEach(el=>{
      if(!el)return;
      const row=el.closest('[style*="grid-template-columns"]');
      if(row&&row.parentElement)row.remove();
    });

    // --- Fix building-photo object-fit bug ---
    // The sidebar photo is an <img> inside a 320px-tall div using
    // object-fit:cover. html2canvas 1.4.1 ignores object-fit and
    // stretches the full image to the box (the squished skyline in
    // previous exports). Convert to background-image on the parent,
    // which html2canvas renders correctly with cover cropping.
    const photoImg=clone.querySelector('[style*="width:520px"] img');
    if(photoImg){
      const src=photoImg.getAttribute('src');
      if(src){
        const p=photoImg.parentElement;
        p.innerHTML='';
        p.style.backgroundImage=`url("${src}")`;
        p.style.backgroundSize='cover';
        p.style.backgroundPosition='center';
        p.style.backgroundRepeat='no-repeat';
        p.style.display='block';        // was flex for <img> centering
      }
    }

    // Strip scroll constraints so the whole layout flows vertically.
    // Preserve the `display:flex` on the container so main + sidebar
    // keep their side-by-side layout.
    clone.style.cssText='display:flex;width:100%;overflow:visible';
    clone.querySelectorAll('[style*="overflow-y:auto"],[style*="overflow:auto"]').forEach(el=>{
      el.style.overflow='visible';
      if(el.style.height==='100%'||el.style.height==='')el.style.height='auto';
    });

    // --- Build the full print wrapper: header + clone + footer ---
    wrapper=document.createElement('div');
    // Fixed 1800px design width — main pane ends up ~1280px wide,
    // which matches a typical desktop dashboard view. Height auto.
    wrapper.style.cssText='position:fixed;top:-30000px;left:0;width:1800px;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#0E1220;z-index:-1';
    document.body.appendChild(wrapper);

    const header=document.createElement('div');
    header.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:24px 36px;border-bottom:1px solid #E4E8F0;background:#fff';
    header.innerHTML=`
      <div style="display:flex;align-items:center;gap:24px">
        <img src="${logoSrc}" alt="Cresa Law Firm Practice Group" style="height:56px;width:auto">
        <div style="height:48px;width:1px;background:#E4E8F0"></div>
        <div style="font-size:26px;font-weight:700;color:#001E5A;line-height:1.15;letter-spacing:-.3px">${esc(reportTitle)}</div>
      </div>
      <div style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid #E4E8F0;border-radius:6px;background:#fff;font-size:12px;font-weight:600;color:#001E5A;letter-spacing:.5px">
        <span style="width:8px;height:8px;border-radius:4px;background:#1B8F6A;display:inline-block"></span>
        ${dateStr.toUpperCase()}
      </div>`;
    wrapper.appendChild(header);

    wrapper.appendChild(clone);

    const footer=document.createElement('div');
    footer.style.cssText='padding:12px 36px;border-top:1px solid #E4E8F0;display:flex;justify-content:space-between;font-size:10px;color:#8A93A8;text-transform:uppercase;letter-spacing:1px;font-weight:600;background:#fff';
    footer.innerHTML='<span>Cresa Houston | Confidential</span><span>Generated from Houston Law Firm Database</span>';
    wrapper.appendChild(footer);

    // Force a layout pass so every canvas gets its CSS size assigned
    // before we measure and re-render.
    void wrapper.offsetHeight;

    // --- Re-render each Chart.js canvas at 2× buffer, matching aspect ---
    // Walk the cloned canvases in document order; pair each with its
    // live counterpart (same index) to get the source Chart config.
    const origCanvases=contentEl.querySelectorAll('canvas');
    const cloneCanvases=clone.querySelectorAll('canvas');
    const bubbleCharts=[];

    cloneCanvases.forEach((cc,i)=>{
      try{
        const oc=origCanvases[i];
        if(!oc)return;
        const sourceChart=Chart.getChart(oc);
        if(!sourceChart){cc.remove();return;}

        // Use the cloned canvas's own offsetWidth/offsetHeight —
        // these reflect the live dashboard's chart display size after
        // the layout pass above.
        let w=cc.offsetWidth;
        let h=cc.offsetHeight;
        if(!w||!h){
          // Fallback: parent container or the live canvas's dims.
          w=cc.parentElement.offsetWidth||oc.offsetWidth||oc.width||400;
          h=cc.parentElement.offsetHeight||oc.offsetHeight||oc.height||300;
        }

        // Fresh canvas: 2× buffer for crispness, CSS size locked to
        // the measured aspect so CSS can only scale uniformly.
        const fresh=document.createElement('canvas');
        fresh.width=Math.round(w*2);
        fresh.height=Math.round(h*2);
        fresh.style.cssText=`width:${w}px;height:${h}px;display:block`;
        // Preserve donut centering from the live view
        if(sourceChart.config.type==='doughnut'||sourceChart.config.type==='pie'){
          fresh.style.margin='0 auto';
        }
        cc.parentElement.replaceChild(fresh,cc);

        // Clone config (JSON roundtrip; callbacks will be lost).
        const cfg=sourceChart.config;
        const clonedData=JSON.parse(JSON.stringify(cfg.data));
        const clonedOpts=JSON.parse(JSON.stringify(cfg.options));
        clonedOpts.maintainAspectRatio=false;
        clonedOpts.responsive=false;
        clonedOpts.animation=false;

        // Radar's external tooltip renders a floating DOM overlay
        // bound to live elements — disable it so it doesn't error.
        if(clonedOpts.plugins&&clonedOpts.plugins.tooltip){
          delete clonedOpts.plugins.tooltip.external;
        }

        // Bubble chart: subject firm highlight + rebuilt tooltip
        // callbacks (JSON roundtrip drops the live ones).
        if(cfg.type==='bubble'&&clonedData.datasets&&clonedData.datasets.length>0){
          const subj=clonedData.datasets[0];
          subj.borderColor='#FFB600';
          subj.borderWidth=4;
          subj.backgroundColor='rgba(0,30,90,0.85)';
          subj.order=-1;
          if(Array.isArray(subj.data)){
            subj.data=subj.data.map(pt=>({...pt,r:(pt.r||8)*1.3}));
          }
          if(!clonedOpts.plugins)clonedOpts.plugins={};
          clonedOpts.plugins.tooltip={
            enabled:true,mode:'nearest',intersect:false,
            backgroundColor:'#001E5A',titleColor:'#FFFFFF',bodyColor:'#FFFFFF',
            titleFont:{size:13,weight:'700',family:'Arial,Helvetica,sans-serif'},
            bodyFont:{size:12,weight:'500',family:'Arial,Helvetica,sans-serif'},
            padding:{top:10,right:14,bottom:10,left:14},
            cornerRadius:6,displayColors:false,
            callbacks:{
              title:ctx=>ctx[0].dataset.label||'',
              label:ctx=>{
                const d=ctx.raw;const rsf=ctx.dataset._firmRsf;
                return [
                  'SF/Atty: '+Math.round(d.x).toLocaleString(),
                  'MKT AGR/Atty: $'+Math.round(d.y).toLocaleString(),
                  'RSF: '+Math.round(rsf||0).toLocaleString(),
                ];
              }
            }
          };
          // The live legend uses a generateLabels function that JSON
          // can't serialize; strip the filter so the default labels
          // (subject + peer series names) show through.
          if(clonedOpts.plugins.legend&&clonedOpts.plugins.legend.labels){
            delete clonedOpts.plugins.legend.labels.filter;
          }
        }

        const plugins=(cfg.plugins||[]).slice();
        // Scale all text on the chart by 50% for better print
        // legibility. This runs last so any hand-built config
        // (e.g., the bubble tooltip with explicit sizes) also
        // gets bumped consistently.
        pdfBumpChartFonts(clonedOpts, 1.5);
        const scaledPlugins=pdfBumpPlugins(plugins, 1.5);
        const newChart=new Chart(fresh,{
          type:cfg.type,
          data:clonedData,
          options:clonedOpts,
          plugins:scaledPlugins,
        });
        if(cfg.type==='bubble')bubbleCharts.push(newChart);
      }catch(e){console.log('Chart re-render error:',e);}
    });

    // Activate the subject-firm tooltip on bubble charts so the
    // readout (SF/Atty, MKT AGR/Atty, RSF) appears in the PDF.
    await new Promise(r=>setTimeout(r,250));
    bubbleCharts.forEach(bc=>{
      try{
        const meta=bc.getDatasetMeta(0);
        if(meta&&meta.data&&meta.data.length){
          bc.setActiveElements([{datasetIndex:0,index:0}]);
          bc.tooltip.setActiveElements(
            [{datasetIndex:0,index:0}],
            {x:meta.data[0].x,y:meta.data[0].y}
          );
          bc.update('none');
        }
      }catch(e){console.log('tooltip activate error:',e);}
    });
    await new Promise(r=>setTimeout(r,150));

    // --- Measure, capture, emit PDF sized to the content ---
    void wrapper.offsetHeight;
    // If the inner layout overflows the design width (e.g. a wide table
    // or the right sidebar), widen the wrapper to its full content width
    // so the header/footer span everything and html2canvas captures the
    // whole thing — this is what was clipping the right side before.
    if(wrapper.scrollWidth>wrapper.offsetWidth){
      wrapper.style.width=wrapper.scrollWidth+'px';
      void wrapper.offsetHeight;
    }
    const wW=wrapper.offsetWidth;
    const wH=wrapper.offsetHeight;

    const canvas=await html2canvas(wrapper,{
      scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,
      width:wW,height:wH,windowWidth:wW,windowHeight:wH,
    });

    // Page is sized to fit the content exactly (px → mm at 96 DPI), so
    // the whole profile lands on one custom-size sheet with no clipping
    // and no wasted margin.
    const PX_TO_MM=25.4/96;
    const pdfWmm=wW*PX_TO_MM;
    const pdfHmm=wH*PX_TO_MM;

    const pdf=new jsPDF({
      orientation:pdfWmm>=pdfHmm?'landscape':'portrait',
      unit:'mm',
      format:[pdfWmm,pdfHmm],
      compress:true,
    });
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,pdfWmm,pdfHmm);

    const safeName=firm.n.replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'');
    pdf.save('Cresa_Firm_Profile_'+safeName+'.pdf');

    // Cleanup
    wrapper.querySelectorAll('canvas').forEach(c=>{const ch=Chart.getChart(c);if(ch)ch.destroy();});
    document.body.removeChild(wrapper);
    wrapper=null;
  }catch(e){
    console.error('Dashboard PDF export error:',e);
    if(wrapper){
      try{
        wrapper.querySelectorAll('canvas').forEach(c=>{const ch=Chart.getChart(c);if(ch)ch.destroy();});
        if(wrapper.parentElement)wrapper.parentElement.removeChild(wrapper);
      }catch(_){}
    }
    alert('Error generating PDF. Please try again.');
  }
  btn.innerHTML=origText;btn.disabled=false;
}

function updateModelOutputs(){
  const s=modelState;
  const c=s.current;
  // Future state calcs
  const totalSF=s.attys*s.sfaTarget;
  const annualRent=totalSF*s.askRate;
  const monthlyRent=annualRent/12;
  const agrPerAtty=s.attys>0?annualRent/s.attys:0;
  // Current state calcs
  const curTotalSF=c.attys*c.sfaTarget;
  const curAnnualRent=curTotalSF*c.askRate;
  const curMonthlyRent=curAnnualRent/12;
  const curAgrPerAtty=c.attys>0?curAnnualRent/c.attys:0;
  // Peers — use manually selected firms if any, otherwise use headcount bands
  let peerFirms=[];
  const lockedId=s.locked&&s.currentFirmId!=null?s.currentFirmId:null;
  const useCustomPeers=selectedIds.size>=2;
  if(useCustomPeers){
    peerFirms=FIRMS.filter(f=>selectedIds.has(f.id)&&f.id!==lockedId);
  } else {
    const ps=s.peerSets||['25-49'];
    ps.forEach(band=>{
      const[lo,hi]=band.split('-').map(Number);
      peerFirms=peerFirms.concat(FIRMS.filter(f=>f.att!=null&&f.att>=lo&&f.att<=hi));
    });
    const seen=new Set();peerFirms=peerFirms.filter(f=>{if(seen.has(f.id))return false;seen.add(f.id);return true;});
    if(s.submarkets&&s.submarkets.length>0&&s.submarkets.length<24){
      peerFirms=peerFirms.filter(f=>s.submarkets.includes(f.sm));
    }
  }
  const median=(arr,key)=>{const v=arr.map(a=>a[key]).filter(v=>v!=null).sort((a,b)=>a-b);if(!v.length)return null;const mid=Math.floor(v.length/2);return v.length%2?v[mid]:(v[mid-1]+v[mid])/2;};
  const simpleAvg=(arr,key)=>{const v=arr.map(a=>a[key]).filter(v=>v!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};
  const peerMed={att:median(peerFirms,'att'),rsf:median(peerFirms,'rsf'),sfa:median(peerFirms,'sfa'),grs:median(peerFirms,'grs'),agra:median(peerFirms,'agra')};
  // Weighted averages: SF/Atty & AGR/Atty = totals/totals, Rent/SF = weighted by RSF
  const pTotalSF=peerFirms.filter(f=>f.rsf!=null).reduce((s,f)=>s+f.rsf,0);
  const pTotalAtt=peerFirms.filter(f=>f.att!=null).reduce((s,f)=>s+f.att,0);
  const pTotalAGR=peerFirms.filter(f=>f.agr!=null).reduce((s,f)=>s+f.agr,0);
  const pWtdRent=peerFirms.filter(f=>f.rsf!=null&&f.grs!=null).reduce((s,f)=>s+f.rsf*f.grs,0);
  const pRentSF=peerFirms.filter(f=>f.rsf!=null&&f.grs!=null).reduce((s,f)=>s+f.rsf,0);
  const peerAvg={
    att:simpleAvg(peerFirms,'att'),
    rsf:simpleAvg(peerFirms,'rsf'),
    sfa:pTotalAtt>0?pTotalSF/pTotalAtt:null,
    grs:pRentSF>0?pWtdRent/pRentSF:null,
    agra:pTotalAtt>0?pTotalAGR/pTotalAtt:null
  };

  // Delta helpers — Cresa semantic colors
  const pctVs=(val,base)=>base!=null&&base!==0?((val-base)/base*100).toFixed(1):null;
  const diffColor=v=>v==null?'var(--ink-4)':parseFloat(v)<=0?'#1B8F6A':'#C93B3B';
  const diffLabel=v=>v==null?'\u2014':(parseFloat(v)>0?'+':'')+v+'%';
  const deltaStr=(fut,cur,isMoney)=>{
    if(cur===0)return'';
    const diff=fut-cur;const pct=pctVs(fut,cur);
    const arrow=diff>0?'\u25B2':diff<0?'\u25BC':'';
    const clr=diff<=0?'#1B8F6A':'#B54708';
    const val=isMoney?fmtMoney(Math.abs(diff)):Math.round(Math.abs(diff)).toLocaleString();
    return s.locked?'<span style="color:'+clr+'">'+arrow+' '+val+' ('+diffLabel(pct)+')</span>':'';
  };

  // Current state output cards
  document.getElementById('mCurOutSF').textContent=curTotalSF.toLocaleString();
  document.getElementById('mCurOutAGR').textContent=fmtMoney(curAnnualRent);
  document.getElementById('mCurOutMonthly').textContent=fmtMoney(curMonthlyRent);
  document.getElementById('mCurOutAGRA').textContent=fmtMoney(curAgrPerAtty);

  // Future state output cards
  document.getElementById('mOutSF').textContent=totalSF.toLocaleString();
  document.getElementById('mOutAGR').textContent=fmtMoney(annualRent);
  document.getElementById('mOutMonthly').textContent=fmtMoney(monthlyRent);
  document.getElementById('mOutAGRA').textContent=fmtMoney(agrPerAtty);
  document.getElementById('mDeltaSF').innerHTML=deltaStr(totalSF,curTotalSF,false);
  document.getElementById('mDeltaAGR').innerHTML=deltaStr(annualRent,curAnnualRent,true);
  document.getElementById('mDeltaMonthly').innerHTML=deltaStr(monthlyRent,curMonthlyRent,true);
  document.getElementById('mDeltaAGRA').innerHTML=deltaStr(agrPerAtty,curAgrPerAtty,true);
  document.getElementById('mPeerCount').textContent=peerFirms.length+' firms in peer set'+(useCustomPeers?' (custom selection)':'');

  // Table: Current vs Future vs Peer
  const rows=[
    {l:'Attorneys',cur:c.attys,fut:s.attys,peer:peerMed.att,peerA:peerAvg.att,fmt:v=>v==null?'\u2014':Math.round(v).toLocaleString()},
    {l:'Total RSF',cur:curTotalSF,fut:totalSF,peer:peerMed.rsf,peerA:peerAvg.rsf,fmt:v=>v==null?'\u2014':Math.round(v).toLocaleString()},
    {l:'SF / Attorney',cur:c.sfaTarget,fut:s.sfaTarget,peer:peerMed.sfa,peerA:peerAvg.sfa,fmt:v=>v==null?'\u2014':Math.round(v).toLocaleString()},
    {l:'Rent / SF',cur:c.askRate,fut:s.askRate,peer:peerMed.grs,peerA:peerAvg.grs,fmt:v=>v==null?'\u2014':fmtMoney(v)},
    {l:'AGR / Attorney',cur:curAgrPerAtty,fut:agrPerAtty,peer:peerMed.agra,peerA:peerAvg.agra,fmt:v=>v==null?'\u2014':fmtMoney(v)},
  ];
  document.getElementById('mTableBody').innerHTML=rows.map((r,i)=>{
    const delta=pctVs(r.fut,r.cur);
    return'<tr style="'+(i<rows.length-1?'border-bottom:1px solid var(--line-soft)':'')+'"><td style="padding:11px 5px;color:var(--ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">'+r.l+'</td><td style="padding:11px 5px;text-align:center;font-weight:700;color:var(--navy);font-size:12.5px;letter-spacing:-.1px">'+r.fmt(r.cur)+'</td><td style="padding:11px 5px;text-align:center;font-weight:700;color:var(--blue-accent);font-size:12.5px;letter-spacing:-.1px">'+r.fmt(r.fut)+'</td><td style="padding:11px 5px;text-align:center;font-weight:700;color:'+diffColor(delta)+';font-size:12px">'+diffLabel(delta)+'</td><td style="padding:11px 5px;text-align:center;color:var(--ink-2);font-size:12px">'+r.fmt(r.peer)+'</td><td style="padding:11px 5px;text-align:center;color:var(--ink-2);font-size:12px">'+r.fmt(r.peerA)+'</td></tr>';
  }).join('');

  // Chart: 3-bar comparison (Current vs Future vs Peer as % of Peer)
  const mCur=[c.sfaTarget,c.askRate,curAgrPerAtty];
  const mFut=[s.sfaTarget,s.askRate,agrPerAtty];
  const mPeers=[peerMed.sfa||0,peerMed.grs||0,peerMed.agra||0];
  const mCurPct=mCur.map((v,i)=>mPeers[i]>0?(v/mPeers[i]*100):100);
  const mFutPct=mFut.map((v,i)=>mPeers[i]>0?(v/mPeers[i]*100):100);
  if(modelChart){
    modelChart.data.datasets[0].data=mCurPct;
    modelChart.data.datasets[1].data=mFutPct;
    modelChart._mCur=mCur;modelChart._mFut=mFut;modelChart._mPeers=mPeers;
    modelChart.update('none');
  } else {
    modelChart=new Chart(document.getElementById('modelChart'),{type:'bar',
      data:{labels:['SF/Atty','Rent/SF','AGR/Atty'],datasets:[
        {label:'Current State',data:mCurPct,backgroundColor:'#001E5A',borderRadius:4},
        {label:'Future State',data:mFutPct,backgroundColor:'#2E6CC7',borderRadius:4},
        {label:'Peer Median (100%)',data:[100,100,100],backgroundColor:'#FFB600',borderRadius:4},
      ]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:0},
        plugins:{legend:{display:true,position:'bottom',labels:{font:{size:10},usePointStyle:true,pointStyle:'rectRounded'}},datalabels:{display:false},
          tooltip:{callbacks:{label:function(ctx){const i=ctx.dataIndex;const crs=modelChart._mCur||mCur;const fts=modelChart._mFut||mFut;const prs=modelChart._mPeers||mPeers;const actual=ctx.datasetIndex===0?crs[i]:ctx.datasetIndex===1?fts[i]:prs[i];return ctx.dataset.label+': '+(i>=1?fmtMoney(actual):Math.round(actual).toLocaleString());}}}},
        scales:{y:{ticks:{callback:v=>v+'%'},title:{display:true,text:'% of Peer Median',color:'#8A93A8',font:{size:10}}},x:{ticks:{font:{size:10}}}}}});
    modelChart._mCur=mCur;modelChart._mFut=mFut;modelChart._mPeers=mPeers;
  }

  // Closest matching firms - score by similarity to future scenario
  const matchEl=document.getElementById('mMatchTable');
  if(matchEl){
    const scored=peerFirms.filter(f=>f.att!=null&&f.rsf!=null&&f.id!==lockedId).map(f=>{
      let score=0;
      if(s.attys)score+=Math.abs((f.att||0)-s.attys)/Math.max(s.attys,1)*0.3;
      if(s.sfaTarget&&f.sfa)score+=Math.abs(f.sfa-s.sfaTarget)/Math.max(s.sfaTarget,1)*0.3;
      if(s.askRate&&f.grs)score+=Math.abs(f.grs-s.askRate)/Math.max(s.askRate,1)*0.4;
      return{...f,score};
    }).sort((a,b)=>a.score-b.score).slice(0,10);
    matchEl.innerHTML=`<thead><tr style="border-bottom:1px solid var(--line)">
      <th style="text-align:left;padding:9px 6px;color:var(--ink-4);font-size:10px;text-transform:uppercase;letter-spacing:.9px;font-weight:700">Firm</th>
      <th style="text-align:center;padding:9px 6px;color:var(--ink-4);font-size:10px;text-transform:uppercase;letter-spacing:.9px;font-weight:700">Attys</th>
      <th style="text-align:center;padding:9px 6px;color:var(--ink-4);font-size:10px;text-transform:uppercase;letter-spacing:.9px;font-weight:700">SF/Atty</th>
      <th style="text-align:center;padding:9px 6px;color:var(--ink-4);font-size:10px;text-transform:uppercase;letter-spacing:.9px;font-weight:700">Rent</th>
    </tr></thead><tbody>`+scored.map(f=>
      `<tr style="border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background var(--transition)" onclick="openDashboard(FIRMS[${f.id}])" onmouseover="this.style.background='var(--blue-softer)'" onmouseout="this.style.background='transparent'">
        <td style="padding:8px 6px;color:var(--navy);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;letter-spacing:-.1px">${esc(f.n)}</td>
        <td style="padding:8px 6px;text-align:center;color:var(--ink-2);font-weight:600">${f.att||'\u2014'}</td>
        <td style="padding:8px 6px;text-align:center;color:var(--ink-2);font-weight:600">${f.sfa?Math.round(f.sfa).toLocaleString():'\u2014'}</td>
        <td style="padding:8px 6px;text-align:center;color:var(--ink-2);font-weight:600">${f.grs?fmtMoney(f.grs):'\u2014'}</td>
      </tr>`).join('')+`</tbody>`;
  }
}

function setView(v){
  if(v==='compare'&&selectedIds.size<2)return;
  currentView=v;
  closeDetail();
  hideChartTooltip();
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  // Filter rail stays visible on map + table (so filters apply to both
   // views), but hidden on compare + model per user request — those views
   // are about picked/locked firms, not the full dataset.
  const onMap = v === 'map';
  const showFilters = v === 'map' || v === 'table';
  const lp = document.getElementById('leftPanel');
  if (lp) lp.classList.toggle('hidden', !showFilters);
  const cardsPanel = document.getElementById('cardsPanel');
  if (cardsPanel) cardsPanel.classList.toggle('hidden', !onMap);
  document.getElementById('mapArea').style.visibility=v==='map'?'visible':'hidden';
  document.getElementById('mapArea').style.zIndex=v==='map'?'1':'0';
  document.getElementById('tableArea').classList.toggle('visible',v==='table');
  document.getElementById('tableArea').style.zIndex=v==='table'?'1':'0';
  document.getElementById('compareArea').classList.toggle('visible',v==='compare');
  document.getElementById('compareArea').style.zIndex=v==='compare'?'1':'0';
  document.getElementById('modelArea').classList.toggle('visible',v==='model');
  document.getElementById('modelArea').style.zIndex=v==='model'?'1':'0';
  const exportBtn=document.getElementById('exportPdfBtn');
  if(exportBtn)exportBtn.style.display=(v==='model'||v==='compare')?'inline-flex':'none';
  if(v==='map'&&map){google.maps.event.trigger(map,'resize');plotMarkers(filteredFirms);}
  if(v==='table')renderTable();
  if(v==='compare')renderCompare();
  if(v==='model')renderModel();
  applyFilters();
}

/* KEYBOARD SHORTCUTS — lightweight power-user affordances that make the
   tool feel native. "/" focuses search; Escape steps back out of any open
   overlay; g then m/t/c/e jumps between views. All guarded so they never
   fire while typing in an input. */
function setupKeyboardShortcuts(){
  let gPending=false,gTimer=null;
  document.addEventListener('keydown',function(e){
    const t=e.target;
    const typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    // Escape works everywhere, including inputs (blur + close overlays).
    if(e.key==='Escape'){
      const dash=document.getElementById('dashboard');
      const detail=document.getElementById('detailPanel');
      if(dash&&dash.classList.contains('open')){closeDashboard();return;}
      if(detail&&detail.classList.contains('open')){closeDetail();return;}
      if(typeof closeClusterPopover==='function')closeClusterPopover();
      const sl=document.getElementById('smList');if(sl)sl.classList.remove('open');
      if(typing&&t.blur)t.blur();
      return;
    }
    if(typing)return;
    if(e.key==='/'){
      const s=document.getElementById('sideSearch');
      if(s){e.preventDefault();s.focus();s.select();}
      return;
    }
    if(e.key==='g'){gPending=true;clearTimeout(gTimer);gTimer=setTimeout(()=>gPending=false,900);return;}
    if(gPending){
      const map={m:'map',t:'table',c:'compare',e:'model'};
      const v=map[e.key.toLowerCase()];
      if(v){e.preventDefault();setView(v);}
      gPending=false;
      return;
    }
  });
}

/* INIT */
async function init(){
  // Show loading indicator
  const loader = document.createElement('div');
  loader.id = 'dataLoader';
  loader.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--navy);color:#fff;text-align:center;padding:6px;font-size:11px;font-weight:600;letter-spacing:0.5px;transition:opacity 0.3s';
  loader.textContent = 'Loading live data from Google Sheets...';
  document.body.appendChild(loader);

  // Skeleton placeholders while live data resolves — reads as a premium,
  // intentional loading state instead of empty panels. Replaced wholesale
  // by renderStats()/renderCards() once buildFilters()+applyFilters() run.
  const statsBarEl = document.getElementById('statsBar');
  if (statsBarEl) statsBarEl.innerHTML = Array.from({length:6}).map(()=>'<div class="stat-card skeleton skel-stat"></div>').join('');
  const cardsListEl = document.getElementById('cardsList');
  if (cardsListEl) cardsListEl.innerHTML = Array.from({length:7}).map(()=>'<div class="skeleton skel-card"></div>').join('');

  // Live chip starts in loading state — pulsing ink-4 dot + SYNCING label.
  // Cleared to LIVE or SAMPLE once fetchLiveData resolves.
  const initChip = document.getElementById('dataSourceChip');
  const initLabel = document.getElementById('dataSourceLabel');
  if (initChip) initChip.classList.add('loading');
  if (initLabel) initLabel.innerHTML = 'SYNCING &middot; <strong id="totalCount">…</strong>';

  // Try fetching live data
  const liveFirms = await fetchLiveData();
  const chip = document.getElementById('dataSourceChip');
  const chipLabel = document.getElementById('dataSourceLabel');
  if (chip) chip.classList.remove('loading');
  if (liveFirms && liveFirms.length > 0) {
    // Apply tier logic
    liveFirms.forEach(f => { f.tier = getAmTier(f); });
    FIRMS = liveFirms;
    SUBMARKETS = [...new Set(FIRMS.map(f => f.sm).filter(Boolean))].sort();
    loader.textContent = 'Live data loaded — ' + FIRMS.length + ' firms';
    loader.style.background = '#1B8F6A';
    if (chip) chip.classList.remove('fallback');
    if (chipLabel) chipLabel.innerHTML = 'LIVE &middot; <strong id="totalCount">' + FIRMS.length + '</strong> FIRMS';
  } else {
    loader.textContent = 'Using embedded data — ' + FIRMS.length + ' firms';
    loader.style.background = '#E24B4A';
    if (chip) chip.classList.add('fallback');
    if (chipLabel) chipLabel.innerHTML = 'SAMPLE &middot; <strong id="totalCount">' + FIRMS.length + '</strong> FIRMS';
  }

  // Recalculate SF/Attorney and AGR/Attorney for all firms (ensures consistency)
  FIRMS.forEach(f => {
    f.sfa = (f.rsf != null && f.att != null && f.att > 0) ? f.rsf / f.att : null;
    f.agra = (f.agr != null && f.att != null && f.att > 0) ? f.agr / f.att : null;
    if(!f.img) f.img = '';
  });

  // Update firm count display
  const countEl = document.getElementById('cardsCount');
  if (countEl) countEl.textContent = FIRMS.length;
  const totalEl = document.getElementById('totalCount');
  if (totalEl) totalEl.textContent = FIRMS.length;

  // Build UI
  buildFilters();
  applyFilters();
  setupKeyboardShortcuts();

  // Fade out loader
  setTimeout(() => { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 300); }, 2000);
}

// Load Google Maps
window.initMap=initMap;
init();
</script>

const auth=firebase.auth();

/* Listen for auth state */
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appWrapper').classList.add('authed');
  } else {
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('appWrapper').classList.remove('authed');
  }
});

/* Login */
function handleLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPassword').value;
  const errEl=document.getElementById('loginError');
  const btn=document.getElementById('loginBtn');
  errEl.style.display='none';
  if(!email||!pass){errEl.textContent='Please enter email and password';errEl.style.display='block';return}
  btn.disabled=true;btn.textContent='Signing in…';
  auth.signInWithEmailAndPassword(email,pass)
    .then(()=>{btn.disabled=false;btn.textContent='Sign In'})
    .catch(err=>{
      btn.disabled=false;btn.textContent='Sign In';
      let msg='Sign in failed. Please try again.';
      if(err.code==='auth/user-not-found'||err.code==='auth/wrong-password'||err.code==='auth/invalid-credential')msg='Invalid email or password.';
      else if(err.code==='auth/too-many-requests')msg='Too many attempts. Please try again later.';
      else if(err.code==='auth/invalid-email')msg='Please enter a valid email address.';
      errEl.textContent=msg;errEl.style.display='block';
    });
}

/* Forgot password */
function handleForgotPassword(){
  const email=document.getElementById('loginEmail').value.trim();
  const errEl=document.getElementById('loginError');
  if(!email){errEl.textContent='Enter your email above, then click Forgot password';errEl.style.display='block';return}
  auth.sendPasswordResetEmail(email)
    .then(()=>{errEl.style.display='block';errEl.style.color='#2E7D32';errEl.textContent='Password reset email sent. Check your inbox.'})
    .catch(()=>{errEl.textContent='Could not send reset email. Check your email address.';errEl.style.display='block';errEl.style.color='#E24B4A'});
}

/* Sign out */
function handleSignOut(){
  auth.signOut();
}

/* Enter key to submit */
document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin()});
document.getElementById('loginEmail').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginPassword').focus()});
</script>
