<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downtown West · Concept B</title>
<style>
  :root {
    --navy: #001E5A; --deep: #00102F; --gold: #FFB600; --white: #fff;
    --muted: #6E6E73; --tile: #F5F5F7;
    --pos: #1E9E62; --neu: #F2B705; --neg: #E0453A;
    --font: Arial, Helvetica, sans-serif;
    --ease: cubic-bezier(.65,0,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--deep); color: #fff; font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }

  /* Map layer fills the viewport; JS moves the "camera" */
  #viewport { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 40% 50%, #002266 0%, var(--deep) 70%); }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform 1.4s var(--ease); }
  #world > svg { display: block; width: 100%; height: 100%; }
  .pin { position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--gold); color: var(--navy); font: 700 14px var(--font); display: grid; place-items: center;
    box-shadow: 0 0 0 6px rgba(255,182,0,.18), 0 0 30px rgba(255,182,0,.55); transition: opacity .6s, transform .6s var(--ease); }
  .pin::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(255,182,0,.5); animation: ring 2.4s ease-out infinite; }
  @keyframes ring { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .touring .pin { opacity: .25; }
  .touring .pin.on { opacity: 1; }
  .pin .tip { position: absolute; left: 50%; bottom: calc(100% + 12px); transform: translateX(-50%); white-space: nowrap; background: #fff; color: var(--navy);
    padding: 7px 12px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .pin:hover .tip { opacity: 1; }
  .touring .pin .tip { display: none; }

  /* Chrome */
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 18px; padding: 22px 36px;
    background: linear-gradient(rgba(0,16,47,.85), rgba(0,16,47,0)); }
  .top .logo svg { height: 20px; width: auto; display: block; }
  .vr { width: 1px; height: 26px; background: rgba(255,255,255,.2); }
  .top .t { font-size: 14px; font-weight: 700; }
  .top .t span { display: block; font-size: 11px; font-weight: 400; color: rgba(255,255,255,.6); margin-top: 2px; }
  .sp { flex: 1; }
  .ghost { height: 38px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #fff;
    font: 700 13px var(--font); cursor: pointer; backdrop-filter: blur(10px); display: inline-flex; align-items: center; gap: 8px; }
  .ghost:hover { background: rgba(255,255,255,.14); }
  .gold { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .gold:hover { background: #FFC52E; }

  /* Overview title block */
  .intro { position: fixed; left: 56px; bottom: 120px; z-index: 10; max-width: 560px; transition: opacity .6s, transform .8s var(--ease); }
  .intro .eb { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; color: var(--gold); text-transform: uppercase; }
  .intro h1 { margin: 12px 0 0; font-size: 60px; line-height: 1.02; letter-spacing: -2px; }
  .intro p { margin: 16px 0 26px; font-size: 19px; color: rgba(255,255,255,.7); }
  #viewport::after { content: ""; position: absolute; inset: 0; pointer-events: none; transition: opacity .8s;
    background: linear-gradient(90deg, rgba(0,16,47,.92) 0%, rgba(0,16,47,.6) 38%, rgba(0,16,47,0) 65%); }
  .touring #viewport::after { opacity: 0; }
  .touring .intro { opacity: 0; transform: translateY(20px); pointer-events: none; }

  /* Presenter panel */
  .panel { position: fixed; top: 96px; right: 36px; bottom: 110px; width: 460px; z-index: 15; background: #fff; color: var(--navy);
    border-radius: 32px; padding: 36px 36px 30px; box-shadow: 0 40px 120px rgba(0,0,0,.5); display: flex; flex-direction: column;
    transform: translateX(calc(100% + 60px)); transition: transform .9s var(--ease); }
  .touring .panel { transform: none; }
  .panel .count { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #B07D00; }
  .panel h2 { margin: 8px 0 0; font-size: 44px; line-height: 1.02; letter-spacing: -1.6px; }
  .panel .addr { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .panel .rent { margin-top: 26px; padding: 22px 24px; border-radius: 20px; background: var(--navy); color: #fff; display: flex; align-items: baseline; justify-content: space-between; }
  .panel .rent small { font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,.6); font-weight: 700; }
  .panel .rent b { font-size: 52px; letter-spacing: -2px; color: var(--gold); line-height: 1; }
  .panel .rent b span { font-size: 15px; color: rgba(255,255,255,.7); letter-spacing: 0; font-weight: 400; }
  .rows { margin-top: 18px; }
  .rowx { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px; border-bottom: 1px solid #EEF0F4; font-size: 17px; font-weight: 700; }
  .rowx:last-child { border-bottom: 0; }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
  .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 17px; font-weight: 700; }
  .ic.pos { background: var(--pos); } .ic.neu { background: var(--neu); color: var(--navy); } .ic.neg { background: var(--neg); }
  .firms { margin-top: auto; padding-top: 16px; font-size: 13px; color: #424245; line-height: 1.55; }
  .firms small { display: block; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 4px; }

  /* Rows animate in on every step */
  .panel.step .anim { animation: up .7s var(--ease) both; }
  .panel.step .anim:nth-child(2) { animation-delay: .06s; } .panel.step .anim:nth-child(3) { animation-delay: .12s; }
  .panel.step .rowx { animation: up .6s var(--ease) both; }
  .panel.step .rowx:nth-child(1) { animation-delay: .25s; } .panel.step .rowx:nth-child(2) { animation-delay: .32s; }
  .panel.step .rowx:nth-child(3) { animation-delay: .39s; } .panel.step .rowx:nth-child(4) { animation-delay: .46s; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* Progress */
  .dock { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 14px;
    padding: 10px 12px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(16px); }
  .dock .nav { width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: #fff; font-size: 18px; cursor: pointer; }
  .dock .nav:hover { background: rgba(255,255,255,.2); }
  .dots { display: flex; gap: 8px; }
  .dots button { height: 8px; width: 8px; border-radius: 99px; border: 0; padding: 0; background: rgba(255,255,255,.3); cursor: pointer; transition: width .5s var(--ease), background .3s; }
  .dots button.on { width: 34px; background: var(--gold); }
  .hint { position: fixed; right: 36px; bottom: 44px; z-index: 20; font-size: 12px; color: rgba(255,255,255,.45); }
  kbd { font: 700 11px var(--font); padding: 2px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,.25); }
</style>

];
const CATS = [["space", "Available Space"], ["ownership", "Ownership"], ["amenities", "Amenities"], ["parking", "Parking"]];
const LBL = { pos: "Favorable", neu: "Neutral", neg: "Unfavorable" }, SYM = { pos: "+", neu: "•", neg: "−" };
const $ = s => document.querySelector(s);
const world = $("#world"), panel = $("#panel");
const MW = 1600, MH = 1000;
world.style.width = MW + "px"; world.style.height = MH + "px";
world.innerHTML = nightMap();

function nightMap() {
  const W = MW, H = MH, R = 15, VX = [110,280,450,620,790,960,1130,1300,1470], HY = [120,310,500,690,880];
  const VN = ["Clay","Polk","Dallas","Lamar","McKinney","Walker","Rusk","Capitol","Texas"], HN = ["Bagby","Smith","Louisiana","Milam","Travis"];
  let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const xs = [0, ...VX, W], ys = [0, ...HY, H], p = [];
  const feat = BUILDINGS.filter(b => !b.campus).map(b => [b.x * 16, b.y * 10]);
  p.push(`<defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`);
  for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
    const x0 = xs[i] + (i ? R : 0), x1 = xs[i + 1] - (i + 1 < xs.length - 1 ? R : 0), y0 = ys[j] + (j ? R : 0), y1 = ys[j + 1] - (j + 1 < ys.length - 1 ? R : 0);
    if (j === 0) { p.push(`<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="8" fill="#062A4A"/>`); continue; }
    p.push(`<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="8" fill="#03214F"/>`);
    if (j === 1 && x0 < VX[2]) continue;
    const f = feat.find(([fx, fy]) => fx > x0 && fx < x1 && fy > y0 && fy < y1);
    if (f) { const t = 100; p.push(`<rect x="${f[0] - t / 2}" y="${f[1] - t / 2}" width="${t}" height="${t}" rx="12" fill="#FFFFFF" filter="url(#g)" opacity=".95"/><rect x="${f[0] - t / 2 + 14}" y="${f[1] - t / 2 + 14}" width="${t - 28}" height="${t - 28}" rx="6" fill="#DCE6F5"/>`); continue; }
    const c = 1 + Math.floor(rnd() * 3), r = 1 + Math.floor(rnd() * 2), lw = (x1 - x0 - 16) / c, lh = (y1 - y0 - 16) / r;
    for (let a = 0; a < c; a++) for (let b = 0; b < r; b++) {
      const pd = 5 + rnd() * 7, x = x0 + 8 + a * lw + pd, y = y0 + 8 + b * lh + pd, w = lw - pd * 2, h = lh - pd * 2;
      p.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${rnd() < .5 ? "#0A2D68" : "#0D3474"}"/>`);
      for (let k = 0; k < 3; k++) if (rnd() < .5) p.push(`<rect x="${x + 6 + rnd() * (w - 16)}" y="${y + 6 + rnd() * (h - 16)}" width="4" height="4" fill="#FFD36B" opacity="${.3 + rnd() * .5}"/>`);
    }
  }
  const cy = (HY[0] + HY[1]) / 2;
  [[95, 90], [280, 110], [395, 82]].forEach(([cx, t]) => p.push(`<rect x="${cx - t / 2}" y="${cy - t / 2}" width="${t}" height="${t}" rx="12" fill="#fff" filter="url(#g)" opacity=".95"/>`));
  HY.forEach(y => p.push(`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#FFB600" stroke-opacity=".12" stroke-width="2"/>`));
  VX.forEach(x => p.push(`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#FFB600" stroke-opacity=".12" stroke-width="2"/>`));
  VX.forEach((x, i) => p.push(`<text x="${x}" y="${H - 30}" transform="rotate(-90 ${x} ${H - 30})" dy="4" font-size="11" fill="#5C7AB0" font-family="Arial" letter-spacing="2">${VN[i].toUpperCase()}</text>`));
  HY.forEach((y, i) => p.push(`<text x="${VX[5] + 85}" y="${y}" dy="4" text-anchor="middle" font-size="11" fill="#5C7AB0" font-family="Arial" letter-spacing="2">${HN[i].toUpperCase()} ST</text>`));
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${p.join("")}</svg>`;
}

const pins = BUILDINGS.map((b, i) => {
  const el = document.createElement("button"); el.className = "pin";
  el.style.left = b.x * 16 + "px"; el.style.top = b.y * 10 + "px";
  el.innerHTML = `${i + 1}<span class="tip">${b.name} · $${b.rent}</span>`;
  el.onclick = () => go(i); world.appendChild(el); return el;
});
$("#dots").innerHTML = BUILDINGS.map((_, i) => `<button aria-label="Option ${i + 1}"></button>`).join("");
const dots = [...document.querySelectorAll("#dots button")];
dots.forEach((d, i) => d.onclick = () => go(i));

let cur = -1;
function camera(scale, cx, cy, tx, ty) { world.style.transform = `translate(${tx - cx * scale}px, ${ty - cy * scale}px) scale(${scale})`; }
function overview() {
  cur = -1; document.body.classList.remove("touring");
  pins.forEach(p => p.classList.remove("on")); dots.forEach(d => d.classList.remove("on"));
  const s = Math.max(innerWidth / MW, innerHeight / MH) * 1.02;
  camera(s, MW / 2, MH / 2, innerWidth / 2, innerHeight / 2);
}
function go(i) {
  cur = (i + BUILDINGS.length) % BUILDINGS.length; const b = BUILDINGS[cur];
  document.body.classList.add("touring");
  pins.forEach((p, k) => p.classList.toggle("on", k === cur)); dots.forEach((d, k) => d.classList.toggle("on", k === cur));
  const s = Math.max(innerWidth / MW, innerHeight / MH) * 2.3;
  camera(s, b.x * 16, b.y * 10, (innerWidth - 500) / 2, innerHeight / 2);
  panel.classList.remove("step"); void panel.offsetWidth;
  panel.innerHTML = `
    <div class="anim count">OPTION ${String(cur + 1).padStart(2, "0")} OF ${String(BUILDINGS.length).padStart(2, "0")}</div>
    <div class="anim"><h2>${b.name}</h2><div class="addr">${b.address}</div></div>
    <div class="anim rent"><small>Asking rent<br>gross</small><b>$${b.rent.toFixed(2)}<span> /SF</span></b></div>
    <div class="rows">${CATS.map(([k, l]) => `<div class="rowx"><span>${l}</span><span class="badge" style="color:${k && b.s[k] === "neg" ? "#C93B3B" : b.s[k] === "neu" ? "#8A6400" : "#1B7F52"}">${LBL[b.s[k]]}<i class="ic ${b.s[k]}">${SYM[b.s[k]]}</i></span></div>`).join("")}</div>
    <div class="firms"><small>Other law firms in the building</small>${b.firms.join(" · ")}</div>`;
  panel.classList.add("step");
}
$("#start").onclick = () => go(0);
$("#overview").onclick = overview;
$("#next").onclick = () => go(cur + 1);
$("#prev").onclick = () => go(cur < 0 ? BUILDINGS.length - 1 : cur - 1);
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(cur + 1); }
  if (e.key === "ArrowLeft") go(cur < 0 ? BUILDINGS.length - 1 : cur - 1);
  if (e.key === "Escape") overview();
});
addEventListener("resize", () => cur < 0 ? overview() : go(cur));
world.style.transition = "none"; overview(); requestAnimationFrame(() => world.style.transition = "");
</script>
</body>
</html>
